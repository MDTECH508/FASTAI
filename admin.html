<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLAST PROXY - Administration</title>
    <style>
        :root {
            --bg-primary: #07070a;
            --bg-secondary: #101014;
            --text: #eef0f4;
            --text-secondary: #9aa1ae;
            --text-muted: #565b68;
            --accent: #8b93a6;
            --accent-2: #d7dce4;
            --glass: rgba(255, 255, 255, 0.035);
            --glass-border: rgba(255, 255, 255, 0.14);
            --success: #6bcf9a;
            --error: #ff8078;
            --warning: #fdcb6e;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            padding: 30px 20px;
            overflow-x: hidden;
        }
        .admin-container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .admin-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .admin-header h1 {
            font-size: 28px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--accent-2);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }
        button:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--accent);
        }
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .category-tab {
            padding: 8px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        .category-tab.active {
            background: rgba(139,147,166,0.2);
            border-color: var(--accent);
            color: #fff;
        }
        .glass-table {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 13px;
        }
        th {
            background: rgba(255,255,255,0.03);
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        tr:last-child td { border-bottom: none; }
        .status-active { color: var(--success); }
        .status-expired { color: var(--error); }
        .status-blocked { color: var(--warning); }
        .btn-sm {
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 6px;
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🔐 Administration des Licences</h1>
        </div>

        <div class="controls">
            <button onclick="createNewKey()">+ Créer une clé</button>
            <button onclick="resetAll()">Réinitialiser tout</button>
        </div>

        <div class="category-tabs">
            <div class="category-tab active" data-cat="all" onclick="setCategory('all')">Toutes</div>
            <div class="category-tab" data-cat="1" onclick="setCategory('1')">1 jour</div>
            <div class="category-tab" data-cat="7" onclick="setCategory('7')">7 jours</div>
            <div class="category-tab" data-cat="30" onclick="setCategory('30')">30 jours</div>
        </div>

        <div class="glass-table">
            <table>
                <thead>
                    <tr>
                        <th>Clé</th>
                        <th>Durée</th>
                        <th>IP</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let currentCategory = 'all';

        function getDB() {
            return JSON.parse(localStorage.getItem('blast_keys_db') || '[]');
        }
        function saveDB(db) {
            localStorage.setItem('blast_keys_db', JSON.stringify(db));
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.cat === cat);
            });
            render();
        }

        function render() {
            const db = getDB();
            const filtered = db.filter(k => {
                if (currentCategory === 'all') return true;
                return k.duration === parseInt(currentCategory);
            });
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            filtered.forEach((k, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${k.key}</td>
                    <td>${k.duration}j</td>
                    <td>${k.ip || '—'}</td>
                    <td class="status-${k.status}">${k.status}</td>
                    <td>
                        ${k.status === 'active' && !k.ip ? `<button class="btn-sm" onclick="blockKey(${idx})">Bloquer</button>` : ''}
                        ${k.status === 'blocked' ? `<button class="btn-sm" onclick="unblockKey(${idx})">Débloquer</button>` : ''}
                        ${k.ip ? `<button class="btn-sm" onclick="resetKey(${idx})">Reset IP</button>` : ''}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function blockKey(idx) {
            const db = getDB();
            db[idx].status = 'blocked';
            saveDB(db);
            render();
        }
        function unblockKey(idx) {
            const db = getDB();
            db[idx].status = 'active';
            saveDB(db);
            render();
        }
        function resetKey(idx) {
            const db = getDB();
            db[idx].ip = null;
            db[idx].activatedAt = null;
            db[idx].expiresAt = null;
            db[idx].status = 'active';
            saveDB(db);
            render();
        }
        function createNewKey() {
            const db = getDB();
            const dur = prompt('Durée en jours (1, 7, 30) :', '1');
            const d = parseInt(dur);
            if (![1,7,30].includes(d)) return alert('Durée invalide');
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const seg = () => Array.from({length:4}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
            const key = `BLAST-${d}D-${String(db.length+1).padStart(4,'0')}-${seg()}`;
            db.push({ key, duration:d, status:'active', ip:null, activatedAt:null, expiresAt:null });
            saveDB(db);
            render();
        }
        function resetAll() {
            if (confirm('Réinitialiser toutes les clés ? Cette action est irréversible.')) {
                localStorage.removeItem('blast_keys_db');
                location.reload();
            }
        }

        // Initialisation (même génération que index.html)
        if (!localStorage.getItem('blast_keys_db')) {
            const keys = [];
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const rand4 = () => Array.from({length:4}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
            for(let i=1; i<=200; i++) keys.push({ key:`BLAST-1D-${String(i).padStart(4,'0')}-${rand4()}`, duration:1, status:'active', ip:null, activatedAt:null, expiresAt:null });
            for(let i=1; i<=150; i++) keys.push({ key:`BLAST-7D-${String(i).padStart(4,'0')}-${rand4()}`, duration:7, status:'active', ip:null, activatedAt:null, expiresAt:null });
            for(let i=1; i<=50; i++) keys.push({ key:`BLAST-30D-${String(i).padStart(4,'0')}-${rand4()}`, duration:30, status:'active', ip:null, activatedAt:null, expiresAt:null });
            localStorage.setItem('blast_keys_db', JSON.stringify(keys));
        }

        render();
    </script>
</body>
</html>
