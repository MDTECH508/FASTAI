<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0b">
<title>NET PLUS — Aktivasyon</title>
<script src="splash.js"></script>
<style>
  :root{
    --bg:#0a0a0b; --ink:#f2f2f3; --mute:#9d9da4;
    --line:rgba(255,255,255,.12); --neon:#5ee7ff; --neon2:#b18cff;
    --ok:#8fd19e; --bad:#ff8f8f; --warn:#e3c77a;
    --glass:rgba(255,255,255,.055);
    --glass-hi:rgba(255,255,255,.11);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh; display:grid; place-items:center; padding:24px 16px;
    line-height:1.55;
  }
  body::before{
    content:""; position:fixed; inset:-20%; z-index:-2;
    background:
      radial-gradient(45% 40% at 20% 20%, rgba(94,231,255,.18), transparent 70%),
      radial-gradient(40% 35% at 80% 25%, rgba(177,140,255,.16), transparent 70%),
      radial-gradient(45% 40% at 55% 90%, rgba(94,231,255,.1), transparent 70%);
    animation:drift 24s ease-in-out infinite alternate;
  }
  @keyframes drift{from{transform:translate3d(-2%,-2%,0) scale(1)}to{transform:translate3d(2%,3%,0) scale(1.06)}}
  @media(prefers-reduced-motion:reduce){body::before{animation:none}}

  /* ============ KAT GLASS ============ */
  .card{
    width:100%; max-width:500px; position:relative;
    background:linear-gradient(160deg,rgba(28,30,38,.94),rgba(16,17,22,.97));
    border:1px solid var(--line); border-radius:24px;
    padding:32px 26px 26px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.3),
      0 30px 80px rgba(0,0,0,.65);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    backdrop-filter:blur(24px) saturate(160%);
    animation:cardIn .6s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes cardIn{from{opacity:0; transform:translateY(20px)}to{opacity:1; transform:none}}
  .card::before{
    content:""; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background:linear-gradient(135deg,rgba(94,231,255,.55),transparent 32%,transparent 68%,rgba(177,140,255,.5));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude; pointer-events:none; opacity:.85;
  }

  /* ============ BRAND ============ */
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:22px}
  .brand .mark{
    width:42px; height:42px; border-radius:13px; flex:none;
    display:grid; place-items:center;
    background:
      radial-gradient(circle at 30% 22%, rgba(255,255,255,.55) 0, transparent 45%),
      linear-gradient(135deg, rgba(94,231,255,.4), rgba(177,140,255,.28));
    border:1px solid rgba(94,231,255,.55);
    color:#fff;
    box-shadow:0 0 18px rgba(94,231,255,.35), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .brand .mark svg{width:22px; height:22px; filter:drop-shadow(0 0 4px rgba(255,255,255,.8))}
  .brand .text{display:flex; flex-direction:column; line-height:1}
  .brand .text b{color:var(--ink); font-size:1.02rem; font-weight:900; letter-spacing:.05em}
  .brand .text small{color:var(--neon); font-size:.62rem; font-weight:700; letter-spacing:.22em; margin-top:3px}

  h1{font-size:1.35rem; letter-spacing:-.02em; margin-bottom:6px}
  p.sub{color:var(--mute); font-size:.9rem; margin-bottom:22px}

  /* ============ PRODUCT BOX ============ */
  .product-box{
    background:rgba(94,231,255,.08); border:1px solid rgba(94,231,255,.4);
    border-radius:16px; padding:18px; margin-bottom:18px;
    display:flex; gap:16px; align-items:center;
    position:relative;
  }
  .product-box .icon{
    width:60px; height:60px; border-radius:16px;
    display:grid; place-items:center;
    background:radial-gradient(circle at 50% 45%, rgba(94,231,255,.22), transparent 65%), #0c0c10;
    border:1px solid rgba(94,231,255,.35);
    color:var(--neon); flex:none;
  }
  .product-box .icon svg{width:34px; height:34px}
  .product-box .info{flex:1; min-width:0}
  .product-box h2{font-size:1.05rem; margin-bottom:2px; word-break:break-word; color:var(--ink)}
  .product-box .dur{color:var(--mute); font-size:.84rem; margin-bottom:8px}
  .product-box .amt{font-size:1.5rem; font-weight:800; color:var(--neon); letter-spacing:-.02em; line-height:1.1}
  .product-box .amt .old{color:var(--mute); text-decoration:line-through; font-size:.9rem; font-weight:600; margin-left:8px}
  .product-box .install-note{
    margin-top:6px; font-size:.8rem; color:var(--warn);
    padding:4px 10px; background:rgba(227,199,122,.1); border-radius:6px;
    display:inline-block;
  }

  /* ============ FÒM ============ */
  label{display:block; font-size:.8rem; color:#c8c8cf; margin:14px 0 6px; font-weight:600}
  .field{
    display:flex; align-items:center; gap:10px;
    background:#0c0c10; border:1px solid var(--line); border-radius:12px;
    padding:0 14px; transition:.18s;
  }
  .field:focus-within{border-color:var(--neon); box-shadow:0 0 0 3px rgba(94,231,255,.18)}
  .field.err{border-color:var(--bad); box-shadow:0 0 0 3px rgba(255,143,143,.15)}
  .field svg{color:var(--mute); flex:none}
  .field input, .field select, .field textarea{
    flex:1; background:transparent; border:0; outline:0; color:var(--ink);
    font:inherit; font-size:16px; padding:13px 0; min-width:0;
  }
  .field textarea{resize:vertical; min-height:60px}
  .field select option{background:#1a1a1d}

  /* ============ PHONE ROW + CALL BUTTON ============ */
  .phone-row{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:stretch}
  .phone-row .field{min-width:0}
  .btn-call{
    width:50px; border-radius:12px; border:1px solid var(--line);
    background:rgba(94,231,255,.1); color:var(--neon);
    display:grid; place-items:center; cursor:pointer;
    transition:.15s;
  }
  .btn-call:hover{background:rgba(94,231,255,.2); border-color:var(--neon)}
  .btn-call:active{transform:scale(.95)}
  .btn-call svg{width:20px; height:20px}

  /* ============ BOUTON ============ */
  .btn{
    width:100%; margin-top:22px; padding:14px; border:0; border-radius:12px;
    cursor:pointer; font:inherit; font-weight:800; font-size:.98rem;
    color:#06121a;
    background:linear-gradient(180deg,#eaf8fc 0%,#a9dbe9 100%);
    box-shadow:inset 0 1px 0 #fff, 0 0 0 1px rgba(94,231,255,.45), 0 12px 30px rgba(94,231,255,.28);
    transition:transform .14s, filter .18s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:scale(.98)}
  .btn[disabled]{opacity:.55; cursor:not-allowed}
  .spinner{
    width:16px; height:16px; border:2px solid rgba(6,18,26,.3);
    border-top-color:#06121a; border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ============ MESAJ ============ */
  .msg{
    margin-top:14px; padding:11px 14px; border-radius:10px;
    font-size:.86rem; display:none; align-items:center; gap:8px;
  }
  .msg.err{display:flex; background:rgba(255,120,120,.12); border:1px solid rgba(255,120,120,.4); color:#ffb0b0}
  .msg.ok{display:flex; background:rgba(143,209,158,.12); border:1px solid rgba(143,209,158,.4); color:var(--ok)}
  .msg svg{flex:none}

  /* ============ PAY INFO ============ */
  .pay-info{
    background:rgba(0,0,0,.3); border:1px solid var(--line);
    border-radius:12px; padding:14px; margin-top:18px; font-size:.88rem;
  }
  .pay-info div{display:flex; justify-content:space-between; padding:6px 0}
  .pay-info span{color:var(--mute)}
  .pay-info b{color:var(--ink)}

  /* ============ ZONE NOTE ============ */
  .zone-note{
    margin-top:8px; padding:10px 12px; border-radius:10px;
    background:rgba(227,199,122,.1); border:1px solid rgba(227,199,122,.4);
    color:var(--warn); font-size:.82rem;
    display:none; align-items:center; gap:8px;
  }
  .zone-note.show{display:flex}
  .zone-note svg{flex:none}

  /* ============ BACK ============ */
  .back{margin-top:18px; text-align:center}
  .back a{
    color:var(--mute); font-size:.86rem; text-decoration:none;
    display:inline-flex; align-items:center; gap:6px;
    transition:.15s;
  }
  .back a:hover{color:var(--neon)}

  /* ============ RESPONSIVE ============ */
  @media(max-width:420px){
    .card{padding:26px 20px 22px; border-radius:20px}
    h1{font-size:1.2rem}
    .product-box{padding:14px; gap:12px}
    .product-box .icon{width:50px; height:50px}
    .product-box .icon svg{width:28px; height:28px}
    .product-box .amt{font-size:1.3rem}
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <span class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8.5a16 16 0 0 1 20 0"/><path d="M5 12a11 11 0 0 1 14 0"/>
        <path d="M8.5 15.5a6 6 0 0 1 7 0"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <span class="text"><b>NET PLUS</b><small>5G LTE</small></span>
  </div>

  <h1 id="hTitle">Aktivasyon</h1>
  <p class="sub" id="hSub">Ranpli enfòmasyon ou pou w kontinye.</p>

  <!-- REZIME PLAN -->
  <div class="product-box">
    <div class="icon" id="pIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 8.5a16 16 0 0 1 20 0"/><path d="M5 12a11 11 0 0 1 14 0"/><path d="M8.5 15.5a6 6 0 0 1 7 0"/><circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/></svg>
    </div>
    <div class="info">
      <h2 id="pName">—</h2>
      <div class="dur" id="pDur">—</div>
      <div class="amt" id="pPrice">—</div>
      <div class="install-note" id="installNote" hidden></div>
    </div>
  </div>

  <!-- NON -->
  <label for="name">Non ou</label>
  <div class="field" id="nameField">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" width="20" height="20"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
    <input id="name" autocomplete="name" required placeholder="Non konplè">
  </div>

  <!-- WHATSAPP + RELE DIRÈK -->
  <label for="phone">Nimewo WhatsApp</label>
  <div class="phone-row">
    <div class="field" id="phoneField">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M6.5 10.5a14 14 0 0 0 7 7l2-2a1 1 0 0 1 1-.2 10 10 0 0 0 3.5.5 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A16 16 0 0 1 3 4a1 1 0 0 1 1-1h3.2a1 1 0 0 1 1 1c0 1.2.2 2.4.5 3.5a1 1 0 0 1-.2 1z"/></svg>
      <input id="phone" type="tel" inputmode="tel" placeholder="509 3XXX XXXX" required>
    </div>
    <button type="button" class="btn-call" id="callBtn" title="Rele nou dirèk" aria-label="Rele nou dirèk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 10.5a14 14 0 0 0 7 7l2-2a1 1 0 0 1 1-.2 10 10 0 0 0 3.5.5 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A16 16 0 0 1 3 4a1 1 0 0 1 1-1h3.2a1 1 0 0 1 1 1c0 1.2.2 2.4.5 3.5a1 1 0 0 1-.2 1z"/>
      </svg>
    </button>
  </div>

  <!-- ZÒN + ADRÈS (pou ekipman ak rezidansyèl) -->
  <div id="zoneBox" hidden>
    <label for="zone">Zòn ou</label>
    <div class="field" id="zoneField">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <select id="zone"></select>
    </div>
    <div class="zone-note" id="zoneNote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".8" fill="currentColor"/></svg>
      <span>Zòn sa a poko disponib. N ap kontakte w pou konfimasyon.</span>
    </div>

    <label for="addr">Adrès livrezon</label>
    <div class="field" id="addrField">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" width="20" height="20"><path d="M3 10l9-7 9 7"/><path d="M5 8v12h14V8"/></svg>
      <textarea id="addr" placeholder="Katye, ri, repè… egz: Parc Vincent, ri 12" style="min-height:60px"></textarea>
    </div>
  </div>

  <button class="btn" type="button" id="goBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
    Kontinye pou peye
  </button>
  <div class="msg" id="msg"></div>

  <!-- ENFÒMASYON PEMAN -->
  <div class="pay-info">
    <div><span>NatCash</span><b>509 5511 2990 — Enelson Pierre</b></div>
    <div><span>MonCash</span><b>509 4195 1159 — NET PLUS</b></div>
  </div>

  <div class="back">
    <a href="portal.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Retounen nan portal
    </a>
  </div>
</div>

<script src="config.js"></script>
<script>
const API = window.NETPLUS_API || "";
const $ = id => document.getElementById(id);
const SUPPORT_PHONE = "50941951159";

/* ============ PLAN MOBIL ============ */
const PLANS = {
  d14:  {name:"14 jou",     days:14, price:1500, kind:"plan"},
  d30:  {name:"30 jou",     days:30, price:2500, kind:"plan"},
  v1:   {name:"VIP Jou",    days:1,  price:500,  kind:"plan"},
  v7:   {name:"VIP 7 jou",  days:7,  price:2500, kind:"plan"},
  v30:  {name:"VIP 30 jou", days:30, price:6500, kind:"plan"}
};

/* ============ PLAN REZIDANSYÈL ============ */
const HOME_PLANS = {
  hb:   {name:"Rezidansyèl Basic", desc:"30/10 Mbps", price:35, kind:"home", install:50},
  hmp:  {name:"Pro (mwa)",        desc:"Vitès siperyè", price:45, kind:"home"},
  hmx:  {name:"Premium (mwa)",    desc:"Vitès maksimòm", price:55, kind:"home"},
  hv14: {name:"VIP 14 jou",       desc:"55 Mbps", price:25, kind:"home", days:14},
  hv30: {name:"VIP 30 jou",       desc:"100 Mbps", price:75, kind:"home", days:30}
};

/* ============ EKIPMAN ============ */
const EQUIPS = {
  cpe:    {name:"Antèn CPE NetPlus", desc:"Resevwa siyal lakay ou", price:60, oldPrice:65, kind:"equip"},
  router: {name:"Routeur NetPlus",   desc:"Routeur WiFi pou kay ou", price:60, oldPrice:65, kind:"equip"}
};

/* ============ PLAN AJAN (sou lyen) ============ */
const AGENT_PLANS = {
  agent30: {name:"Ajan 30 jou", desc:"Rezève pou anplwaye", price:1000, days:30, kind:"plan"}
};

/* ============ PLAN PROMO (sou envitasyon) ============ */
const PROMO_PLANS = {
  promo8:  {name:"Promo 8.5 GB", desc:"Sou envitasyon", price:100,  kind:"plan"},
  promo30: {name:"Promo 30 jou", desc:"Sou envitasyon", price:1800, days:30, kind:"plan"}
};

/* ============ ZONES ============ */
const ZONES = [
  {n:"Asipha",d:"Gonaïves",s:"ok"},{n:"Morne Blanc",d:"Gonaïves",s:"ok"},
  {n:"Bien Ac",d:"Gonaïves",s:"ok"},{n:"Seprenn",d:"Gonaïves",s:"ok"},
  {n:"Gros Morne",d:"Gonaïves",s:"ok"},{n:"Parc Vincent",d:"Gonaïves",s:"ok"},
  {n:"Bretagne",d:"Gonaïves",s:"ok"},{n:"Cap-Haïtien",d:"Okap",s:"soon"},
  {n:"Lòt zòn",d:"Sou demann",s:"soon"}
];

/* ============ ICONS ============ */
const ICONS = {
  plan: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 8.5a16 16 0 0 1 20 0"/><path d="M5 12a11 11 0 0 1 14 0"/><path d="M8.5 15.5a6 6 0 0 1 7 0"/><circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/></svg>`,
  home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>`,
  cpe: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6"/><path d="M9 6a3 3 0 0 1 6 0"/><path d="M12 9l-6 12h12L12 9z"/><circle cx="12" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>`,
  router: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 16.5h.01M11 16.5h.01"/><path d="M8 13V9a4 4 0 0 1 8 0v4"/><path d="M18 6l2-2M6 6L4 4"/></svg>`
};

/* ============ DETÈMINE PLAN AKI ============ */
const params = new URLSearchParams(location.search);
const key = params.get("plan");

let product = PLANS[key] || HOME_PLANS[key] || EQUIPS[key] || AGENT_PLANS[key] || PROMO_PLANS[key];
let productType = PLANS[key] ? "plan"
                 : HOME_PLANS[key] ? "home"
                 : EQUIPS[key] ? "equip"
                 : AGENT_PLANS[key] ? "agent"
                 : PROMO_PLANS[key] ? "promo" : null;

if (!product){
  location.replace("portal.html");
} else {
  const isEquip = productType === "equip";
  const isHome = productType === "home";
  const isAgent = productType === "agent";
  const isPromo = productType === "promo";

  let title = "Aktivasyon plan";
  let subtitle = "Ranpli enfòmasyon ou pou w kontinye.";

  if (isEquip){ title = "Achte ekipman"; subtitle = "Ranpli enfòmasyon ou pou peman an."; }
  else if (isHome){ title = "Enstalasyon rezidansyèl"; subtitle = "Ranpli enfòmasyon ou pou enstalasyon an."; }
  else if (isAgent){ title = "Plan ajan"; subtitle = "Plan rezève pou anplwaye NET PLUS."; }
  else if (isPromo){ title = "Plan promo"; subtitle = "Plan sou envitasyon sèlman."; }

  $("hTitle").textContent = title;
  $("hSub").textContent = subtitle;
  $("pIcon").innerHTML = ICONS[isHome ? "home" : isEquip ? key : "plan"] || ICONS.plan;
  $("pName").textContent = product.name;

  let dur = "";
  if (isEquip) dur = product.desc;
  else if (isHome) dur = product.desc + (product.days ? " · " + product.days + " jou" : " · 1 mwa");
  else if (product.days) dur = product.days + " jou";
  else dur = "Ilimite";
  $("pDur").textContent = dur;

  const priceUnit = (isHome || isEquip) ? " USD" : " HTG";
  $("pPrice").innerHTML = product.price.toLocaleString("fr-FR") + priceUnit +
    (product.oldPrice ? `<span class="old">${product.oldPrice} USD</span>` : "");

  if (product.install){
    $("installNote").hidden = false;
    $("installNote").textContent = "+ " + product.install + " USD enstalasyon";
  }

  /* Zòn + adrès pou ekipman ak rezidansyèl */
  if (isEquip || isHome){
    $("zoneBox").hidden = false;
    $("zone").innerHTML = ZONES.map(z =>
      `<option value="${z.n}">${z.n} — ${z.d} (${z.s === "ok" ? "Disponib" : "Byento"})</option>`
    ).join("");
    $("zone").addEventListener("change", () => {
      const z = ZONES.find(x => x.n === $("zone").value);
      $("zoneNote").classList.toggle("show", z && z.s === "soon");
    });
  }
}

/* ============ BOUTON RELE ============ */
$("callBtn").addEventListener("click", () => {
  location.href = "tel:+" + SUPPORT_PHONE;
});

/* ============ MESAJ ============ */
function setMsg(kind, text){
  const el = $("msg");
  el.className = "msg" + (kind ? " " + kind : "");
  el.innerHTML = "";
  if (!text) return;
  const icon = kind === "ok"
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="M5 12l5 5L20 7"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".8" fill="currentColor"/></svg>`;
  el.innerHTML = icon + "<span>" + text + "</span>";
}

/* ============ VALIDASYON ============ */
$("name").addEventListener("input", () => { $("nameField").classList.remove("err"); setMsg(null, ""); });
$("phone").addEventListener("input", () => { $("phoneField").classList.remove("err"); setMsg(null, ""); });
$("addr")?.addEventListener("input", () => { $("addrField").classList.remove("err"); setMsg(null, ""); });

/* ============ KONTINYE ============ */
$("goBtn").addEventListener("click", async () => {
  if (!product) return;

  const name = $("name").value.trim();
  const phone = $("phone").value.trim();
  setMsg(null, "");

  if (!name){
    $("nameField").classList.add("err");
    setMsg("err", "Antre non ou.");
    $("name").focus();
    return;
  }

  if (!phone){
    $("phoneField").classList.add("err");
    setMsg("err", "Antre nimewo WhatsApp ou.");
    $("phone").focus();
    return;
  }

  const digits = phone.replace(/\D/g, "");
  if (digits.length < 8){
    $("phoneField").classList.add("err");
    setMsg("err", "Nimewo WhatsApp pa valid. Antre omwen 8 chif.");
    $("phone").focus();
    return;
  }

  let payload = { planKey: key, name, phone, kind: productType };

  if (productType === "equip" || productType === "home"){
    const addr = $("addr").value.trim();
    const zone = $("zone").value;
    if (!addr){
      $("addrField").classList.add("err");
      setMsg("err", "Antre adrès livrezon.");
      $("addr").focus();
      return;
    }
    payload = { ...payload, zone, address: addr };
  }

  const btn = $("goBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Ap kontinye…';

  try {
    const r = await fetch(API + "/api/order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "unknown");

    /* Sove done yo pou paj peman an */
    sessionStorage.setItem("np_order_id", d.id);
    sessionStorage.setItem("np_order_amount", d.amount);
    sessionStorage.setItem("np_order_plan", key);
    sessionStorage.setItem("np_order_name", name);
    sessionStorage.setItem("np_order_phone", phone);

    /* Ale nan paj peman an */
    location.href = "payment.html?order=" + d.id + "&amount=" + d.amount + "&plan=" + key;
  } catch(err) {
    setMsg("err", "Erè. Eseye ankò oswa kontakte nou sou WhatsApp.");
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg> Kontinye pou peye';
  }
});
</script>
</body>
        </html>
