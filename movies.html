<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>BLAST FLIX - Tous les Films</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased; }
    :root {
      --black:#000; --charcoal:#121214; --slate:#1c1c1f;
      --cyan:#64d2ff; --blue:#0a84ff; --purple:#bf5af2; --pink:#ff375f;
      --glass-1:rgba(255,255,255,0.035); --glass-2:rgba(255,255,255,0.07);
      --glass-border:rgba(255,255,255,0.09); --glass-border-bright:rgba(255,255,255,0.22);
      --glass-highlight:inset 0 1px 0 rgba(255,255,255,0.20);
      --text:#f5f5f7; --text-dim:rgba(245,245,247,0.55);
      --r-lg:24px; --blur-glass:blur(40px) saturate(180%);
      --spring:0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    body {
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;
      background:var(--black); color:var(--text); min-height:100vh;
      padding-bottom:80px; overflow-x:hidden;
    }
    .bg-neo { position:fixed; inset:0; z-index:-3; background:var(--black); }
    .bg-neo::before {
      content:''; position:absolute; inset:0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(100,210,255,0.22), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(10,132,255,0.15), transparent),
        radial-gradient(ellipse 50% 30% at 0% 50%, rgba(191,90,242,0.1), transparent);
      filter:blur(80px);
    }
    .noise {
      position:fixed; inset:0; z-index:-1; opacity:0.05; pointer-events:none;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode:overlay;
    }
    /* HEADER */
    .header {
      position:sticky; top:0; z-index:100; padding:14px 20px;
      background:rgba(10,10,12,0.85); backdrop-filter:var(--blur-glass);
      border-bottom:1px solid var(--glass-border);
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding-top:calc(14px + env(safe-area-inset-top,0px));
      box-shadow:var(--glass-highlight);
    }
    .back-btn {
      width:42px; height:42px; border-radius:50%;
      background:var(--glass-2); border:1px solid var(--glass-border);
      color:var(--text); display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:all var(--spring); flex-shrink:0;
    }
    .back-btn:hover { border-color:var(--cyan); background:rgba(100,210,255,0.15); }
    .logo { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; flex:1; }
    .logo-mark {
      width:34px; height:34px; border-radius:11px;
      background:linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
      display:flex; align-items:center; justify-content:center;
      color:var(--black); font-size:15px;
      box-shadow:0 6px 20px rgba(100,210,255,0.5), inset 0 1px 0 rgba(255,255,255,0.5);
    }
    .logo-text { font-size:17px; font-weight:800; }
    .count-badge {
      padding:6px 12px; background:rgba(100,210,255,0.15);
      border:1px solid rgba(100,210,255,0.4); border-radius:50px;
      font-size:11px; font-weight:700; color:var(--cyan); flex-shrink:0;
    }
    /* SEARCH BAR */
    .search-wrap { padding:16px 20px 8px; max-width:1200px; margin:0 auto; }
    .search-box {
      width:100%; padding:14px 16px 14px 46px; border-radius:16px;
      background:var(--glass-2); border:1px solid var(--glass-border);
      color:var(--text); font-size:15px; font-family:inherit; outline:none;
      transition:all var(--spring); position:relative;
    }
    .search-box::placeholder { color:var(--text-dim); }
    .search-box:focus { border-color:var(--cyan); background:rgba(100,210,255,0.08); box-shadow:0 0 0 3px rgba(100,210,255,0.15); }
    .search-icon-wrap { position:relative; }
    .search-icon-wrap .fa-search {
      position:absolute; left:16px; top:50%; transform:translateY(-50%);
      color:var(--text-dim); font-size:16px; pointer-events:none;
    }
    /* FILTERS */
    .filters { display:flex; gap:8px; padding:12px 20px 8px; overflow-x:auto; scrollbar-width:none; max-width:1200px; margin:0 auto; }
    .filters::-webkit-scrollbar { display:none; }
    .filter-btn {
      padding:9px 16px; background:var(--glass-1);
      border:1px solid var(--glass-border); border-radius:50px;
      color:var(--text-dim); font-size:12px; font-weight:600;
      white-space:nowrap; cursor:pointer; font-family:inherit;
      transition:all var(--spring); flex-shrink:0;
    }
    .filter-btn.active {
      background:linear-gradient(135deg, rgba(100,210,255,0.25), rgba(191,90,242,0.2));
      border-color:var(--cyan); color:var(--cyan);
      box-shadow:0 4px 20px rgba(100,210,255,0.3);
    }
    .filter-btn:hover:not(.active) { border-color:var(--glass-border-bright); color:var(--text); }
    /* CONTENT */
    .content { max-width:1200px; margin:0 auto; padding:16px 20px 24px; }
    .results-info {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:16px; font-size:13px; color:var(--text-dim);
    }
    .results-info strong { color:var(--cyan); font-weight:700; }
    /* GRID */
    .grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
      gap:14px;
    }
    .card {
      border-radius:var(--r-lg); overflow:hidden;
      background:var(--glass-1); border:1px solid var(--glass-border);
      cursor:pointer; transition:transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      text-decoration:none; color:inherit; display:block;
      box-shadow:var(--glass-highlight), 0 4px 12px rgba(0,0,0,0.3);
      position:relative; transform:translateZ(0); will-change:transform;
    }
    .card:hover {
      transform:translateY(-6px) scale(1.02) translateZ(0);
      border-color:var(--glass-border-bright);
      box-shadow:0 20px 40px rgba(0,0,0,0.6), 0 0 30px rgba(100,210,255,0.2);
    }
    .poster-wrap {
      position:relative; width:100%; aspect-ratio:2/3;
      overflow:hidden; background:linear-gradient(135deg, #1a1a1c, #2a2a2e);
    }
    .poster {
      width:100%; height:100%; object-fit:cover; display:block;
      transition:transform 0.5s ease, opacity 0.3s ease;
      opacity:0; background:linear-gradient(135deg, #1a1a1c, #2a2a2e);
    }
    .poster.loaded { opacity:1; }
    .card:hover .poster { transform:scale(1.08); }
    /* Skeleton loading */
    .poster-skeleton {
      position:absolute; inset:0;
      background:linear-gradient(90deg, #1a1a1c 25%, #2a2a2e 50%, #1a1a1c 75%);
      background-size:200% 100%;
      animation:shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { background-position:200% 0; }
      100% { background-position:-200% 0; }
    }
    .card-hd {
      position:absolute; top:8px; right:8px;
      padding:3px 7px; background:rgba(0,0,0,0.75);
      border:1px solid rgba(255,255,255,0.2); border-radius:6px;
      font-size:9px; font-weight:800; color:var(--cyan);
      backdrop-filter:blur(10px);
    }
    .card-info { padding:9px 11px; }
    .card-title {
      font-size:12px; font-weight:700;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      margin-bottom:3px;
    }
    .card-meta { display:flex; gap:6px; font-size:10px; color:var(--text-dim); align-items:center; }
    .card-meta .rating { color:var(--cyan); font-weight:700; display:inline-flex; align-items:center; gap:2px; }
    .card-meta .rating i { font-size:8px; }
    /* EMPTY STATE */
    .empty {
      text-align:center; padding:80px 20px; color:var(--text-dim);
    }
    .empty i { font-size:48px; margin-bottom:16px; opacity:0.4; }
    .empty h3 { font-size:18px; margin-bottom:8px; color:var(--text); }
    /* LOAD MORE */
    .load-more-wrap { text-align:center; padding:32px 0; }
    .load-more-btn {
      padding:14px 40px; border-radius:50px;
      background:linear-gradient(135deg, rgba(100,210,255,0.2), rgba(191,90,242,0.15));
      border:1px solid var(--cyan); color:var(--cyan);
      font-size:14px; font-weight:700; font-family:inherit;
      cursor:pointer; transition:all var(--spring);
      display:inline-flex; align-items:center; gap:10px;
    }
    .load-more-btn:hover { background:rgba(100,210,255,0.25); transform:translateY(-2px); }
    .load-more-btn:disabled { opacity:0.5; cursor:not-allowed; }
    /* FOOTER */
    .footer {
      position:fixed; bottom:0; left:0; right:0; z-index:90;
      padding:10px 20px; background:rgba(10,10,12,0.9);
      backdrop-filter:var(--blur-glass);
      border-top:1px solid var(--glass-border);
      display:flex; align-items:center; justify-content:space-around;
      padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));
    }
    .footer-btn {
      display:flex; flex-direction:column; align-items:center; gap:3px;
      color:var(--text-dim); text-decoration:none;
      font-size:10px; font-weight:600;
      padding:6px 14px; border-radius:12px;
      transition:all var(--spring);
    }
    .footer-btn i { font-size:18px; }
    .footer-btn.active { color:var(--cyan); }
    @media (max-width: 768px) {
      .grid { grid-template-columns:repeat(3, 1fr); gap:10px; }
      .content { padding:12px 14px 24px; }
      .search-wrap, .filters { padding-left:14px; padding-right:14px; }
      .header { padding:12px 14px; }
      .card-title { font-size:11px; }
    }
    @media (max-width: 380px) {
      .grid { grid-template-columns:repeat(2, 1fr); }
    }
    /* Smooth scroll */
    html { scroll-behavior:smooth; }
  </style>
</head>

// ============================================================
// ✅ STATE
// ============================================================
const STATE = {
  allMovies: MOVIES,
  filtered: MOVIES,
  displayCount: 30,
  currentFilter: 'all',
  searchQuery: '',
  searchTimer: null,
  observer: null
};

const PAGE_SIZE = 30;

// ============================================================
// ✅ INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('totalCount').textContent = `${MOVIES.length} films`;
  setupFilters();
  setupSearch();
  setupLoadMore();
  renderGrid();
});

// ============================================================
// ✅ FILTERS
// ============================================================
function setupFilters() {
  const filters = ['all', 'Action', 'Drama', 'Comedy', 'Animation', 'Anime', 'Crime', 'Horror', 'Sci-Fi', 'Thriller', 'Fantasy', 'Adventure', 'Romance', 'Series'];
  const labels = { 'all':'Tous', 'Action':'Action', 'Drama':'Drama', 'Comedy':'Comédie', 'Animation':'Animation', 'Anime':'Anime', 'Crime':'Crime', 'Horror':'Horreur', 'Sci-Fi':'Sci-Fi', 'Thriller':'Thriller', 'Fantasy':'Fantasy', 'Adventure':'Aventure', 'Romance':'Romance', 'Series':'Séries' };
  const container = document.getElementById('filters');
  container.innerHTML = filters.map(f => `<button class="filter-btn ${f==='all'?'active':''}" data-filter="${f}">${labels[f]}</button>`).join('');
  container.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      STATE.currentFilter = btn.dataset.filter;
      STATE.displayCount = PAGE_SIZE;
      applyFilters();
    });
  });
}

// ============================================================
// ✅ SEARCH (debounce 300ms)
// ============================================================
function setupSearch() {
  const input = document.getElementById('searchInput');
  input.addEventListener('input', (e) => {
    clearTimeout(STATE.searchTimer);
    STATE.searchTimer = setTimeout(() => {
      STATE.searchQuery = e.target.value.trim().toLowerCase();
      STATE.displayCount = PAGE_SIZE;
      applyFilters();
    }, 300);
  });
}

// ============================================================
// ✅ LOAD MORE
// ============================================================
function setupLoadMore() {
  document.getElementById('loadMoreBtn').addEventListener('click', () => {
    STATE.displayCount += PAGE_SIZE;
    renderGrid();
  });
}

// ============================================================
// ✅ APPLY FILTERS
// ============================================================
function applyFilters() {
  let result = STATE.allMovies;
  if (STATE.currentFilter === 'Series') {
    result = result.filter(m => m.type === 'series');
  } else if (STATE.currentFilter !== 'all') {
    result = result.filter(m => m.genre.includes(STATE.currentFilter));
  }
  if (STATE.searchQuery) {
    const q = STATE.searchQuery;
    result = result.filter(m => 
      m.title.toLowerCase().includes(q) || 
      m.genre.toLowerCase().includes(q) ||
      m.desc.toLowerCase().includes(q)
    );
  }
  STATE.filtered = result;
  renderGrid();
}

// ============================================================
// ✅ RENDER GRID (lazy + pagination)
// ============================================================
function renderGrid() {
  const grid = document.getElementById('grid');
  const loadMoreWrap = document.getElementById('loadMoreWrap');
  const resultsLabel = document.getElementById('resultsLabel');
  
  const total = STATE.filtered.length;
  const visible = STATE.filtered.slice(0, STATE.displayCount);
  
  if (total === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">
      <i class="fas fa-search"></i>
      <h3>Aucun résultat</h3>
      <p>Essayez un autre mot-clé ou filtre</p>
    </div>`;
    loadMoreWrap.style.display = 'none';
    resultsLabel.innerHTML = `<strong>0</strong> film trouvé`;
    return;
  }
  
  resultsLabel.innerHTML = `<strong>${visible.length}</strong> sur <strong>${total}</strong> films`;
  
  grid.innerHTML = visible.map(m => createCard(m)).join('');
  
  // Setup lazy loading
  setupLazyLoading();
  
  // Show/hide load more
  if (STATE.displayCount < total) {
    loadMoreWrap.style.display = 'block';
    document.getElementById('loadMoreBtn').innerHTML = `<i class="fas fa-plus"></i> Charger plus (${total - STATE.displayCount} restants)`;
  } else {
    loadMoreWrap.style.display = 'none';
  }
}

// ============================================================
// ✅ CREATE CARD
// ============================================================
function createCard(m) {
  const params = new URLSearchParams({
    subjectId: m.subjectId, title: m.title, poster: m.poster,
    year: m.year, rating: m.rating, type: m.type,
    detailPath: m.detailPath, desc: m.desc
  });
  return `
    <a href="player.html?${params.toString()}" class="card">
      <div class="poster-wrap">
        <div class="poster-skeleton"></div>
        <img class="poster" data-src="${m.poster}" alt="${m.title}" loading="lazy"
             onerror="this.style.display='none'; this.parentElement.querySelector('.poster-skeleton').style.display='block';">
        <div class="card-hd">HD</div>
      </div>
      <div class="card-info">
        <div class="card-title">${m.title}</div>
        <div class="card-meta">
          <span>${m.year}</span>
          <span class="rating"><i class="fas fa-star"></i>${m.rating}</span>
        </div>
      </div>
    </a>`;
}

// ============================================================
// ✅ LAZY LOADING (IntersectionObserver — chaje imaj sèlman lè parèt)
// ============================================================
function setupLazyLoading() {
  if (STATE.observer) STATE.observer.disconnect();
  
  if ('IntersectionObserver' in window) {
    STATE.observer = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          const src = img.dataset.src;
          if (src) {
            img.src = src;
            img.onload = () => {
              img.classList.add('loaded');
              const skel = img.parentElement.querySelector('.poster-skeleton');
              if (skel) skel.style.display = 'none';
            };
            img.removeAttribute('data-src');
          }
          obs.unobserve(img);
        }
      });
    }, { rootMargin: '200px' });
    
    document.querySelectorAll('.poster[data-src]').forEach(img => STATE.observer.observe(img));
  } else {
    // Fallback
    document.querySelectorAll('.poster[data-src]').forEach(img => {
      img.src = img.dataset.src;
      img.onload = () => {
        img.classList.add('loaded');
        const skel = img.parentElement.querySelector('.poster-skeleton');
        if (skel) skel.style.display = 'none';
      };
    });
  }
}
</script>
