<style>
/* ============ RESET & BASE ============ */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }

:root {
  /* Palette gris / noir */
  --gray-50:  #f9fafb;
  --gray-100: #f3f4f6;
  --gray-300: #d1d5db;
  --gray-400: #9ca3af;
  --gray-500: #6b7280;
  --gray-600: #4b5563;
  --gray-700: #374151;
  --gray-800: #1f2937;
  --gray-900: #111827;
  --black:    #0a0a0a;
  --black-soft: #141414;

  --accent:   #e5e7eb;
  --accent-glow: rgba(229, 231, 235, 0.35);

  --glass-bg:     rgba(255, 255, 255, 0.04);
  --glass-border: rgba(255, 255, 255, 0.10);
  --glass-strong: rgba(20, 20, 20, 0.55);

  --text-primary:   #f3f4f6;
  --text-secondary: rgba(209, 213, 219, 0.65);

  --radius:    22px;
  --radius-sm: 14px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  background: var(--black);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: 100px;
  position: relative;
}

/* ============ BACKGROUND ORBS (gris/blanc) ============ */
.bg-orbs {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.35;
  animation: float 22s ease-in-out infinite;
}
.orb-1 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, #6b7280, transparent 70%);
  top: -150px; left: -120px;
}
.orb-2 {
  width: 600px; height: 600px;
  background: radial-gradient(circle, #9ca3af, transparent 70%);
  bottom: -220px; right: -160px;
  animation-delay: -8s;
}
.orb-3 {
  width: 420px; height: 420px;
  background: radial-gradient(circle, #4b5563, transparent 70%);
  top: 40%; left: 50%;
  animation-delay: -15s;
}
@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(60px, -40px) scale(1.1); }
  66% { transform: translate(-40px, 50px) scale(0.95); }
}

/* ============ GLASS EFFECT ============ */
.glass-card,
.glass-header {
  background: var(--glass-bg);
  backdrop-filter: blur(26px) saturate(160%);
  -webkit-backdrop-filter: blur(26px) saturate(160%);
  border: 1px solid var(--glass-border);
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.55),
    inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

/* ============ HEADER ============ */
.glass-header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-radius: 0 0 var(--radius) var(--radius);
  border-top: none;
  border-left: none;
  border-right: none;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-text {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 1.5px;
  color: var(--gray-100);
  text-shadow: 0 0 18px rgba(255, 255, 255, 0.25);
}
.nav-links { display: flex; gap: 22px; }
.nav-links a {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.3s;
}
.nav-links a.active,
.nav-links a:hover {
  color: var(--gray-100);
  text-shadow: 0 0 12px rgba(255, 255, 255, 0.55);
}
.header-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
}
.icon-btn:hover {
  background: rgba(255, 255, 255, 0.10);
  border-color: var(--gray-400);
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.18);
}

/* ============ SEARCH ============ */
.search-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 10, 10, 0.85);
  backdrop-filter: blur(20px);
  z-index: 200;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding-top: 120px;
}
.search-overlay.active { display: flex; }
.search-box {
  width: 90%;
  max-width: 600px;
  padding: 8px 8px 8px 24px;
  border-radius: 50px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.search-box input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-size: 16px;
  padding: 12px 0;
}
.search-box input::placeholder { color: var(--text-secondary); }

/* ============ HERO ============ */
.hero {
  margin: 20px;
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
  min-height: 420px;
  display: flex;
  align-items: flex-end;
  padding: 32px;
}
.hero-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: blur(2px) brightness(0.45) grayscale(0.35);
  transform: scale(1.05);
  z-index: 0;
}
.hero-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(10,10,10,0.96) 10%, transparent 75%);
}
.hero-content { position: relative; z-index: 2; max-width: 620px; }
.hero-badge {
  display: inline-block;
  padding: 6px 14px;
  background: linear-gradient(90deg, var(--gray-700), var(--gray-500));
  border: 1px solid var(--gray-500);
  border-radius: 50px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 14px;
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.10);
}
.hero-title {
  font-size: clamp(28px, 5vw, 52px);
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: 14px;
  text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
}
.hero-meta {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 14px;
  font-size: 14px;
  color: var(--text-secondary);
}
.hero-meta span {
  padding: 4px 10px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 50px;
  backdrop-filter: blur(10px);
}
.hero-desc {
  font-size: 15px;
  line-height: 1.6;
  color: var(--text-secondary);
  margin-bottom: 22px;
  max-width: 520px;
}
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }

/* ============ BUTTONS ============ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 26px;
  border-radius: 50px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.3s;
  font-family: inherit;
  text-decoration: none;
}
.btn-primary {
  background: linear-gradient(135deg, var(--gray-100), var(--gray-400));
  color: #050505;
  box-shadow: 0 0 30px rgba(255, 255, 255, 0.30);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 45px rgba(255, 255, 255, 0.55);
}
.btn-glass {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  color: var(--text-primary);
  backdrop-filter: blur(20px);
}
.btn-glass:hover {
  border-color: var(--gray-400);
  box-shadow: 0 0 25px rgba(255, 255, 255, 0.20);
}
.btn-wa {
  background: linear-gradient(135deg, #1f2937, #374151);
  color: #fff;
  border: 1px solid #4b5563;
  box-shadow: 0 0 25px rgba(37, 211, 102, 0.25);
}
.btn-wa:hover {
  background: linear-gradient(135deg, #25D366, #1da851);
  transform: translateY(-2px);
  box-shadow: 0 0 35px rgba(37, 211, 102, 0.55);
}

/* ============ CATEGORY TABS ============ */
.category-tabs {
  display: flex;
  gap: 10px;
  padding: 0 20px 20px;
  overflow-x: auto;
  scrollbar-width: none;
}
.category-tabs::-webkit-scrollbar { display: none; }
.cat-pill {
  padding: 10px 20px;
  border-radius: 50px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
}
.cat-pill.active,
.cat-pill:hover {
  background: rgba(255, 255, 255, 0.10);
  border-color: var(--gray-400);
  color: var(--gray-100);
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.18);
}

/* ============ CONTENT ============ */
.content { padding: 0 20px; }
.section { margin-bottom: 40px; }
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.section-title {
  font-size: 20px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.see-all {
  background: none;
  border: none;
  color: var(--gray-400);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
}
.see-all:hover { color: var(--gray-100); text-shadow: 0 0 12px rgba(255, 255, 255, 0.55); }

/* ============ MOVIE GRID ============ */
.movie-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
}
.movie-card {
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(20px);
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}
.movie-card:hover {
  transform: translateY(-6px) scale(1.02);
  border-color: var(--gray-400);
  box-shadow: 0 12px 40px rgba(255, 255, 255, 0.15);
}
.movie-poster {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
}
.movie-poster-placeholder {
  width: 100%;
  aspect-ratio: 2/3;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
  color: var(--text-secondary);
}
.movie-info { padding: 10px 12px; }
.movie-title {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}
.movie-meta {
  display: flex;
  gap: 8px;
  font-size: 11px;
  color: var(--text-secondary);
}
.rating-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  padding: 4px 8px;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(10px);
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  color: var(--gray-100);
  display: flex;
  align-items: center;
  gap: 3px;
}

/* ============ WHATSAPP BANNER ============ */
.whatsapp-banner {
  margin: 30px 20px;
  padding: 26px;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  gap: 22px;
  flex-wrap: wrap;
  border: 1px solid rgba(37, 211, 102, 0.25);
  box-shadow: 0 0 40px rgba(37, 211, 102, 0.10);
}
.wa-icon {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, #25D366, #1da851);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  flex-shrink: 0;
  box-shadow: 0 0 30px rgba(37, 211, 102, 0.55);
}
.wa-text { flex: 1; min-width: 240px; }
.wa-text h3 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 6px;
}
.wa-text p {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 14px;
  line-height: 1.5;
}
.wa-text strong { color: #25D366; }

/* ============ FOOTER ============ */
.site-footer {
  text-align: center;
  padding: 50px 20px 120px;
  border-top: 1px solid var(--glass-border);
  margin-top: 30px;
}
.footer-logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 1.5px;
  color: var(--gray-100);
  margin-bottom: 10px;
}
.powered {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 24px;
  letter-spacing: 0.5px;
}
.grad-text {
  font-weight: 800;
  background: linear-gradient(90deg, #d1d5db, #ffffff, #9ca3af);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 15px rgba(255,255,255,0.3);
  letter-spacing: 1px;
}
.footer-links {
  display: flex;
  justify-content: center;
  gap: 22px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.footer-links a {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 13px;
  transition: color 0.3s;
}
.footer-links a:hover { color: var(--gray-100); }
.copyright {
  font-size: 12px;
  color: var(--gray-600);
}

/* ============ BOTTOM NAV ============ */
.bottom-nav {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 500px;
  border-radius: var(--radius);
  display: flex;
  justify-content: space-around;
  padding: 10px 8px;
  z-index: 90;
}
.nav-item {
  background: none;
  border: none;
  color: var(--text-secondary);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.3s;
  font-family: inherit;
  font-size: 10px;
  font-weight: 600;
}
.nav-item.active {
  color: var(--gray-100);
  background: rgba(255, 255, 255, 0.08);
  text-shadow: 0 0 12px rgba(255, 255, 255, 0.65);
}
.nav-item.active svg {
  filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.65));
}

/* ============ MODALS ============ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 10, 10, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.active { display: flex; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--glass-border);
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  transition: all 0.3s;
}
.modal-close:hover {
  background: var(--gray-600);
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.30);
}

/* ============ PLAYER ============ */
.player-card {
  width: 100%;
  max-width: 900px;
  padding: 24px;
  border-radius: var(--radius);
  position: relative;
}
.video-wrapper {
  width: 100%;
  aspect-ratio: 16/9;
  background: black;
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin-bottom: 16px;
  border: 1px solid var(--gray-500);
  box-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
}
.video-wrapper video { width: 100%; height: 100%; display: block; }
.player-info h3 {
  font-size: 20px;
  margin-bottom: 8px;
  color: var(--gray-100);
  text-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
}
.player-info p { color: var(--text-secondary); font-size: 14px; line-height: 1.6; }

/* ============ AUTH ============ */
.auth-card {
  width: 100%;
  max-width: 420px;
  padding: 40px 30px;
  border-radius: var(--radius);
  position: relative;
  text-align: center;
}
.auth-title {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 8px;
  color: var(--gray-100);
  text-shadow: 0 0 18px rgba(255, 255, 255, 0.25);
}
.auth-sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 30px; }
.auth-option {
  width: 100%;
  padding: 16px;
  margin-bottom: 12px;
  border-radius: var(--radius-sm);
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  color: white;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all 0.3s;
  font-family: inherit;
  backdrop-filter: blur(20px);
}
.auth-option:hover {
  border-color: var(--gray-400);
  background: rgba(255, 255, 255, 0.08);
  box-shadow: 0 0 25px rgba(255, 255, 255, 0.18);
}

/* ============ LOADER ============ */
.loader-overlay {
  position: fixed;
  inset: 0;
  background: var(--black);
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.5s;
}
.loader-overlay.hidden { opacity: 0; pointer-events: none; }
.neon-spinner {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 3px solid transparent;
  border-top-color: var(--gray-200, #e5e7eb);
  border-right-color: var(--gray-500);
  animation: spin 1s linear infinite;
  box-shadow: 0 0 30px rgba(255, 255, 255, 0.30);
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ RESPONSIVE ============ */
@media (max-width: 768px) {
  .nav-links { display: none; }
  .hero { min-height: 340px; padding: 24px; margin: 14px; }
  .movie-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
  .content { padding: 0 14px; }
  .bottom-nav { bottom: 10px; width: calc(100% - 20px); }
  .whatsapp-banner { flex-direction: column; text-align: center; }
}
@media (max-width: 400px) {
  .logo-text { font-size: 17px; }
  .hero-title { font-size: 24px; }
}
  </style>
