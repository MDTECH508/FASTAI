<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Lecture - BLAST FLIX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        :root {
            --black:#000; --charcoal:#121214;
            --cyan:#64d2ff; --blue:#0a84ff; --purple:#bf5af2; --pink:#ff375f; --gold:#ffd60a;
            --glass-1:rgba(255,255,255,0.035); --glass-2:rgba(255,255,255,0.07);
            --glass-border:rgba(255,255,255,0.09); --glass-border-bright:rgba(255,255,255,0.22);
            --text:#f5f5f7; --text-dim:rgba(245,245,247,0.55);
            --r-lg:20px; --r-md:14px;
            --blur-glass:blur(40px) saturate(180%);
            --spring:0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        html, body {
            font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
            background:var(--black); color:var(--text); min-height:100vh;
            overflow-x:hidden; overflow-y:auto;
        }
        .bg-neo { position:fixed; inset:0; z-index:-3; background:var(--black); }
        .bg-neo::before {
            content:''; position:absolute; inset:0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(100,210,255,0.18), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(10,132,255,0.12), transparent);
            filter:blur(80px);
        }
        
        /* HEADER */
        .header {
            position:sticky; top:0; z-index:100;
            padding:10px 16px;
            background:rgba(10,10,12,0.85);
            backdrop-filter:var(--blur-glass);
            -webkit-backdrop-filter:var(--blur-glass);
            border-bottom:1px solid var(--glass-border);
            display:flex; align-items:center; gap:12px;
            padding-top:calc(10px + env(safe-area-inset-top,0px));
        }
        .back-btn {
            width:38px; height:38px; border-radius:50%;
            background:rgba(255,255,255,0.07);
            border:1px solid var(--glass-border);
            color:var(--text);
            display:flex; align-items:center; justify-content:center;
            text-decoration:none; font-size:14px; flex-shrink:0;
            transition:all var(--spring);
        }
        .back-btn:hover { border-color:var(--cyan); background:rgba(100,210,255,0.15); }
        .header-title {
            font-size:14px; font-weight:700;
            flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .fav-btn-header {
            width:38px; height:38px; border-radius:50%;
            background:rgba(255,255,255,0.07);
            border:1px solid var(--glass-border);
            color:var(--text);
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; font-size:15px; flex-shrink:0;
            transition:all var(--spring);
        }
        .fav-btn-header:hover { border-color:var(--pink); background:rgba(255,55,95,0.15); color:var(--pink); }
        .fav-btn-header.active { background:rgba(255,55,95,0.25); border-color:var(--pink); color:var(--pink); }
        .fav-btn-header.active i { animation:heartBeat 0.6s ease; }
        @keyframes heartBeat {
            0%, 100% { transform:scale(1); }
            25% { transform:scale(1.4); }
            50% { transform:scale(1.1); }
            75% { transform:scale(1.3); }
        }
        
        /* IFRAME CONTAINER — BLOKE SCROLL */
        .iframe-wrap {
            position:relative;
            width:100%;
            height:380px;
            max-height:56vw;
            background:#000;
            overflow:hidden;
            margin-bottom:16px;
            isolation:isolate;
        }
        .iframe-wrap iframe {
            position:absolute;
            top:-1px; left:-1px;
            width:calc(100% + 2px);
            height:calc(100% + 2px);
            border:none;
            display:block;
            overflow:hidden;
            scrollbar-width:none;
            -ms-overflow-style:none;
            pointer-events:auto;
        }
        .iframe-wrap iframe::-webkit-scrollbar {
            display:none; width:0; height:0;
        }
        
        /* MASK ANWO — pi wo pou kache search bar + logo */
        .iframe-wrap .mask-top {
            position:absolute;
            top:0; left:0; right:0;
            height:130px;
            background:linear-gradient(to bottom, 
                #000 0%, 
                #000 85%, 
                rgba(0,0,0,0.5) 95%, 
                transparent 100%);
            z-index:10;
            pointer-events:none;
        }
        
        /* MASK ANBA */
        .iframe-wrap .mask-bottom {
            position:absolute;
            bottom:0; left:0; right:0;
            height:60px;
            background:linear-gradient(to top,
                #000 0%,
                #000 70%,
                rgba(0,0,0,0.4) 90%,
                transparent 100%);
            z-index:10;
            pointer-events:none;
        }
        
        /* MASK GOUCH */
        .iframe-wrap .mask-left {
            position:absolute;
            top:0; bottom:0; left:0;
            width:2px;
            background:#000;
            z-index:10;
            pointer-events:none;
        }
        
        /* MASK DWAT */
        .iframe-wrap .mask-right {
            position:absolute;
            top:0; bottom:0; right:0;
            width:2px;
            background:#000;
            z-index:10;
            pointer-events:none;
        }
        
        /* KONTNI ANBA A */
        .content {
            max-width:1000px;
            margin:0 auto;
            padding:0 16px 40px;
        }
        
        /* INFO CARD */
        .info-card {
            background:var(--glass-1);
            backdrop-filter:var(--blur-glass);
            -webkit-backdrop-filter:var(--blur-glass);
            border:1px solid var(--glass-border);
            border-radius:var(--r-lg);
            padding:16px;
            margin-bottom:14px;
        }
        .info-header {
            display:flex;
            gap:14px;
            align-items:flex-start;
            margin-bottom:14px;
        }
        .info-poster {
            width:80px;
            aspect-ratio:2/3;
            object-fit:cover;
            border-radius:var(--r-md);
            border:1px solid var(--glass-border);
            flex-shrink:0;
            background:var(--charcoal);
        }
        .info-content { flex:1; min-width:0; }
        .info-title {
            font-size:18px;
            font-weight:800;
            margin-bottom:8px;
            line-height:1.2;
        }
        .info-meta {
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            font-size:11px;
            color:var(--text-dim);
            font-weight:600;
        }
        .info-meta span { display:inline-flex; align-items:center; gap:4px; }
        .info-meta i { color:var(--cyan); font-size:10px; }
        .info-meta .rating { color:var(--gold); font-weight:800; }
        .info-desc {
            font-size:13px;
            line-height:1.6;
            color:var(--text-dim);
            padding-top:14px;
            border-top:1px solid var(--glass-border);
            margin-bottom:14px;
        }
        
        /* ACTIONS */
        .info-actions {
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }
        .btn {
            padding:11px 20px;
            border-radius:50px;
            font-size:13px;
            font-weight:800;
            cursor:pointer;
            font-family:inherit;
            text-decoration:none;
            display:inline-flex;
            align-items:center;
            gap:8px;
            border:none;
            transition:all var(--spring);
        }
        .btn-favorite {
            background:rgba(255,55,95,0.15);
            color:var(--pink);
            border:1px solid rgba(255,55,95,0.4);
        }
        .btn-favorite:hover {
            background:rgba(255,55,95,0.25);
            transform:scale(1.03);
        }
        .btn-favorite.active {
            background:linear-gradient(135deg, var(--pink), var(--purple));
            color:#fff;
            border:none;
            box-shadow:0 6px 20px rgba(255,55,95,0.4);
        }
        .btn-favorite.active i {
            animation:heartBeat 0.6s ease;
        }
        .btn-favorite:active {
            transform:scale(0.96);
        }
        
        /* WHATSAPP */
        .wa-card {
            display:flex;
            align-items:center;
            gap:12px;
            padding:14px;
            background:linear-gradient(135deg, rgba(37,211,102,0.15), rgba(18,140,126,0.1));
            border:1px solid rgba(37,211,102,0.4);
            border-radius:var(--r-lg);
            margin-bottom:14px;
        }
        .wa-icon {
            width:40px; height:40px;
            border-radius:12px;
            background:linear-gradient(135deg, #25D366, #128C7E);
            display:flex; align-items:center; justify-content:center;
            color:#fff; font-size:20px; flex-shrink:0;
        }
        .wa-content { flex:1; min-width:0; }
        .wa-title { font-size:13px; font-weight:800; margin-bottom:3px; }
        .wa-desc { font-size:10px; color:var(--text-dim); }
        .wa-btn {
            padding:8px 14px;
            background:linear-gradient(135deg, #25D366, #128C7E);
            color:#fff;
            border:none; border-radius:50px;
            font-size:11px; font-weight:700;
            cursor:pointer; text-decoration:none;
            white-space:nowrap;
        }
        
        /* SIJESYON */
        .suggest-title {
            font-size:15px;
            font-weight:800;
            margin-bottom:12px;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .suggest-title i { color:var(--cyan); font-size:13px; }
        .suggest-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
            gap:10px;
        }
        .suggest-card {
            border-radius:var(--r-md);
            overflow:hidden;
            background:var(--glass-1);
            border:1px solid var(--glass-border);
            text-decoration:none;
            color:inherit;
            display:block;
            transition:all var(--spring);
        }
        .suggest-card:hover {
            transform:translateY(-4px);
            border-color:var(--glass-border-bright);
            box-shadow:0 12px 30px rgba(0,0,0,0.5);
        }
        .suggest-card img {
            width:100%;
            aspect-ratio:2/3;
            object-fit:cover;
            display:block;
            background:var(--charcoal);
        }
        .suggest-info { padding:8px 10px; }
        .suggest-name {
            font-size:12px;
            font-weight:700;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            margin-bottom:2px;
        }
        .suggest-meta { font-size:10px; color:var(--text-dim); }
        
        /* TOAST */
        .toast {
            position:fixed;
            bottom:100px;
            left:50%;
            transform:translateX(-50%) translateY(100px);
            padding:14px 24px;
            border-radius:50px;
            background:rgba(30,30,32,0.98);
            border:1px solid var(--glass-border-bright);
            color:var(--text);
            font-size:14px;
            font-weight:700;
            backdrop-filter:blur(40px);
            -webkit-backdrop-filter:blur(40px);
            z-index:500;
            opacity:0;
            pointer-events:none;
            transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
            display:flex;
            align-items:center;
            gap:10px;
            box-shadow:0 10px 40px rgba(0,0,0,0.6);
        }
        .toast.show {
            opacity:1;
            transform:translateX(-50%) translateY(0);
        }
        .toast i { font-size:16px; color:var(--pink); }
        
        @media (max-width:768px) {
            .iframe-wrap { height:56vw; max-height:380px; }
            .content { padding:0 12px 40px; }
            .info-title { font-size:16px; }
            .suggest-grid { grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:8px; }
        }
    </style>
</head>
<body>

<div class="bg-neo"></div>

<!-- HEADER AK BOUTON FAVORI -->
<header class="header">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <div class="header-title" id="headerTitle">Chargement...</div>
    <button class="fav-btn-header" id="favBtnHeader" title="Favori">
        <i class="fas fa-heart"></i>
    </button>
</header>

<!-- IFRAME WRAPPER — BLOKE SCROLL -->
<div class="iframe-wrap">
    <iframe 
        id="playerIframe" 
        allowfullscreen 
        webkitallowfullscreen
        mozallowfullscreen
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        scrolling="no"
        frameborder="0"
        referrerpolicy="no-referrer-when-downgrade">
    </iframe>
    <!-- MASKS POU KACHE BARS MOVIESBOX -->
    <div class="mask-top"></div>
    <div class="mask-bottom"></div>
    <div class="mask-left"></div>
    <div class="mask-right"></div>
</div>

<!-- KONTNI ANBA A -->
<div class="content">
    <div class="info-card">
        <div class="info-header">
            <img id="infoPoster" class="info-poster" src="" alt="Poster">
            <div class="info-content">
                <h1 id="infoTitle" class="info-title">Chargement...</h1>
                <div class="info-meta" id="infoMeta"></div>
            </div>
        </div>
        <p id="infoDesc" class="info-desc">Chargement...</p>
        <div class="info-actions">
            <button class="btn btn-favorite" id="favBtnMain">
                <i class="fas fa-heart"></i> <span>Ajouter aux favoris</span>
            </button>
        </div>
    </div>

    <div class="wa-card">
        <div class="wa-icon"><i class="fab fa-whatsapp"></i></div>
        <div class="wa-content">
            <div class="wa-title">Rejoignez notre chaîne WhatsApp</div>
            <div class="wa-desc">Nouveautés + liens directs</div>
        </div>
        <a href="https://whatsapp.com/channel/0029Vb6tw1G42Dcja42wiY3R" target="_blank" class="wa-btn">
            <i class="fab fa-whatsapp"></i> Suivre
        </a>
    </div>

    <div class="suggest-title"><i class="fas fa-film"></i> Films suggérés</div>
    <div class="suggest-grid" id="suggestGrid"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"><i class="fas fa-heart"></i> <span id="toastText">OK</span></div>

<script>
// ============================================================
// ✅ DATA SOTI NAN URL
// ============================================================
const params = new URLSearchParams(window.location.search);
const data = {
    subjectId: params.get('subjectId') || '',
    title: params.get('title') || 'Film',
    poster: params.get('poster') || '',
    year: params.get('year') || '',
    rating: params.get('rating') || 'N/A',
    type: params.get('type') || 'movie',
    detailPath: params.get('detailPath') || '',
    desc: params.get('desc') || 'Aucune description disponible.'
};

document.getElementById('headerTitle').textContent = data.title;
document.getElementById('infoPoster').src = data.poster || 'https://via.placeholder.com/300x450/1a1a1c/4a4a52?text=No+Image';
document.getElementById('infoTitle').textContent = data.title;
document.getElementById('infoMeta').innerHTML = `
    <span><i class="fas fa-calendar"></i> ${data.year}</span>
    <span class="rating"><i class="fas fa-star"></i> ${data.rating}</span>
    <span>${data.type === 'series' ? 'Série' : 'Film'}</span>
`;
document.getElementById('infoDesc').textContent = data.desc;

// ============================================================
// ✅ IFRAME (movieboxonline.net)
// ============================================================
const iframe = document.getElementById('playerIframe');
let iframeUrl = '';

if (data.detailPath) {
    iframeUrl = `https://movieboxonline.net/play/${data.detailPath}?id=${data.subjectId}&page_from=home&type=/movie/detail`;
} else {
    iframeUrl = `https://movieboxonline.net/play?id=${data.subjectId}&type=/movie/detail`;
}

console.log('🔗 Iframe URL:', iframeUrl);
iframe.src = iframeUrl;

// ============================================================
// ✅ FAVORIS
// ============================================================
function isFavorite() {
    try {
        const favorites = JSON.parse(localStorage.getItem('blastflix_favorites') || '[]');
        return favorites.some(f => f.subjectId === data.subjectId);
    } catch { return false; }
}

function updateFavButtons() {
    const fav = isFavorite();
    const btnHeader = document.getElementById('favBtnHeader');
    const btnMain = document.getElementById('favBtnMain');
    
    if (fav) {
        btnHeader.classList.add('active');
        btnMain.classList.add('active');
        btnMain.innerHTML = '<i class="fas fa-heart"></i> <span>Retirer des favoris</span>';
    } else {
        btnHeader.classList.remove('active');
        btnMain.classList.remove('active');
        btnMain.innerHTML = '<i class="fas fa-heart"></i> <span>Ajouter aux favoris</span>';
    }
}

function toggleFavorite() {
    let favorites = [];
    try { favorites = JSON.parse(localStorage.getItem('blastflix_favorites') || '[]'); } catch {}
    
    const exists = favorites.some(f => f.subjectId === data.subjectId);
    
    if (exists) {
        favorites = favorites.filter(f => f.subjectId !== data.subjectId);
        showToast('Retiré des favoris', 'pink');
    } else {
        favorites.unshift({
            subjectId: data.subjectId,
            title: data.title,
            poster: data.poster,
            year: data.year,
            rating: data.rating,
            type: data.type,
            detailPath: data.detailPath,
            desc: data.desc,
            addedAt: Date.now()
        });
        showToast('Ajouté aux favoris !', 'pink');
    }
    
    localStorage.setItem('blastflix_favorites', JSON.stringify(favorites));
    updateFavButtons();
}

document.getElementById('favBtnHeader').addEventListener('click', toggleFavorite);
document.getElementById('favBtnMain').addEventListener('click', toggleFavorite);
updateFavButtons();

// ============================================================
// ✅ ISTWA — otomatik anrejistre
// ============================================================
(function trackHistory() {
    const movie = {
        subjectId: data.subjectId,
        title: data.title,
        poster: data.poster,
        year: data.year,
        rating: data.rating,
        type: data.type,
        detailPath: data.detailPath,
        desc: data.desc,
        watchedAt: Date.now(),
        progress: 0
    };
    
    let history = [];
    try { history = JSON.parse(localStorage.getItem('blastflix_history') || '[]'); } catch {}
    
    history = history.filter(h => h.subjectId !== movie.subjectId);
    history.unshift(movie);
    history = history.slice(0, 100);
    
    localStorage.setItem('blastflix_history', JSON.stringify(history));
})();

// ============================================================
// ✅ SIJESYON FIM YO
// ============================================================
const SUGGESTIONS = [
    { subjectId: "3725096513421442384", title: "Bugonia", poster: "https://pbcdnw.aoneroom.com/image/2025/12/04/cbb960d2b8053e40398372b031d7c6af.jpg", year: "2025", rating: "7.2", detailPath: "bugonia-WTd7eaSmwY2", desc: "A conspiracy theorist kidnaps a CEO." },
    { subjectId: "3854326812578922640", title: "After the Hunt", poster: "https://pbcdnw.aoneroom.com/image/2025/11/21/40a1b8238733d1169d079a5e7af0fc7f.jpg", year: "2025", rating: "6.2", detailPath: "after-the-hunt-G9uUgYaRIA4", desc: "A professor's crossroads." },
    { subjectId: "8759851328492438440", title: "Train Dreams", poster: "https://pbcdnw.aoneroom.com/image/2025/11/17/ad421550a04b88b8696a04264ec5a37c.jpg", year: "2025", rating: "7.7", detailPath: "train-dreams-OJyRf09d6ra", desc: "Portrait of a logger." },
    { subjectId: "407974060606504992", title: "The Family Plan 2", poster: "https://pbcdnw.aoneroom.com/image/2025/12/02/873fd90dff1123846fe6cc34c1010f10.jpg", year: "2025", rating: "5.6", detailPath: "the-family-plan-2-YctPw7Aw8u", desc: "Dan wants quality time." },
    { subjectId: "144265366439707640", title: "One Battle After Another", poster: "https://pbcdnw.aoneroom.com/image/2025/11/03/19c186991294a590412ee734350cad0c.jpg", year: "2025", rating: "8.2", detailPath: "one-battle-after-another-AorB0GGJEa", desc: "Ex-revolutionaries reunite." },
    { subjectId: "488603172416769952", title: "Roofman", poster: "https://pbcdnw.aoneroom.com/image/2025/11/03/e4639ad4c7e759e3385a3afc19157a57.jpg", year: "2025", rating: "7.2", detailPath: "roofman-axKcIQ4O5A", desc: "A criminal hides." }
];

const suggestGrid = document.getElementById('suggestGrid');
const filtered = SUGGESTIONS.filter(s => s.subjectId !== data.subjectId);

suggestGrid.innerHTML = filtered.map(s => {
    const p = new URLSearchParams({
        subjectId: s.subjectId,
        title: s.title,
        poster: s.poster,
        year: s.year,
        rating: s.rating,
        detailPath: s.detailPath,
        type: 'movie',
        desc: s.desc
    });
    return `
        <a href="player.html?${p.toString()}" class="suggest-card">
            <img src="${s.poster}" alt="${s.title}" loading="lazy"
                 onerror="this.src='https://via.placeholder.com/300x450/1a1a1c/4a4a52?text=No+Image'">
            <div class="suggest-info">
                <div class="suggest-name">${s.title}</div>
                <div class="suggest-meta">${s.year}</div>
            </div>
        </a>
    `;
}).join('');

// ============================================================
// ✅ TOAST
// ============================================================
function showToast(text, color) {
    const toast = document.getElementById('toast');
    document.getElementById('toastText').textContent = text;
    toast.className = 'toast show';
    setTimeout(() => {
        toast.classList.remove('show');
    }, 2500);
}
</script>
</body>
              </html>
