<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Lecture - BLAST FLIX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        :root {
            --black:#000; --charcoal:#121214; --slate:#1c1c1f;
            --cyan:#64d2ff; --blue:#0a84ff; --purple:#bf5af2;
            --glass-1:rgba(255,255,255,0.035); --glass-2:rgba(255,255,255,0.07);
            --glass-border:rgba(255,255,255,0.09); --glass-border-bright:rgba(255,255,255,0.22);
            --text:#f5f5f7; --text-dim:rgba(245,245,247,0.55);
            --r-lg:20px; --r-md:14px;
            --blur-glass:blur(40px) saturate(180%);
            --spring:0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        html, body {
            font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
            background:var(--black); color:var(--text); min-height:100vh;
            overflow-x:hidden;
            overflow-y:auto;
        }
        .bg-neo { position:fixed; inset:0; z-index:-3; background:var(--black); }
        .bg-neo::before {
            content:''; position:absolute; inset:0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(100,210,255,0.18), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(10,132,255,0.12), transparent);
            filter:blur(80px);
        }
        
        /* HEADER */
        .header {
            position:sticky; top:0; z-index:100;
            padding:10px 16px;
            background:rgba(10,10,12,0.85);
            backdrop-filter:var(--blur-glass);
            border-bottom:1px solid var(--glass-border);
            display:flex; align-items:center; gap:12px;
            padding-top:calc(10px + env(safe-area-inset-top,0px));
        }
        .back-btn {
            width:38px; height:38px; border-radius:50%;
            background:rgba(255,255,255,0.07);
            border:1px solid var(--glass-border);
            color:var(--text);
            display:flex; align-items:center; justify-content:center;
            text-decoration:none; font-size:14px;
            flex-shrink:0;
        }
        .back-btn:hover { border-color:var(--cyan); background:rgba(100,210,255,0.15); }
        .header-title {
            font-size:14px; font-weight:700;
            flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        
        /* IFRAME CONTAINER (WOTÈ FIKS 450px) */
        .iframe-wrap {
            position:relative;
            width:100%;
            height:450px; /* WOTÈ FIKS */
            background:#000;
            overflow:hidden; /* BLOKE SCROLL */
            margin-bottom:16px;
        }
        .iframe-wrap iframe {
            position:absolute;
            top:0; left:0;
            width:100%; height:100%;
            border:none;
            display:block;
            overflow:hidden; /* BLOKE SCROLL ANDEDAN IFRAME A */
            scrollbar-width:none; /* Firefox */
        }
        .iframe-wrap iframe::-webkit-scrollbar {
            display:none; /* Chrome/Safari */
        }
        
        /* MASK ANWO A (KACHE BAR RECHÈCH LA) */
        .iframe-wrap .mask-top {
            position:absolute;
            top:0; left:0; right:0;
            height:70px;
            background:linear-gradient(to bottom, #000 85%, transparent 100%);
            z-index:10;
            pointer-events:none;
        }
        
        /* MASK ANBA A */
        .iframe-wrap .mask-bottom {
            position:absolute;
            bottom:0; left:0; right:0;
            height:50px;
            background:linear-gradient(to top, #000 85%, transparent 100%);
            z-index:10;
            pointer-events:none;
        }
        
        /* KONTNI ANBA A */
        .content {
            max-width:1000px;
            margin:0 auto;
            padding:0 16px 40px;
        }
        
        /* INFO CARD */
        .info-card {
            background:var(--glass-1);
            backdrop-filter:var(--blur-glass);
            border:1px solid var(--glass-border);
            border-radius:var(--r-lg);
            padding:16px;
            margin-bottom:14px;
        }
        .info-header {
            display:flex;
            gap:14px;
            align-items:flex-start;
            margin-bottom:14px;
        }
        .info-poster {
            width:80px;
            aspect-ratio:2/3;
            object-fit:cover;
            border-radius:var(--r-md);
            border:1px solid var(--glass-border);
            flex-shrink:0;
        }
        .info-content { flex:1; min-width:0; }
        .info-title {
            font-size:18px;
            font-weight:800;
            margin-bottom:8px;
        }
        .info-meta {
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            font-size:11px;
            color:var(--text-dim);
            font-weight:600;
        }
        .info-meta span { display:inline-flex; align-items:center; gap:4px; }
        .info-meta i { color:var(--cyan); font-size:10px; }
        .info-desc {
            font-size:13px;
            line-height:1.6;
            color:var(--text-dim);
            padding-top:14px;
            border-top:1px solid var(--glass-border);
        }
        
        /* WHATSAPP */
        .wa-card {
            display:flex;
            align-items:center;
            gap:12px;
            padding:14px;
            background:linear-gradient(135deg, rgba(37,211,102,0.15), rgba(18,140,126,0.1));
            border:1px solid rgba(37,211,102,0.4);
            border-radius:var(--r-lg);
            margin-bottom:14px;
        }
        .wa-icon {
            width:40px; height:40px;
            border-radius:12px;
            background:linear-gradient(135deg, #25D366, #128C7E);
            display:flex; align-items:center; justify-content:center;
            color:#fff; font-size:20px; flex-shrink:0;
        }
        .wa-content { flex:1; min-width:0; }
        .wa-title { font-size:13px; font-weight:800; margin-bottom:3px; }
        .wa-desc { font-size:10px; color:var(--text-dim); }
        .wa-btn {
            padding:8px 14px;
            background:linear-gradient(135deg, #25D366, #128C7E);
            color:#fff;
            border:none;
            border-radius:50px;
            font-size:11px;
            font-weight:700;
            cursor:pointer;
            text-decoration:none;
            white-space:nowrap;
        }
        
        /* SIJESYON */
        .suggest-title {
            font-size:15px;
            font-weight:800;
            margin-bottom:12px;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .suggest-title i { color:var(--cyan); font-size:13px; }
        .suggest-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
            gap:10px;
        }
        .suggest-card {
            border-radius:var(--r-md);
            overflow:hidden;
            background:var(--glass-1);
            border:1px solid var(--glass-border);
            text-decoration:none;
            color:inherit;
            display:block;
            transition:all var(--spring);
        }
        .suggest-card:hover {
            transform:translateY(-4px);
            border-color:var(--glass-border-bright);
        }
        .suggest-card img {
            width:100%;
            aspect-ratio:2/3;
            object-fit:cover;
            display:block;
        }
        .suggest-info { padding:8px 10px; }
        .suggest-name {
            font-size:12px;
            font-weight:700;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            margin-bottom:2px;
        }
        .suggest-meta { font-size:10px; color:var(--text-dim); }
        
        @media (max-width:768px) {
            .iframe-wrap { height: 450px; }
            .content { padding:0 12px 40px; }
            .info-title { font-size:16px; }
            .suggest-grid { grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:8px; }
        }
    </style>
</head>
<body>

<div class="bg-neo"></div>

<!-- HEADER -->
<header class="header">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <div class="header-title" id="headerTitle">Chargement...</div>
</header>

<!-- IFRAME WRAPPER AK WOTÈ 450px AK MASK -->
<div class="iframe-wrap">
    <iframe 
        id="playerIframe" 
        allowfullscreen 
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        scrolling="no">
    </iframe>
    <!-- MASK ANWO -->
    <div class="mask-top"></div>
    <!-- MASK ANBA -->
    <div class="mask-bottom"></div>
</div>

<!-- KONTNI ANBA A -->
<div class="content">
    <div class="info-card">
        <div class="info-header">
            <img id="infoPoster" class="info-poster" src="" alt="Poster">
            <div class="info-content">
                <h1 id="infoTitle" class="info-title">Chargement...</h1>
                <div class="info-meta" id="infoMeta"></div>
            </div>
        </div>
        <p id="infoDesc" class="info-desc">Chargement...</p>
    </div>

    <div class="wa-card">
        <div class="wa-icon"><i class="fab fa-whatsapp"></i></div>
        <div class="wa-content">
            <div class="wa-title">Rejoignez notre chaîne WhatsApp</div>
            <div class="wa-desc">Nouveautés + liens directs</div>
        </div>
        <a href="https://whatsapp.com/channel/0029Vb6tw1G42Dcja42wiY3R" target="_blank" class="wa-btn">
            <i class="fab fa-whatsapp"></i> Suivre
        </a>
    </div>

    <div class="suggest-title"><i class="fas fa-film"></i> Films suggérés</div>
    <div class="suggest-grid" id="suggestGrid"></div>
</div>

<script>
// ============================================================
// ✅ DATA SOTI NAN URL
// ============================================================
const params = new URLSearchParams(window.location.search);
const data = {
    subjectId: params.get('subjectId') || '',
    title: params.get('title') || 'Film',
    poster: params.get('poster') || '',
    year: params.get('year') || '',
    rating: params.get('rating') || 'N/A',
    type: params.get('type') || 'movie',
    detailPath: params.get('detailPath') || '',
    season: params.get('season') || '0',
    episode: params.get('episode') || '0',
    desc: params.get('desc') || 'Aucune description disponible.'
};

document.getElementById('headerTitle').textContent = data.title;
document.getElementById('infoPoster').src = data.poster || 'https://via.placeholder.com/300x450/1a1a1c/4a4a52?text=No+Image';
document.getElementById('infoTitle').textContent = data.title;
document.getElementById('infoMeta').innerHTML = `
    <span><i class="fas fa-calendar"></i> ${data.year}</span>
    <span><i class="fas fa-star"></i> ${data.rating}</span>
    <span>${data.type === 'series' ? 'Série' : 'Film'}</span>
`;
document.getElementById('infoDesc').textContent = data.desc;

// ============================================================
// ✅ IFRAME (movieboxonline.net)
// ============================================================
const iframe = document.getElementById('playerIframe');

let iframeUrl = '';

if (data.detailPath) {
    iframeUrl = `https://movieboxonline.net/play/${data.detailPath}?id=${data.subjectId}&page_from=home&type=/movie/detail`;
} else {
    iframeUrl = `https://movieboxonline.net/play?id=${data.subjectId}&type=/movie/detail`;
}

console.log('🔗 Iframe URL:', iframeUrl);
iframe.src = iframeUrl;

// ============================================================
// ✅ BLOKE SCROLL NAN IFRAME A
// ============================================================
// scrolling="no" deja la, menm si.

// ============================================================
// ✅ SIJESYON FIM YO
// ============================================================
const SUGGESTIONS = [
    { subjectId: "3725096513421442384", title: "Bugonia", poster: "https://pbcdnw.aoneroom.com/image/2025/12/04/cbb960d2b8053e40398372b031d7c6af.jpg", year: "2025", detailPath: "bugonia-WTd7eaSmwY2" },
    { subjectId: "3854326812578922640", title: "After the Hunt", poster: "https://pbcdnw.aoneroom.com/image/2025/11/21/40a1b8238733d1169d079a5e7af0fc7f.jpg", year: "2025", detailPath: "after-the-hunt-G9uUgYaRIA4" },
    { subjectId: "8759851328492438440", title: "Train Dreams", poster: "https://pbcdnw.aoneroom.com/image/2025/11/17/ad421550a04b88b8696a04264ec5a37c.jpg", year: "2025", detailPath: "train-dreams-OJyRf09d6ra" },
    { subjectId: "407974060606504992", title: "The Family Plan 2", poster: "https://pbcdnw.aoneroom.com/image/2025/12/02/873fd90dff1123846fe6cc34c1010f10.jpg", year: "2025", detailPath: "the-family-plan-2-YctPw7Aw8u" },
    { subjectId: "144265366439707640", title: "One Battle After Another", poster: "https://pbcdnw.aoneroom.com/image/2025/11/03/19c186991294a590412ee734350cad0c.jpg", year: "2025", detailPath: "one-battle-after-another-AorB0GGJEa" },
    { subjectId: "488603172416769952", title: "Roofman", poster: "https://pbcdnw.aoneroom.com/image/2025/11/03/e4639ad4c7e759e3385a3afc19157a57.jpg", year: "2025", detailPath: "roofman-axKcIQ4O5A" }
];

const suggestGrid = document.getElementById('suggestGrid');
const filtered = SUGGESTIONS.filter(s => s.subjectId !== data.subjectId);

suggestGrid.innerHTML = filtered.map(s => {
    const p = new URLSearchParams({
        subjectId: s.subjectId,
        title: s.title,
        poster: s.poster,
        year: s.year,
        detailPath: s.detailPath,
        type: 'movie',
        rating: '7.0',
        desc: ''
    });
    return `
        <a href="player.html?${p.toString()}" class="suggest-card">
            <img src="${s.poster}" alt="${s.title}" loading="lazy"
                 onerror="this.src='https://via.placeholder.com/300x450/1a1a1c/4a4a52?text=No+Image'">
            <div class="suggest-info">
                <div class="suggest-name">${s.title}</div>
                <div class="suggest-meta">${s.year}</div>
            </div>
        </a>
    `;
}).join('');
</script>
</body>
</html>
