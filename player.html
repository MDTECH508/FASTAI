<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Lecture - BLAST FLIX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        :root {
            --black:#000;
            --cyan:#64d2ff;
            --blue:#0a84ff;
            --purple:#bf5af2;
            --glass-1:rgba(255,255,255,0.035);
            --glass-2:rgba(255,255,255,0.07);
            --glass-border:rgba(255,255,255,0.09);
            --glass-border-bright:rgba(255,255,255,0.22);
            --text:#f5f5f7;
            --text-dim:rgba(245,245,247,0.55);
            --blur-glass:blur(40px) saturate(180%);
        }
        html, body {
            width:100%; height:100%; overflow:hidden;
            background:#000;
            font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
            color:var(--text);
        }
        
        /* IFRAME KOUVRI TOUT EKRAN */
        #playerIframe {
            position:fixed;
            top:0; left:0;
            width:100vw; height:100vh;
            border:none;
            z-index:1;
        }
        
        /* BOUTON BACK */
        .back-btn {
            position:fixed;
            top:calc(16px + env(safe-area-inset-top, 0px));
            left:16px;
            z-index:100;
            width:44px; height:44px;
            border-radius:50%;
            background:rgba(0,0,0,0.6);
            backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.25);
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            text-decoration:none;
            cursor:pointer;
        }
        .back-btn:active { transform:scale(0.9); }
        
        /* BOUTON SVG POU LOUVRI PANEL LA */
        .info-btn {
            position:fixed;
            top:calc(16px + env(safe-area-inset-top, 0px));
            right:16px;
            z-index:100;
            width:44px; height:44px;
            border-radius:50%;
            background:rgba(0,0,0,0.6);
            backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,0.25);
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
        }
        .info-btn:active { transform:scale(0.9); }
        .info-btn svg {
            width:22px; height:22px;
            stroke:currentColor;
            fill:none;
            stroke-width:2;
            stroke-linecap:round;
            stroke-linejoin:round;
        }
        
        /* PANEL KI GLISE SOTI */
        .panel {
            position:fixed;
            top:0; right:-100%;
            width:85%; max-width:400px;
            height:100vh;
            z-index:99;
            background:rgba(15,15,17,0.95);
            backdrop-filter:var(--blur-glass);
            border-left:1px solid var(--glass-border-bright);
            padding:70px 20px 20px;
            overflow-y:auto;
            transition:right 0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        .panel.open { right:0; }
        .panel-close {
            position:absolute;
            top:calc(16px + env(safe-area-inset-top, 0px));
            right:16px;
            width:36px; height:36px;
            border-radius:50%;
            background:rgba(255,255,255,0.1);
            border:1px solid var(--glass-border);
            color:var(--text);
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            font-size:14px;
        }
        
        /* KONTNI PANEL LA */
        .panel-poster {
            width:100%;
            aspect-ratio:2/3;
            object-fit:cover;
            border-radius:16px;
            border:1px solid var(--glass-border-bright);
            margin-bottom:16px;
        }
        .panel-title {
            font-size:20px;
            font-weight:800;
            margin-bottom:8px;
        }
        .panel-meta {
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            font-size:11px;
            color:var(--text-dim);
            font-weight:600;
            margin-bottom:16px;
        }
        .panel-meta span {
            display:inline-flex;
            align-items:center;
            gap:4px;
        }
        .panel-meta i { color:var(--cyan); font-size:10px; }
        
        .panel-desc {
            font-size:13px;
            line-height:1.6;
            color:var(--text-dim);
            margin-bottom:20px;
        }
        
        /* WHATSAPP */
        .wa-card {
            display:flex;
            align-items:center;
            gap:12px;
            padding:14px;
            background:linear-gradient(135deg, rgba(37,211,102,0.15), rgba(18,140,126,0.1));
            border:1px solid rgba(37,211,102,0.4);
            border-radius:14px;
            margin-bottom:20px;
        }
        .wa-icon {
            width:40px; height:40px;
            border-radius:12px;
            background:linear-gradient(135deg, #25D366, #128C7E);
            display:flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            font-size:20px;
            flex-shrink:0;
        }
        .wa-content { flex:1; min-width:0; }
        .wa-title { font-size:13px; font-weight:800; margin-bottom:3px; }
        .wa-desc { font-size:10px; color:var(--text-dim); }
        .wa-btn {
            padding:8px 14px;
            background:linear-gradient(135deg, #25D366, #128C7E);
            color:#fff;
            border:none;
            border-radius:50px;
            font-size:11px;
            font-weight:700;
            cursor:pointer;
            text-decoration:none;
            white-space:nowrap;
        }
        
        /* SIJESYON */
        .suggest-title {
            font-size:14px;
            font-weight:800;
            margin-bottom:12px;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .suggest-title i { color:var(--cyan); font-size:13px; }
        .suggest-grid {
            display:grid;
            grid-template-columns:repeat(2, 1fr);
            gap:10px;
        }
        .suggest-card {
            border-radius:12px;
            overflow:hidden;
            background:var(--glass-1);
            border:1px solid var(--glass-border);
            text-decoration:none;
            color:inherit;
            display:block;
        }
        .suggest-card img {
            width:100%;
            aspect-ratio:2/3;
            object-fit:cover;
            display:block;
        }
        .suggest-card .suggest-info {
            padding:8px;
        }
        .suggest-card .suggest-name {
            font-size:11px;
            font-weight:700;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            margin-bottom:2px;
        }
        .suggest-card .suggest-meta {
            font-size:9px;
            color:var(--text-dim);
        }
    </style>
</head>
<body>

<!-- IFRAME KOUVRI TOUT EKRAN -->
<iframe 
    id="playerIframe" 
    allowfullscreen 
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    webkitallowfullscreen
    mozallowfullscreen>
</iframe>

<!-- BOUTON BACK -->
<a href="index.html" class="back-btn">
    <i class="fas fa-arrow-left"></i>
</a>

<!-- BOUTON SVG POU LOUVRI PANEL LA -->
<button class="info-btn" onclick="togglePanel()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="16" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
    </svg>
</button>

<!-- PANEL KI GLISE SOTI -->
<div class="panel" id="infoPanel">
    <button class="panel-close" onclick="togglePanel()">
        <i class="fas fa-times"></i>
    </button>
    
    <img id="panelPoster" class="panel-poster" src="" alt="Poster">
    <h1 id="panelTitle" class="panel-title">Chargement...</h1>
    <div id="panelMeta" class="panel-meta"></div>
    <p id="panelDesc" class="panel-desc">Chargement...</p>
    
    <!-- WHATSAPP -->
    <div class="wa-card">
        <div class="wa-icon"><i class="fab fa-whatsapp"></i></div>
        <div class="wa-content">
            <div class="wa-title">Rejoignez notre chaîne</div>
            <div class="wa-desc">Nouveautés + liens</div>
        </div>
        <a href="https://whatsapp.com/channel/0029Vb6tw1G42Dcja42wiY3R" target="_blank" class="wa-btn">
            Suivre
        </a>
    </div>
    
    <!-- SIJESYON -->
    <div class="suggest-title"><i class="fas fa-film"></i> Films suggérés</div>
    <div class="suggest-grid" id="suggestGrid"></div>
</div>

<script>
// ============================================================
// ✅ DATA SOTI NAN URL
// ============================================================
const params = new URLSearchParams(window.location.search);
const data = {
    subjectId: params.get('subjectId') || '',
    title: params.get('title') || 'Film',
    poster: params.get('poster') || '',
    year: params.get('year') || '',
    rating: params.get('rating') || 'N/A',
    type: params.get('type') || 'movie',
    detailPath: params.get('detailPath') || '',
    season: params.get('season') || '0',
    episode: params.get('episode') || '0',
    desc: params.get('desc') || 'Aucune description disponible.'
};

// Met enfòmasyon nan panel la
document.getElementById('panelPoster').src = data.poster || 'https://via.placeholder.com/300x450/1a1a1c/4a4a52?text=No+Image';
document.getElementById('panelTitle').textContent = data.title;
document.getElementById('panelMeta').innerHTML = `
    <span><i class="fas fa-calendar"></i> ${data.year}</span>
    <span><i class="fas fa-star"></i> ${data.rating}</span>
    <span>${data.type === 'series' ? 'Série' : 'Film'}</span>
`;
document.getElementById('panelDesc').textContent = data.desc;

// ============================================================
// ✅ IFRAME
// ============================================================
const iframe = document.getElementById('playerIframe');
let iframeUrl = '';

if (data.detailPath) {
    const se = data.season || '0';
    const ep = data.episode || '0';
    iframeUrl = `https://mzfi.me/spa/videoPlayPage/movies/${data.detailPath}?id=${data.subjectId}&detailSe=${se}&detailEp=${ep}&lang=en&type=%2Fmovie%2Fdetail`;
} else {
    iframeUrl = `https://mzfi.me/spa/videoPlayPage/movies/play?id=${data.subjectId}&lang=en&type=%2Fmovie%2Fdetail`;
}

iframe.src = iframeUrl;

// ============================================================
// ✅ SIJESYON FIM YO
// ============================================================
const SUGGESTIONS = [
    { subjectId: "8759851328492438440", title: "Train Dreams", poster: "https://pbcdnw.aoneroom.com/image/2025/11/17/ad421550a04b88b8696a04264ec5a37c.jpg", year: "2025", detailPath: "train-dreams-OJyRf09d6ra" },
    { subjectId: "4956801153355891744", title: "Stranger Things", poster: "https://pbcdnw.aoneroom.com/image/2025/12/01/56d9b04173d90d3f74bb5a7e1112ed7e.jpg", year: "2016", detailPath: "stranger-things-wsymkZvcaU5" },
    { subjectId: "6938790327474438416", title: "Sinners", poster: "https://pbcdnw.aoneroom.com/image/2025/11/03/dc68b1ba52dbab48c07486f1ec8c7e59.jpg", year: "2025", detailPath: "sinners-Mc81wRsJzg8" },
    { subjectId: "144265366439707640", title: "One Battle", poster: "https://pbcdnw.aoneroom.com/image/2025/11/03/19c186991294a590412ee734350cad0c.jpg", year: "2025", detailPath: "one-battle-after-another" }
];

const suggestGrid = document.getElementById('suggestGrid');
suggestGrid.innerHTML = SUGGESTIONS.filter(s => s.subjectId !== data.subjectId).map(s => {
    const p = new URLSearchParams({
        subjectId: s.subjectId,
        title: s.title,
        poster: s.poster,
        year: s.year,
        detailPath: s.detailPath,
        type: 'movie',
        rating: '7.0',
        desc: ''
    });
    return `
        <a href="player.html?${p.toString()}" class="suggest-card">
            <img src="${s.poster}" alt="${s.title}" loading="lazy"
                 onerror="this.src='https://via.placeholder.com/300x450/1a1a1c/4a4a52?text=No+Image'">
            <div class="suggest-info">
                <div class="suggest-name">${s.title}</div>
                <div class="suggest-meta">${s.year}</div>
            </div>
        </a>
    `;
}).join('');

// ============================================================
// ✅ TOGGLE PANEL
// ============================================================
function togglePanel() {
    const panel = document.getElementById('infoPanel');
    panel.classList.toggle('open');
}

// ============================================================
// ✅ BLOKE SCROLL SOU BODY A
// ============================================================
document.documentElement.style.overflow = 'hidden';
document.body.style.overflow = 'hidden';

window.addEventListener('scroll', (e) => {
    window.scrollTo(0, 0);
}, { passive: false });
</script>
</body>
    </html>
