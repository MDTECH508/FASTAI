<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>BLAST FLIX - Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased; }
    :root {
      --black:#000; --charcoal:#121214;
      --cyan:#64d2ff; --blue:#0a84ff; --purple:#bf5af2; --pink:#ff375f; --gold:#ffd60a;
      --glass-1:rgba(255,255,255,0.035); --glass-2:rgba(255,255,255,0.07);
      --glass-border:rgba(255,255,255,0.09); --glass-border-bright:rgba(255,255,255,0.22);
      --glass-highlight:inset 0 1px 0 rgba(255,255,255,0.20);
      --text:#f5f5f7; --text-dim:rgba(245,245,247,0.55);
      --spring:0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    html { scroll-behavior:smooth; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;
      background:var(--black); color:var(--text); min-height:100vh;
      overflow-x:hidden; padding-bottom:80px;
    }
    .bg-neo { position:fixed; inset:0; z-index:-3; background:var(--black); pointer-events:none; }
    .bg-neo::before {
      content:''; position:absolute; inset:0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(100,210,255,0.22), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(10,132,255,0.15), transparent),
        radial-gradient(ellipse 50% 30% at 0% 50%, rgba(191,90,242,0.1), transparent);
      filter:blur(80px);
    }
    /* HEADER */
    .header {
      position:sticky; top:0; z-index:100; padding:14px 16px;
      background:rgba(10,10,12,0.85); backdrop-filter:blur(40px) saturate(180%);
      -webkit-backdrop-filter:blur(40px) saturate(180%);
      border-bottom:1px solid var(--glass-border);
      display:flex; align-items:center; gap:10px;
      padding-top:calc(14px + env(safe-area-inset-top,0px));
      box-shadow:var(--glass-highlight);
    }
    .back-btn {
      width:40px; height:40px; border-radius:50%;
      background:var(--glass-2); border:1px solid var(--glass-border);
      color:var(--text); display:flex; align-items:center; justify-content:center;
      cursor:pointer; text-decoration:none; transition:all var(--spring); flex-shrink:0;
    }
    .back-btn:hover { border-color:var(--cyan); background:rgba(100,210,255,0.15); }
    .player-title {
      font-size:15px; font-weight:700; flex:1;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .header-actions { display:flex; gap:8px; flex-shrink:0; }
    .icon-btn {
      width:40px; height:40px; border-radius:50%;
      background:var(--glass-2); border:1px solid var(--glass-border);
      color:var(--text); display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:all var(--spring); flex-shrink:0; font-size:15px;
    }
    .icon-btn:hover { border-color:var(--cyan); background:rgba(100,210,255,0.15); transform:scale(1.05); }
    .icon-btn.random:hover { border-color:var(--gold); background:rgba(255,214,10,0.15); color:var(--gold); }
    .icon-btn.favorite:hover { border-color:var(--pink); background:rgba(255,55,95,0.15); color:var(--pink); }
    .icon-btn.favorite.active { border-color:var(--pink); background:rgba(255,55,95,0.25); color:var(--pink); }
    .icon-btn.favorite.active i { animation:heartBeat 0.6s ease; }
    @keyframes heartBeat {
      0%, 100% { transform:scale(1); }
      25% { transform:scale(1.3); }
      50% { transform:scale(1.1); }
      75% { transform:scale(1.25); }
    }
    /* VIDEO */
    .video-wrap {
      position:relative; width:100%; aspect-ratio:16/9;
      background:#000; margin-bottom:16px; overflow:hidden;
    }
    #videoFrame {
      position:absolute; inset:0; width:100%; height:100%;
      border:none; display:block; background:#000;
    }
    /* INFO */
    .info-wrap { padding:0 20px; max-width:1200px; margin:0 auto; }
    .info-card {
      padding:16px; border-radius:20px;
      background:var(--glass-1); border:1px solid var(--glass-border);
      backdrop-filter:blur(40px); -webkit-backdrop-filter:blur(40px);
      margin-bottom:16px;
    }
    .info-title { font-size:22px; font-weight:900; margin-bottom:10px; line-height:1.2; }
    .info-meta {
      display:flex; gap:12px; flex-wrap:wrap;
      font-size:13px; color:var(--text-dim); margin-bottom:12px; font-weight:600;
    }
    .info-meta span { display:inline-flex; align-items:center; gap:4px; }
    .info-meta i { color:var(--cyan); font-size:11px; }
    .info-meta .rating { color:var(--gold); font-weight:800; }
    .info-badges { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .badge {
      display:inline-flex; align-items:center; gap:5px;
      padding:5px 10px; border-radius:6px;
      font-size:10px; font-weight:800;
    }
    .badge.hd { background:rgba(100,210,255,0.15); color:var(--cyan); border:1px solid rgba(100,210,255,0.3); }
    .badge.premium {
      background:linear-gradient(135deg, var(--gold), #ff9500);
      color:var(--black); box-shadow:0 2px 10px rgba(255,214,10,0.5);
    }
    .badge.series {
      background:rgba(191,90,242,0.15); color:var(--purple);
      border:1px solid rgba(191,90,242,0.3);
    }
    .info-desc { font-size:14px; line-height:1.6; color:rgba(245,245,247,0.8); margin-bottom:16px; }
    .info-actions { display:flex; gap:10px; flex-wrap:wrap; }
    .btn {
      padding:12px 22px; border-radius:50px;
      font-size:13px; font-weight:800; cursor:pointer;
      font-family:inherit; text-decoration:none;
      display:inline-flex; align-items:center; gap:8px;
      border:none; transition:all var(--spring);
    }
    .btn-primary {
      background:linear-gradient(135deg, var(--cyan), var(--blue));
      color:var(--black); box-shadow:0 6px 20px rgba(100,210,255,0.4);
    }
    .btn-primary:hover { transform:scale(1.05); box-shadow:0 8px 30px rgba(100,210,255,0.6); }
    .btn-secondary {
      background:var(--glass-2); color:var(--text);
      border:1px solid var(--glass-border);
    }
    .btn-secondary:hover { border-color:var(--glass-border-bright); background:rgba(255,255,255,0.1); }
    .btn-favorite {
      background:rgba(255,55,95,0.15); color:var(--pink);
      border:1px solid rgba(255,55,95,0.4);
    }
    .btn-favorite.active {
      background:linear-gradient(135deg, var(--pink), var(--purple));
      color:#fff; border:none;
      box-shadow:0 6px 20px rgba(255,55,95,0.4);
    }
    .btn:active { transform:scale(0.96); }
    /* EPISODES */
    .episodes-section {
      padding:16px; border-radius:20px;
      background:var(--glass-1); border:1px solid var(--glass-border);
      backdrop-filter:blur(40px); -webkit-backdrop-filter:blur(40px);
      margin-bottom:16px; display:none;
    }
    .episodes-section.active { display:block; }
    .episodes-title {
      font-size:15px; font-weight:800; margin-bottom:12px;
      display:flex; align-items:center; gap:8px;
    }
    .episodes-title i { color:var(--purple); }
    .episodes-grid {
      display:grid; grid-template-columns:repeat(auto-fill, minmax(60px, 1fr));
      gap:8px;
    }
    .episode-btn {
      padding:10px 8px; border-radius:10px;
      background:var(--glass-2); border:1px solid var(--glass-border);
      color:var(--text-dim); font-size:12px; font-weight:700;
      cursor:pointer; font-family:inherit; transition:all var(--spring);
    }
    .episode-btn:hover { border-color:var(--cyan); color:var(--cyan); }
    .episode-btn.active {
      background:linear-gradient(135deg, rgba(100,210,255,0.25), rgba(191,90,242,0.2));
      border-color:var(--cyan); color:var(--cyan);
    }
    /* SUGGESTIONS */
    .suggestions-title {
      font-size:17px; font-weight:800; margin-bottom:14px;
      display:flex; align-items:center; gap:8px;
    }
    .suggestions-title i { color:var(--cyan); }
    .suggestions-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
    .sug-card {
      border-radius:14px; overflow:hidden;
      background:var(--glass-1); border:1px solid var(--glass-border);
      cursor:pointer; transition:all var(--spring);
      text-decoration:none; color:inherit; display:block;
    }
    .sug-card:hover {
      transform:translateY(-4px);
      border-color:var(--glass-border-bright);
      box-shadow:0 15px 30px rgba(0,0,0,0.5);
    }
    .sug-poster-wrap {
      position:relative; width:100%; aspect-ratio:2/3;
      overflow:hidden; background:var(--charcoal);
    }
    .sug-poster {
      width:100%; height:100%; object-fit:cover; display:block;
      transition:transform 0.4s;
    }
    .sug-card:hover .sug-poster { transform:scale(1.08); }
    .sug-info { padding:8px 10px; }
    .sug-title {
      font-size:11px; font-weight:700;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      margin-bottom:2px;
    }
    .sug-meta { font-size:10px; color:var(--text-dim); display:flex; gap:6px; }
    .sug-meta .rating { color:var(--cyan); font-weight:700; }
    /* FOOTER */
    .footer {
      position:fixed; bottom:0; left:0; right:0; z-index:90;
      padding:12px 20px; background:rgba(10,10,12,0.9);
      backdrop-filter:blur(40px) saturate(180%);
      -webkit-backdrop-filter:blur(40px) saturate(180%);
      border-top:1px solid var(--glass-border);
      display:flex; align-items:center; justify-content:space-around;
      padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    }
    .footer-btn {
      display:flex; flex-direction:column; align-items:center; gap:4px;
      color:var(--text-dim); text-decoration:none;
      font-size:10px; font-weight:600; padding:8px 16px;
      border-radius:14px; transition:color 0.3s;
    }
    .footer-btn i { font-size:20px; }
    .footer-btn.active { color:var(--cyan); }
    /* TOAST */
    .toast {
      position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(100px);
      padding:14px 24px; border-radius:50px;
      background:rgba(30,30,32,0.98); border:1px solid var(--glass-border-bright);
      color:var(--text); font-size:14px; font-weight:700;
      backdrop-filter:blur(40px); -webkit-backdrop-filter:blur(40px);
      z-index:500; opacity:0; pointer-events:none;
      transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
      display:flex; align-items:center; gap:10px;
      box-shadow:0 10px 40px rgba(0,0,0,0.6);
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast i { font-size:16px; color:var(--cyan); }
    .toast.pink i { color:var(--pink); }
    .toast.gold i { color:var(--gold); }
    @media (min-width: 768px) {
      .video-wrap { max-width:1200px; margin:0 auto 16px; }
      .suggestions-grid { grid-template-columns:repeat(6, 1fr); }
    }
    @media (max-width: 380px) {
      .suggestions-grid { grid-template-columns:repeat(2, 1fr); }
    }
  </style>
</head>

// ============================================================
// ✅ REKIPERE PARAMÈT
// ============================================================
const params = new URLSearchParams(window.location.search);
const movieData = {
  subjectId: params.get('subjectId') || '',
  title: params.get('title') || 'Film',
  poster: params.get('poster') || '',
  year: params.get('year') || '',
  rating: params.get('rating') || '',
  type: params.get('type') || 'movie',
  detailPath: params.get('detailPath') || '',
  desc: params.get('desc') || '',
  episodes: parseInt(params.get('episodes')) || 0,
  seasons: parseInt(params.get('seasons')) || 0,
  premium: params.get('premium') === 'true',
  comingSoon: params.get('comingSoon') === 'true'
};

// ============================================================
// ✅ AFICHE INFO
// ============================================================
document.getElementById('headerTitle').textContent = movieData.title;
document.getElementById('infoTitle').textContent = movieData.title;
document.getElementById('infoMeta').innerHTML = `
  <span><i class="fas fa-calendar"></i> ${movieData.year}</span>
  <span class="rating"><i class="fas fa-star"></i> ${movieData.rating}</span>
  <span><i class="fas fa-tag"></i> ${movieData.type === 'series' ? 'Série' : 'Film'}</span>
`;
document.getElementById('infoDesc').textContent = movieData.desc || 'Pa gen deskripsyon.';

let badgesHtml = `<span class="badge hd"><i class="fas fa-hd"></i> HD</span>`;
if (movieData.premium) {
  badgesHtml += `<span class="badge premium"><i class="fas fa-crown"></i> PREMIUM</span>`;
}
if (movieData.type === 'series') {
  badgesHtml += `<span class="badge series"><i class="fas fa-tv"></i> Série${movieData.seasons ? ' • S' + movieData.seasons : ''}${movieData.episodes ? ' • ' + movieData.episodes + ' ép.' : ''}</span>`;
}
document.getElementById('infoBadges').innerHTML = badgesHtml;

// ============================================================
// ✅ KONSTRIKSYON URL MOVIESBOX — san muted, dirèk
// ============================================================
function buildMovieboxUrl() {
  if (movieData.detailPath) {
    return `https://movieboxonline.net/play/${movieData.detailPath}?id=${movieData.subjectId}&page_from=home&type=/movie/detail`;
  } else {
    return `https://movieboxonline.net/play?id=${movieData.subjectId}&type=/movie/detail`;
  }
}

const videoFrame = document.getElementById('videoFrame');
const baseUrl = buildMovieboxUrl();

// Chaje iframe a DIRÈKTMAN — pa gen overlay, pa gen muted
videoFrame.src = baseUrl;

// ============================================================
// ✅ EPISODES (si séries)
// ============================================================
if (movieData.type === 'series' && movieData.episodes > 0) {
  const episodesSection = document.getElementById('episodesSection');
  const episodesGrid = document.getElementById('episodesGrid');
  episodesSection.classList.add('active');
  document.getElementById('episodesTitle').textContent = `Épisodes (${movieData.episodes})`;
  
  let epHtml = '';
  for (let i = 1; i <= Math.min(movieData.episodes, 30); i++) {
    epHtml += `<button class="episode-btn ${i === 1 ? 'active' : ''}" data-ep="${i}">${i}</button>`;
  }
  episodesGrid.innerHTML = epHtml;
  
  episodesGrid.querySelectorAll('.episode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      episodesGrid.querySelectorAll('.episode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const ep = btn.dataset.ep;
      videoFrame.src = baseUrl + `&ep=${ep}`;
    });
  });
}

// ============================================================
// ✅ ISTWA
// ============================================================
(function trackHistory() {
  const movie = {
    subjectId: movieData.subjectId, title: movieData.title, poster: movieData.poster,
    year: movieData.year, rating: movieData.rating, type: movieData.type,
    detailPath: movieData.detailPath, desc: movieData.desc,
    watchedAt: Date.now(), progress: 0
  };
  let history = [];
  try { history = JSON.parse(localStorage.getItem('blastflix_history') || '[]'); } catch {}
  history = history.filter(h => h.subjectId !== movie.subjectId);
  history.unshift(movie);
  history = history.slice(0, 100);
  localStorage.setItem('blastflix_history', JSON.stringify(history));
})();

// ============================================================
// ✅ FAVORIS
// ============================================================
function isFavorite() {
  try {
    const favorites = JSON.parse(localStorage.getItem('blastflix_favorites') || '[]');
    return favorites.some(f => f.subjectId === movieData.subjectId);
  } catch { return false; }
}

function updateFavButtons() {
  const fav = isFavorite();
  const btnHeader = document.getElementById('favBtnHeader');
  const btnMain = document.getElementById('favBtnMain');
  if (fav) {
    btnHeader.classList.add('active');
    btnMain.classList.add('active');
    btnMain.innerHTML = '<i class="fas fa-heart"></i> <span>Retirer des favoris</span>';
  } else {
    btnHeader.classList.remove('active');
    btnMain.classList.remove('active');
    btnMain.innerHTML = '<i class="fas fa-heart"></i> <span>Ajouter aux favoris</span>';
  }
}

function toggleFavorite() {
  let favorites = [];
  try { favorites = JSON.parse(localStorage.getItem('blastflix_favorites') || '[]'); } catch {}
  const exists = favorites.some(f => f.subjectId === movieData.subjectId);
  if (exists) {
    favorites = favorites.filter(f => f.subjectId !== movieData.subjectId);
    showToast('Retiré des favoris', 'pink');
  } else {
    favorites.unshift({
      subjectId: movieData.subjectId, title: movieData.title, poster: movieData.poster,
      year: movieData.year, rating: movieData.rating, type: movieData.type,
      detailPath: movieData.detailPath, desc: movieData.desc,
      addedAt: Date.now()
    });
    showToast('Ajouté aux favoris !', 'pink');
  }
  localStorage.setItem('blastflix_favorites', JSON.stringify(favorites));
  updateFavButtons();
}

document.getElementById('favBtnHeader').addEventListener('click', toggleFavorite);
document.getElementById('favBtnMain').addEventListener('click', toggleFavorite);
updateFavButtons();

// ============================================================
// ✅ FILM ALÉATOIRE
// ============================================================
function goRandomMovie() {
  const others = ALL_MOVIES.filter(m => m.subjectId !== movieData.subjectId);
  if (others.length === 0) return;
  const random = others[Math.floor(Math.random() * others.length)];
  const p = new URLSearchParams({
    subjectId: random.subjectId, title: random.title, poster: random.poster,
    year: random.year, rating: random.rating, type: random.type,
    detailPath: random.detailPath, desc: random.desc
  });
  showToast('Film aléatoire: ' + random.title, 'gold');
  setTimeout(() => { window.location.href = `player.html?${p.toString()}`; }, 500);
}

document.getElementById('randomBtn').addEventListener('click', goRandomMovie);
document.getElementById('randomBtnMain').addEventListener('click', goRandomMovie);

// ============================================================
// ✅ SUGGESTIONS ALÉATOIRES
// ============================================================
function renderRandomSuggestions() {
  const grid = document.getElementById('suggestionsGrid');
  const others = ALL_MOVIES.filter(m => m.subjectId !== movieData.subjectId);
  const shuffled = [...others].sort(() => Math.random() - 0.5);
  const picks = shuffled.slice(0, 6);
  
  grid.innerHTML = picks.map(m => {
    const p = new URLSearchParams({
      subjectId: m.subjectId, title: m.title, poster: m.poster,
      year: m.year, rating: m.rating, type: m.type,
      detailPath: m.detailPath, desc: m.desc
    });
    return `
      <a href="player.html?${p.toString()}" class="sug-card">
        <div class="sug-poster-wrap">
          <img class="sug-poster" src="${m.poster}" alt="${m.title}" loading="lazy"
               onerror="this.style.display='none';">
        </div>
        <div class="sug-info">
          <div class="sug-title">${m.title}</div>
          <div class="sug-meta">
            <span>${m.year}</span>
            <span class="rating"><i class="fas fa-star" style="font-size:8px;"></i>${m.rating}</span>
          </div>
        </div>
      </a>`;
  }).join('');
}

renderRandomSuggestions();

// ============================================================
// ✅ TOAST
// ============================================================
function showToast(text, color) {
  const toast = document.getElementById('toast');
  document.getElementById('toastText').textContent = text;
  toast.className = 'toast show' + (color ? ' ' + color : '');
  setTimeout(() => { toast.classList.remove('show'); }, 2500);
}
</script>
