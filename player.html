<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Lecture - BLAST FLIX</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
html { scroll-behavior: smooth; }
:root {
  --neo-black: #000000;
  --neo-ink: #0a0a0c;
  --neo-charcoal: #121214;
  --neo-slate: #1c1c1f;
  --neo-graphite: #26262a;
  --neo-steel: #34343a;
  --neo-silver: #8a8a92;
  --neo-light: #c8c8d0;
  --neo-white: #f5f5f7;
  --neo-blue: #0a84ff;
  --neo-cyan: #64d2ff;
  --neo-purple: #bf5af2;
  --glass-1: rgba(255, 255, 255, 0.03);
  --glass-2: rgba(255, 255, 255, 0.06);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-border-bright: rgba(255, 255, 255, 0.18);
  --text: #f5f5f7;
  --text-dim: rgba(245, 245, 247, 0.55);
  --text-mute: rgba(245, 245, 247, 0.35);
  --r-sm: 14px;
  --r-md: 20px;
  --r-lg: 28px;
  --r-xl: 34px;
  --r-2xl: 42px;
  --shadow-2: 0 8px 24px rgba(0, 0, 0, 0.5);
  --shadow-3: 0 20px 60px rgba(0, 0, 0, 0.7);
  --shadow-inset-strong: inset 0 2px 0 rgba(255, 255, 255, 0.12), inset 0 -1px 0 rgba(0, 0, 0, 0.3);
  --spring: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
  background: var(--neo-black);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 40px;
  letter-spacing: -0.01em;
}
.bg-neo {
  position: fixed; inset: 0; z-index: -2;
  background: var(--neo-black);
  overflow: hidden;
}
.bg-neo::before {
  content: '';
  position: absolute; inset: 0;
  background: 
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(100, 210, 255, 0.15), transparent),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(191, 90, 242, 0.1), transparent);
  filter: blur(60px);
}
.noise {
  position: fixed; inset: 0; z-index: -1;
  opacity: 0.04; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode: overlay;
}

/* HEADER */
.header {
  position: sticky; top: 0; z-index: 100;
  padding: 16px 20px;
  background: rgba(0, 0, 0, 0.72);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  border-bottom: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-radius: 0 0 var(--r-xl) var(--r-xl);
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
}
.back {
  display: flex; align-items: center; gap: 8px;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  color: var(--text);
  padding: 10px 18px;
  border-radius: 50px;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  transition: all var(--spring);
  backdrop-filter: blur(20px);
}
.back:hover {
  border-color: var(--neo-cyan);
  background: rgba(100, 210, 255, 0.15);
  box-shadow: 0 0 20px rgba(100, 210, 255, 0.4);
}
.back i { font-size: 16px; }
.header-title {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.01em;
  background: linear-gradient(90deg, var(--neo-white), var(--neo-silver));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* CONTAINER */
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px;
}

/* VIDEO */
.video-wrap {
  width: 100%;
  aspect-ratio: 16/9;
  background: black;
  border-radius: var(--r-lg);
  overflow: hidden;
  border: 1px solid var(--glass-border-bright);
  box-shadow: 
    0 0 60px rgba(100, 210, 255, 0.2),
    var(--shadow-3),
    var(--shadow-inset-strong);
  position: relative;
  margin-bottom: 28px;
}
.video-wrap video { width: 100%; height: 100%; display: block; }
.video-wrap:fullscreen { border-radius: 0; border: none; margin: 0; width: 100vw; height: 100vh; }

/* LOADING */
.loading-overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(20px);
  z-index: 8;
  gap: 24px;
  transition: opacity 0.4s, visibility 0.4s;
}
.loading-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.spinner {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, 0.08);
  border-top-color: var(--neo-cyan);
  border-right-color: var(--neo-purple);
  animation: spin 1s linear infinite;
  box-shadow: 
    0 0 30px rgba(100, 210, 255, 0.5),
    inset 0 0 10px rgba(191, 90, 242, 0.2);
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 2px;
  text-transform: uppercase;
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

/* ERROR */
.error-overlay {
  position: absolute; inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.95);
  backdrop-filter: blur(20px);
  z-index: 10;
  gap: 16px;
  padding: 20px;
  text-align: center;
}
.error-overlay.show { display: flex; }
.error-overlay i {
  font-size: 60px;
  color: #ff4444;
  filter: drop-shadow(0 0 20px rgba(255, 68, 68, 0.5));
}
.error-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--neo-white);
}
.error-msg {
  font-size: 13px;
  color: var(--text-dim);
  max-width: 400px;
  line-height: 1.6;
}
.error-btn {
  margin-top: 10px;
  padding: 13px 26px;
  background: linear-gradient(135deg, var(--neo-cyan), var(--neo-blue));
  color: var(--neo-black);
  border: none;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  box-shadow: 0 8px 24px rgba(100, 210, 255, 0.4);
  transition: all var(--spring);
}
.error-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(100, 210, 255, 0.6);
}

/* BIG PLAY */
.big-play {
  position: absolute; inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(2px);
  z-index: 7;
  cursor: pointer;
  transition: opacity 0.3s;
}
.big-play.hidden {
  opacity: 0;
  pointer-events: none;
}
.play-circle {
  width: 104px;
  height: 104px;
  border-radius: 50%;
  background: rgba(100, 210, 255, 0.25);
  backdrop-filter: blur(20px);
  border: 2px solid var(--neo-cyan);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: playPulse 2.5s ease-in-out infinite;
  position: relative;
}
.play-circle::before {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 1px solid rgba(100, 210, 255, 0.4);
  animation: playRing 2.5s ease-out infinite;
}
@keyframes playPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(100, 210, 255, 0.6); }
  50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(100, 210, 255, 0.9); }
}
@keyframes playRing {
  0% { transform: scale(1); opacity: 0.6; }
  100% { transform: scale(1.4); opacity: 0; }
}
.play-circle i {
  font-size: 46px;
  color: white;
  margin-left: 6px;
  filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.9));
}

/* INFO CARD */
.info-card {
  background: var(--glass-1);
  backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-lg);
  padding: 30px;
  margin-bottom: 28px;
  box-shadow: var(--shadow-2), var(--shadow-inset-strong);
}
.info-head {
  display: flex;
  gap: 24px;
  align-items: flex-start;
  flex-wrap: wrap;
  margin-bottom: 26px;
}
.poster {
  width: 140px;
  aspect-ratio: 2/3;
  border-radius: var(--r-sm);
  object-fit: cover;
  flex-shrink: 0;
  border: 1px solid var(--glass-border-bright);
  box-shadow: var(--shadow-2);
}
.info-content {
  flex: 1;
  min-width: 240px;
}
.info-title {
  font-size: clamp(24px, 4vw, 34px);
  font-weight: 900;
  letter-spacing: -0.02em;
  margin-bottom: 16px;
  line-height: 1.15;
  text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
}
.info-meta {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
.info-meta span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 7px 14px;
  background: var(--glass-2);
  border: 1px solid var(--glass-border);
  border-radius: 50px;
  font-size: 12px;
  font-weight: 600;
  backdrop-filter: blur(20px);
}
.info-meta i { font-size: 10px; color: var(--neo-cyan); }
.info-meta .rating i { color: var(--neo-cyan); }
.info-desc {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-dim);
  margin-bottom: 20px;
}

/* CREATOR BADGE */
.creator {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 11px 20px;
  margin-bottom: 22px;
  background: linear-gradient(135deg, rgba(100, 210, 255, 0.12), rgba(191, 90, 242, 0.08));
  border: 1px solid rgba(100, 210, 255, 0.35);
  border-radius: 50px;
  font-size: 12px;
  font-weight: 600;
  backdrop-filter: blur(20px);
  box-shadow: 0 0 20px rgba(100, 210, 255, 0.15);
}
.creator i {
  color: var(--neo-cyan);
  font-size: 14px;
  filter: drop-shadow(0 0 6px rgba(100, 210, 255, 0.6));
}
.creator .label { color: var(--text-dim); }
.creator .id {
  font-family: 'SF Mono', 'Monaco', monospace;
  font-weight: 800;
  background: linear-gradient(90deg, var(--neo-cyan), var(--neo-purple));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-size: 13px;
  letter-spacing: 0.5px;
}

/* ACTIONS */
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.act-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 24px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  transition: all var(--spring);
  font-family: inherit;
  text-decoration: none;
  position: relative;
  overflow: hidden;
}
.act-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.2), transparent 50%);
  pointer-events: none;
}
.act-btn.primary {
  background: linear-gradient(135deg, var(--neo-cyan), var(--neo-blue));
  color: var(--neo-black);
  box-shadow: 0 8px 24px rgba(100, 210, 255, 0.4);
}
.act-btn.primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(100, 210, 255, 0.6);
}
.act-btn.glass {
  background: var(--glass-2);
  border: 1px solid var(--glass-border-bright);
  color: var(--text);
  backdrop-filter: blur(20px);
}
.act-btn.glass:hover {
  border-color: var(--neo-cyan);
  box-shadow: 0 0 20px rgba(100, 210, 255, 0.3);
}

/* RELATED */
.related {
  margin-top: 40px;
}
.related-title {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.related-title i {
  color: var(--neo-cyan);
  filter: drop-shadow(0 0 8px rgba(100, 210, 255, 0.6));
}
.related-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.related-card {
  border-radius: var(--r-md);
  overflow: hidden;
  background: var(--glass-1);
  border: 1px solid var(--glass-border);
  text-decoration: none;
  color: inherit;
  transition: all var(--spring);
  display: block;
  box-shadow: var(--shadow-1, 0 2px 8px rgba(0,0,0,0.4));
  position: relative;
}
.related-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent 40%);
  pointer-events: none;
  z-index: 2;
  border-radius: var(--r-md);
}
.related-card:hover {
  transform: translateY(-6px) scale(1.02);
  border-color: var(--glass-border-bright);
  box-shadow: 
    0 20px 40px rgba(0, 0, 0, 0.6),
    0 0 30px rgba(100, 210, 255, 0.15);
}
.related-poster {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
}
.related-info {
  padding: 12px 14px;
}
.related-title-text {
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 5px;
}
.related-meta {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 500;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(20, 20, 22, 0.95);
  backdrop-filter: blur(40px) saturate(180%);
  border: 1px solid var(--glass-border-bright);
  color: var(--text);
  padding: 14px 24px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 600;
  z-index: 10000;
  opacity: 0;
  transition: all 0.4s var(--spring);
  box-shadow: var(--shadow-3), var(--shadow-inset-strong);
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* PLYR OVERRIDES */
.plyr--video .plyr__controls {
  background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
}
.plyr__control--overlaid {
  background: rgba(100, 210, 255, 0.3) !important;
  border: 2px solid var(--neo-cyan) !important;
  backdrop-filter: blur(20px);
}
.plyr--video .plyr__progress__buffer {
  background: rgba(255, 255, 255, 0.15) !important;
}

@media (max-width: 768px) {
  .container { padding: 14px; }
  .info-card { padding: 22px; }
  .poster { width: 100px; }
  .info-title { font-size: 22px; }
  .info-desc { font-size: 13px; }
  .related-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .play-circle { width: 76px; height: 76px; }
  .play-circle i { font-size: 32px; }
  .back { padding: 8px 14px; font-size: 13px; }
}
  </style>
</head>
<body>

<div class="bg-neo"></div>
<div class="noise"></div>

<!-- HEADER -->
<header class="header">
  <a href="javascript:history.back()" class="back">
    <i class="fas fa-arrow-left"></i>
    Retour
  </a>
  <div class="header-title">BLAST FLIX</div>
  <div style="width: 80px;"></div>
</header>

<div class="container">
  <!-- VIDEO -->
  <div class="video-wrap" id="videoWrap">
    <video id="playerVideo" playsinline webkit-playsinline crossorigin controls></video>
    
    <!-- BIG PLAY -->
    <div class="big-play" id="bigPlay">
      <div class="play-circle">
        <i class="fas fa-play"></i>
      </div>
    </div>
    
    <!-- LOADING -->
    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Chargement</div>
    </div>
    
    <!-- ERROR -->
    <div class="error-overlay" id="error">
      <i class="fas fa-exclamation-triangle"></i>
      <div class="error-title">Vidéo indisponible</div>
      <div class="error-msg" id="errorMsg">Impossible de charger.</div>
      <button class="error-btn" onclick="retryVideo()">
        <i class="fas fa-redo"></i>
        Réessayer
      </button>
    </div>
  </div>

  <!-- INFO CARD -->
  <div class="info-card">
    <div class="info-head">
      <img id="infoPoster" class="poster" src="" alt="">
      <div class="info-content">
        <h1 id="infoTitle" class="info-title">Chargement...</h1>
        <div id="infoMeta" class="info-meta"></div>
        <p id="infoDesc" class="info-desc"></p>
        
        <div class="creator">
          <i class="fas fa-star"></i>
          <span class="label">Créé par</span>
          <span class="id">Engine 50934946793</span>
        </div>
        
        <div class="actions">
          <button class="act-btn primary" id="playBtn">
            <i class="fas fa-play"></i>
            Regarder
          </button>
          <button class="act-btn glass" id="shareBtn">
            <i class="fas fa-share-alt"></i>
            Partager
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- RELATED -->
  <div class="related">
    <h3 class="related-title">
      <i class="fas fa-film"></i>
      Vous pourriez aimer
    </h3>
    <div class="related-grid" id="relatedGrid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const data = {
  subjectId: params.get('subjectId') || '',
  title: params.get('title') || 'Film',
  poster: params.get('poster') || '',
  year: params.get('year') || '',
  rating: params.get('rating') || '',
  genre: params.get('genre') || '',
  desc: params.get('desc') || 'Aucune description.'
};

document.getElementById('infoTitle').textContent = data.title;
document.getElementById('infoPoster').src = data.poster || 'https://via.placeholder.com/300x450/1a1a1c/4a4a52?text=No+Image';
document.getElementById('infoDesc').textContent = data.desc;
document.getElementById('infoMeta').innerHTML = `
  ${data.year ? `<span><i class="fas fa-calendar"></i> ${data.year}</span>` : ''}
  ${data.rating ? `<span class="rating"><i class="fas fa-star"></i> ${data.rating}</span>` : ''}
  ${data.genre ? `<span><i class="fas fa-tag"></i> ${data.genre}</span>` : ''}
`;

const videoEl = document.getElementById('playerVideo');
const loadingEl = document.getElementById('loading');
const errorEl = document.getElementById('error');
const errorMsg = document.getElementById('errorMsg');
const bigPlay = document.getElementById('bigPlay');

let player = null;
let streamUrl = null;

window.addEventListener('load', () => {
  if (typeof Plyr !== 'undefined') {
    player = new Plyr(videoEl, {
      controls: ['play-large', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'pip', 'fullscreen'],
      settings: ['speed'],
      speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
      seekTime: 10
    });
    player.on('play', () => bigPlay.classList.add('hidden'));
  }
  loadVideo();
});

async function loadVideo() {
  if (!data.subjectId) {
    showError('Aucun ID fourni.');
    return;
  }
  hideError();
  showLoading();

  try {
    const res = await fetch(`/api/sources/${data.subjectId}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    
    const sources = json.results || [];
    if (sources.length === 0) throw new Error('Aucune source.');
    
    streamUrl = sources[0].stream_url;
    
    if (player) {
      player.source = {
        type: 'video',
        sources: [{ src: streamUrl, type: 'video/mp4' }],
        poster: data.poster
      };
    } else {
      videoEl.src = streamUrl;
    }
    
    hideLoading();
    
    setTimeout(() => {
      const p = player ? player.play() : videoEl.play();
      if (p && p.catch) p.catch(() => hideLoading());
    }, 500);
    
  } catch (err) {
    hideLoading();
    showError(err.message);
  }
}

function showLoading() { loadingEl.classList.remove('hidden'); }
function hideLoading() { loadingEl.classList.add('hidden'); }
function showError(msg) { errorMsg.textContent = msg; errorEl.classList.add('show'); }
function hideError() { errorEl.classList.remove('show'); }

window.retryVideo = function() {
  hideError();
  if (player) player.stop();
  videoEl.src = '';
  loadVideo();
};

function startPlay() {
  bigPlay.classList.add('hidden');
  if (player) player.play().catch(() => {});
  else videoEl.play().catch(() => {});
}

bigPlay.addEventListener('click', startPlay);
document.getElementById('playBtn').addEventListener('click', () => {
  startPlay();
  document.getElementById('videoWrap').scrollIntoView({ behavior: 'smooth', block: 'center' });
});

document.getElementById('shareBtn').addEventListener('click', async () => {
  const sd = { title: `${data.title} - BLAST FLIX`, text: `Regarde ${data.title} !`, url: window.location.href };
  try {
    if (navigator.share) await navigator.share(sd);
    else { await navigator.clipboard.writeText(sd.url); showToast('🔗 Lien copié !'); }
  } catch (err) {
    if (err.name !== 'AbortError') {
      try { await navigator.clipboard.writeText(sd.url); showToast('🔗 Lien copié !'); } catch {}
    }
  }
});

  { subjectId: "144265366439707640", title: "One Battle After Another", poster: "https://pbcdnw.aoneroom.com/image/2025/11/03/19c186991294a590412ee734350cad0c.jpg", year: "2025", rating: 8.2 },
  { subjectId: "488603172416769952", title: "Roofman", poster: "https://pbcdnw.aoneroom.com/image/2025/11/03/e4639ad4c7e759e3385a3afc19157a57.jpg", year: "2025", rating: 7.2 },
  { subjectId: "5821547884994614176", title: "Now You See Me", poster: "https://pbcdnw.aoneroom.com/image/2025/12/01/aec3f8fb67dbc4ae8bf1888a6688ebed.jpg", year: "2025", rating: 6.3 },
  { subjectId: "3646928918696838480", title: "IT: Welcome to Derry", poster: "https://pbcdnw.aoneroom.com/image/2025/12/02/9e9b3aeb35ce26354b8092d9621b2c7a.jpg", year: "2025", rating: 7.7 }
];

const pool = RELATED.filter(m => m.subjectId !== data.subjectId);
const shuffled = pool.sort(() => Math.random() - 0.5).slice(0, 6);

document.getElementById('relatedGrid').innerHTML = shuffled.map(m => {
  const p = new URLSearchParams({
    subjectId: m.subjectId, title: m.title, poster: m.poster,
    year: m.year, rating: String(m.rating)
  });
  return `
    <a href="player.html?${p.toString()}" class="related-card">
      <img class="related-poster" src="${m.poster}" alt="${m.title}" loading="lazy">
      <div class="related-info">
        <div class="related-title-text">${m.title}</div>
        <div class="related-meta">${m.year} • ⭐ ${m.rating}</div>
      </div>
    </a>
  `;
}).join('');

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}
</script>
