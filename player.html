<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Lecture - BLAST FLIX</title>
    <link rel="preconnect" href="https://pbcdnw.aoneroom.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        :root {
            --black:#000; --charcoal:#121214; --slate:#1c1c1f;
            --cyan:#64d2ff; --blue:#0a84ff; --purple:#bf5af2; --pink:#ff375f; --gold:#ffd60a;
            --glass-1:rgba(255,255,255,0.035); --glass-2:rgba(255,255,255,0.07);
            --glass-border:rgba(255,255,255,0.09); --glass-border-bright:rgba(255,255,255,0.22);
            --text:#f5f5f7; --text-dim:rgba(245,245,247,0.55);
            --r-lg:20px; --r-md:14px;
            --blur-glass:blur(40px) saturate(180%);
            --spring:0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        html, body {
            font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
            background:var(--black); color:var(--text); min-height:100vh;
            overflow-x:hidden; overflow-y:auto;
        }
        .bg-neo { position:fixed; inset:0; z-index:-3; background:var(--black); }
        .bg-neo::before {
            content:''; position:absolute; inset:0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(100,210,255,0.18), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(10,132,255,0.12), transparent);
            filter:blur(80px);
        }
        
        /* HEADER */
        .header {
            position:sticky; top:0; z-index:100;
            padding:10px 16px;
            background:rgba(10,10,12,0.85);
            backdrop-filter:var(--blur-glass);
            -webkit-backdrop-filter:var(--blur-glass);
            border-bottom:1px solid var(--glass-border);
            display:flex; align-items:center; gap:12px;
            padding-top:calc(10px + env(safe-area-inset-top,0px));
        }
        .back-btn {
            width:38px; height:38px; border-radius:50%;
            background:rgba(255,255,255,0.07);
            border:1px solid var(--glass-border);
            color:var(--text);
            display:flex; align-items:center; justify-content:center;
            text-decoration:none; font-size:14px;
            flex-shrink:0;
            transition:all var(--spring);
        }
        .back-btn:hover { border-color:var(--cyan); background:rgba(100,210,255,0.15); }
        .header-title {
            font-size:14px; font-weight:700;
            flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .fav-btn-header {
            width:38px; height:38px; border-radius:50%;
            background:rgba(255,255,255,0.07);
            border:1px solid var(--glass-border);
            color:var(--text);
            display:flex; align-items:center; justify-content:center;
            cursor:pointer; font-size:15px; flex-shrink:0;
            transition:all var(--spring);
        }
        .fav-btn-header:hover { border-color:var(--pink); background:rgba(255,55,95,0.15); color:var(--pink); }
        .fav-btn-header.active { background:rgba(255,55,95,0.25); border-color:var(--pink); color:var(--pink); }
        .fav-btn-header.active i { animation:heartBeat 0.6s ease; }
        @keyframes heartBeat {
            0%, 100% { transform:scale(1); }
            25% { transform:scale(1.4); }
            50% { transform:scale(1.1); }
            75% { transform:scale(1.3); }
        }
        
        /* IFRAME CONTAINER — BLOKE SCROLL */
        .iframe-wrap {
            position:relative;
            width:100%;
            height:380px;
            background:#000;
            overflow:hidden;
            margin-bottom:16px;
            isolation:isolate;
        }
        .iframe-wrap iframe {
            position:absolute;
            top:-1px; left:-1px;
            width:calc(100% + 2px);
            height:calc(100% + 2px);
            border:none;
            display:block;
            overflow:hidden;
            scrollbar-width:none;
            -ms-overflow-style:none;
        }
        .iframe-wrap iframe::-webkit-scrollbar {
            display:none; width:0; height:0;
        }
        
        /* MASK ANWO (130px pou kache search bar Moviesbox) */
        .iframe-wrap .mask-top {
            position:absolute;
            top:0; left:0; right:0;
            height:130px;
            background:linear-gradient(to bottom, 
                #000 0%, 
                #000 85%, 
                rgba(0,0,0,0.5) 95%, 
                transparent 100%);
            z-index:10;
            pointer-events:none;
        }
        /* MASK ANBA */
        .iframe-wrap .mask-bottom {
            position:absolute;
            bottom:0; left:0; right:0;
            height:60px;
            background:linear-gradient(to top, 
                #000 0%, 
                #000 70%, 
                rgba(0,0,0,0.4) 90%, 
                transparent 100%);
            z-index:10;
            pointer-events:none;
        }
        /* MASK GOUCH/DWAT */
        .iframe-wrap .mask-left,
        .iframe-wrap .mask-right {
            position:absolute;
            top:0; bottom:0;
            width:2px;
            background:#000;
            z-index:10;
            pointer-events:none;
        }
        .iframe-wrap .mask-left { left:0; }
        .iframe-wrap .mask-right { right:0; }
        
        /* KONTNI ANBA A */
        .content {
            max-width:1000px;
            margin:0 auto;
            padding:0 16px 40px;
        }
        
        /* INFO CARD */
        .info-card {
            background:var(--glass-1);
            backdrop-filter:var(--blur-glass);
            -webkit-backdrop-filter:var(--blur-glass);
            border:1px solid var(--glass-border);
            border-radius:var(--r-lg);
            padding:16px;
            margin-bottom:14px;
        }
        .info-header {
            display:flex;
            gap:14px;
            align-items:flex-start;
            margin-bottom:14px;
        }
        .info-poster {
            width:90px;
            aspect-ratio:2/3;
            object-fit:cover;
            border-radius:var(--r-md);
            border:1px solid var(--glass-border);
            flex-shrink:0;
            box-shadow:0 4px 16px rgba(0,0,0,0.5);
        }
        .info-content { flex:1; min-width:0; }
        .info-title {
            font-size:19px;
            font-weight:800;
            margin-bottom:8px;
            line-height:1.2;
        }
        .info-meta {
            display:flex;
            flex-wrap:wrap;
            gap:8px;
            font-size:11px;
            color:var(--text-dim);
            font-weight:600;
            margin-bottom:10px;
        }
        .info-meta span { display:inline-flex; align-items:center; gap:4px; }
        .info-meta i { color:var(--cyan); font-size:10px; }
        .info-meta .rating { color:var(--gold); font-weight:800; }
        .info-desc {
            font-size:13px;
            line-height:1.6;
            color:var(--text-dim);
            padding-top:14px;
            border-top:1px solid var(--glass-border);
            margin-bottom:14px;
        }
        
        /* BOUTON FAVORI AK ANIMASYON */
        .info-actions {
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }
        .btn-favorite {
            padding:11px 20px;
            border-radius:50px;
            font-size:13px;
            font-weight:800;
            cursor:pointer;
            font-family:inherit;
            display:inline-flex;
            align-items:center;
            gap:8px;
            border:1px solid rgba(255,55,95,0.4);
            background:rgba(255,55,95,0.15);
            color:var(--pink);
            transition:all var(--spring);
        }
        .btn-favorite:hover {
            background:rgba(255,55,95,0.25);
            transform:scale(1.03);
        }
        .btn-favorite.active {
            background:linear-gradient(135deg, var(--pink), var(--purple));
            color:#fff;
            border:none;
            box-shadow:0 6px 20px rgba(255,55,95,0.4);
        }
        .btn-favorite.active i {
            animation:heartBeat 0.6s ease;
        }
        .btn-favorite:active { transform:scale(0.96); }
        
        /* WHATSAPP */
        .wa-card {
            display:flex;
            align-items:center;
            gap:12px;
            padding:14px;
            background:linear-gradient(135deg, rgba(37,211,102,0.15), rgba(18,140,126,0.1));
            border:1px solid rgba(37,211,102,0.4);
            border-radius:var(--r-lg);
            margin-bottom:16px;
        }
        .wa-icon {
            width:40px; height:40px;
            border-radius:12px;
            background:linear-gradient(135deg, #25D366, #128C7E);
            display:flex; align-items:center; justify-content:center;
            color:#fff; font-size:20px; flex-shrink:0;
        }
        .wa-content { flex:1; min-width:0; }
        .wa-title { font-size:13px; font-weight:800; margin-bottom:3px; }
        .wa-desc { font-size:10px; color:var(--text-dim); }
        .wa-btn {
            padding:8px 14px;
            background:linear-gradient(135deg, #25D366, #128C7E);
            color:#fff;
            border:none;
            border-radius:50px;
            font-size:11px;
            font-weight:700;
            cursor:pointer;
            text-decoration:none;
            white-space:nowrap;
        }
        
        /* SIJESYON — AMELYORE */
        .suggest-head {
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin-bottom:14px;
        }
        .suggest-title {
            font-size:16px;
            font-weight:800;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .suggest-title i { color:var(--cyan); font-size:14px; }
        .refresh-btn {
            padding:7px 14px;
            border-radius:50px;
            background:var(--glass-2);
            border:1px solid var(--glass-border);
            color:var(--cyan);
            font-size:11px;
            font-weight:700;
            cursor:pointer;
            font-family:inherit;
            display:inline-flex;
            align-items:center;
            gap:6px;
            transition:all var(--spring);
        }
        .refresh-btn:hover {
            background:rgba(100,210,255,0.15);
            border-color:var(--cyan);
            transform:rotate(-15deg);
        }
        .refresh-btn i { font-size:11px; }
        .refresh-btn.spinning i {
            animation:spin 0.6s linear;
        }
        @keyframes spin {
            from { transform:rotate(0deg); }
            to { transform:rotate(360deg); }
        }
        .suggest-grid {
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(130px, 1fr));
            gap:12px;
        }
        .suggest-card {
            border-radius:var(--r-md);
            overflow:hidden;
            background:var(--glass-1);
            border:1px solid var(--glass-border);
            text-decoration:none;
            color:inherit;
            display:block;
            transition:all var(--spring);
            position:relative;
        }
        .suggest-card:hover {
            transform:translateY(-5px) scale(1.02);
            border-color:var(--glass-border-bright);
            box-shadow:0 15px 30px rgba(0,0,0,0.6), 0 0 25px rgba(100,210,255,0.15);
        }
        .suggest-poster-wrap {
            position:relative;
            width:100%;
            aspect-ratio:2/3;
            overflow:hidden;
            background:var(--charcoal);
        }
        .suggest-card img {
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
            transition:transform 0.5s ease;
        }
        .suggest-card:hover img {
            transform:scale(1.1);
        }
        .suggest-badge {
            position:absolute;
            top:8px;
            right:8px;
            padding:3px 7px;
            background:rgba(0,0,0,0.85);
            border:1px solid rgba(255,255,255,0.2);
            border-radius:5px;
            font-size:8px;
            font-weight:800;
            color:var(--cyan);
            backdrop-filter:blur(10px);
        }
        .suggest-rating-badge {
            position:absolute;
            top:8px;
            left:8px;
            padding:3px 7px;
            background:rgba(0,0,0,0.85);
            border:1px solid rgba(255,214,10,0.4);
            border-radius:5px;
            font-size:9px;
            font-weight:800;
            color:var(--gold);
            display:flex;
            align-items:center;
            gap:3px;
            backdrop-filter:blur(10px);
        }
        .suggest-rating-badge i { font-size:7px; }
        .suggest-info { padding:9px 11px; }
        .suggest-name {
            font-size:12px;
            font-weight:700;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
            margin-bottom:4px;
        }
        .suggest-meta {
            font-size:10px;
            color:var(--text-dim);
            display:flex;
            gap:6px;
            align-items:center;
            flex-wrap:wrap;
        }
        .suggest-category {
            padding:1px 6px;
            border-radius:3px;
            background:rgba(100,210,255,0.15);
            color:var(--cyan);
            font-size:8px;
            font-weight:700;
        }
        
        /* SKELETON */
        .suggest-skeleton {
            position:absolute;
            inset:0;
            background:linear-gradient(90deg, #1a1a1c 25%, #2a2a2e 50%, #1a1a1c 75%);
            background-size:200% 100%;
            animation:shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position:200% 0; }
            100% { background-position:-200% 0; }
        }
        
        /* TOAST */
        .toast {
            position:fixed;
            bottom:100px;
            left:50%;
            transform:translateX(-50%) translateY(100px);
            padding:14px 24px;
            border-radius:50px;
            background:rgba(30,30,32,0.98);
            border:1px solid var(--glass-border-bright);
            color:var(--text);
            font-size:14px;
            font-weight:700;
            backdrop-filter:blur(40px);
            -webkit-backdrop-filter:blur(40px);
            z-index:500;
            opacity:0;
            pointer-events:none;
            transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
            display:flex;
            align-items:center;
            gap:10px;
            box-shadow:0 10px 40px rgba(0,0,0,0.6);
        }
        .toast.show {
            opacity:1;
            transform:translateX(-50%) translateY(0);
        }
        .toast i { font-size:16px; color:var(--pink); }
        
        @media (max-width:768px) {
            .iframe-wrap { height:380px; }
            .content { padding:0 12px 40px; }
            .info-title { font-size:16px; }
            .info-poster { width:80px; }
            .suggest-grid { grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:10px; }
        }
        @media (max-width:380px) {
            .suggest-grid { grid-template-columns:repeat(2, 1fr); }
        }
    </style>
</head>

<!-- HEADER AK BOUTON FAVORI -->
<header class="header">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>

<div class="content">

        </button>
    </div>
    <div class="suggest-grid" id="suggestGrid"></div>
</div>

<div class="toast" id="toast"><i class="fas fa-heart"></i> <span id="toastText">OK</span></div>

<script>
// ============================================================
// ✅ DATA SOTI NAN URL
// ============================================================
const params = new URLSearchParams(window.location.search);
const data = {
    subjectId: params.get('subjectId') || '',
    title: params.get('title') || 'Film',
    poster: params.get('poster') || '',
    year: params.get('year') || '',
    rating: params.get('rating') || 'N/A',
    type: params.get('type') || 'movie',
    detailPath: params.get('detailPath') || '',
    desc: params.get('desc') || 'Aucune description disponible.'
};

document.getElementById('headerTitle').textContent = data.title;
document.getElementById('infoPoster').src = data.poster || 'https://via.placeholder.com/300x450/1a1a1c/4a4a52?text=No+Image';
document.getElementById('infoTitle').textContent = data.title;
document.getElementById('infoMeta').innerHTML = `
    <span><i class="fas fa-calendar"></i> ${data.year}</span>
    <span class="rating"><i class="fas fa-star"></i> ${data.rating}</span>
    <span>${data.type === 'series' ? 'Série' : 'Film'}</span>
`;
document.getElementById('infoDesc').textContent = data.desc;

// ============================================================
// ✅ IFRAME (movieboxonline.net)
// ============================================================
const iframe = document.getElementById('playerIframe');
let iframeUrl = '';

if (data.detailPath) {
    iframeUrl = `https://movieboxonline.net/play/${data.detailPath}?id=${data.subjectId}&page_from=home&type=/movie/detail`;
} else {
    iframeUrl = `https://movieboxonline.net/play?id=${data.subjectId}&type=/movie/detail`;
}

console.log('🔗 Iframe URL:', iframeUrl);
iframe.src = iframeUrl;

// ✅ FAVORIS
// ============================================================
function isFavorite() {
    try {
        const favorites = JSON.parse(localStorage.getItem('blastflix_favorites') || '[]');
        return favorites.some(f => f.subjectId === data.subjectId);
    } catch { return false; }
}

function updateFavButtons() {
    const fav = isFavorite();
    const btnHeader = document.getElementById('favBtnHeader');
    const btnMain = document.getElementById('favBtnMain');
    
    if (fav) {
        btnHeader.classList.add('active');
        btnMain.classList.add('active');
        btnMain.innerHTML = '<i class="fas fa-heart"></i> <span>Retirer des favoris</span>';
    } else {
        btnHeader.classList.remove('active');
        btnMain.classList.remove('active');
        btnMain.innerHTML = '<i class="fas fa-heart"></i> <span>Ajouter aux favoris</span>';
    }
}

function toggleFavorite() {
    let favorites = [];
    try { favorites = JSON.parse(localStorage.getItem('blastflix_favorites') || '[]'); } catch {}
    
    const exists = favorites.some(f => f.subjectId === data.subjectId);
    
    if (exists) {
        favorites = favorites.filter(f => f.subjectId !== data.subjectId);
        showToast('Retiré des favoris');
    } else {
        favorites.unshift({
            subjectId: data.subjectId,
            title: data.title,
            poster: data.poster,
            year: data.year,
            rating: data.rating,
            type: data.type,
            detailPath: data.detailPath,
            desc: data.desc,
            addedAt: Date.now()
        });
        showToast('Ajouté aux favoris !');
    }
    
    localStorage.setItem('blastflix_favorites', JSON.stringify(favorites));
    updateFavButtons();
}

document.getElementById('favBtnHeader').addEventListener('click', toggleFavorite);
document.getElementById('favBtnMain').addEventListener('click', toggleFavorite);
updateFavButtons();

// ============================================================
// ✅ ISTWA — otomatik anrejistre
// ============================================================
(function trackHistory() {
    const movie = {
        subjectId: data.subjectId,
        title: data.title,
        poster: data.poster,
        year: data.year,
        rating: data.rating,
        type: data.type,
        detailPath: data.detailPath,
        desc: data.desc,
        watchedAt: Date.now(),
        progress: 0
    };
    
    let history = [];
    try { history = JSON.parse(localStorage.getItem('blastflix_history') || '[]'); } catch {}
    
    history = history.filter(h => h.subjectId !== movie.subjectId);
    history.unshift(movie);
    history = history.slice(0, 100);
    
    localStorage.setItem('blastflix_history', JSON.stringify(history));
})();

// ============================================================
// ✅ SIJESYON — PLIS FIM AK KATEGORI VARYE
// ============================================================
function renderSuggestions() {
    const grid = document.getElementById('suggestGrid');
    
    // Filtre fim diferan de fim aktyèl la
    const others = ALL_MOVIES.filter(m => m.subjectId !== data.subjectId);
    
    // MÉLANGE (Fisher-Yates shuffle)
    const shuffled = [...others].sort(() => Math.random() - 0.5);
    
    // CHWAZI 18 FIM (plis pase 6)
    const picks = shuffled.slice(0, 18);
    
    // AFICHE
    grid.innerHTML = picks.map(m => {
        const p = new URLSearchParams({
            subjectId: m.subjectId,
            title: m.title,
            poster: m.poster,
            year: m.year,
            rating: m.rating,
            type: m.category === 'Series' ? 'series' : 'movie',
            detailPath: m.detailPath,
            desc: m.desc
        });
        return `
            <a href="player.html?${p.toString()}" class="suggest-card">
                <div class="suggest-poster-wrap">
                    <div class="suggest-skeleton"></div>
                    <img src="${m.poster}" alt="${m.title}" loading="lazy"
                         onload="this.parentElement.querySelector('.suggest-skeleton')?.remove();"
                         onerror="this.src='https://via.placeholder.com/300x450/1a1a1c/4a4a52?text=No+Image'">
                    <div class="suggest-rating-badge"><i class="fas fa-star"></i>${m.rating}</div>
                    <div class="suggest-badge">HD</div>
                </div>
                <div class="suggest-info">
                    <div class="suggest-name">${m.title}</div>
                    <div class="suggest-meta">
                        <span>${m.year}</span>
                        <span class="suggest-category">${m.category}</span>
                    </div>
                </div>
            </a>
        `;
    }).join('');
    
    console.log(`✅ ${picks.length} films suggérés (aléatoire)`);
}

// Afiche premye fwa
renderSuggestions();

// Bouton refresh pou chanje suggestions
document.getElementById('refreshBtn').addEventListener('click', (e) => {
    const btn = e.currentTarget;
    btn.classList.add('spinning');
    renderSuggestions();
    showToast('Suggestions changées !');
    setTimeout(() => btn.classList.remove('spinning'), 600);
});

// ============================================================
// ✅ TOAST
// ============================================================
function showToast(text) {
    const toast = document.getElementById('toast');
    document.getElementById('toastText').textContent = text;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}
