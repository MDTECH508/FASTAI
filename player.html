<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Lecture - BLAST FLIX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        :root {
            --black:#000; --cyan:#64d2ff; --blue:#0a84ff; --purple:#bf5af2;
            --glass-1:rgba(255,255,255,0.035); --glass-border:rgba(255,255,255,0.09);
            --text:#f5f5f7; --text-dim:rgba(245,245,247,0.55);
            --r-lg:24px; --blur-glass:blur(40px) saturate(180%);
        }
        html, body {
            font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
            background:var(--black); color:var(--text); min-height:100vh;
        }
        .bg-neo { position:fixed; inset:0; z-index:-3; background:var(--black); }
        .bg-neo::before {
            content:''; position:absolute; inset:0;
            background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(100,210,255,0.18), transparent);
            filter:blur(80px);
        }
        .header {
            position:sticky; top:0; z-index:100; padding:12px 16px;
            background:rgba(10,10,12,0.55); backdrop-filter:var(--blur-glass);
            border-bottom:1px solid var(--glass-border);
            display:flex; align-items:center; gap:12px;
        }
        .back-btn {
            width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,0.07);
            border:1px solid var(--glass-border); color:var(--text);
            display:flex; align-items:center; justify-content:center;
            text-decoration:none; font-size:14px;
        }
        .header-title { font-size:15px; font-weight:700; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .container { max-width:1000px; margin:0 auto; padding:16px; }
        .iframe-container {
            position:relative; width:100%; aspect-ratio:16/9; background:#000;
            border-radius:var(--r-lg); overflow:hidden;
            border:1px solid rgba(255,255,255,0.22);
            box-shadow:0 0 40px rgba(100,210,255,0.15), 0 20px 60px rgba(0,0,0,0.7);
            margin-bottom:16px;
        }
        .iframe-container iframe {
            width:100%; height:100%; border:none; display:block;
        }
        .info-card {
            background:var(--glass-1); backdrop-filter:var(--blur-glass);
            border:1px solid var(--glass-border); border-radius:var(--r-lg);
            padding:18px; margin-bottom:14px;
        }
        .info-header { display:flex; gap:14px; align-items:flex-start; }
        .info-poster {
            width:75px; aspect-ratio:2/3; object-fit:cover;
            border-radius:12px; border:1px solid rgba(255,255,255,0.22);
            flex-shrink:0;
        }
        .info-content { flex:1; min-width:0; }
        .info-title { font-size:18px; font-weight:800; margin-bottom:6px; }
        .info-meta { display:flex; flex-wrap:wrap; gap:8px; font-size:11px; color:var(--text-dim); font-weight:600; }
        .info-meta span { display:inline-flex; align-items:center; gap:4px; }
        .info-meta i { color:var(--cyan); font-size:10px; }
        .toast {
            position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
            background:rgba(20,20,22,0.95); border:1px solid rgba(255,255,255,0.22);
            color:var(--text); padding:10px 20px; border-radius:50px; font-size:12px; font-weight:600;
            z-index:10000; opacity:0; transition:all 0.3s; pointer-events:none;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="bg-neo"></div>

<div class="header">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <div class="header-title" id="headerTitle">Chargement...</div>
</div>

<div class="container">
    <!-- IFRAME POU JWE FIM NAN -->
    <div class="iframe-container">
        <iframe id="playerIframe" allowfullscreen allow="autoplay; fullscreen"></iframe>
    </div>

    <div class="info-card">
        <div class="info-header">
            <img id="infoPoster" class="info-poster" src="" alt="Poster">
            <div class="info-content">
                <h1 id="infoTitle" class="info-title">Chargement...</h1>
                <div class="info-meta" id="infoMeta"></div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// ✅ DATA SOTI NAN URL
// ============================================================
const params = new URLSearchParams(window.location.search);
const data = {
    subjectId: params.get('subjectId') || '',
    title: params.get('title') || 'Film',
    poster: params.get('poster') || '',
    year: params.get('year') || '',
    rating: params.get('rating') || 'N/A',
    type: params.get('type') || 'movie',
    detailPath: params.get('detailPath') || ''
};

document.getElementById('headerTitle').textContent = data.title;
document.getElementById('infoPoster').src = data.poster || 'https://via.placeholder.com/300x450/1a1a1c/4a4a52?text=No+Image';
document.getElementById('infoTitle').textContent = data.title;
document.getElementById('infoMeta').innerHTML = `
    <span><i class="fas fa-calendar"></i> ${data.year}</span>
    <span><i class="fas fa-star"></i> ${data.rating}</span>
    <span>${data.type === 'series' ? 'Série' : 'Film'}</span>
`;

// ============================================================
// ✅ IFRAME: Louvri paj la dirèkteman
// ============================================================
const iframe = document.getElementById('playerIframe');

// Bati URL la egzakteman jan w te bay la:
// https://movieboxhd.net/moviedetail/{detailPath}?id={subjectId}&page_from=home_Action%26Thriller&type=/movie/detail

// Si w pa gen detailPath, nou ka eseye kreye yon URL jis ak subjectId a
let iframeUrl = '';

if (data.detailPath) {
    // Gen detailPath (pi bon)
    iframeUrl = `https://movieboxhd.net/moviedetail/${data.detailPath}?id=${data.subjectId}&page_from=home&type=/movie/detail`;
} else {
    // Pa gen detailPath, eseye jis ak subjectId a
    iframeUrl = `https://movieboxhd.net/moviedetail/play?id=${data.subjectId}`;
}

console.log('🔗 Iframe URL:', iframeUrl);

// Chaje URL la nan iframe a
iframe.src = iframeUrl;

// Si iframe a pa chaje, montre yon mesaj
iframe.onerror = () => {
    showToast('⚠️ Iframe pa chaje. Eseye louvri l nan yon nouvo tab.');
};

// Montre yon mesaj si iframe a bloke
setTimeout(() => {
    try {
        // Eseye wè si iframe a chaje (sa ka bay erè CORS)
        if (iframe.contentDocument && iframe.contentDocument.body.innerHTML === '') {
            showToast('⚠️ Iframe vid. Sit la ka bloke l.');
        }
    } catch (e) {
        // Sa nòmal (CORS bloke aksè)
    }
}, 3000);

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
}
</script>
</body>
</html>
