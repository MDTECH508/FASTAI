<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0b">
<title>NET PLUS — Peman</title>
<style>
  :root{
    --bg:#0a0a0b; --ink:#f2f2f3; --mute:#9d9da4;
    --line:rgba(255,255,255,.12); --neon:#5ee7ff; --neon2:#b18cff;
    --ok:#8fd19e; --bad:#ff8f8f; --warn:#e3c77a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh; display:grid; place-items:center; padding:20px;
  }
  body::before{
    content:""; position:fixed; inset:-20%; z-index:-2;
    background:
      radial-gradient(45% 40% at 20% 20%, rgba(94,231,255,.18), transparent 70%),
      radial-gradient(40% 35% at 80% 25%, rgba(177,140,255,.15), transparent 70%);
  }
  .card{
    width:100%; max-width:480px;
    background:linear-gradient(160deg,rgba(28,30,38,.94),rgba(16,17,22,.97));
    border:1px solid var(--line); border-radius:22px;
    padding:32px 26px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 30px 80px rgba(0,0,0,.65);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    backdrop-filter:blur(24px) saturate(160%);
  }
  .brand{display:flex; align-items:center; gap:10px; color:var(--neon); margin-bottom:22px}
  .brand .mark{
    width:38px; height:38px; border-radius:11px; flex:none;
    display:grid; place-items:center;
    background:radial-gradient(circle at 30% 22%, rgba(255,255,255,.5) 0, transparent 45%), linear-gradient(135deg, rgba(94,231,255,.35), rgba(177,140,255,.25));
    border:1px solid rgba(94,231,255,.5); color:#fff;
    box-shadow:0 0 16px rgba(94,231,255,.3), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .brand .mark svg{width:20px; height:20px}
  .brand .text{display:flex; flex-direction:column; line-height:1}
  .brand .text b{color:var(--ink); font-size:.95rem; font-weight:900; letter-spacing:.05em}
  .brand .text small{color:var(--neon); font-size:.6rem; font-weight:700; letter-spacing:.2em; margin-top:3px}

  h1{font-size:1.35rem; letter-spacing:-.02em; margin-bottom:6px}
  p.sub{color:var(--mute); font-size:.9rem; margin-bottom:20px}

  /* Secure */
  .secure-badge{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:999px;
    background:rgba(143,209,158,.1); border:1px solid rgba(143,209,158,.4);
    color:var(--ok); font-size:.74rem; font-weight:700;
    margin:0 auto 16px;
  }
  .secure-badge svg{width:13px; height:13px}
  .secure-badge b{background:linear-gradient(90deg,#8fd19e,#5ee7ff); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:900}

  /* Rezime */
  .order-sum{
    background:rgba(94,231,255,.08); border:1px solid rgba(94,231,255,.4);
    border-radius:14px; padding:16px; margin-bottom:20px;
  }
  .order-sum .row{display:flex; justify-content:space-between; padding:6px 0; font-size:.9rem}
  .order-sum .row span{color:var(--mute)}
  .order-sum .total{
    margin-top:10px; padding-top:12px; border-top:1px solid rgba(94,231,255,.2);
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .order-sum .total span{color:var(--mute); font-size:.88rem}
  .order-sum .total b{font-size:1.6rem; color:var(--neon); letter-spacing:-.02em}

  /* Metòd */
  .method-title{
    font-size:.82rem; color:#c8c8cf; font-weight:700; margin-bottom:10px;
    text-transform:uppercase; letter-spacing:.06em;
  }
  .methods{display:grid; gap:10px; margin-bottom:20px}
  .method{
    display:flex; align-items:center; gap:14px;
    padding:16px; border-radius:14px; cursor:pointer;
    background:#0c0c10; border:1px solid var(--line);
    transition:.18s; position:relative;
  }
  .method:hover{border-color:rgba(94,231,255,.35); background:#0e0f14}
  .method input{position:absolute; opacity:0; pointer-events:none}
  .method.selected{
    border-color:var(--neon); background:rgba(94,231,255,.06);
    box-shadow:0 0 0 1px var(--neon), 0 8px 24px rgba(94,231,255,.15);
  }
  .method .m-icon{
    width:44px; height:44px; border-radius:12px;
    display:grid; place-items:center; flex:none;
    background:rgba(94,231,255,.1); color:var(--neon);
    border:1px solid rgba(94,231,255,.3);
  }
  .method .m-icon svg{width:22px; height:22px}
  .method .m-info{flex:1; min-width:0}
  .method .m-info b{display:block; font-size:.95rem; margin-bottom:2px}
  .method .m-info span{font-size:.82rem; color:var(--mute)}

  /* Detay */
  .pay-detail{
    background:rgba(0,0,0,.3); border:1px solid var(--line);
    border-radius:14px; padding:18px; margin-bottom:18px;
    animation:detailIn .35s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes detailIn{from{opacity:0; transform:translateY(-8px)}to{opacity:1; transform:none}}
  .pay-detail h3{
    font-size:.94rem; margin-bottom:12px;
    display:flex; align-items:center; gap:8px; color:var(--neon);
  }
  .pay-detail h3 svg{width:18px; height:18px}
  .pay-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:.92rem}
  .pay-row:last-child{border-bottom:0}
  .pay-row span{color:var(--mute)}
  .pay-row b{color:var(--ink); font-variant-numeric:tabular-nums}
  .pay-row b.mono{font-family:ui-monospace,monospace; letter-spacing:.04em; font-size:1rem}
  .copy-btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 10px; border-radius:8px; margin-left:8px;
    background:rgba(94,231,255,.1); border:1px solid rgba(94,231,255,.35);
    color:var(--neon); font-size:.78rem; font-weight:700; cursor:pointer;
    transition:.15s;
  }
  .copy-btn:hover{background:rgba(94,231,255,.2)}
  .copy-btn svg{width:12px; height:12px}

  label{display:block; font-size:.8rem; color:#c8c8cf; margin:14px 0 6px; font-weight:600}
  .field{
    display:flex; align-items:center; gap:10px;
    background:#0c0c10; border:1px solid var(--line); border-radius:12px;
    padding:0 14px; transition:.18s;
  }
  .field:focus-within{border-color:var(--neon); box-shadow:0 0 0 3px rgba(94,231,255,.18)}
  .field svg{color:var(--mute); flex:none}
  .field input{
    flex:1; background:transparent; border:0; outline:0; color:var(--ink);
    font:inherit; font-size:16px; padding:13px 0; min-width:0;
  }
  .field input.mono{font-family:ui-monospace,monospace; letter-spacing:.04em}

  .btn{
    width:100%; margin-top:18px; padding:14px; border:0; border-radius:12px;
    cursor:pointer; font:inherit; font-weight:800; font-size:.98rem;
    color:#06121a;
    background:linear-gradient(180deg,#eaf8fc 0%,#a9dbe9 100%);
    box-shadow:inset 0 1px 0 #fff, 0 0 0 1px rgba(94,231,255,.45), 0 12px 30px rgba(94,231,255,.28);
    transition:transform .14s, filter .18s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:scale(.98)}
  .btn[disabled]{opacity:.55; cursor:not-allowed}
  .btn.ghost{background:rgba(255,255,255,.05); color:var(--ink); box-shadow:none; border:1px solid var(--line)}
  .btn.ghost:hover{background:rgba(255,255,255,.09)}

  .spinner{
    width:16px; height:16px; border:2px solid rgba(6,18,26,.3);
    border-top-color:#06121a; border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .msg{
    margin-top:14px; padding:11px 14px; border-radius:10px;
    font-size:.86rem; display:none; align-items:center; gap:8px;
  }
  .msg.err{display:flex; background:rgba(255,120,120,.12); border:1px solid rgba(255,120,120,.4); color:#ffb0b0}
  .msg.ok{display:flex; background:rgba(143,209,158,.12); border:1px solid rgba(143,209,158,.4); color:var(--ok)}

  .back{margin-top:16px; text-align:center}
  .back a{color:var(--mute); font-size:.86rem; text-decoration:none; display:inline-flex; align-items:center; gap:6px}
  .back a:hover{color:var(--neon)}

  .steps{list-style:none; counter-reset:s; margin-top:12px}
  .steps li{
    counter-increment:s; display:grid; grid-template-columns:26px 1fr;
    gap:10px; align-items:start; padding:8px 0; font-size:.88rem; color:var(--mute);
  }
  .steps li::before{
    content:counter(s); width:26px; height:26px; border-radius:50%;
    display:grid; place-items:center; font-weight:800; font-size:.78rem;
    background:rgba(94,231,255,.12); border:1px solid rgba(94,231,255,.35); color:var(--neon);
  }

  .wa-banner{
    background:linear-gradient(160deg, rgba(37,211,102,.14), rgba(37,211,102,.06));
    border:1px solid rgba(37,211,102,.4); border-radius:14px; padding:18px;
    text-align:center;
  }
  .wa-banner .wa-icon{
    width:56px; height:56px; border-radius:50%; margin:0 auto 12px;
    display:grid; place-items:center;
    background:rgba(37,211,102,.15); color:#25d366;
    border:1px solid rgba(37,211,102,.4);
  }
  .wa-banner .wa-icon svg{width:30px; height:30px}
  .wa-banner h3{font-size:1rem; margin-bottom:6px; color:#8fe7b0}
  .wa-banner p{font-size:.86rem; color:var(--mute); margin-bottom:14px}
  .wa-banner .btn{
    background:linear-gradient(180deg,#5ee78a,#25d366); color:#04120a;
    box-shadow:inset 0 1px 0 #fff, 0 0 0 1px rgba(37,211,102,.45), 0 12px 30px rgba(37,211,102,.3);
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <span class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8.5a16 16 0 0 1 20 0"/><path d="M5 12a11 11 0 0 1 14 0"/>
        <path d="M8.5 15.5a6 6 0 0 1 7 0"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <span class="text"><b>NET PLUS</b><small>5G LTE</small></span>
  </div>

  <h1>Peman</h1>
  <p class="sub">Chwazi metòd peman ou epi swiv enstriksyon yo.</p>

  <div style="text-align:center">
    <div class="secure-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l8 3.5v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10v-6z"/>
        <path d="M8.5 12l2.5 2.5 4.5-5"/>
      </svg>
      Secured by <b>NET PLUS Secure X</b>
    </div>
  </div>

  <div class="order-sum" id="orderSum">
    <div class="row"><span>Kòmand</span><b id="oidLabel">—</b></div>
    <div class="row"><span>Plan</span><b id="planLabel">—</b></div>
    <div class="total">
      <span>Total pou peye</span>
      <b id="amtLabel">—</b>
    </div>
  </div>

  <div id="methodSelect">
    <div class="method-title">Chwazi metòd peman</div>
    <div class="methods">
      <label class="method" data-method="natcash">
        <input type="radio" name="payMethod" value="natcash" checked>
        <div class="m-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>
          </svg>
        </div>
        <div class="m-info">
          <b>NatCash</b>
          <span>Voye lajan sou 509 5511 2990</span>
        </div>
      </label>

      <label class="method" data-method="moncash">
        <input type="radio" name="payMethod" value="moncash">
        <div class="m-icon" style="background:rgba(255,80,80,.1); color:#ff8f8f; border-color:rgba(255,80,80,.35)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>
          </svg>
        </div>
        <div class="m-info">
          <b>MonCash</b>
          <span>Voye lajan sou 509 4195 1159</span>
        </div>
      </label>

      <label class="method" data-method="whatsapp">
        <input type="radio" name="payMethod" value="whatsapp">
        <div class="m-icon" style="background:rgba(37,211,102,.1); color:#25d366; border-color:rgba(37,211,102,.35)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a8 8 0 0 1-11.6 7.2L4 21l1.8-5.4A8 8 0 1 1 21 12z"/>
          </svg>
        </div>
        <div class="m-info">
          <b>WhatsApp</b>
          <span>Pale dirèk ak ekip nou an</span>
        </div>
      </label>
    </div>
  </div>

  <div id="payDetail"></div>
  <div class="msg" id="msg"></div>

  <div class="back">
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Retounen sou paj akèy
    </a>
  </div>
</div>

<script src="config.js"></script>
<script>
const API = window.NETPLUS_API || "";
const $ = id => document.getElementById(id);

const PAY_ACCOUNTS = {
  natcash: { number: "50955112990", name: "Enelson Pierre", label: "NatCash" },
  moncash: { number: "50941951159", name: "NET PLUS", label: "MonCash" }
};
const WHATSAPP = "50941951159";
const SUPPORT_PHONE = "50941951159";

const params = new URLSearchParams(location.search);
const orderId = params.get("order") || "";
const amount = parseInt(params.get("amount") || "0", 10);
const planKey = params.get("plan") || "";

$("oidLabel").textContent = orderId || "—";
$("planLabel").textContent = planKey || "—";
$("amtLabel").textContent = amount ? amount.toLocaleString("fr-FR") + " HTG" : "—";

const methods = document.querySelectorAll(".method");

function selectMethod(method){
  methods.forEach(m => {
    const input = m.querySelector("input");
    input.checked = input.value === method;
    m.classList.toggle("selected", input.value === method);
  });
  renderDetail(method);
}

methods.forEach(m => {
  m.addEventListener("click", () => selectMethod(m.dataset.method));
});

function setMsg(kind, text){
  const el = $("msg");
  el.className = "msg" + (kind ? " " + kind : "");
  el.innerHTML = "";
  if (!text) return;
  const icon = kind === "ok"
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="M5 12l5 5L20 7"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".8" fill="currentColor"/></svg>`;
  el.innerHTML = icon + "<span>" + text + "</span>";
}

function renderDetail(method){
  const el = $("payDetail");
  setMsg(null, "");

  if (method === "natcash" || method === "moncash"){
    const acc = PAY_ACCOUNTS[method];
    el.innerHTML = `
      <div class="pay-detail">
        <h3>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>
          </svg>
          Peye ak ${acc.label}
        </h3>

        <div class="pay-row">
          <span>Nimewo</span>
          <b class="mono">${acc.number}
            <button class="copy-btn" data-copy="${acc.number}" title="Kopye">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>
              </svg>
              Kopye
            </button>
          </b>
        </div>
        <div class="pay-row">
          <span>Non</span>
          <b>${acc.name}</b>
        </div>
        <div class="pay-row">
          <span>Montan</span>
          <b>${amount.toLocaleString("fr-FR")} HTG</b>
        </div>

        <ol class="steps">
          <li>Louvri aplikasyon ${acc.label} ou</li>
          <li>Chwazi "Voye lajan" epi voye <b>${amount.toLocaleString("fr-FR")} HTG</b> sou <b>${acc.number}</b> (${acc.name})</li>
          <li>Kopye <b>ID tranzaksyon an</b> nan SMS konfimasyon an</li>
          <li>Antre ID a anba a epi klike "Valide peman"</li>
          <li>Kòd ou ap parèt — kopye l epi konekte</li>
        </ol>

        <label for="txn">ID tranzaksyon (${acc.label})</label>
        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" width="20" height="20">
            <rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h2M11 10h2M15 10h2M7 14h10"/>
          </svg>
          <input id="txn" class="mono" placeholder="Egz: 1234567890" autocomplete="off" autocapitalize="characters">
        </div>

        <button class="btn" type="button" id="payBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16">
            <path d="M5 12l5 5L20 7"/>
          </svg>
          Valide peman
        </button>

        <p style="font-size:.8rem;color:var(--mute);margin-top:12px;text-align:center">
          Pa gen ${acc.label}? Kontakte nou sou WhatsApp: <a href="https://wa.me/${WHATSAPP}" target="_blank" style="color:var(--neon)">${WHATSAPP}</a>
        </p>
      </div>
    `;

    document.querySelectorAll(".copy-btn").forEach(b => {
      b.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(b.dataset.copy);
          b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="12" height="12"><path d="M5 12l5 5L20 7"/></svg> Kopye!`;
          setTimeout(() => {
            b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="12" height="12"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg> Kopye`;
          }, 1500);
        } catch(_){}
      });
    });

    $("payBtn").addEventListener("click", () => submitPay(method));
  }

  if (method === "whatsapp"){
    const text = encodeURIComponent(
      `Bonjou NET PLUS!\n\nMwen vle peye kòmand mwen:\nKòmand: ${orderId}\nPlan: ${planKey}\nMontan: ${amount} HTG\n\nTanpri voye m enstriksyon peman yo.`
    );
    el.innerHTML = `
      <div class="wa-banner">
        <div class="wa-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a8 8 0 0 1-11.6 7.2L4 21l1.8-5.4A8 8 0 1 1 21 12z"/>
          </svg>
        </div>
        <h3>Peye sou WhatsApp</h3>
        <p>Klike anba a epi ekip nou an ap ba w enstriksyon peman yo dirèkteman.</p>
        <a class="btn" href="https://wa.me/${WHATSAPP}?text=${text}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16">
            <path d="M21 12a8 8 0 0 1-11.6 7.2L4 21l1.8-5.4A8 8 0 1 1 21 12z"/>
          </svg>
          Louvri WhatsApp
        </a>
        <button class="btn ghost" type="button" style="margin-top:10px" onclick="location.href='tel:+${SUPPORT_PHONE}'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" width="16" height="16">
            <path d="M6.5 10.5a14 14 0 0 0 7 7l2-2a1 1 0 0 1 1-.2 10 10 0 0 0 3.5.5 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A16 16 0 0 1 3 4a1 1 0 0 1 1-1h3.2a1 1 0 0 1 1 1c0 1.2.2 2.4.5 3.5a1 1 0 0 1-.2 1z"/>
          </svg>
          Rele dirèk
        </button>
      </div>
    `;
  }
}

async function submitPay(method){
  const txn = ($("txn")?.value || "").trim();
  const btn = $("payBtn");

  if (!txn){
    setMsg("err", "Antre ID tranzaksyon an.");
    return;
  }
  if (txn.length < 6){
    setMsg("err", "ID tranzaksyon an twò kout. Verifye l.");
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Ap verifye peman…';
  setMsg(null, "");

  try {
    const r = await fetch(API + "/api/pay", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ orderId, txnId: txn, amount, method })
    });
    const d = await r.json();

    if (!d.ok){
      const map = {
        used: "ID sa a deja itilize. Kontakte nou si w pa resevwa kòd ou.",
        low: "Montan w peye a pi piti pase pri plan an.",
        pending: "Peman w poko konfime. Tann 1 minit epi eseye ankò.",
        rate: "Twòp tantativ. Eseye ankò nan 5 minit.",
        not_found: "Kòmand sa a pa egziste.",
        mikrotik: "Erè teknik. Kontakte nou sou WhatsApp."
      };
      setMsg("err", map[d.error] || "Erè. Eseye ankò oswa ekri nou sou WhatsApp.");
      btn.disabled = false;
      btn.textContent = "Valide peman";
      return;
    }

    /* SUKSÈ — sove kòd la epi ale nan paj siksè */
    sessionStorage.setItem("np_success_code", d.code);
    sessionStorage.setItem("np_success_order", orderId);
    sessionStorage.setItem("np_success_plan", planKey);
    sessionStorage.setItem("np_success_amount", amount);
    location.href = "pay-success.html";
  } catch(_) {
    setMsg("err", "Erè rezo. Verifye koneksyon w epi eseye ankò.");
    btn.disabled = false;
    btn.textContent = "Valide peman";
  }
}

if (!orderId || !amount){
  location.replace("index.html");
} else {
  selectMethod("natcash");
}
</script>
</body>
