<!-- dashboard.html - Menu Premium avec Script Speed -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLAST PROXY - Menu Premium</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --text: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #666680;
            --accent: #6c5ce7;
            --accent-secondary: #a29bfe;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --success: #00b894;
            --error: #ff7675;
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        
        .liquid-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            animation: floatOrb 20s ease-in-out infinite;
        }
        
        .liquid-orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #6c5ce7, transparent);
            top: -80px;
            left: -80px;
        }
        
        .liquid-orb:nth-child(2) {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #a29bfe, transparent);
            bottom: -60px;
            right: -60px;
            animation-delay: -7s;
        }
        
        .liquid-orb:nth-child(3) {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #00b894, transparent);
            top: 50%;
            left: 40%;
            animation-delay: -14s;
        }
        
        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(80px, -60px) scale(1.1); }
            50% { transform: translate(-60px, 80px) scale(0.9); }
            75% { transform: translate(50px, 50px) scale(1.05); }
        }
        
        .navbar {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: calc(100% - 24px);
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .navbar-brand {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: nowrap;
        }
        
        .user-info {
            background: rgba(255, 255, 255, 0.08);
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 9px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.3;
            white-space: nowrap;
        }
        
        .logout-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .logout-btn:hover {
            background: var(--error);
            border-color: var(--error);
            transform: scale(1.05);
        }
        
        .logout-btn:active {
            transform: scale(0.95);
        }
        
        .logout-btn svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .welcome-section {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 80px 15px 20px;
        }
        
        .welcome-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff, #6c5ce7, #a29bfe, #ffffff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .welcome-subtitle {
            color: var(--text-muted);
            margin-top: 6px;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        
        .dashboard {
            position: relative;
            z-index: 10;
            max-width: 500px;
            margin: 10px auto;
            padding: 0 12px 40px;
        }
        
        .section {
            background: rgba(20, 20, 30, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .section:hover {
            border-color: rgba(108, 92, 231, 0.3);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }
        
        .section-title {
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 14px;
            background: linear-gradient(135deg, #ffffff, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .feature-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 14px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
        }
        
        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(108, 92, 231, 0.5), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .feature-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 20px rgba(108, 92, 231, 0.15);
            border-color: rgba(108, 92, 231, 0.4);
        }
        
        .feature-card:hover::before {
            opacity: 1;
        }
        
        .feature-card:active {
            transform: translateY(0) scale(0.98);
        }
        
        .feature-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .feature-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.25), rgba(162, 155, 254, 0.15));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(108, 92, 231, 0.2);
        }
        
        .feature-icon svg {
            width: 16px;
            height: 16px;
            stroke: var(--accent-secondary);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .feature-title {
            font-size: 11px;
            font-weight: 600;
            flex: 1;
            letter-spacing: 0.3px;
            color: #ddd;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 7px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }
        
        .status-indicator.active {
            color: var(--success);
            background: rgba(0, 184, 148, 0.15);
            border: 1px solid rgba(0, 184, 148, 0.4);
            text-shadow: 0 0 8px rgba(0, 184, 148, 0.5);
        }
        
        .status-indicator.inactive {
            color: #888;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .status-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: dotPulse 1.5s infinite;
        }
        
        .status-indicator.active .status-dot {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }
        
        .status-indicator.inactive .status-dot {
            background: #666;
        }
        
        @keyframes dotPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.6); }
        }
        
        .toggle-switch {
            position: relative;
            width: 38px;
            height: 22px;
            flex-shrink: 0;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.15);
            transition: .3s;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background: #aaa;
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        input:checked + .toggle-slider {
            background: rgba(0, 184, 148, 0.3);
            border-color: rgba(0, 184, 148, 0.5);
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(16px);
            background: var(--success);
            box-shadow: 0 0 10px rgba(0, 184, 148, 0.6);
        }
        
        .feature-status {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 8px;
            padding: 4px 6px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 6px;
        }
        
        .script-info {
            background: rgba(0, 0, 0, 0.25);
            border: 1px dashed rgba(108, 92, 231, 0.3);
            border-radius: 10px;
            padding: 8px;
            margin-top: 8px;
            text-align: center;
        }
        
        .script-info p {
            font-size: 8px;
            color: var(--text-muted);
            margin: 2px 0;
        }
        
        .script-info .script-name {
            font-family: 'Courier New', monospace;
            color: var(--accent-secondary);
            font-size: 9px;
        }
        
        .script-info .script-target {
            font-family: 'Courier New', monospace;
            color: var(--success);
            font-size: 9px;
        }
        
        @media (max-width: 400px) {
            .features-grid {
                grid-template-columns: 1fr;
            }
            
            .welcome-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="liquid-bg">
        <div class="liquid-orb"></div>
        <div class="liquid-orb"></div>
        <div class="liquid-orb"></div>
    </div>
    
    <nav class="navbar">
        <div class="navbar-brand">BLAST</div>
        <div class="user-info" id="userInfo">--</div>
        <button class="logout-btn" onclick="logout()" title="Déconnexion">
            <svg viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
        </button>
    </nav>
    
    <div class="welcome-section">
        <h1 class="welcome-title">BLAST PROXY</h1>
        <p class="welcome-subtitle">Premium System</p>
    </div>
    
    <div class="dashboard">
        <!-- AIM OPTIONS -->
        <div class="section">
            <h2 class="section-title">AIM OPTIONS</h2>
            <div class="features-grid">
                <div class="feature-card">
                    <div class="feature-header">
                        <div class="feature-icon">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><line x1="12" y1="1" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="1" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="23" y2="12"/></svg>
                        </div>
                        <span class="feature-title">AIMDRAG</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="aimDrag" onchange="toggleFeature('aimDrag')">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="feature-status">
                        <span class="status-indicator inactive" id="status-aimDrag">
                            <span class="status-dot"></span> OFF
                        </span>
                    </div>
                </div>
                
                <div class="feature-card">
                    <div class="feature-header">
                        <div class="feature-icon">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><line x1="12" y1="1" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="1" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="23" y2="12"/></svg>
                        </div>
                        <span class="feature-title">AIM BODY</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="aimBody" onchange="toggleFeature('aimBody')">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="feature-status">
                        <span class="status-indicator inactive" id="status-aimBody">
                            <span class="status-dot"></span> OFF
                        </span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- HOLO FEATURES -->
        <div class="section">
            <h2 class="section-title">HOLO FEATURES</h2>
            <div class="features-grid">
                <div class="feature-card">
                    <div class="feature-header">
                        <div class="feature-icon">
                            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                        </div>
                        <span class="feature-title">HOLO ARMAS</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="holoV1Armas" onchange="toggleFeature('holoV1Armas')">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="feature-status">
                        <span class="status-indicator inactive" id="status-holoV1Armas">
                            <span class="status-dot"></span> OFF
                        </span>
                    </div>
                    <div class="script-info">
                        <p>File: <span class="script-name">bde.js</span></p>
                        <p>Container: <span class="script-name">"678kksijaj"</span></p>
                        <p>Dest: <span class="script-target">com.exo.drmo</span></p>
                    </div>
                </div>
                
                <div class="feature-card">
                    <div class="feature-header">
                        <div class="feature-icon">
                            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                        </div>
                        <span class="feature-title">HOLO ALL</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="holoV1All" onchange="toggleFeature('holoV1All')">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="feature-status">
                        <span class="status-indicator inactive" id="status-holoV1All">
                            <span class="status-dot"></span> OFF
                        </span>
                    </div>
                    <div class="script-info">
                        <p>File: <span class="script-name">bde.js</span></p>
                        <p>Container: <span class="script-name">"678kksijaj"</span></p>
                        <p>Dest: <span class="script-target">com.exo.drmo</span></p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- MOST FEATURES -->
        <div class="section">
            <h2 class="section-title">MOST FEATURES</h2>
            <div class="features-grid">
                <div class="feature-card">
                    <div class="feature-header">
                        <div class="feature-icon">
                            <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                        </div>
                        <span class="feature-title">BACK JUMP</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="backJump" onchange="toggleFeature('backJump')">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="feature-status">
                        <span class="status-indicator inactive" id="status-backJump">
                            <span class="status-dot"></span> OFF
                        </span>
                    </div>
                </div>
                
                <div class="feature-card">
                    <div class="feature-header">
                        <div class="feature-icon">
                            <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg>
                        </div>
                        <span class="feature-title">SWAP FAST</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="swapFast" onchange="toggleFeature('swapFast')">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="feature-status">
                        <span class="status-indicator inactive" id="status-swapFast">
                            <span class="status-dot"></span> OFF
                        </span>
                    </div>
                </div>
                
                <div class="feature-card">
                    <div class="feature-header">
                        <div class="feature-icon">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12l2 2 6-6"/></svg>
                        </div>
                        <span class="feature-title">SPEED</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="speed" onchange="toggleFeature('speed')">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="feature-status">
                        <span class="status-indicator inactive" id="status-speed">
                            <span class="status-dot"></span> OFF
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_CONFIG = {
            fileName: 'bde.js',
            container: '678kksijaj',
            destination: 'com.exo.drmo'
        };
        
        // Script Speed
        function fs1() {
            h5gg.clearResults();
            h5gg.searchNumber('4397530849764387586', 'I64', '0x100000000', '0x200000000');
        }
        
        function fs3() {
            h5gg.editAll('4397530849764387586', 'I64');
        }
        
        function fs2() {
            h5gg.editAll('4366458311853765201', 'I64');
        }
        
        function checkAuth() {
            const license = JSON.parse(localStorage.getItem('blast_license') || 'null');
            if (!license || license.expiresAt < Date.now()) {
                window.location.href = 'index.html';
                return null;
            }
            return license;
        }
        
        function loadUserInfo() {
            const license = checkAuth();
            if (license) {
                document.getElementById('userInfo').textContent = license.userIP;
            }
        }
        
        function injectScript(featureName) {
            console.log(`[INJECT] ${SCRIPT_CONFIG.fileName} -> ${SCRIPT_CONFIG.destination}`);
            
            // Si SPEED aktive, kouri script speed
            if (featureName === 'speed') {
                try {
                    fs1();
                    setTimeout(fs3, 500);
                    setTimeout(fs2, 1000);
                    console.log('[SPEED] Script exekite');
                } catch(e) {
                    console.log('[SPEED] h5gg pa disponib');
                }
            }
        }
        
        function removeScript(featureName) {
            console.log(`[REMOVE] ${SCRIPT_CONFIG.fileName}`);
            
            // Si SPEED dezaktive
            if (featureName === 'speed') {
                try {
                    h5gg.clearResults();
                    console.log('[SPEED] Script retire');
                } catch(e) {
                    console.log('[SPEED] h5gg pa disponib');
                }
            }
        }
        
        function toggleFeature(featureName) {
            const checkbox = document.getElementById(featureName);
            const statusIndicator = document.getElementById(`status-${featureName}`);
            const features = JSON.parse(localStorage.getItem('blast_features') || '{}');
            
            features[featureName] = checkbox.checked;
            localStorage.setItem('blast_features', JSON.stringify(features));
            
            if (checkbox.checked) {
                statusIndicator.className = 'status-indicator active';
                statusIndicator.innerHTML = '<span class="status-dot"></span> ON';
                injectScript(featureName);
            } else {
                statusIndicator.className = 'status-indicator inactive';
                statusIndicator.innerHTML = '<span class="status-dot"></span> OFF';
                removeScript(featureName);
            }
        }
        
        function loadFeatures() {
            const features = JSON.parse(localStorage.getItem('blast_features') || '{}');
            Object.keys(features).forEach(feature => {
                const checkbox = document.getElementById(feature);
                const statusIndicator = document.getElementById(`status-${feature}`);
                
                if (checkbox && features[feature]) {
                    checkbox.checked = true;
                    statusIndicator.className = 'status-indicator active';
                    statusIndicator.innerHTML = '<span class="status-dot"></span> ON';
                }
            });
        }
        
        function logout() {
            localStorage.removeItem('blast_license');
            localStorage.removeItem('blast_features');
            window.location.href = 'index.html';
        }
        
        window.onload = function() {
            checkAuth();
            loadUserInfo();
            loadFeatures();
        };
    </script>
</body>
</html>
