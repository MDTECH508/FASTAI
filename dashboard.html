<!-- dashboard.html - Dashboard Konplè ak Script Saver pou Chak Feature -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BLAST PROXY - Dashboard</title>
    <style>
        :root {
            --bg-primary: #07070a;
            --bg-secondary: #101014;
            --text: #eef0f4;
            --text-secondary: #9aa1ae;
            --text-muted: #565b68;
            --accent: #8b93a6;
            --accent-2: #d7dce4;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.14);
            --success: #6bcf9a;
            --error: #ff8078;
            --warning: #fdcb6e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 80px;
        }

        /* Fond liquid glass */
        .liquid-bg {
            position: fixed; inset: 0; z-index: 0; overflow: hidden;
            background:
                radial-gradient(ellipse 90% 60% at 50% 0%, rgba(140,150,170,0.08), transparent 60%),
                linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
        }
        .liquid-orb {
            position: absolute; border-radius: 50%; filter: blur(110px); opacity: 0.3;
            animation: floatOrb 18s ease-in-out infinite;
        }
        .liquid-orb:nth-child(1) { width:400px; height:400px; background:radial-gradient(circle,#4b5262,transparent 70%); top:-100px; left:-80px; }
        .liquid-orb:nth-child(2) { width:350px; height:350px; background:radial-gradient(circle,#6e7688,transparent 70%); bottom:-60px; right:-50px; animation-delay:-6s; }
        @keyframes floatOrb {
            0%,100% { transform:translate3d(0,0,0) scale(1); }
            25% { transform:translate3d(90px,-70px,40px) scale(1.1); }
            50% { transform:translate3d(-70px,80px,-30px) scale(0.9); }
            75% { transform:translate3d(60px,50px,20px) scale(1.05); }
        }

        /* Navbar */
        .navbar {
            position: sticky; top: 0; z-index: 50;
            background: rgba(10,10,15,0.75);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 12px 16px;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .navbar-brand {
            font-size: 15px; font-weight: 800; letter-spacing: 2px;
            background: linear-gradient(135deg,#ffffff,var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .navbar-info { font-size: 10px; color: var(--text-secondary); }
        .logout-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            color: var(--accent-2); width: 34px; height: 34px; border-radius: 10px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .logout-btn:hover { background: var(--error); border-color: var(--error); color:#fff; }
        .logout-btn svg { width: 16px; height: 16px; }

        /* Dashboard */
        .dashboard {
            position: relative; z-index: 10;
            max-width: 560px; margin: 20px auto 0; padding: 0 14px;
        }

        /* Timer */
        .timer-card {
            background: var(--glass);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 18px; text-align: center; margin-bottom: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .timer-label { font-size: 10px; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        .timer-display { font-size: 26px; font-weight: 800; color: var(--success); font-variant-numeric: tabular-nums; }

        /* Section */
        .section {
            background: var(--glass);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 16px; margin-bottom: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .section-title {
            font-size: 12px; font-weight: 700; letter-spacing: 2px;
            text-align: center; margin-bottom: 14px; text-transform: uppercase;
            background: linear-gradient(135deg,#ffffff,var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .features-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 420px) { .features-grid { grid-template-columns: 1fr; } }

        .feature-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 12px;
            transition: all 0.25s;
        }
        .feature-card:hover { transform: translateY(-2px); border-color: rgba(180,190,205,0.35); }

        .feature-header { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
        .feature-icon {
            width: 30px; height: 30px; background: rgba(139,147,166,0.15);
            border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .feature-icon svg { width: 15px; height: 15px; stroke: var(--accent-2); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .feature-title { font-size: 11px; font-weight: 600; flex: 1; }

        /* Toggle */
        .toggle-switch { position: relative; width: 38px; height: 21px; flex-shrink: 0; }
        .toggle-switch input { display:none; }
        .toggle-slider {
            position:absolute; cursor:pointer; inset:0;
            background:#444; border-radius:21px; transition:0.3s;
        }
        .toggle-slider::before {
            content:""; position:absolute; height:15px; width:15px;
            left:3px; bottom:3px; background:#aaa; border-radius:50%; transition:0.3s;
        }
        .toggle-switch input:checked + .toggle-slider { background: var(--success); }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(17px); background:#fff; }

        .status-badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 8px; font-weight: 700; padding: 3px 7px; border-radius: 10px;
            margin-top: 8px;
        }
        .status-badge.active { color: var(--success); background: rgba(107,207,154,0.12); border: 1px solid rgba(107,207,154,0.3); }
        .status-badge.inactive { color: var(--text-muted); background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); }

        /* Spin bot (bouton pou ouvri modal script) */
        .spin-btn {
            width: 100%; margin-top: 8px; padding: 7px;
            background: rgba(139,147,166,0.1); border: 1px solid var(--glass-border);
            border-radius: 8px; color: var(--accent-2); font-size: 9px; font-weight: 600;
            cursor: pointer; letter-spacing: 1px; text-transform: uppercase;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .spin-btn:hover { background: rgba(139,147,166,0.2); }
        .spin-btn svg { width: 12px; height: 12px; animation: spin 2s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Modal Script */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
            display: none; align-items: center; justify-content: center; padding: 16px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: rgba(20,20,28,0.95);
            border: 1px solid var(--glass-border); border-radius: 18px;
            padding: 20px; width: 100%; max-width: 380px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }
        .modal-title { font-size: 14px; font-weight: 700; text-align: center; margin-bottom: 14px; }
        .modal-field { margin-bottom: 12px; }
        .modal-field label { display: block; font-size: 9px; color: var(--text-muted); margin-bottom: 5px; letter-spacing: 1px; }
        .modal-field input, .modal-field textarea {
            width: 100%; padding: 9px; background: rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border); border-radius: 9px;
            color: var(--text); font-size: 11px; font-family: 'Courier New', monospace;
        }
        .modal-field textarea { min-height: 80px; resize: vertical; }
        .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
        .modal-btn {
            flex: 1; padding: 10px; border-radius: 9px; font-size: 11px; font-weight: 700;
            cursor: pointer; letter-spacing: 1px; text-transform: uppercase; transition: all 0.2s;
        }
        .modal-btn.save { background: linear-gradient(150deg,#3d4250,#1a1c22); color: var(--accent-2); border: 1px solid var(--glass-border); }
        .modal-btn.cancel { background: rgba(255,255,255,0.05); color: var(--text-secondary); border: 1px solid var(--glass-border); }

        /* Toast */
        .toast {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(10,10,15,0.9); backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 12px;
            padding: 10px 20px; font-size: 11px; font-weight: 600; z-index: 300;
            display: none; white-space: nowrap;
        }
        .toast.show { display: block; animation: toastIn 0.3s ease; }
        .toast.success { border-color: var(--success); color: var(--success); }
        .toast.error { border-color: var(--error); color: var(--error); }
        @keyframes toastIn { from { transform: translateX(-50%) translateY(20px); opacity:0; } to { transform: translateX(-50%) translateY(0); opacity:1; } }
    </style>
</head>
<body>
    <div class="liquid-bg">
        <div class="liquid-orb"></div>
        <div class="liquid-orb"></div>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-brand">BLAST PROXY</div>
        <div class="navbar-info" id="userInfo">--</div>
        <button class="logout-btn" onclick="logout()" title="Déconnexion">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
        </button>
    </nav>

    <div class="dashboard">
        <!-- Timer -->
        <div class="timer-card">
            <div class="timer-label">Temps restant</div>
            <div class="timer-display" id="timerDisplay">--</div>
        </div>

        <!-- iOS OPTIONS -->
        <div class="section">
            <div class="section-title">iOS Options</div>
            <div class="features-grid" id="iosOptionsGrid">
                <!-- Jenere dynamikman -->
            </div>
        </div>

        <!-- HOLO iOS -->
        <div class="section">
            <div class="section-title">Hologram iOS</div>
            <div class="features-grid" id="holoIosGrid">
                <!-- Jenere dynamikman -->
            </div>
        </div>

        <!-- MOST FEATURES -->
        <div class="section">
            <div class="section-title">Most Features</div>
            <div class="features-grid" id="mostFeaturesGrid">
                <!-- Jenere dynamikman -->
            </div>
        </div>
    </div>

    <!-- Modal pou antre script -->
    <div class="modal-overlay" id="scriptModal">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">Script</div>
            <div class="modal-field">
                <label>NOM DU FICHIER</label>
                <input type="text" id="scriptName" placeholder="ex: demo.lua">
            </div>
            <div class="modal-field">
                <label>DOSSIER PATCH</label>
                <input type="text" id="patchFolder" placeholder="ex: Aim Drag">
            </div>
            <div class="modal-field">
                <label>CONTENU DU SCRIPT</label>
                <textarea id="scriptContent" placeholder="-- Entrez le script ici..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeModal()">Annuler</button>
                <button class="modal-btn save" onclick="saveScript()">💾 Sauvegarder</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // =============================================
        // KONFIGIRASYON FEATURES
        // =============================================
        const FEATURES_CONFIG = {
            iosOptions: [
                { id: 'iosAimBody', name: 'Aim Body', icon: 'crosshair', risk: true },
                { id: 'iosAimChest', name: 'Aim Chest', icon: 'crosshair' },
                { id: 'iosAimMagic', name: 'Aim Magic', icon: 'crosshair' },
                { id: 'iosAimNeck', name: 'Aim Neck', icon: 'crosshair' },
                { id: 'iosAimDrag', name: 'Aim Drag', icon: 'crosshair' }
            ],
            holoIos: [
                { id: 'holoIos', name: 'Holo iOS', icon: 'layers' }
            ],
            mostFeatures: [
                { id: 'backJump', name: 'Back Jump', icon: 'zap' },
                { id: 'swapFast', name: 'Swap Fast', icon: 'box' },
                { id: 'speed', name: 'Speed', icon: 'check' },
                { id: 'bypass', name: 'Bypass', icon: 'shield' },
                { id: 'bypassTh', name: 'Bypass TH', icon: 'shield' }
            ]
        };

        const ICONS = {
            crosshair: '<circle cx="12" cy="12" r="8"/><line x1="12" y1="1" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="1" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="23" y2="12"/>',
            layers: '<path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>',
            zap: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',
            box: '<path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/><path d="M12 22.08V12"/>',
            check: '<circle cx="12" cy="12" r="10"/><path d="M8 12l2 2 6-6"/>',
            shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'
        };

        let currentFeatureId = null;

        // =============================================
        // RENDER FEATURES
        // =============================================
        function renderFeatures() {
            renderFeatureGroup('iosOptionsGrid', FEATURES_CONFIG.iosOptions);
            renderFeatureGroup('holoIosGrid', FEATURES_CONFIG.holoIos);
            renderFeatureGroup('mostFeaturesGrid', FEATURES_CONFIG.mostFeatures);
            loadSavedFeatures();
        }

        function renderFeatureGroup(containerId, features) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            features.forEach(feature => {
                const card = document.createElement('div');
                card.className = 'feature-card';
                card.innerHTML = `
                    <div class="feature-header">
                        <div class="feature-icon">
                            <svg viewBox="0 0 24 24">${ICONS[feature.icon] || ICONS.crosshair}</svg>
                        </div>
                        <span class="feature-title">${feature.name}</span>
                        ${feature.risk ? '<span style="font-size:8px;color:#fdcb6e;">⚠</span>' : ''}
                        <label class="toggle-switch">
                            <input type="checkbox" id="${feature.id}" onchange="toggleFeature('${feature.id}')">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <span class="status-badge inactive" id="status-${feature.id}">OFF</span>
                    <button class="spin-btn" onclick="openModal('${feature.id}', '${feature.name}')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
                        Script
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // =============================================
        // TOGGLE FEATURE
        // =============================================
        function toggleFeature(featureId) {
            const checkbox = document.getElementById(featureId);
            const badge = document.getElementById(`status-${featureId}`);
            const features = JSON.parse(localStorage.getItem('blast_features') || '{}');
            
            features[featureId] = checkbox.checked;
            localStorage.setItem('blast_features', JSON.stringify(features));
            
            if (checkbox.checked) {
                badge.className = 'status-badge active';
                badge.textContent = 'ON';
                showToast(`${featureId.toUpperCase()} ACTIVE`, 'success');
            } else {
                badge.className = 'status-badge inactive';
                badge.textContent = 'OFF';
                showToast(`${featureId.toUpperCase()} OFF`, 'error');
            }
        }

        function loadSavedFeatures() {
            const features = JSON.parse(localStorage.getItem('blast_features') || '{}');
            Object.keys(features).forEach(id => {
                const checkbox = document.getElementById(id);
                const badge = document.getElementById(`status-${id}`);
                if (checkbox && features[id]) {
                    checkbox.checked = true;
                    badge.className = 'status-badge active';
                    badge.textContent = 'ON';
                }
            });
        }

        // =============================================
        // MODAL SCRIPT
        // =============================================
        function openModal(featureId, featureName) {
            currentFeatureId = featureId;
            document.getElementById('modalTitle').textContent = `Script - ${featureName}`;
            document.getElementById('scriptName').value = `${featureId}.lua`;
            document.getElementById('patchFolder').value = 'Aim Drag';
            document.getElementById('scriptContent').value = '';
            document.getElementById('scriptModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('scriptModal').classList.remove('show');
        }

        // =============================================
        // SAVE SCRIPT (API)
        // =============================================
        async function saveScript() {
            const scriptName = document.getElementById('scriptName').value;
            const scriptContent = document.getElementById('scriptContent').value;
            const patchFolder = document.getElementById('patchFolder').value;
            
            if (!scriptName || !scriptContent || !patchFolder) {
                showToast('Remplissez tous les champs', 'error');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8080/api/save-script', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        script_name: scriptName,
                        script_content: scriptContent,
                        patch_folder: patchFolder,
                        feature_id: currentFeatureId
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('SCRIPT SAUVEGARDÉ', 'success');
                    closeModal();
                } else {
                    showToast('Erreur sauvegarde', 'error');
                }
            } catch (error) {
                // Si API pa disponib, sove lokalman
                const savedScripts = JSON.parse(localStorage.getItem('blast_scripts') || '{}');
                savedScripts[currentFeatureId] = {
                    name: scriptName,
                    content: scriptContent,
                    folder: patchFolder
                };
                localStorage.setItem('blast_scripts', JSON.stringify(savedScripts));
                showToast('SAUVEGARDÉ LOCALEMENT', 'success');
                closeModal();
            }
        }

        // =============================================
        // TOAST
        // =============================================
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + (type === 'success' ? 'success' : 'error');
            setTimeout(() => { toast.className = 'toast'; }, 2000);
        }

        // =============================================
        // TIMER
        // =============================================
        function startTimer() {
            const lic = JSON.parse(localStorage.getItem('blast_license') || 'null');
            if (!lic || !lic.expiresAt) { window.location.href = 'index.html'; return; }
            
            const timerDisplay = document.getElementById('timerDisplay');
            
            function update() {
                const remaining = lic.expiresAt - Date.now();
                if (remaining <= 0) {
                    timerDisplay.textContent = 'EXPIRÉ';
                    localStorage.removeItem('blast_license');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                    return;
                }
                const days = Math.floor(remaining / 86400000);
                const hours = Math.floor((remaining % 86400000) / 3600000);
                const mins = Math.floor((remaining % 3600000) / 60000);
                const secs = Math.floor((remaining % 60000) / 1000);
                timerDisplay.textContent = `${days}j ${hours}h ${mins}m ${secs}s`;
            }
            
            update();
            setInterval(update, 1000);
        }

        // =============================================
        // LOGOUT
        // =============================================
        function logout() {
            localStorage.removeItem('blast_license');
            localStorage.removeItem('blast_features');
            window.location.href = 'index.html';
        }

        // =============================================
        // INIT
        // =============================================
        const lic = JSON.parse(localStorage.getItem('blast_license') || 'null');
        if (!lic || lic.expiresAt < Date.now()) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('userInfo').textContent = `${lic.ip} · ${new Date(lic.expiresAt).toLocaleDateString('fr-FR')}`;
            renderFeatures();
            startTimer();
        }
    </script>
</body>
</html>
