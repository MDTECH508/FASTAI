<!-- dashboard.html - Menu Page avec Vérification Auth -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLAST PROXY - Menu</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --text: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #666680;
            --accent: #6c5ce7;
            --accent-secondary: #a29bfe;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --success: #00b894;
            --error: #ff7675;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
        }
        
        .navbar {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .navbar-brand {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .user-info {
            background: var(--glass);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .logout-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .logout-btn:hover {
            background: var(--error);
            border-color: var(--error);
            color: white;
        }
        
        .dashboard {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        
        .hologram-section {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .hologram-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .feature-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s;
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            border-color: rgba(108, 92, 231, 0.3);
        }
        
        .feature-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .feature-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), rgba(162, 155, 254, 0.2));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-right: 15px;
        }
        
        .feature-title {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 20px;
            transition: all 0.3s;
        }
        
        .status-indicator.active {
            color: var(--success);
            background: rgba(0, 184, 148, 0.1);
            border: 1px solid var(--success);
        }
        
        .status-indicator.inactive {
            color: var(--error);
            background: rgba(255, 118, 117, 0.1);
            border: 1px solid var(--error);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: dotPulse 1.5s infinite;
        }
        
        .status-indicator.active .status-dot {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }
        
        .status-indicator.inactive .status-dot {
            background: var(--error);
            box-shadow: 0 0 10px var(--error);
        }
        
        @keyframes dotPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.5); }
        }
        
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #444;
            transition: .4s;
            border-radius: 34px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: #888;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: var(--success);
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(24px);
            background-color: white;
        }
        
        .feature-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">BLAST PROXY</div>
        <div class="user-info" id="userInfo">Chargement...</div>
        <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </nav>
    
    <div class="dashboard">
        <div class="hologram-section">
            <h2 class="hologram-title">HOLOGRAM V1</h2>
            
            <div class="features-grid">
                <div class="feature-card" id="card-aimChest">
                    <div class="feature-header">
                        <div class="feature-icon">🎯</div>
                        <span class="feature-title">AIM CHEST</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="aimChest" onchange="toggleFeature('aimChest')">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="feature-status">
                        <span class="status-indicator inactive" id="status-aimChest">
                            <span class="status-dot"></span>
                            OFFLINE
                        </span>
                    </div>
                </div>
                
                <div class="feature-card" id="card-bypass">
                    <div class="feature-header">
                        <div class="feature-icon">🛡️</div>
                        <span class="feature-title">BYPASS</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="bypass" onchange="toggleFeature('bypass')">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="feature-status">
                        <span class="status-indicator inactive" id="status-bypass">
                            <span class="status-dot"></span>
                            OFFLINE
                        </span>
                    </div>
                </div>
                
                <div class="feature-card" id="card-boostFps">
                    <div class="feature-header">
                        <div class="feature-icon">⚡</div>
                        <span class="feature-title">BOOST FPS</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="boostFps" onchange="toggleFeature('boostFps')">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="feature-status">
                        <span class="status-indicator inactive" id="status-boostFps">
                            <span class="status-dot"></span>
                            OFFLINE
                        </span>
                    </div>
                </div>
                
                <div class="feature-card" id="card-speed">
                    <div class="feature-header">
                        <div class="feature-icon">🚀</div>
                        <span class="feature-title">SPEED</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="speed" onchange="toggleFeature('speed')">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="feature-status">
                        <span class="status-indicator inactive" id="status-speed">
                            <span class="status-dot"></span>
                            OFFLINE
                        </span>
                    </div>
                </div>
                
                <div class="feature-card" id="card-swap">
                    <div class="feature-header">
                        <div class="feature-icon">🔄</div>
                        <span class="feature-title">SWAP</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="swap" onchange="toggleFeature('swap')">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="feature-status">
                        <span class="status-indicator inactive" id="status-swap">
                            <span class="status-dot"></span>
                            OFFLINE
                        </span>
                    </div>
                </div>
                
                <div class="feature-card" id="card-speedBoost">
                    <div class="feature-header">
                        <div class="feature-icon">🏃</div>
                        <span class="feature-title">SPEED BOOST</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="speedBoost" onchange="toggleFeature('speedBoost')">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="feature-status">
                        <span class="status-indicator inactive" id="status-speedBoost">
                            <span class="status-dot"></span>
                            OFFLINE
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Vérifier l'authentification
        function checkAuth() {
            const license = JSON.parse(localStorage.getItem('blast_license') || 'null');
            if (!license || license.expiresAt < Date.now()) {
                // REDIRECTION VERS INDEX.HTML SI PAS AUTHENTIFIÉ
                window.location.href = 'index.html';
                return null;
            }
            return license;
        }
        
        function loadUserInfo() {
            const license = checkAuth();
            if (license) {
                const userInfo = document.getElementById('userInfo');
                userInfo.innerHTML = `
                    <strong>IP:</strong> ${license.userIP}<br>
                    <strong>Expire:</strong> ${new Date(license.expiresAt).toLocaleDateString('fr-FR')}
                `;
            }
        }
        
        function toggleFeature(featureName) {
            const checkbox = document.getElementById(featureName);
            const statusIndicator = document.getElementById(`status-${featureName}`);
            const features = JSON.parse(localStorage.getItem('blast_features') || '{}');
            
            features[featureName] = checkbox.checked;
            localStorage.setItem('blast_features', JSON.stringify(features));
            
            if (checkbox.checked) {
                statusIndicator.className = 'status-indicator active';
                statusIndicator.innerHTML = '<span class="status-dot"></span> ACTIVE';
            } else {
                statusIndicator.className = 'status-indicator inactive';
                statusIndicator.innerHTML = '<span class="status-dot"></span> OFFLINE';
            }
        }
        
        function loadFeatures() {
            const features = JSON.parse(localStorage.getItem('blast_features') || '{}');
            Object.keys(features).forEach(feature => {
                const checkbox = document.getElementById(feature);
                const statusIndicator = document.getElementById(`status-${feature}`);
                
                if (checkbox && features[feature]) {
                    checkbox.checked = true;
                    statusIndicator.className = 'status-indicator active';
                    statusIndicator.innerHTML = '<span class="status-dot"></span> ACTIVE';
                }
            });
        }
        
        function logout() {
            localStorage.removeItem('blast_license');
            localStorage.removeItem('blast_features');
            // REDIRECTION VERS INDEX.HTML
            window.location.href = 'index.html';
        }
        
        window.onload = function() {
            checkAuth();
            loadUserInfo();
            loadFeatures();
        };
    </script>
</body>
  </html>
