<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLAST PROXY - Menu</title>
    <style>
        body { background:#0a0a0f; color:#fff; font-family:system-ui, sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
        .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12); border-radius:18px; padding:30px; max-width:400px; width:90%; text-align:center; }
        h1 { font-size:22px; margin-bottom:20px; }
        .info { margin:10px 0; color:#9aa1ae; font-size:14px; }
        button { padding:12px 30px; background:#2a2e38; color:#d7dce4; border:1px solid #444; border-radius:10px; cursor:pointer; margin-top:20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>BLAST PROXY</h1>
        <div class="info" id="licenseInfo"></div>
        <button onclick="logout()">Déconnexion</button>
    </div>

    <script>
        const lic = JSON.parse(localStorage.getItem('blast_license') || 'null');
        if (!lic || lic.expiresAt < Date.now()) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('licenseInfo').innerHTML = `
                <p>IP : ${lic.ip}</p>
                <p>Expire le : ${new Date(lic.expiresAt).toLocaleString('fr-FR')}</p>
            `;
        }

        function logout() {
            localStorage.removeItem('blast_license');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
