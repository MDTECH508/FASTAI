<!-- index.html - Login Page avec Redirection vers dashboard.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLAST PROXY - Activation</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --text: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #666680;
            --accent: #6c5ce7;
            --accent-secondary: #a29bfe;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --success: #00b894;
            --error: #ff7675;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        
        .liquid-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            animation: floatOrb 15s infinite;
        }
        
        .liquid-orb:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #6c5ce7, transparent);
            top: -100px;
            left: -100px;
        }
        
        .liquid-orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #a29bfe, transparent);
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }
        
        .liquid-orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #00b894, transparent);
            top: 50%;
            left: 50%;
            animation-delay: -10s;
        }
        
        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(150px, -100px) scale(1.2); }
            50% { transform: translate(-100px, 150px) scale(0.8); }
            75% { transform: translate(100px, 100px) scale(1.1); }
        }
        
        .login-container {
            position: relative;
            z-index: 10;
            background: var(--glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: containerAppear 0.8s ease;
        }
        
        @keyframes containerAppear {
            from { transform: translateY(50px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        
        .logo {
            text-align: center;
            margin-bottom: 35px;
        }
        
        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
            box-shadow: 0 15px 40px rgba(108, 92, 231, 0.4);
        }
        
        .logo-icon svg {
            width: 32px;
            height: 32px;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .logo h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .logo p {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 13px;
        }
        
        .input-group {
            position: relative;
            margin: 30px 0;
        }
        
        .input-group input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(108, 92, 231, 0.3);
            border-radius: 15px;
            color: var(--text);
            font-size: 16px;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(108, 92, 231, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .input-group input::placeholder {
            color: var(--text-muted);
        }
        
        .input-group label {
            position: absolute;
            left: 15px;
            top: -12px;
            background: var(--bg-primary);
            padding: 0 10px;
            color: var(--accent-secondary);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        .btn-activate {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }
        
        .btn-activate:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(108, 92, 231, 0.4);
        }
        
        .btn-activate:active {
            transform: translateY(0);
        }
        
        .btn-activate:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            display: none;
            font-size: 14px;
        }
        
        .status-message.success {
            display: block;
            background: rgba(0, 184, 148, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }
        
        .status-message.error {
            display: block;
            background: rgba(255, 118, 117, 0.1);
            color: var(--error);
            border: 1px solid var(--error);
        }
        
        .status-message.loading {
            display: block;
            background: rgba(108, 92, 231, 0.1);
            color: var(--accent-secondary);
            border: 1px solid var(--accent);
        }
        
        .powered-by {
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 11px;
            letter-spacing: 1px;
        }
        
        .powered-by strong {
            color: var(--accent-secondary);
        }
        
        @media (max-width: 480px) {
            .login-container {
                padding: 35px 25px;
                margin: 20px;
                border-radius: 25px;
            }
            
            .logo h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="liquid-bg">
        <div class="liquid-orb"></div>
        <div class="liquid-orb"></div>
        <div class="liquid-orb"></div>
    </div>
    
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
            </div>
            <h1>BLAST PROXY</h1>
            <p>Système d'Activation Premium</p>
        </div>
        
        <div class="input-group">
            <label>CLÉ DE LICENCE</label>
            <input type="text" id="licenseInput" placeholder="Entrez votre clé de licence..." maxlength="50" autocomplete="off">
        </div>
        
        <button class="btn-activate" id="activateBtn" onclick="activateLicense()">
            Activer
        </button>
        
        <div class="status-message" id="statusMessage"></div>
        
        <div class="powered-by">
            Powered by <strong>BLAST PROXY SAFE</strong>
        </div>
    </div>

    <script>
        // 50 Clés valides (cachées - admin only)
        const VALID_LICENSES = [
            // 20 Clés de 1 Jour
            { key: 'BLAST-1D-AAAA1-BBBB1-CCCC1', duration: 1 },
            { key: 'BLAST-1D-AAAA2-BBBB2-CCCC2', duration: 1 },
            { key: 'BLAST-1D-AAAA3-BBBB3-CCCC3', duration: 1 },
            { key: 'BLAST-1D-AAAA4-BBBB4-CCCC4', duration: 1 },
            { key: 'BLAST-1D-AAAA5-BBBB5-CCCC5', duration: 1 },
            { key: 'BLAST-1D-AAAA6-BBBB6-CCCC6', duration: 1 },
            { key: 'BLAST-1D-AAAA7-BBBB7-CCCC7', duration: 1 },
            { key: 'BLAST-1D-AAAA8-BBBB8-CCCC8', duration: 1 },
            { key: 'BLAST-1D-AAAA9-BBBB9-CCCC9', duration: 1 },
            { key: 'BLAST-1D-AAAA0-BBBB0-CCCC0', duration: 1 },
            { key: 'BLAST-1D-DDDD1-EEEE1-FFFF1', duration: 1 },
            { key: 'BLAST-1D-DDDD2-EEEE2-FFFF2', duration: 1 },
            { key: 'BLAST-1D-DDDD3-EEEE3-FFFF3', duration: 1 },
            { key: 'BLAST-1D-DDDD4-EEEE4-FFFF4', duration: 1 },
            { key: 'BLAST-1D-DDDD5-EEEE5-FFFF5', duration: 1 },
            { key: 'BLAST-1D-DDDD6-EEEE6-FFFF6', duration: 1 },
            { key: 'BLAST-1D-DDDD7-EEEE7-FFFF7', duration: 1 },
            { key: 'BLAST-1D-DDDD8-EEEE8-FFFF8', duration: 1 },
            { key: 'BLAST-1D-DDDD9-EEEE9-FFFF9', duration: 1 },
            { key: 'BLAST-1D-DDDD0-EEEE0-FFFF0', duration: 1 },
            
            // 20 Clés de 7 Jours
            { key: 'BLAST-7D-GGGG1-HHHH1-IIII1', duration: 7 },
            { key: 'BLAST-7D-GGGG2-HHHH2-IIII2', duration: 7 },
            { key: 'BLAST-7D-GGGG3-HHHH3-IIII3', duration: 7 },
            { key: 'BLAST-7D-GGGG4-HHHH4-IIII4', duration: 7 },
            { key: 'BLAST-7D-GGGG5-HHHH5-IIII5', duration: 7 },
            { key: 'BLAST-7D-GGGG6-HHHH6-IIII6', duration: 7 },
            { key: 'BLAST-7D-GGGG7-HHHH7-IIII7', duration: 7 },
            { key: 'BLAST-7D-GGGG8-HHHH8-IIII8', duration: 7 },
            { key: 'BLAST-7D-GGGG9-HHHH9-IIII9', duration: 7 },
            { key: 'BLAST-7D-GGGG0-HHHH0-IIII0', duration: 7 },
            { key: 'BLAST-7D-JJJJ1-KKKK1-LLLL1', duration: 7 },
            { key: 'BLAST-7D-JJJJ2-KKKK2-LLLL2', duration: 7 },
            { key: 'BLAST-7D-JJJJ3-KKKK3-LLLL3', duration: 7 },
            { key: 'BLAST-7D-JJJJ4-KKKK4-LLLL4', duration: 7 },
            { key: 'BLAST-7D-JJJJ5-KKKK5-LLLL5', duration: 7 },
            { key: 'BLAST-7D-JJJJ6-KKKK6-LLLL6', duration: 7 },
            { key: 'BLAST-7D-JJJJ7-KKKK7-LLLL7', duration: 7 },
            { key: 'BLAST-7D-JJJJ8-KKKK8-LLLL8', duration: 7 },
            { key: 'BLAST-7D-JJJJ9-KKKK9-LLLL9', duration: 7 },
            { key: 'BLAST-7D-JJJJ0-KKKK0-LLLL0', duration: 7 },
            
            // 10 Clés de 30 Jours
            { key: 'BLAST-30D-MMMM1-NNNN1-OOOO1', duration: 30 },
            { key: 'BLAST-30D-MMMM2-NNNN2-OOOO2', duration: 30 },
            { key: 'BLAST-30D-MMMM3-NNNN3-OOOO3', duration: 30 },
            { key: 'BLAST-30D-MMMM4-NNNN4-OOOO4', duration: 30 },
            { key: 'BLAST-30D-MMMM5-NNNN5-OOOO5', duration: 30 },
            { key: 'BLAST-30D-PPPP1-QQQQ1-RRRR1', duration: 30 },
            { key: 'BLAST-30D-PPPP2-QQQQ2-RRRR2', duration: 30 },
            { key: 'BLAST-30D-PPPP3-QQQQ3-RRRR3', duration: 30 },
            { key: 'BLAST-30D-PPPP4-QQQQ4-RRRR4', duration: 30 },
            { key: 'BLAST-30D-PPPP5-QQQQ5-RRRR5', duration: 30 }
        ];
        
        // Clés déjà utilisées avec IP
        let usedLicenses = JSON.parse(localStorage.getItem('blast_used_licenses') || '{}');
        
        // Détecter l'IP automatiquement
        async function detectUserIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return 'Unknown';
            }
        }
        
        // Activer la licence
        async function activateLicense() {
            const licenseKey = document.getElementById('licenseInput').value.trim();
            const statusMessage = document.getElementById('statusMessage');
            const activateBtn = document.getElementById('activateBtn');
            
            if (!licenseKey) {
                showStatus('Veuillez entrer votre clé de licence', 'error');
                return;
            }
            
            // Détecter IP
            const userIP = await detectUserIP();
            
            // Vérifier la clé
            const license = VALID_LICENSES.find(l => l.key === licenseKey);
            
            if (!license) {
                showStatus('Clé invalide', 'error');
                return;
            }
            
            // Vérifier si déjà utilisée
            if (usedLicenses[licenseKey]) {
                const used = usedLicenses[licenseKey];
                
                if (used.ip !== userIP) {
                    showStatus('Cette clé est liée à une autre IP', 'error');
                    return;
                }
                
                if (used.expiresAt > Date.now()) {
                    showStatus('Licence active! Redirection...', 'success');
                    
                    localStorage.setItem('blast_license', JSON.stringify({
                        key: licenseKey,
                        userIP: userIP,
                        duration: used.duration,
                        activatedAt: used.activatedAt,
                        expiresAt: used.expiresAt,
                        sessionId: 'SESSION-' + Math.random().toString(36).substr(2, 9).toUpperCase()
                    }));
                    
                    // REDIRECTION VERS DASHBOARD.HTML
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                    return;
                } else {
                    showStatus('Cette clé a expiré', 'error');
                    return;
                }
            }
            
            // Validation en cours
            showStatus('Validation en cours...', 'loading');
            activateBtn.disabled = true;
            
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            const expiresAt = Date.now() + license.duration * 24 * 60 * 60 * 1000;
            
            // Enregistrer
            usedLicenses[licenseKey] = {
                ip: userIP,
                duration: license.duration,
                activatedAt: Date.now(),
                expiresAt: expiresAt
            };
            
            localStorage.setItem('blast_used_licenses', JSON.stringify(usedLicenses));
            
            showStatus('Licence valide! Redirection...', 'success');
            
            localStorage.setItem('blast_license', JSON.stringify({
                key: licenseKey,
                userIP: userIP,
                duration: license.duration,
                activatedAt: Date.now(),
                expiresAt: expiresAt,
                sessionId: 'SESSION-' + Math.random().toString(36).substr(2, 9).toUpperCase()
            }));
            
            // REDIRECTION VERS DASHBOARD.HTML
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);
        }
        
        function showStatus(message, type) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.textContent = message;
            statusMessage.className = 'status-message ' + type;
        }
        
        // Vérifier licence existante
        window.onload = function() {
            const savedLicense = localStorage.getItem('blast_license');
            if (savedLicense) {
                const license = JSON.parse(savedLicense);
                if (license.expiresAt > Date.now()) {
                    // REDIRECTION DIRECTE VERS DASHBOARD
                    window.location.href = 'dashboard.html';
                }
            }
        };
        
        // Touche Entrée
        document.getElementById('licenseInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                activateLicense();
            }
        });
    </script>
</body>
</html>
