<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>NET PLUS 5G LTE</title>
<style>
:root{
  --bg:#0a0a0b; --ink:#f2f2f3; --mute:#9d9da4; --line:rgba(255,255,255,.14);
  --glass:rgba(255,255,255,.055); --glass-hi:rgba(255,255,255,.11);
  --steel:#cacace; --ok:#8fd19e; --soon:#e3c77a;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px;-webkit-text-size-adjust:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh;overflow-x:hidden}
a{color:inherit}
img,svg{max-width:100%}
.wrap{width:100%;max-width:1160px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}

/* Fon */
.bg{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(60% 50% at 12% 8%,#3c3c42 0%,transparent 60%),
  radial-gradient(50% 45% at 92% 28%,#2c2c31 0%,transparent 62%),
  radial-gradient(55% 50% at 50% 100%,#35353b 0%,transparent 60%),
  linear-gradient(180deg,#0a0a0b,#131315)}
.bg::after{content:"";position:absolute;inset:0;opacity:.07;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent);mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent)}

/* Liquid glass */
.glass{position:relative;
  background:linear-gradient(145deg,var(--glass-hi),var(--glass) 45%,rgba(255,255,255,.03));
  border:1px solid var(--line);border-radius:var(--r-lg);
  -webkit-backdrop-filter:blur(26px) saturate(170%) brightness(1.05);backdrop-filter:blur(26px) saturate(170%) brightness(1.05);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 0 30px rgba(255,255,255,.04),0 18px 50px rgba(0,0,0,.55)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 70%,rgba(255,255,255,.08) 100%);
  mix-blend-mode:screen;opacity:.7}

/* Header */
header{position:sticky;top:0;z-index:40;padding:12px 0}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px 8px 18px;border-radius:999px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.02em;text-decoration:none;white-space:nowrap}
.logo svg{width:26px;height:26px;flex:none}
.logo small{color:var(--mute);font-weight:600}
.menu{display:flex;gap:2px;list-style:none}
.menu a{display:block;padding:9px 14px;border-radius:999px;text-decoration:none;color:var(--mute);font-size:.92rem;transition:.2s}
.menu a:hover{color:var(--ink);background:rgba(255,255,255,.08)}
.tools{display:flex;align-items:center;gap:8px}
.lang{display:flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.lang button{border:0;background:transparent;color:var(--mute);font:inherit;font-size:.8rem;font-weight:700;padding:6px 10px;border-radius:999px;cursor:pointer;min-height:30px}
.lang button[aria-pressed="true"]{background:#fff;color:#111}

/* Bouton */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:12px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.28);
  font:inherit;font-weight:700;cursor:pointer;color:#0b0b0c;text-decoration:none;text-align:center;
  background:linear-gradient(180deg,#fafafa,#b9b9bf);box-shadow:inset 0 1px 0 #fff,0 8px 24px rgba(0,0,0,.45);transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{color:var(--ink);background:rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.btn.sm{min-height:40px;padding:9px 16px;font-size:.92rem}
.btn.block{width:100%}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* Hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center;padding:48px 0 30px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:.85rem;color:var(--steel)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);flex:none}
h1{font-size:clamp(2.1rem,5.6vw,4.2rem);line-height:1.04;letter-spacing:-.03em;margin:20px 0 16px;font-weight:800;
  background:linear-gradient(180deg,#fff 30%,#8c8c93);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--mute);font-size:1.08rem;max-width:50ch}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.stats{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:12px 32px;margin-top:32px}
.stats b{display:block;font-size:1.45rem;line-height:1.2}
.stats span{color:var(--mute);font-size:.86rem}

/* Portail */
.portal{padding:26px}
.portal h2{font-size:1.3rem;margin-bottom:4px}
.sub{color:var(--mute);font-size:.92rem}
label{display:block;font-size:.85rem;color:var(--steel);margin:14px 0 6px}
input,select,textarea{width:100%;padding:13px 16px;min-height:48px;border-radius:var(--r-sm);font:inherit;font-size:16px;color:var(--ink);
  background:rgba(0,0,0,.35);border:1px solid var(--line);box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
textarea{resize:vertical;min-height:84px}
input::placeholder,textarea::placeholder{color:#70707a}
select option{background:#1a1a1d}
.portal .btn{margin-top:18px}
.links{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:.88rem;flex-wrap:wrap}
.links a{color:var(--mute)}.links a:hover{color:#fff}
.note{margin-top:12px;padding:10px 14px;border-radius:var(--r-sm);background:rgba(143,209,158,.12);border:1px solid rgba(143,209,158,.4);font-size:.9rem}
.err{display:none;margin-top:12px;padding:10px 14px;border-radius:var(--r-sm);background:rgba(255,120,120,.12);border:1px solid rgba(255,120,120,.35);font-size:.9rem}

/* Seksyon */
section{padding:58px 0}
.sec-head{max-width:640px;margin-bottom:28px}
.sec-head h2{font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-.02em;line-height:1.12}
.sec-head p{color:var(--mute);margin-top:10px}

/* Boutik: tab */
.tabs{display:inline-flex;padding:4px;border-radius:999px;margin-bottom:24px;max-width:100%}
.tabs button{border:0;background:transparent;color:var(--mute);font:inherit;font-weight:700;padding:11px 22px;border-radius:999px;cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{background:#fff;color:#111}

/* Plan */
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}
.plan{padding:24px;display:flex;flex-direction:column;gap:8px;transition:transform .25s}
.plan:hover{transform:translateY(-4px)}
.plan.pop{background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.07) 50%,rgba(255,255,255,.04));border-color:rgba(255,255,255,.35)}
.tag{align-self:flex-start;font-size:.75rem;padding:4px 10px;border-radius:999px;background:#fff;color:#111;font-weight:700}
.plan h3{font-size:1rem;color:var(--steel);font-weight:600}
.plan .mb{font-size:2.3rem;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.plan .mb small{font-size:1rem;color:var(--mute);font-weight:600;margin-left:4px}
.plan .price{font-size:1.2rem;font-weight:700}
.plan ul{list-style:none;color:var(--mute);font-size:.9rem;margin:6px 0 14px;flex:1}
.plan li{padding:6px 0;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}

/* Rezidansyèl */
.home{display:grid;grid-template-columns:1.1fr .9fr;gap:0;overflow:hidden}
.home .l{padding:32px}
.home .r{padding:32px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:16px}
.home h3{font-size:1.6rem;letter-spacing:-.02em;margin-bottom:6px}
.big{font-size:clamp(2.2rem,5vw,3.2rem);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.big small{font-size:1rem;color:var(--mute);font-weight:600}
.feat{list-style:none;margin:18px 0 22px}
.feat li{padding:9px 0 9px 28px;border-top:1px solid var(--line);position:relative;color:var(--steel)}
.feat li::before{content:"";position:absolute;left:4px;top:16px;width:12px;height:7px;border-left:2px solid var(--ok);border-bottom:2px solid var(--ok);transform:rotate(-45deg)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.row span{color:var(--mute)}
.row b{font-size:1.25rem;text-align:right}

/* Komand */
.order{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.order>.glass{padding:26px}
.summary{margin-top:18px;padding:16px;border-radius:var(--r-md);background:rgba(0,0,0,.3);border:1px solid var(--line);font-size:.95rem}
.summary b{font-size:1.1rem}
.oid{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-weight:700;letter-spacing:.06em}
.contactline{margin-top:16px;font-size:.88rem;color:var(--mute);overflow-wrap:anywhere}
.contactline a{color:var(--steel)}
.steps{list-style:none;counter-reset:s;display:grid;gap:14px}
.steps li{counter-increment:s;display:grid;grid-template-columns:38px 1fr;gap:14px;align-items:start}
.steps li::before{content:counter(s);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.steps strong{display:block}.steps span{color:var(--mute);font-size:.92rem}

/* Kouvèti */
.cov-tools{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--mute);font:inherit;font-size:.9rem;font-weight:600;padding:9px 16px;border-radius:999px;cursor:pointer;min-height:42px}
.chips button[aria-pressed="true"]{background:#fff;color:#111;border-color:#fff}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.zone{padding:16px 18px;border-radius:var(--r-md);display:flex;justify-content:space-between;align-items:center;gap:12px}
.zone b{display:block}.zone span.d{color:var(--mute);font-size:.85rem}
.pill{font-size:.78rem;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap;border:1px solid}
.pill.ok{color:var(--ok);border-color:rgba(143,209,158,.45);background:rgba(143,209,158,.1)}
.pill.soon{color:var(--soon);border-color:rgba(227,199,122,.45);background:rgba(227,199,122,.1)}
.zone{flex-wrap:wrap}
.zone .btn{flex:1 1 100%}
s.old,.old{color:var(--mute);text-decoration:line-through;font-weight:600}
.live{margin-bottom:16px}
.grp{font-size:1.25rem;margin:6px 0 4px}
.grp+.sub{margin-bottom:16px}
.sug{margin-top:34px}
.sug h3{font-size:1.25rem}
.sug-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.sug-card{padding:22px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sug-card h4{font-size:1.1rem}
.sug-card p{color:var(--mute);font-size:.92rem;flex:1}
@media(max-width:700px){.sug-grid{grid-template-columns:1fr}}
.empty{padding:26px;text-align:center;color:var(--mute);grid-column:1/-1}
.cov-foot{margin-top:20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--mute)}

/* Legal */
.legal{padding:28px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.legal svg{width:56px;height:56px}
.legal p{color:var(--mute)}.legal strong{color:var(--ink)}
footer{padding:32px 0 40px;color:var(--mute);font-size:.88rem;text-align:center;border-top:1px solid var(--line);overflow-wrap:anywhere}

/* WhatsApp flotan + ba mobil */
.wa-float{position:fixed;right:18px;bottom:18px;z-index:35;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;text-decoration:none}
.wa-float svg{width:28px;height:28px}
.bar{display:none}

/* Animasyon (yon sèl fwa) */
.fade{opacity:0;transform:translateY(12px);animation:in .6s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes in{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none;opacity:1;filter:none;transform:none}.plan{transition:none}html{scroll-behavior:auto}}

/* ====== NEON iOS 26 ====== */
:root{--neon:#5ee7ff;--neon2:#b18cff;--r-lg:30px;--r-md:20px}
.bg{background:
  radial-gradient(55% 45% at 8% 4%,rgba(94,231,255,.17) 0%,transparent 62%),
  radial-gradient(50% 45% at 94% 24%,rgba(177,140,255,.15) 0%,transparent 62%),
  radial-gradient(55% 50% at 50% 106%,rgba(94,231,255,.10) 0%,transparent 60%),
  radial-gradient(60% 50% at 14% 10%,#3a3a40 0%,transparent 60%),
  linear-gradient(180deg,#0a0a0b,#131315)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;opacity:.5;transition:opacity .2s;
  background:linear-gradient(135deg,rgba(94,231,255,.75),rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(177,140,255,.7));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.plan:hover::after,.sug-card:hover::after,.zone:hover::after{opacity:1}
.btn,.chips button,.tabs button,.lang button{transition:transform .14s cubic-bezier(.3,1.5,.5,1),filter .15s,box-shadow .2s,background .2s}
.btn:not(.ghost){box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(94,231,255,.4),0 10px 32px rgba(94,231,255,.28)}
.btn:not(.ghost):hover{box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(94,231,255,.65),0 12px 40px rgba(94,231,255,.45)}
.btn.ghost{border-color:rgba(94,231,255,.3)}
.badge i{background:var(--neon);box-shadow:0 0 14px var(--neon)}
h1{background:linear-gradient(180deg,#fff 25%,#9bdcec 70%,#8c8c93);-webkit-background-clip:text;background-clip:text}
.tabs button[aria-selected="true"],.lang button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:linear-gradient(180deg,#fff,#d6dae2);box-shadow:0 0 18px rgba(94,231,255,.45)}
.oid{border-color:rgba(94,231,255,.45);color:var(--neon)}
.tag{background:linear-gradient(90deg,var(--neon),var(--neon2));color:#06121a}
.plan:hover{transform:translateY(-5px)}
.big{text-shadow:0 0 28px rgba(94,231,255,.25)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--neon);box-shadow:inset 0 2px 6px rgba(0,0,0,.4),0 0 0 3px rgba(94,231,255,.2)}
.paybox{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.paybox h3{font-size:1.15rem;margin-bottom:10px}
.paybox ol{margin:0 0 4px 20px;color:var(--steel);font-size:.93rem}
.paybox li{padding:3px 0}
.note.bad{background:rgba(255,120,120,.12);border-color:rgba(255,120,120,.4)}
.note.wait{background:rgba(94,231,255,.1);border-color:rgba(94,231,255,.4)}

/* ====== Aksesibilite + vitès ====== */
.welcome{font-weight:800;font-size:1.1rem;color:var(--ink);margin-bottom:10px;text-shadow:0 0 22px rgba(94,231,255,.35)}
.netbanner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0 0;padding:12px 16px;border-radius:var(--r-md);background:rgba(227,199,122,.12);border:1px solid rgba(227,199,122,.45);font-size:.92rem}
.netbanner.down{background:rgba(255,120,120,.12);border-color:rgba(255,120,120,.45)}
.noticebar{margin:6px 0 0;padding:12px 16px;border-radius:var(--r-md);background:rgba(94,231,255,.1);border:1px solid rgba(94,231,255,.4);font-size:.92rem}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-64px;z-index:100;background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-weight:700;text-decoration:none;transition:top .15s}
.skip:focus{top:12px}
button,a,.btn,input,select,textarea,label{touch-action:manipulation}
fieldset{border:0;min-width:0}
legend{font-size:.85rem;color:var(--steel);padding:0;margin-bottom:6px}
.fb{padding:26px;max-width:640px}
.starrow{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:2px}
.starrow input{position:absolute;opacity:0;width:1px;height:1px}
.starrow label{display:block;margin:0;padding:2px 6px;font-size:2.3rem;line-height:1.1;color:#55555c;cursor:pointer;transition:color .12s,transform .12s}
.starrow label:hover,.starrow label:hover~label,.starrow input:checked~label{color:var(--neon);text-shadow:0 0 14px rgba(94,231,255,.6)}
.starrow label:active{transform:scale(.9)}
.starrow input:focus-visible+label{outline:2px solid #fff;outline-offset:2px;border-radius:10px}
@media(max-width:700px){
  .glass{-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%)}
  .glass::before{display:none}
}
@media(prefers-reduced-transparency:reduce){
  .glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:#1b1b1f}
  .bg::after{display:none}
}
@media(prefers-contrast:more){:root{--line:rgba(255,255,255,.5);--mute:#d2d2d8}}

/* ====== Tablèt ====== */
@media(max-width:1000px){
  .menu{display:none}
  .hero{grid-template-columns:1fr;padding-top:24px}
  .order,.home{grid-template-columns:1fr}
  .home .r{border-left:0;border-top:1px solid var(--line)}
  .bar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;justify-content:space-around;padding:6px;border-radius:999px}
  .bar a{flex:1;text-align:center;text-decoration:none;color:var(--steel);font-size:.85rem;font-weight:600;padding:12px 6px;border-radius:999px}
  .bar a:active{background:rgba(255,255,255,.12)}
  body{padding-bottom:96px}
  .wa-float{bottom:calc(88px + env(safe-area-inset-bottom))}
}
/* ====== Telefòn ====== */
@media(max-width:560px){
  .wrap{padding:0 14px}
  section{padding:44px 0}
  .nav{padding-left:14px}
  .logo small{display:none}
  .btn.sm.hide-s{display:none}
  .stats{grid-template-columns:repeat(3,1fr);gap:10px}
  .stats b{font-size:1.1rem}
  .cta .btn{flex:1 1 100%}
  .portal,.order>.glass,.home .l,.home .r,.legal{padding:20px}
  .legal{grid-template-columns:1fr}
  .cov-tools{grid-template-columns:1fr}
  .tabs{display:flex;width:100%}.tabs button{flex:1;padding:11px 6px;font-size:.85rem}
  .plans{grid-template-columns:1fr}
}
/* ====== Touch + vitès (telefòn) ====== */
*{-webkit-tap-highlight-color:transparent}
.btn,.tabs button,.chips button,.lang button,.bar a,.starrow label,.menu a{-webkit-user-select:none;user-select:none}
.btn:active,.tabs button:active,.chips button:active,.lang button:active{transform:scale(.96)}
@media (hover:none){
  .plan:hover,.sug-card:hover{transform:none}
  .btn:hover{filter:none}
  .bg::after{display:none}
  .glass::after{display:none}
  .glass{border-color:rgba(94,231,255,.22);-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 28px rgba(0,0,0,.45)}
  .nav,.bar{background:rgba(22,22,26,.86)}
  .btn:not(.ghost){box-shadow:inset 0 1px 0 #fff,0 6px 18px rgba(94,231,255,.25)}
  .starrow label{padding:8px 9px}
  .chips button,.lang button{min-height:44px}
  .lang button{padding:6px 11px}
}
</style>
</head>
<body>
<a class="skip" href="#top" data-i18n="skip"></a>
<div class="bg"></div>

<header>
  <div class="wrap">

const G = id => document.getElementById(id);

const t = (k, v) => { let s = (T[lang] && T[lang][k]) ?? T.ht[k] ?? k; if (v) for (const x in v) s = s.replace("{"+x+"}", v[x]); return s; };
const fmt = n => n.toLocaleString("fr-FR");
const htg = n => fmt(n) + " HTG";
const daysTxt = n => n === 1 ? t("day1") : t("dayn", {n});
const planName = p => p.label || t("n_" + p.k);
const durTxt = p => p.months ? t("month1") : daysTxt(p.days);
const planData = p => p.tier === "vip" ? p.down + " Mbps" : (p.data || t("unl"));
const planValid = p => p.days ? daysTxt(p.days) : t("till");
const planLabel = p => p.tier === "vip" ? durTxt(p) : planData(p) + (p.days ? " / " + daysTxt(p.days) : "");
const homeSpeed = p => p.down ? `${p.down} Mbps ↓${p.up ? " · " + p.up + " Mbps ↑" : ""}` : t("spd_tbc");
const speedOf = p => p.down ? `${p.down} Mbps ↓` : speedHot();
const wa = txt => `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(txt)}`;
const zoneName = z => z.nk ? t(z.nk) : z.n;
const zoneDesc = z => z.dk ? t(z.dk) : z.d;
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const speedHot = () => `${CONFIG.hotspot.min}–${CONFIG.hotspot.max} Mbps ↓`;

/* ID kòmand (baze sou IP MikroTik si li disponib) */
const mtIp = "$(ip)";
const hasIp = /^\d{1,3}(\.\d{1,3}){3}$/.test(mtIp);
function genId(){
  const seed = hasIp ? mtIp.split(".").map(n => (+n).toString(36).toUpperCase()).join("") : "";
  const rnd = Math.random().toString(36).slice(2,6).toUpperCase();
  const ts = Date.now().toString(36).slice(-3).toUpperCase();
  return "NP-" + (seed ? seed.slice(-4) : rnd) + ts + (seed ? rnd.slice(0,2) : "");
}
let orderId = genId();

function applyStatic(){

  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  const E = CONFIG.equip, eqv = {promo:E.promoUSD, regular:E.regularUSD, save:E.regularUSD - E.promoUSD};
  document.querySelectorAll("[data-eq]").forEach(el => el.textContent = eqv[el.dataset.eq]);
  G("lgText").innerHTML = t("lg_text", { c:`<strong>${CONFIG.company}</strong>`, l:`<strong>${CONFIG.license}</strong>` });
}

/* --- Plan yo --- */
function planCard(p,i){
  const vip = p.tier === "vip";
  const big = vip ? [String(p.down), "Mbps"] : (p.data ? p.data.split(" ") : [t("unl")]);
  const perk = vip ? "pk_vip" : p.promo ? "pk_promo" : p.k === "mini" ? "pk_mini" : p.k === "d30" ? "pk_best" : p.data ? "" : "pk_unl";
  return `<article class="glass plan ${p.pop||vip ? "pop" : ""}">
    ${vip ? `<span class="tag">VIP</span>` : ""}${p.pop ? `<span class="tag">${t("popular")}</span>` : ""}${p.promo ? `<span class="tag">${t("promo")}</span>` : ""}
    <h3>${planName(p)}</h3>
    <div class="mb">${big[0]}${big[1] ? `<small>${big[1]}</small>` : ""}</div>
    <div class="price">${htg(p.price)}${p.days ? " · " + daysTxt(p.days) : ""}</div>
    <ul><li>${speedOf(p)}</li>${perk ? `<li>${t(perk)}</li>` : ""}${p.days ? "" : `<li>${t("till")}</li>`}</ul>
    <button type="button" class="btn ${p.pop||p.promo||vip ? "" : "ghost"}" data-plan="${i}">${t("choose")}</button>
  </article>`;
}
function renderPlans(){
  const idx = CONFIG.plans.map((p,i) => i);
  G("plans").innerHTML = idx.filter(i => CONFIG.plans[i].tier !== "vip").map(i => planCard(CONFIG.plans[i], i)).join("");
  G("plansVip").innerHTML = idx.filter(i => CONFIG.plans[i].tier === "vip").map(i => planCard(CONFIG.plans[i], i)).join("");

  const cur = G("oPlan").value || "0";
  const opt = i => { const p = CONFIG.plans[i]; return `<option value="${i}">${planName(p)} – ${planLabel(p)} – ${htg(p.price)}</option>`; };
  G("oPlan").innerHTML = `<optgroup label="${t("bas_title")}">${idx.filter(i => CONFIG.plans[i].tier !== "vip").map(opt).join("")}</optgroup><optgroup label="${t("vip_title")}">${idx.filter(i => CONFIG.plans[i].tier === "vip").map(opt).join("")}</optgroup>`;
  G("oPlan").value = cur;

  /* Rezidansyèl VIP */
  G("homeMonthly").innerHTML = CONFIG.homePlans.map((p,i) => !p.mon ? "" : `<article class="glass plan">
    <h3>${t("n_"+p.k)}</h3>
    <div class="mb">${p.price}<small>USD</small></div>
    <div class="price">${durTxt(p)}</div>
    <ul><li>${homeSpeed(p)}</li><li>${t("pk_mo")}</li></ul>
    <button type="button" class="btn ghost" data-hplan="${i}">${t("choose")}</button></article>`).join("");
  G("homeVip").innerHTML = CONFIG.homePlans.map((p,i) => (p.basic || p.mon) ? "" : `<article class="glass plan pop">
    <span class="tag">VIP</span><h3>${t("n_"+p.k)}</h3>
    <div class="mb">${p.down}<small>Mbps</small></div>
    <div class="price">${p.price} USD · ${durTxt(p)}</div>
    <ul><li>${p.down} Mbps ↓</li><li>${t("pk_hvip")}</li></ul>
    <button type="button" class="btn" data-hplan="${i}">${t("choose")}</button></article>`).join("");
  const hc = G("oHPlan").value || "0";
  G("oHPlan").innerHTML = CONFIG.homePlans.map((p,i) => `<option value="${i}">${p.basic ? t("n_hb") : `${t("n_"+p.k)} – ${homeSpeed(p)} – ${p.price} USD / ${durTxt(p)}`}</option>`).join("");
  G("oHPlan").value = hc;
}

/* --- Zòn kouvèti --- */
function renderZones(){
  const q = norm(G("covSearch").value.trim());
  const list = CONFIG.zones.filter(z => (covFilter === "all" || z.s === covFilter) && (!q || norm(zoneName(z) + " " + zoneDesc(z) + " " + (z.kw||"")).includes(q)));
  G("zones").innerHTML = list.length ? list.map(z => `<div class="glass zone"><div><b>${zoneName(z)}</b><span class="d">${zoneDesc(z)}</span></div><span class="pill ${z.s}">${t(z.s==="ok" ? "st_ok" : "st_soon")}</span>${z.s==="soon" ? `<button type="button" class="btn ghost sm" data-notify="${zoneName(z)}${z.d ? " (" + z.d + ")" : ""}">${t("notify")}</button>` : ""}</div>`).join("")
    : `<div class="empty glass">${t("cov_none")}</div>`;
  const cur = G("oZone").value;
  G("oZone").innerHTML = CONFIG.zones.map(z => `<option value="${zoneName(z)}">${zoneName(z)} (${t(z.s==="ok" ? "st_ok" : "st_soon")})</option>`).join("");
  if (cur) G("oZone").value = cur;
}

      : `${t("chose")} <b>${t("n_"+hp.k)}</b>: ${homeSpeed(hp)} · ${durTxt(hp)}<br>${t("total")}: <b>${hp.price} USD</b>${oid}`;

  }
}
const BAR = "━━━━━━━━━━";
const hdr = tag => `*NET PLUS 5G LTE* 📶 · ${tag}`;
function buildMsg(kind){
  const verify = kind === "verify";
  const tag = verify ? "VERIFY" : mode === "hot" ? "ORDER" : mode === "home" ? "INSTALL" : "EQUIP";
  const title = verify ? "lbl_verify" : mode === "hot" ? "lbl_order" : mode === "home" ? "lbl_install" : "lbl_equip";
  const L = [hdr(tag), BAR, `*${t(title)}*`, `🆔 ID: ${orderId}`];
  if (!verify) {
    if (mode === "hot") {
      const p = CONFIG.plans[G("oPlan").value];
      L.push(`📦 ${t("m_plan")}: ${planName(p)} (${planLabel(p)})`, `⚡ ${t("m_speed")}: ${speedOf(p)}`, `💰 ${t("m_price")}: ${htg(p.price)}`, `💳 ${t("m_pay")}: ${G("oPay").selectedOptions[0].textContent}`, `🔖 Ref: ${p.k}`);
    } else if (mode === "home") {
      const hp = CONFIG.homePlans[G("oHPlan").value];
      if (hp.basic) L.push(`📦 ${t("m_plan")}: ${t("n_hb")}`, `⚡ ${t("m_speed")}: ${CONFIG.home.down} Mbps ↓ · ${CONFIG.home.up} Mbps ↑`, `🛠️ ${t("install")}: ${CONFIG.home.installUSD} USD`);
      else L.push(`📦 ${t("m_plan")}: ${t("n_"+hp.k)}`, `⚡ ${t("m_speed")}: ${homeSpeed(hp)} · ${durTxt(hp)}`, `💰 ${t("m_price")}: ${hp.price} USD`);
    } else {
      L.push(`📦 ${t("m_equipment")}: ${CONFIG.equip.promoUSD} USD (${t("promo")} · ${t("e_regular")}: ${CONFIG.equip.regularUSD} USD)`, `💳 ${t("m_pay")}: ${G("oPay").selectedOptions[0].textContent}`);
    }
    if (mode !== "hot") L.push(`📍 ${t("m_zone")}: ${G("oZone").value}`, `🏠 ${t("m_addr")}: ${G("oAddr").value.trim()}`);
  }
  L.push(`👤 ${t("m_name")}: ${G("oName").value.trim()}`, `📱 WhatsApp: ${G("oPhone").value.trim()}`, BAR, t(verify ? "m_close_verify" : mode === "hot" ? "m_close_order" : "m_close_other"));
  return L.join("\n");
}
function feedbackMsg(rating, text, name){
  const L = [hdr("FEEDBACK"), BAR, `*${t("lbl_feedback")}*`];
  if (rating) L.push(`⭐ ${rating}/5`);
  if (text) L.push(`💬 ${text}`);
  if (name) L.push(`👤 ${t("m_name")}: ${name}`);
  L.push(BAR, t("m_close_fb")); return L.join("\n");
}
function covLink(){
  const z = G("covSearch").value.trim();
  return wa([hdr("COVERAGE"), BAR, `*${t("lbl_cov")}*`, `📍 ${t("m_zone")}: ${z || "________"}`, BAR, t("m_close_cov")].join("\n"));
}
function notifyMsg(zone){
  return [hdr("NOTIFY"), BAR, `*${t("lbl_notify")}*`, `📍 ${t("m_zone")}: ${zone}`, BAR, t("m_close_notify")].join("\n");
}
function valid(){
  const ok = G("oName").value.trim() && G("oPhone").value.trim() && (mode === "hot" || G("oAddr").value.trim());

const tabEls = [G("tabHot"), G("tabHome"), G("tabEquip")], tabModes = ["hot", "home", "equip"], panelIds = ["panelHot", "panelHome", "panelEquip"];
tabEls.forEach((b, i) => {

/* --- Peman otomatik (bezwen sèvè bot la: CONFIG.apiBase) --- */
const mtMac = "$(mac)";   /* MikroTik ranplase sa ak MAC kliyan an */
const macOk = /^([0-9A-F]{2}:){5}[0-9A-F]{2}$/i.test(mtMac);
let payOrder = null;
async function api(path, body){
  const r = await fetch(CONFIG.apiBase.replace(/\/$/, "") + path, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
  return r.json();
}
function payMsg(key, kind){
  const n = G("payNote"); n.hidden = false; n.className = "note" + (kind ? " " + kind : ""); n.textContent = t(key);
}
function showPay(r){
  G("payBox").hidden = false;
  const nums = [r.pay.moncash && "MonCash " + r.pay.moncash, r.pay.natcash && "NatCash " + r.pay.natcash].filter(Boolean).join(" / ");
  const ul = G("payInfo"); ul.innerHTML = "";
  [t("pay_s1", { amt: htg(r.amount), nums }), t("pay_s2"), t("pay_s3")].forEach(x => { const li = document.createElement("li"); li.textContent = x; ul.appendChild(li); });
}
async function startPay(){
  const p = CONFIG.plans[G("oPlan").value];
  try {
    const r = await api("/api/order", { planKey:p.k, phone:G("oPhone").value.trim(), name:G("oName").value.trim() });
    if (!r.ok) throw new Error(r.error);
    orderId = r.id; payOrder = r; renderOrder(); showPay(r);
    G("payBox").scrollIntoView({ behavior:"smooth", block:"center" });
  } catch (e) { alert(t("pay_err")); }
}
G("payGo").addEventListener("click", async () => {
  const txn = G("txnId").value.trim();
  if (!txn) { payMsg("pay_need", "bad"); return; }
  payMsg("pay_wait", "wait");
  try {
    const r = await api("/api/pay", { orderId, txnId:txn, mac: macOk ? mtMac : "" });
    if (r.ok) {
      payMsg("pay_ok");
      G("username").value = r.code;
      G("konekte").scrollIntoView({ behavior:"smooth" });
      setTimeout(() => G("loginForm").submit(), 1400);
    } else {
      payMsg({ pending:"pay_pending", used:"pay_used", low:"pay_low", rate:"pay_rate" }[r.error] || "pay_err", "bad");
    }
  } catch (e) { payMsg("pay_err", "bad"); }
});

  if (netState === "ok") { b.hidden = true; return; }
  b.hidden = false; b.className = "netbanner" + (netState === "down" ? " down" : "");
  G("netMsg").textContent = t(netState === "busy" ? "net_busy" : "net_down"); G("netTech").href = supportLink();
}
async function pollStatus(){
  if (!CONFIG.apiBase) return;
  try {
    const r = await fetch(CONFIG.apiBase.replace(/\/$/, "") + "/api/status", { cache:"no-store" });
    netState = (await r.json()).state || "ok"; netFails = 0;
  } catch (e) { netFails++; netState = netFails >= 2 ? "down" : netState; }
  showNet();
}
pollStatus(); setInterval(pollStatus, 60000);

/* --- Plan ak mesaj ki soti nan app admin lan (/admin): paj la mete ajou san re-telechaje fichye a --- */
let siteNotice = null;
function showNotice(){
  const b = G("noticeBar"), txt = siteNotice && (siteNotice[lang] || siteNotice.ht);
  if (!txt) { b.hidden = true; return; }
  b.hidden = false; b.textContent = txt;
}
async function loadPlans(){
  if (!CONFIG.apiBase) return;
  try {
    const r = await (await fetch(CONFIG.apiBase.replace(/\/$/, "") + "/api/plans", { cache:"no-store" })).json();
    if (!r.ok || !r.plans.length) return;
    CONFIG.plans = r.plans.map(p => p.vip
      ? { k:p.k, label:p.label, tier:"vip", down:p.down || 30, price:p.price, days:p.days }
      : { k:p.k, label:p.label, data:p.gb ? p.gb + " GB" : null, price:p.price, days:p.days, promo:p.promo, pop:p.pop });
    siteNotice = r.notice || null;
    renderPlans(); renderOrder(); showNotice();
  } catch (e) { /* sèvè pa disponib: kenbe plan ki nan fichye a */ }
}
loadPlans(); setInterval(loadPlans, 300000);
/* --- Aktivasyon otomatik: lyen WhatsApp ?code=NP-XXXX (oswa ?username=) --- */
const qp = new URLSearchParams(location.search);
const autoCode = (qp.get("code") || qp.get("username") || "").trim();
function showAuto(){ const n = G("autoNote"); if (n.dataset.on) { n.hidden = false; n.textContent = t("p_auto"); } }
/* --- Kontak dirèk --- */
G("waDirect").href = wa("👋 MENU");
G("waFloat").href = wa("👋 MENU");
G("resendLink").href = wa("KOD"); G("resendLink").target = "_blank";
G("mailDirect").href = "mailto:" + CONFIG.email;
G("yr").textContent = new Date().getFullYear();

/* --- Lang ofisyèl otomatik --- */
const nav = (navigator.language || "ht").slice(0,2).toLowerCase();
setLang(nav === "fr" ? "fr" : nav === "en" ? "en" : "ht");
if (G("err").dataset.bad) G("err").textContent = t("p_err_bad");
if (autoCode && !qp.get("error")) {
  G("username").value = autoCode;
  G("autoNote").dataset.on = "1"; showAuto();
  history.replaceState(null, "", location.pathname);   /* retire kòd la nan adrès la */
  setTimeout(() => G("loginForm").submit(), 1200);
}
</script>
