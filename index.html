  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Liquid Glass Design */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    :root {
      --black: #000; --charcoal: #121214; --slate: #1c1c1f;
      --cyan: #64d2ff; --blue: #0a84ff; --purple: #bf5af2;
      --glass-1: rgba(255,255,255,0.035); --glass-2: rgba(255,255,255,0.07);
      --glass-border: rgba(255,255,255,0.09); --glass-border-bright: rgba(255,255,255,0.22);
      --glass-highlight: inset 0 1px 0 rgba(255,255,255,0.2);
      --text: #f5f5f7; --text-dim: rgba(245,245,247,0.55);
      --r-lg: 24px; --r-xl: 34px;
      --shadow-2: 0 8px 24px rgba(0,0,0,0.5); --shadow-3: 0 20px 60px rgba(0,0,0,0.7);
      --spring: 0.4s cubic-bezier(0.34,1.56,0.64,1);
      --blur-glass: blur(40px) saturate(180%);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
      background: var(--black); color: var(--text); min-height: 100vh;
    }
    .bg-neo { position: fixed; inset: 0; z-index: -3; background: var(--black); overflow: hidden; }
    .bg-neo::before {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(100,210,255,0.22), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(10,132,255,0.15), transparent);
      filter: blur(80px);
    }
    .noise {
      position: fixed; inset: 0; z-index: -1; opacity: 0.05; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }
    .header {
      position: sticky; top: 0; z-index: 100; padding: 16px 20px;
      background: rgba(10,10,12,0.55);
      backdrop-filter: var(--blur-glass); -webkit-backdrop-filter: var(--blur-glass);
      border-bottom: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: space-between;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      box-shadow: var(--glass-highlight);
    }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .logo-mark {
      width: 36px; height: 36px; border-radius: 12px;
      background: linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
      display: flex; align-items: center; justify-content: center;
      color: var(--black); font-size: 16px;
    }
    .logo-text { font-size: 19px; font-weight: 800; }
    
    .content { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .section-title { font-size: 21px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .section-title i { color: var(--cyan); }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 16px; }
    .card {
      border-radius: var(--r-lg); overflow: hidden;
      background: var(--glass-1); border: 1px solid var(--glass-border);
      cursor: pointer; transition: all 0.45s var(--spring);
      position: relative; display: block; text-decoration: none; color: inherit;
      box-shadow: var(--glass-highlight), var(--shadow-2);
    }
    .card:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: var(--glass-border-bright);
      box-shadow: var(--glass-highlight), 0 20px 50px rgba(0,0,0,0.7);
    }
    .poster-wrap { position: relative; width: 100%; aspect-ratio: 2/3; overflow: hidden; }
    .poster { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.6s; }
    .card:hover .poster { transform: scale(1.1); }
    .rating {
      position: absolute; top: 12px; right: 12px; padding: 6px 11px;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
      border-radius: 10px; font-size: 12px; font-weight: 800;
      display: flex; align-items: center; gap: 4px; border: 1px solid rgba(255,255,255,0.15);
    }
    .rating i { color: var(--cyan); font-size: 10px; }
    .info { padding: 12px 14px; }
    .title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .meta { font-size: 11px; color: var(--text-dim); }
    
    .loader {
      position: fixed; inset: 0; background: var(--black); z-index: 999;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px;
    }
    .loader.hidden { display: none; }
    .loader-mark {
      width: 80px; height: 80px; border-radius: 20px;
      background: linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
      display: flex; align-items: center; justify-content: center; font-size: 36px; color: var(--black);
      animation: markPulse 2s infinite;
    }
    @keyframes markPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    
    @media (max-width: 768px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 12px; }
      .content { padding: 14px; }
    }
  </style>
</head>

function renderMovies(movies) {
  const grid = document.getElementById("movieGrid");
  
  if (movies.length === 0) {
    grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-dim);">Aucun film</div>`;
    return;
  }
  
  grid.innerHTML = movies.map(m => {
    const params = new URLSearchParams({
      subjectId: m.subjectId,
      title: m.title,
      poster: m.poster || '',
      year: m.year || '',
      rating: m.rating || '',
      type: m.type || 'movie',
      detailPath: m.detailPath || ''
    });
    
    return `
      <a href="player.html?${params.toString()}" class="card">
        <div class="poster-wrap">
          <img class="poster" src="${m.poster}" alt="${m.title}" loading="lazy"
               onerror="this.src='https://via.placeholder.com/300x450/1a1a1c/4a4a52?text=No+Image'">
          ${m.rating ? `<div class="rating"><i class="fas fa-star"></i>${m.rating}</div>` : ''}
        </div>
        <div class="info">
          <div class="title">${m.title}</div>
          <div class="meta">${m.year} • ${m.type === 'series' ? 'Série' : 'Film'}</div>
        </div>
      </a>
    `;
  }).join('');
}
