<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>BLAST FLIX - Films & Séries</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
/* Liquid Glass Design */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
html { scroll-behavior: smooth; }
:root {
  --black: #000000; --charcoal: #121214; --slate: #1c1c1f; --graphite: #26262a;
  --silver: #8a8a92; --white: #f5f5f7; --cyan: #64d2ff; --blue: #0a84ff; --purple: #bf5af2; --pink: #ff375f;
  --glass-1: rgba(255,255,255,0.035); --glass-2: rgba(255,255,255,0.07); --glass-3: rgba(255,255,255,0.11);
  --glass-border: rgba(255,255,255,0.09); --glass-border-bright: rgba(255,255,255,0.22);
  --glass-highlight: inset 0 1px 0 rgba(255,255,255,0.20);
  --glass-inner-shadow: inset 0 -1px 0 rgba(0,0,0,0.2);
  --text: #f5f5f7; --text-dim: rgba(245,245,247,0.55); --text-mute: rgba(245,245,247,0.35);
  --r-md: 20px; --r-lg: 28px; --r-xl: 34px; --r-2xl: 42px;
  --shadow-1: 0 2px 8px rgba(0,0,0,0.4); --shadow-2: 0 8px 24px rgba(0,0,0,0.5); --shadow-3: 0 20px 60px rgba(0,0,0,0.7);
  --spring: 0.5s cubic-bezier(0.34,1.56,0.64,1);
  --ease: 0.3s cubic-bezier(0.4,0,0.2,1);
  --blur-glass: blur(40px) saturate(180%);
  --blur-heavy: blur(60px) saturate(200%);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
  background: var(--black); color: var(--text); min-height: 100vh; overflow-x: hidden;
  padding-bottom: 130px; letter-spacing: -0.01em; position: relative;
}
.bg-neo { position: fixed; inset: 0; z-index: -3; background: var(--black); overflow: hidden; }
.bg-neo::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(100,210,255,0.22), transparent),
    radial-gradient(ellipse 70% 50% at 100% 100%, rgba(10,132,255,0.15), transparent),
    radial-gradient(ellipse 60% 40% at 0% 50%, rgba(191,90,242,0.12), transparent);
  filter: blur(80px);
}
.noise {
  position: fixed; inset: 0; z-index: -1; opacity: 0.05; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode: overlay;
}
.orb { position: fixed; border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: -2; opacity: 0.6; animation: orbFloat 25s ease-in-out infinite; }
.orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(100,210,255,0.5), transparent 70%); top: -200px; left: -180px; }
.orb-2 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(191,90,242,0.4), transparent 70%); bottom: -250px; right: -200px; animation-delay: -10s; }
.orb-3 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(10,132,255,0.35), transparent 70%); top: 40%; left: 50%; animation-delay: -5s; }
@keyframes orbFloat {
  0%, 100% { transform: translate(0,0) scale(1); }
  33% { transform: translate(60px,-50px) scale(1.15); }
  66% { transform: translate(-50px,60px) scale(0.9); }
}
.header {
  position: sticky; top: 0; z-index: 100; padding: 16px 20px;
  background: rgba(10,10,12,0.55);
  backdrop-filter: var(--blur-glass); -webkit-backdrop-filter: var(--blur-glass);
  border-bottom: 1px solid var(--glass-border);
  display: flex; align-items: center; justify-content: space-between;
  border-radius: 0 0 var(--r-xl) var(--r-xl);
  padding-top: calc(16px + env(safe-area-inset-top,0px));
  box-shadow: var(--glass-highlight), 0 4px 24px rgba(0,0,0,0.3);
}
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-mark {
  width: 36px; height: 36px; border-radius: 12px;
  background: linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
  display: flex; align-items: center; justify-content: center;
  color: var(--black); font-size: 16px;
  box-shadow: 0 6px 20px rgba(100,210,255,0.5), inset 0 1px 0 rgba(255,255,255,0.5), inset 0 -1px 0 rgba(0,0,0,0.2);
}
.logo-text {
  font-size: 19px; font-weight: 800; letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--white), var(--silver));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.actions { display: flex; gap: 10px; }
.action-btn {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--glass-2); border: 1px solid var(--glass-border);
  color: var(--text); display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all var(--spring);
  backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
  text-decoration: none;
  box-shadow: var(--glass-highlight), var(--glass-inner-shadow), var(--shadow-1);
  position: relative; overflow: hidden;
}
.action-btn:hover {
  background: rgba(100,210,255,0.18); border-color: var(--cyan); transform: scale(1.08);
  box-shadow: var(--glass-highlight), 0 0 30px rgba(100,210,255,0.6), var(--shadow-2);
}
.action-btn i { font-size: 16px; }
.content { padding: 0 20px; margin-top: 20px; }
.section { margin-bottom: 44px; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.section-title { font-size: 21px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.section-title i { font-size: 16px; color: var(--cyan); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 16px; }
.card {
  border-radius: var(--r-lg); overflow: hidden;
  background: var(--glass-1);
  border: 1px solid var(--glass-border);
  cursor: pointer; transition: all 0.45s var(--spring);
  position: relative; display: block; text-decoration: none; color: inherit;
  box-shadow: var(--glass-highlight), var(--shadow-2);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.card:hover {
  transform: translateY(-8px) scale(1.03);
  border-color: var(--glass-border-bright);
  box-shadow: var(--glass-highlight), 0 20px 50px rgba(0,0,0,0.7), 0 0 50px rgba(100,210,255,0.25);
}
.poster-wrap { position: relative; width: 100%; aspect-ratio: 2/3; overflow: hidden; }
.poster {
  width: 100%; height: 100%; object-fit: cover; display: block;
  background: linear-gradient(135deg, var(--charcoal), var(--slate));
  transition: transform 0.6s var(--ease);
}
.card:hover .poster { transform: scale(1.1); }
.rating {
  position: absolute; top: 12px; right: 12px; padding: 6px 11px;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 10px; font-size: 12px; font-weight: 800;
  display: flex; align-items: center; gap: 4px; z-index: 3;
  border: 1px solid rgba(255,255,255,0.15);
}
.rating i { color: var(--cyan); font-size: 10px; }
.play-btn {
  position: absolute; bottom: 12px; left: 12px;
  width: 48px; height: 48px; border-radius: 50%;
  background: rgba(100,210,255,0.25);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1.5px solid var(--cyan);
  display: flex; align-items: center; justify-content: center;
  z-index: 3; color: white;
  box-shadow: var(--glass-highlight), 0 4px 16px rgba(100,210,255,0.5);
  pointer-events: none; transition: all var(--spring);
}
.play-btn i { font-size: 16px; margin-left: 2px; }
.card:hover .play-btn {
  transform: scale(1.15); background: rgba(100,210,255,0.65);
}
.info { padding: 12px 14px; }
.title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.meta { font-size: 11px; color: var(--text-dim); }
.skeleton { border-radius: var(--r-lg); overflow: hidden; background: var(--glass-1); border: 1px solid var(--glass-border); }
.sk-poster { width: 100%; aspect-ratio: 2/3; background: linear-gradient(90deg, var(--charcoal) 0%, var(--slate) 50%, var(--charcoal) 100%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
.sk-info { padding: 12px 14px; }
.sk-line { height: 12px; margin-bottom: 6px; border-radius: 4px; background: linear-gradient(90deg, var(--charcoal) 0%, var(--slate) 50%, var(--charcoal) 100%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
.sk-line.short { width: 60%; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.loader {
  position: fixed; inset: 0; background: var(--black); z-index: 999;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
  transition: opacity 0.6s, visibility 0.6s;
}
.loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.loader-mark {
  width: 100px; height: 100px; border-radius: 26px;
  background: linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
  display: flex; align-items: center; justify-content: center; font-size: 44px; color: var(--black);
  box-shadow: 0 20px 60px rgba(100,210,255,0.5);
  animation: markPulse 2s ease-in-out infinite;
}
@keyframes markPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.loader-text {
  font-size: 20px; font-weight: 800; letter-spacing: 4px;
  background: linear-gradient(90deg, var(--silver), var(--white), var(--silver));
  background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  animation: shimmerText 2s linear infinite;
}
@keyframes shimmerText { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.bottom-nav {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  width: calc(100% - 32px); max-width: 440px; border-radius: var(--r-2xl);
  display: flex; justify-content: space-around; align-items: center;
  padding: 10px 8px; z-index: 90;
  background: rgba(20,20,22,0.65);
  backdrop-filter: var(--blur-heavy); -webkit-backdrop-filter: var(--blur-heavy);
  border: 1px solid var(--glass-border-bright);
  box-shadow: var(--glass-highlight), 0 -8px 40px rgba(0,0,0,0.7);
  padding-bottom: calc(10px + env(safe-area-inset-bottom,0px));
}
.nav-btn {
  background: none; border: none; color: var(--text-dim);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 16px; border-radius: var(--r-md); cursor: pointer;
  transition: all var(--spring); font-family: inherit; font-size: 10px; font-weight: 600;
  position: relative; text-decoration: none;
}
.nav-btn i { font-size: 20px; }
.nav-btn.active { color: var(--white); }
.nav-btn.active i { color: var(--cyan); filter: drop-shadow(0 0 10px rgba(100,210,255,0.9)); }
@media (max-width: 768px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 12px; }
  .content { padding: 0 14px; }
}
  </style>
</head>
<body>

<div class="bg-neo"></div>
<div class="noise"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="loader" id="loader">
  <div class="loader-mark"><i class="fas fa-play"></i></div>
  <div class="loader-text">BLAST FLIX</div>
</div>

<header class="header">
  <a href="index.html" class="logo">
    <div class="logo-mark"><i class="fas fa-play"></i></div>
    <span class="logo-text">BLAST FLIX</span>
  </a>
  <div class="actions">
    <button class="action-btn"><i class="fas fa-search"></i></button>
  </div>
</header>

<main class="content" id="mainContent">
  <section class="section">
    <div class="section-head">
      <h2 class="section-title"><i class="fas fa-fire"></i> Chargement...</h2>
    </div>
    <div class="grid" id="movieGrid">
      <div class="skeleton"><div class="sk-poster"></div><div class="sk-info"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
      <div class="skeleton"><div class="sk-poster"></div><div class="sk-info"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
      <div class="skeleton"><div class="sk-poster"></div><div class="sk-info"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
      <div class="skeleton"><div class="sk-poster"></div><div class="sk-info"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
      <div class="skeleton"><div class="sk-poster"></div><div class="sk-info"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
      <div class="skeleton"><div class="sk-poster"></div><div class="sk-info"><div class="sk-line"></div><div class="sk-line short"></div></div></div>
    </div>
  </section>
</main>

<nav class="bottom-nav">
  <a href="index.html" class="nav-btn active"><i class="fas fa-home"></i><span>Accueil</span></a>
  <a href="#" class="nav-btn"><i class="fas fa-film"></i><span>Films</span></a>
  <a href="#" class="nav-btn"><i class="fas fa-search"></i><span>Recherche</span></a>
  <a href="#" class="nav-btn"><i class="fas fa-download"></i><span>Téléch.</span></a>
  <a href="#" class="nav-btn"><i class="fas fa-user"></i><span>Moi</span></a>
</nav>

<script>
// ============================================================
// ✅ SEKRE: Itilize API MOOVIEBOX Dirèkteman (Oswa Render)
// ============================================================
const API_BASE_URL = 'https://moviebox-api-snrn.onrender.com';
// Si w vle eseye dirèk:
// const API_BASE_URL = 'https://h5-api.aoneroom.com/wefeed-h5api-bff';

const STATE = { allMovies: [] };

document.addEventListener("DOMContentLoaded", () => {
  setTimeout(() => document.getElementById("loader")?.classList.add("hidden"), 800);
  loadMovies();
});

async function loadMovies() {
  const grid = document.getElementById("movieGrid");
  
  try {
    console.log('🔍 Chèche fim nan API...');
    
    // Eseye chèche fim popilè nan API a
    const [moviesRes, seriesRes] = await Promise.allSettled([
      fetch(`${API_BASE_URL}/movies?page=1&per_page=30`),
      fetch(`${API_BASE_URL}/tv-series?page=1&per_page=30`)
    ]);
    
    let allMovies = [];
    
    if (moviesRes.status === 'fulfilled' && moviesRes.value.ok) {
      const data = await moviesRes.value.json();
      const items = data.items || [];
      console.log('✅ Movies:', items.length);
      allMovies.push(...items.map(m => ({ ...m, type: 'movie' })));
    }
    
    if (seriesRes.status === 'fulfilled' && seriesRes.value.ok) {
      const data = await seriesRes.value.json();
      const items = data.items || [];
      console.log('✅ Series:', items.length);
      allMovies.push(...items.map(m => ({ ...m, type: 'series' })));
    }
    
    if (allMovies.length === 0) {
      throw new Error('API pa retounen anyen');
    }
    
    STATE.allMovies = allMovies;
    renderMovies(allMovies);
    
    document.querySelector('.section-title').innerHTML = `<i class="fas fa-fire"></i> Films Populaires (${allMovies.length})`;
    
  } catch (err) {
    console.error('❌ Erè:', err);
    grid.innerHTML = `
      <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-dim);">
        <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #ff4444; margin-bottom: 16px; display: block;"></i>
        <p style="font-size: 15px;">API pa disponib. Tanpri eseye ankò.</p>
        <button onclick="location.reload()" style="margin-top: 16px; padding: 12px 24px; background: var(--cyan); color: var(--black); border: none; border-radius: 50px; font-weight: 700; cursor: pointer;">
          🔄 Réessayer
        </button>
      </div>
    `;
  }
}

function renderMovies(movies) {
  const grid = document.getElementById("movieGrid");
  
  if (movies.length === 0) {
    grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-dim);">Aucun résultat</div>`;
    return;
  }
  
  grid.innerHTML = movies.map(m => {
    const title = (m.title || 'Sans titre').replace(/"/g, '&quot;');
    const poster = m.cover || 'https://via.placeholder.com/300x450/1a1a1c/4a4a52?text=No+Image';
    const year = m.year || '';
    const rating = m.rating || '';
    const subjectId = m.subject_id || m.subjectId || '';
    const type = m.type || 'movie';
    
    const params = new URLSearchParams({
      subjectId: subjectId,
      title: m.title || '',
      poster: poster,
      year: year,
      rating: rating,
      type: type,
      genre: 'Movie'
    });
    
    return `
      <a href="player.html?${params.toString()}" class="card">
        <div class="poster-wrap">
          <img class="poster" src="${poster}" alt="${title}" loading="lazy"
               onerror="this.src='https://via.placeholder.com/300x450/1a1a1c/4a4a52?text=No+Image'">
          ${rating ? `<div class="rating"><i class="fas fa-star"></i>${rating}</div>` : ''}
          <div class="play-btn"><i class="fas fa-play"></i></div>
        </div>
        <div class="info">
          <div class="title">${title}</div>
          <div class="meta">${year} ${type === 'series' ? '• Série' : '• Film'}</div>
        </div>
      </a>
    `;
  }).join('');
}
</script>
</body>
                                                             </html>
