<!-- index.html - Login Page avec Design Liquid Glass Neo -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLAST PROXY - Activation</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --text: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #666680;
            --accent: #6c5ce7;
            --accent-secondary: #a29bfe;
            --accent-glow: rgba(108, 92, 231, 0.5);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.05);
            --success: #00b894;
            --error: #ff7675;
            --warning: #fdcb6e;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Effet Liquid Glass Background */
        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        
        .liquid-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            animation: floatOrb 15s infinite;
        }
        
        .liquid-orb:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #6c5ce7, transparent);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }
        
        .liquid-orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #a29bfe, transparent);
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }
        
        .liquid-orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #00b894, transparent);
            top: 50%;
            left: 50%;
            animation-delay: -10s;
        }
        
        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(150px, -100px) scale(1.2); }
            50% { transform: translate(-100px, 150px) scale(0.8); }
            75% { transform: translate(100px, 100px) scale(1.1); }
        }
        
        /* Particules */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: particleFloat 10s infinite;
        }
        
        @keyframes particleFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
            50% { transform: translateY(-200px) rotate(360deg); opacity: 1; }
        }
        
        /* Container Principal */
        .login-container {
            position: relative;
            z-index: 10;
            background: var(--glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 50px;
            width: 100%;
            max-width: 450px;
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: containerAppear 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.05),
                transparent
            );
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        @keyframes containerAppear {
            from { transform: translateY(50px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        
        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            animation: pulse 2s infinite;
            box-shadow: 0 15px 40px rgba(108, 92, 231, 0.4);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 15px 40px rgba(108, 92, 231, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 20px 50px rgba(108, 92, 231, 0.6); }
        }
        
        .logo h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .logo p {
            color: var(--text-muted);
            margin-top: 10px;
            font-size: 14px;
            letter-spacing: 1px;
        }
        
        /* Input Groups */
        .input-group {
            position: relative;
            margin: 25px 0;
        }
        
        .input-group input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(108, 92, 231, 0.3);
            border-radius: 15px;
            color: var(--text);
            font-size: 16px;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(108, 92, 231, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .input-group input::placeholder {
            color: var(--text-muted);
        }
        
        .input-group label {
            position: absolute;
            left: 15px;
            top: -12px;
            background: var(--bg-primary);
            padding: 0 10px;
            color: var(--accent-secondary);
            font-size: 13px;
            pointer-events: none;
            letter-spacing: 1px;
        }
        
        /* Proxy Config */
        .proxy-config {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            border: 1px solid rgba(108, 92, 231, 0.2);
        }
        
        .proxy-config h3 {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .proxy-inputs {
            display: flex;
            gap: 10px;
        }
        
        .proxy-inputs input {
            flex: 1;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(108, 92, 231, 0.2);
            border-radius: 10px;
            color: var(--text);
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        
        /* Bouton Activer */
        .btn-activate {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
        }
        
        .btn-activate::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn-activate:hover::before {
            left: 100%;
        }
        
        .btn-activate:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(108, 92, 231, 0.4);
        }
        
        .btn-activate:active {
            transform: translateY(0);
        }
        
        /* Status Message */
        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            display: none;
            animation: fadeIn 0.3s;
            letter-spacing: 0.5px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .status-message.success {
            display: block;
            background: rgba(0, 184, 148, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }
        
        .status-message.error {
            display: block;
            background: rgba(255, 118, 117, 0.1);
            color: var(--error);
            border: 1px solid var(--error);
        }
        
        /* Powered By */
        .powered-by {
            text-align: center;
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 1px;
        }
        
        .powered-by strong {
            color: var(--accent-secondary);
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
                margin: 20px;
            }
            
            .logo h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Liquid Background -->
    <div class="liquid-bg">
        <div class="liquid-orb"></div>
        <div class="liquid-orb"></div>
        <div class="liquid-orb"></div>
    </div>
    
    <!-- Particules -->
    <div class="particles" id="particles"></div>
    
    <!-- Login Container -->
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">⚡</div>
            <h1>BLAST PROXY</h1>
            <p>Système d'Activation Premium</p>
        </div>
        
        <div class="input-group">
            <label>CLÉ DE LICENCE</label>
            <input type="text" id="licenseInput" placeholder="Entrez votre clé de licence..." maxlength="50">
        </div>
        
        <div class="proxy-config">
            <h3>🔧 Configuration Proxy</h3>
            <div class="proxy-inputs">
                <input type="text" id="proxyIp" placeholder="IP Address">
                <input type="text" id="proxyPort" placeholder="Port">
            </div>
        </div>
        
        <button class="btn-activate" onclick="activateLicense()">
            Activer la Licence
        </button>
        
        <div class="status-message" id="statusMessage"></div>
        
        <div class="powered-by">
            Powered by <strong>BLAST PROXY SAFE</strong>
        </div>
    </div>

    <script>
        // Créer les particules
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 3 + 1 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = Math.random() * 10 + 10 + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        // Charger la configuration proxy
        async function loadProxyConfig() {
            try {
                const response = await fetch('/localconfig.json');
                const config = await response.json();
                if (config.ip && config.port) {
                    document.getElementById('proxyIp').value = config.ip;
                    document.getElementById('proxyPort').value = config.port;
                }
            } catch (error) {
                console.log('Configuration proxy non trouvée');
            }
        }
        
        // Détecter l'IP de l'utilisateur
        async function detectUserIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return 'Unknown';
            }
        }
        
        // Activer la licence
        async function activateLicense() {
            const licenseKey = document.getElementById('licenseInput').value;
            const proxyIp = document.getElementById('proxyIp').value;
            const proxyPort = document.getElementById('proxyPort').value;
            const statusMessage = document.getElementById('statusMessage');
            
            if (!licenseKey) {
                showStatus('❌ Veuillez entrer votre clé de licence', 'error');
                return;
            }
            
            if (!proxyIp || !proxyPort) {
                showStatus('❌ Configuration proxy requise', 'error');
                return;
            }
            
            const userIP = await detectUserIP();
            
            // Afficher un état de chargement
            showStatus('⏳ Validation en cours...', 'success');
            
            try {
                const response = await fetch('/api/validate-license', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        licenseKey: licenseKey,
                        userIP: userIP,
                        proxyIp: proxyIp,
                        proxyPort: proxyPort,
                        timestamp: Date.now()
                    })
                });
                
                const result = await response.json();
                
                if (result.valid) {
                    showStatus(`✅ Licence valide! Redirection...`, 'success');
                    
                    // Sauvegarder les informations
                    localStorage.setItem('blast_license', JSON.stringify({
                        key: licenseKey,
                        userIP: userIP,
                        proxyIp: proxyIp,
                        proxyPort: proxyPort,
                        activatedAt: Date.now(),
                        expiresAt: result.expiresAt,
                        sessionId: result.sessionId
                    }));
                    
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showStatus('❌ Clé invalide ou expirée', 'error');
                }
            } catch (error) {
                showStatus('❌ Erreur de connexion au serveur', 'error');
            }
        }
        
        function showStatus(message, type) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.textContent = message;
            statusMessage.className = 'status-message ' + type;
        }
        
        // Vérifier licence existante
        window.onload = async function() {
            createParticles();
            await loadProxyConfig();
            
            const savedLicense = localStorage.getItem('blast_license');
            if (savedLicense) {
                const license = JSON.parse(savedLicense);
                if (license.expiresAt > Date.now()) {
                    window.location.href = '/dashboard';
                }
            }
        };
    </script>
</body>
  </html>
