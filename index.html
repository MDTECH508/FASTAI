<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Lecture - BLAST FLIX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased; }
        :root {
            --black:#000; --charcoal:#121214; --slate:#1c1c1f;
            --cyan:#64d2ff; --blue:#0a84ff; --purple:#bf5af2; --gold:#ffd700;
            --glass-1:rgba(255,255,255,0.035);
            --glass-2:rgba(255,255,255,0.07);
            --glass-border:rgba(255,255,255,0.09);
            --glass-border-bright:rgba(255,255,255,0.22);
            --glass-highlight:inset 0 1px 0 rgba(255,255,255,0.2);
            --text:#f5f5f7;
            --text-dim:rgba(245,245,247,0.55);
            --text-mute:rgba(245,245,247,0.35);
            --r-sm:12px; --r-md:18px; --r-lg:24px;
            --shadow-1:0 2px 8px rgba(0,0,0,0.4);
            --shadow-2:0 8px 24px rgba(0,0,0,0.5);
            --shadow-3:0 20px 60px rgba(0,0,0,0.7);
            --spring:0.4s cubic-bezier(0.34,1.56,0.64,1);
            --blur-glass:blur(40px) saturate(180%);
        }
        html, body {
            font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;
            background:var(--black); color:var(--text); min-height:100vh;
            letter-spacing:-0.01em; overflow-x:hidden;
        }
        .bg-neo { position:fixed; inset:0; z-index:-3; background:var(--black); overflow:hidden; }
        .bg-neo::before {
            content:''; position:absolute; inset:0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(100,210,255,0.18), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(10,132,255,0.12), transparent);
            filter:blur(80px);
        }
        .header {
            position:sticky; top:0; z-index:100; padding:12px 16px;
            background:rgba(10,10,12,0.55);
            backdrop-filter:var(--blur-glass); -webkit-backdrop-filter:var(--blur-glass);
            border-bottom:1px solid var(--glass-border);
            display:flex; align-items:center; gap:12px;
            padding-top:calc(12px + env(safe-area-inset-top,0px));
            box-shadow:var(--glass-highlight);
        }
        .back-btn {
            width:38px; height:38px; border-radius:50%; background:var(--glass-2);
            border:1px solid var(--glass-border); color:var(--text);
            display:flex; align-items:center; justify-content:center;
            text-decoration:none; font-size:14px; transition:all var(--spring);
            box-shadow:var(--glass-highlight); flex-shrink:0;
        }
        .back-btn:hover { border-color:var(--cyan); background:rgba(100,210,255,0.15); }
        .header-title { font-size:15px; font-weight:700; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .container { max-width:1000px; margin:0 auto; padding:16px; }
        .video-container {
            position:relative; width:100%; aspect-ratio:16/9; background:#000;
            border-radius:var(--r-lg); overflow:hidden;
            border:1px solid var(--glass-border-bright);
            box-shadow:0 0 40px rgba(100,210,255,0.15), var(--shadow-3), var(--glass-highlight);
            margin-bottom:16px;
        }
        .video-container video { width:100%; height:100%; display:block; }
        .plyr-loading-overlay {
            position:absolute; inset:0; display:none; flex-direction:column;
            align-items:center; justify-content:center; background:rgba(0,0,0,0.85);
            backdrop-filter:blur(20px); z-index:10; gap:16px;
        }
        .plyr-loading-overlay.active { display:flex; }
        .spinner-circle {
            width:50px; height:50px; border-radius:50%;
            border:3px solid rgba(255,255,255,0.08);
            border-top-color:var(--cyan); border-right-color:var(--purple);
            animation:spin 1s linear infinite;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
        .loading-text { font-size:12px; font-weight:600; color:var(--text-dim); letter-spacing:2px; text-transform:uppercase; }
        .info-card {
            background:var(--glass-1); backdrop-filter:var(--blur-glass);
            border:1px solid var(--glass-border); border-radius:var(--r-lg);
            padding:18px; margin-bottom:14px;
            box-shadow:var(--glass-highlight), var(--shadow-2);
        }
        .info-header { display:flex; gap:14px; align-items:flex-start; margin-bottom:16px; }
        .info-poster {
            width:75px; aspect-ratio:2/3; object-fit:cover;
            border-radius:var(--r-sm); border:1px solid var(--glass-border-bright);
            box-shadow:var(--shadow-2); flex-shrink:0;
        }
        .info-content { flex:1; min-width:0; }
        .info-title { font-size:18px; font-weight:800; line-height:1.2; margin-bottom:6px; }
        .info-meta {
            display:flex; flex-wrap:wrap; gap:8px;
            font-size:11px; color:var(--text-dim); font-weight:600; margin-bottom:6px;
        }
        .info-meta span { display:inline-flex; align-items:center; gap:4px; }
        .info-meta i { color:var(--cyan); font-size:10px; }
        .play-btn-small {
            width:100%; padding:13px 18px;
            background:#fff; color:var(--black);
            border:none; border-radius:50px; cursor:pointer;
            display:flex; align-items:center; justify-content:center; gap:10px;
            font-size:14px; font-weight:800; font-family:inherit;
            transition:all var(--spring);
            box-shadow:0 8px 24px rgba(255,255,255,0.2), inset 0 1px 0 rgba(255,255,255,0.5);
            margin-bottom:10px;
        }
        .play-btn-small:hover { transform:translateY(-2px); box-shadow:0 12px 32px rgba(255,255,255,0.3), inset 0 1px 0 rgba(255,255,255,0.5); }
        .play-btn-small i { font-size:13px; }
        .toast {
            position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
            background:rgba(20,20,22,0.95); backdrop-filter:var(--blur-glass);
            border:1px solid var(--glass-border-bright); color:var(--text);
            padding:10px 20px; border-radius:50px; font-size:12px; font-weight:600;
            z-index:10000; opacity:0; transition:all 0.3s var(--spring); pointer-events:none;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="bg-neo"></div>

<div class="header">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <div class="header-title" id="headerTitle">Chargement...</div>
</div>

<div class="container">
    <div class="video-container">
        <video id="player-video" playsinline webkit-playsinline crossorigin controls></video>
        <div class="plyr-loading-overlay" id="plyr-loading-overlay">
            <div class="spinner-circle"></div>
            <div class="loading-text" id="loadingText">Chargement...</div>
        </div>
    </div>

    <div class="info-card">
        <div class="info-header">
            <img id="infoPoster" class="info-poster" src="" alt="Poster">
            <div class="info-content">
                <h1 id="infoTitle" class="info-title">Chargement...</h1>
                <div class="info-meta" id="infoMeta"></div>
            </div>
        </div>
        <button class="play-btn-small" id="playMainBtn">
            <i class="fas fa-play"></i> Play
        </button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>
// ============================================================
// ✅ API RENDER OU A
// ============================================================
const API_BASE_URL = 'https://moviebox-api-snrn.onrender.com';

const params = new URLSearchParams(window.location.search);
const data = {
    subjectId: params.get('subjectId') || '',
    title: params.get('title') || 'Film',
    poster: params.get('poster') || '',
    year: params.get('year') || '2025',
    rating: params.get('rating') || 'N/A',
    type: params.get('type') || 'movie'
};

document.getElementById('headerTitle').textContent = data.title;
document.getElementById('infoPoster').src = data.poster || 'https://via.placeholder.com/300x450/1a1a1c/4a4a52?text=No+Image';
document.getElementById('infoTitle').textContent = data.title;
document.getElementById('infoMeta').innerHTML = `
    <span><i class="fas fa-calendar"></i> ${data.year}</span>
    <span><i class="fas fa-star"></i> ${data.rating}</span>
    <span>${data.type === 'series' ? 'Série' : 'Film'}</span>
`;

const videoEl = document.getElementById('player-video');
const loadingOverlay = document.getElementById('plyr-loading-overlay');
const loadingText = document.getElementById('loadingText');
let player = null;

window.addEventListener('load', () => {
    if (typeof Plyr !== 'undefined') {
        player = new Plyr(videoEl, {
            controls: ['play-large', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'pip', 'fullscreen'],
            settings: ['speed'],
            speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
        });
        player.on('playing', () => loadingOverlay.classList.remove('active'));
        player.on('waiting', () => loadingOverlay.classList.add('active'));
        player.on('canplay', () => loadingOverlay.classList.remove('active'));
    }
    loadVideo();
});

async function loadVideo() {
    loadingOverlay.classList.add('active');
    loadingText.textContent = 'Recherche de sources...';
    
    try {
        const res = await fetch(`${API_BASE_URL}/api/stream/${data.subjectId}`);
        
        if (!res.ok) throw new Error(`API error: ${res.status}`);
        
        const json = await res.json();
        
        if (json.streams && json.streams.length > 0) {
            const best = json.streams[0];
            loadingText.textContent = `Chargement ${best.quality}...`;
            
            if (player) {
                player.source = {
                    type: 'video',
                    sources: [{ src: best.url, type: 'video/mp4' }],
                    poster: data.poster
                };
            } else {
                videoEl.src = best.url;
            }
            
            loadingOverlay.classList.remove('active');
            showToast(`✅ ${best.quality} prêt`);
            return;
        }
        
        throw new Error('No stream');
    } catch (e) {
        console.error('Erè:', e);
        showToast('⚠️ Demo ap jwe');
        
        const demoUrl = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
        if (player) {
            player.source = { type: 'video', sources: [{ src: demoUrl, type: 'video/mp4' }] };
        } else {
            videoEl.src = demoUrl;
        }
        loadingOverlay.classList.remove('active');
    }
}

document.getElementById('playMainBtn').addEventListener('click', () => {
    if (player) player.play();
});

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
}
</script>
</body>
</html>
