<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLAST PROXY - Premium</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a2e;
            --text: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #666680;
            --accent: #6c5ce7;
            --accent-secondary: #a29bfe;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --success: #00b894;
            --error: #ff7675;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Liquid Background */
        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        
        .liquid-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            animation: floatOrb 15s infinite;
        }
        
        .liquid-orb:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #6c5ce7, transparent);
            top: -100px;
            left: -100px;
        }
        
        .liquid-orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #a29bfe, transparent);
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }
        
        .liquid-orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #00b894, transparent);
            top: 50%;
            left: 50%;
            animation-delay: -10s;
        }
        
        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(150px, -100px) scale(1.2); }
            50% { transform: translate(-100px, 150px) scale(0.8); }
            75% { transform: translate(100px, 100px) scale(1.1); }
        }
        
        /* Login Section */
        .login-section {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: var(--glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: containerAppear 0.8s ease;
        }
        
        @keyframes containerAppear {
            from { transform: translateY(50px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        
        .logo {
            text-align: center;
            margin-bottom: 35px;
        }
        
        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
            box-shadow: 0 15px 40px rgba(108, 92, 231, 0.4);
        }
        
        .logo-icon svg {
            width: 32px;
            height: 32px;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .logo h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .logo p {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 13px;
        }
        
        .input-group {
            position: relative;
            margin: 30px 0;
        }
        
        .input-group input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(108, 92, 231, 0.3);
            border-radius: 15px;
            color: var(--text);
            font-size: 16px;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(108, 92, 231, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .input-group input::placeholder {
            color: var(--text-muted);
        }
        
        .input-group label {
            position: absolute;
            left: 15px;
            top: -12px;
            background: var(--bg-primary);
            padding: 0 10px;
            color: var(--accent-secondary);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        .btn-activate {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }
        
        .btn-activate:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(108, 92, 231, 0.4);
        }
        
        .btn-activate:active {
            transform: translateY(0);
        }
        
        .btn-activate:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            display: none;
            font-size: 14px;
        }
        
        .status-message.success {
            display: block;
            background: rgba(0, 184, 148, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }
        
        .status-message.error {
            display: block;
            background: rgba(255, 118, 117, 0.1);
            color: var(--error);
            border: 1px solid var(--error);
        }
        
        .status-message.loading {
            display: block;
            background: rgba(108, 92, 231, 0.1);
            color: var(--accent-secondary);
            border: 1px solid var(--accent);
        }
        
        .powered-by {
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 11px;
            letter-spacing: 1px;
        }
        
        .powered-by strong {
            color: var(--accent-secondary);
        }
        
        /* Menu Section */
        .menu-section {
            position: relative;
            z-index: 10;
            display: none;
            min-height: 100vh;
            padding: 20px;
        }
        
        .menu-section.active {
            display: block;
        }
        
        .navbar {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-radius: 20px;
            margin-bottom: 30px;
        }
        
        .navbar-brand {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .user-info {
            background: var(--glass);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
        }
        
        .logout-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .logout-btn:hover {
            background: var(--error);
            border-color: var(--error);
            color: white;
        }
        
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .hologram-section {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
        }
        
        .hologram-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .feature-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s;
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            border-color: rgba(108, 92, 231, 0.3);
        }
        
        .feature-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .feature-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), rgba(162, 155, 254, 0.2));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-right: 15px;
        }
        
        .feature-title {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 20px;
            transition: all 0.3s;
        }
        
        .status-indicator.active {
            color: var(--success);
            background: rgba(0, 184, 148, 0.1);
            border: 1px solid var(--success);
        }
        
        .status-indicator.inactive {
            color: var(--error);
            background: rgba(255, 118, 117, 0.1);
            border: 1px solid var(--error);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: dotPulse 1.5s infinite;
        }
        
        .status-indicator.active .status-dot {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }
        
        .status-indicator.inactive .status-dot {
            background: var(--error);
            box-shadow: 0 0 10px var(--error);
        }
        
        @keyframes dotPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.5); }
        }
        
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #444;
            transition: .4s;
            border-radius: 34px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: #888;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: var(--success);
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(24px);
            background-color: white;
        }
        
        .feature-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
        
        @media (max-width: 480px) {
            .login-container {
                padding: 35px 25px;
                border-radius: 25px;
            }
            
            .logo h1 {
                font-size: 22px;
            }
            
            .navbar {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
        }
    </style>
</head>

            { key: 'BLAST-30D-MMMM2-NNNN2-OOOO2', duration: 30 },

        // Clés déjà utilisées
        let usedLicenses = JSON.parse(localStorage.getItem('blast_used_licenses') || '{}');
        
        // Détecter IP
        async function detectUserIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return 'Unknown';
            }
        }
        
        // Activer la licence
        async function activateLicense() {
            const licenseKey = document.getElementById('licenseInput').value.trim();
            const statusMessage = document.getElementById('statusMessage');
            const activateBtn = document.getElementById('activateBtn');
            
            if (!licenseKey) {
                showStatus('Veuillez entrer votre clé de licence', 'error');
                return;
            }
            
            const userIP = await detectUserIP();
            const license = VALID_LICENSES.find(l => l.key === licenseKey);
            
            if (!license) {
                showStatus('Clé invalide', 'error');
                return;
            }
            
            if (usedLicenses[licenseKey]) {
                const used = usedLicenses[licenseKey];
                
                if (used.ip !== userIP) {
                    showStatus('Cette clé est liée à une autre IP', 'error');
                    return;
                }
                
                if (used.expiresAt > Date.now()) {
                    showStatus('Licence active!', 'success');
                    localStorage.setItem('blast_license', JSON.stringify({
                        key: licenseKey,
                        userIP: userIP,
                        duration: used.duration,
                        activatedAt: used.activatedAt,
                        expiresAt: used.expiresAt
                    }));
                    
                    setTimeout(() => showMenu(userIP, used.expiresAt), 1000);
                    return;
                } else {
                    showStatus('Cette clé a expiré', 'error');
                    return;
                }
            }
            
            showStatus('Validation en cours...', 'loading');
            activateBtn.disabled = true;
            
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            const expiresAt = Date.now() + license.duration * 24 * 60 * 60 * 1000;
            
            usedLicenses[licenseKey] = {
                ip: userIP,
                duration: license.duration,
                activatedAt: Date.now(),
                expiresAt: expiresAt
            };
            
            localStorage.setItem('blast_used_licenses', JSON.stringify(usedLicenses));
            
            showStatus('Licence valide!', 'success');
            
            localStorage.setItem('blast_license', JSON.stringify({
                key: licenseKey,
                userIP: userIP,
                duration: license.duration,
                activatedAt: Date.now(),
                expiresAt: expiresAt
            }));
            
            setTimeout(() => showMenu(userIP, expiresAt), 1000);
        }
        
        // Afficher le menu
        function showMenu(userIP, expiresAt) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('menuSection').classList.add('active');
            
            document.getElementById('userInfo').innerHTML = `
                <strong>IP:</strong> ${userIP}<br>
                <strong>Expire:</strong> ${new Date(expiresAt).toLocaleDateString('fr-FR')}
            `;
            
            loadFeatures();
        }
        
        function showStatus(message, type) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.textContent = message;
            statusMessage.className = 'status-message ' + type;
        }
        
        // Toggle feature
        function toggleFeature(featureName) {
            const checkbox = document.getElementById(featureName);
            const statusIndicator = document.getElementById(`status-${featureName}`);
            const features = JSON.parse(localStorage.getItem('blast_features') || '{}');
            
            features[featureName] = checkbox.checked;
            localStorage.setItem('blast_features', JSON.stringify(features));
            
            if (checkbox.checked) {
                statusIndicator.className = 'status-indicator active';
                statusIndicator.innerHTML = '<span class="status-dot"></span> ACTIVE';
            } else {
                statusIndicator.className = 'status-indicator inactive';
                statusIndicator.innerHTML = '<span class="status-dot"></span> OFFLINE';
            }
        }
        
        // Charger features
        function loadFeatures() {
            const features = JSON.parse(localStorage.getItem('blast_features') || '{}');
            Object.keys(features).forEach(feature => {
                const checkbox = document.getElementById(feature);
                const statusIndicator = document.getElementById(`status-${feature}`);
                
                if (checkbox && features[feature]) {
                    checkbox.checked = true;
                    statusIndicator.className = 'status-indicator active';
                    statusIndicator.innerHTML = '<span class="status-dot"></span> ACTIVE';
                }
            });
        }
        
        // Logout
        function logout() {
            localStorage.removeItem('blast_license');
            localStorage.removeItem('blast_features');
            
            document.getElementById('menuSection').classList.remove('active');
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('licenseInput').value = '';
            document.getElementById('activateBtn').disabled = false;
        }
        
        // Vérifier licence au chargement
        window.onload = function() {
            const savedLicense = localStorage.getItem('blast_license');
            if (savedLicense) {
                const license = JSON.parse(savedLicense);
                if (license.expiresAt > Date.now()) {
                    showMenu(license.userIP, license.expiresAt);
                }
            }
        };
        
        // Touche Entrée
        document.getElementById('licenseInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                activateLicense();
            }
        });
    </script>
</body>
</html>
