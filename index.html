<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>BLAST FLIX - Accueil</title>
  <link rel="preconnect" href="https://pbcdnw.aoneroom.com" crossorigin>
  <link rel="dns-prefetch" href="https://pbcdnw.aoneroom.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased; }
    :root {
      --black:#000; --charcoal:#121214;
      --cyan:#64d2ff; --blue:#0a84ff; --purple:#bf5af2; --pink:#ff375f; --gold:#ffd60a;
      --glass-1:rgba(255,255,255,0.035); --glass-2:rgba(255,255,255,0.07);
      --glass-border:rgba(255,255,255,0.09); --glass-border-bright:rgba(255,255,255,0.22);
      --glass-highlight:inset 0 1px 0 rgba(255,255,255,0.20);
      --text:#f5f5f7; --text-dim:rgba(245,245,247,0.55);
      --r-lg:24px; --blur-glass:blur(40px) saturate(180%);
      --spring:0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    html { scroll-behavior:smooth; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;
      background:var(--black); color:var(--text); min-height:100vh;
      padding-bottom:80px; overflow-x:hidden;
    }
    .bg-neo { position:fixed; inset:0; z-index:-3; background:var(--black); pointer-events:none; }
    .bg-neo::before {
      content:''; position:absolute; inset:0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(100,210,255,0.22), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(10,132,255,0.15), transparent),
        radial-gradient(ellipse 50% 30% at 0% 50%, rgba(191,90,242,0.1), transparent);
      filter:blur(80px);
      animation:bgPulse 8s ease-in-out infinite;
    }
    @keyframes bgPulse {
      0%, 100% { opacity:1; }
      50% { opacity:0.7; }
    }
    .noise {
      position:fixed; inset:0; z-index:-1; opacity:0.05; pointer-events:none;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode:overlay;
    }
    /* HEADER */
    .header {
      position:sticky; top:0; z-index:100; padding:16px 20px;
      background:rgba(10,10,12,0.7); backdrop-filter:var(--blur-glass);
      -webkit-backdrop-filter:var(--blur-glass);
      border-bottom:1px solid var(--glass-border);
      display:flex; align-items:center; justify-content:space-between;
      padding-top:calc(16px + env(safe-area-inset-top,0px));
      box-shadow:var(--glass-highlight);
    }
    .logo { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
    .logo-mark {
      width:36px; height:36px; border-radius:12px;
      background:linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
      display:flex; align-items:center; justify-content:center;
      color:var(--black); font-size:16px;
      box-shadow:0 6px 20px rgba(100,210,255,0.5), inset 0 1px 0 rgba(255,255,255,0.5);
      animation:logoPulse 3s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow:0 6px 20px rgba(100,210,255,0.5), inset 0 1px 0 rgba(255,255,255,0.5); }
      50% { box-shadow:0 6px 30px rgba(100,210,255,0.8), inset 0 1px 0 rgba(255,255,255,0.5); }
    }
    .logo-text {
      font-size:19px; font-weight:800;
      background:linear-gradient(135deg, var(--cyan), var(--purple));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .header-actions { display:flex; gap:8px; align-items:center; }
    .icon-btn {
      width:42px; height:42px; border-radius:50%;
      background:var(--glass-2); border:1px solid var(--glass-border);
      color:var(--text); display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:all var(--spring);
    }
    .icon-btn:hover { border-color:var(--cyan); background:rgba(100,210,255,0.15); transform:scale(1.05); }
    .icon-btn.random:hover { border-color:var(--gold); background:rgba(255,214,10,0.15); color:var(--gold); }
    /* HERO */
    .hero { position:relative; height:520px; overflow:hidden; margin-bottom:24px; }
    .hero-bg {
      position:absolute; inset:0; background-size:cover; background-position:center;
      transition:opacity 0.8s ease, transform 0.8s ease;
      will-change:opacity, transform;
      animation:heroZoom 10s ease-in-out infinite alternate;
    }
    @keyframes heroZoom {
      from { transform:scale(1); }
      to { transform:scale(1.05); }
    }
    .hero-bg::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(to top, rgba(0,0,0,0.98) 0%, rgba(0,0,0,0.6) 40%, transparent 80%);
    }
    .hero-content {
      position:absolute; bottom:0; left:0; right:0;
      padding:28px 20px; z-index:2; max-width:1200px; margin:0 auto;
      animation:heroSlideIn 0.6s ease-out;
    }
    @keyframes heroSlideIn {
      from { opacity:0; transform:translateY(20px); }
      to { opacity:1; transform:translateY(0); }
    }
    .hero-badge {
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 12px; background:rgba(100,210,255,0.2);
      border:1px solid rgba(100,210,255,0.5); border-radius:50px;
      font-size:10px; font-weight:700; color:var(--cyan); margin-bottom:12px;
      backdrop-filter:blur(20px);
      animation:badgeGlow 2s ease-in-out infinite;
    }
    @keyframes badgeGlow {
      0%, 100% { box-shadow:0 0 20px rgba(100,210,255,0.3); }
      50% { box-shadow:0 0 30px rgba(100,210,255,0.6); }
    }
    .hero-title {
      font-size:clamp(28px, 7vw, 44px); font-weight:900; line-height:1.1;
      margin-bottom:10px; text-shadow:0 2px 20px rgba(0,0,0,0.8);
    }
    .hero-meta {
      display:flex; gap:12px; flex-wrap:wrap;
      font-size:13px; color:var(--text-dim); margin-bottom:18px; font-weight:600;
    }
    .hero-meta span { display:inline-flex; align-items:center; gap:4px; }
    .hero-meta i { color:var(--cyan); font-size:10px; }
    .hero-meta .rating { color:var(--gold); font-weight:800; }
    .hero-btns { display:flex; gap:10px; flex-wrap:wrap; }
    .btn-play {
      padding:12px 24px; background:#fff; color:var(--black);
      border:none; border-radius:50px; font-size:14px; font-weight:800;
      cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:8px;
      box-shadow:0 8px 24px rgba(255,255,255,0.2); text-decoration:none;
      transition:all var(--spring);
    }
    .btn-play:hover { transform:scale(1.05); box-shadow:0 10px 30px rgba(255,255,255,0.4); }
    .btn-play:active { transform:scale(0.96); }
    .btn-info {
      padding:12px 24px; background:rgba(255,255,255,0.15); color:#fff;
      border:1px solid rgba(255,255,255,0.3); border-radius:50px;
      font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
      display:inline-flex; align-items:center; gap:8px;
      backdrop-filter:blur(20px); text-decoration:none;
      transition:all var(--spring);
    }
    .btn-info:hover { background:rgba(255,255,255,0.25); transform:scale(1.05); }
    /* CATEGORIES */
    .categories {
      display:flex; gap:8px; padding:0 20px 24px;
      overflow-x:auto; scrollbar-width:none; max-width:1200px; margin:0 auto;
      -webkit-overflow-scrolling:touch;
    }
    .categories::-webkit-scrollbar { display:none; }
    .cat {
      padding:10px 18px; background:var(--glass-1);
      border:1px solid var(--glass-border); border-radius:50px;
      color:var(--text-dim); font-size:13px; font-weight:600;
      white-space:nowrap; cursor:pointer; font-family:inherit;
      transition:all var(--spring);
    }
    .cat.active {
      background:linear-gradient(135deg, rgba(100,210,255,0.25), rgba(191,90,242,0.2));
      border-color:var(--cyan); color:var(--cyan);
      box-shadow:0 4px 20px rgba(100,210,255,0.3);
      transform:scale(1.05);
    }
    /* CONTENT */
    .content { max-width:1200px; margin:0 auto; padding:0 20px; }
    .section { margin-bottom:36px; animation:fadeInUp 0.5s ease-out; }
    @keyframes fadeInUp {
      from { opacity:0; transform:translateY(20px); }
      to { opacity:1; transform:translateY(0); }
    }
    .section-head {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:16px;
    }
    .section-title {
      font-size:20px; font-weight:800;
      display:flex; align-items:center; gap:10px;
    }
    .section-title i { color:var(--cyan); font-size:16px; }
    .section-title .top-badge {
      background:linear-gradient(135deg, var(--gold), #ff9500);
      color:var(--black); font-size:11px; font-weight:900;
      padding:4px 10px; border-radius:50px;
      animation:badgePulse 2s ease-in-out infinite;
      box-shadow:0 2px 10px rgba(255,214,10,0.5);
    }
    @keyframes badgePulse {
      0%, 100% { transform:scale(1); }
      50% { transform:scale(1.05); }
    }
    .see-all {
      display:inline-flex; align-items:center; gap:6px;
      padding:8px 16px; border-radius:50px;
      background:var(--glass-2); border:1px solid var(--glass-border);
      color:var(--cyan); font-size:12px; font-weight:700;
      text-decoration:none; cursor:pointer; font-family:inherit;
      transition:all var(--spring);
    }
    .see-all:hover { background:rgba(100,210,255,0.15); border-color:var(--cyan); transform:translateX(4px); }
    .see-all i { font-size:10px; }
    /* CAROUSEL */
    .carousel-wrap { position:relative; margin:0 -20px; padding:0 20px; }
    .carousel {
      display:flex; gap:14px; overflow-x:auto; scrollbar-width:none;
      padding:4px 0 12px; scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
    }
    .carousel::-webkit-scrollbar { display:none; }
    .carousel .card { flex:0 0 200px; scroll-snap-align:start; }
    /* GRID */
    .grid { display:grid; grid-template-columns:repeat(6, 1fr); gap:12px; }
    .card {
      border-radius:var(--r-lg); overflow:hidden;
      background:var(--glass-1); border:1px solid var(--glass-border);
      cursor:pointer; transition:all var(--spring);
      text-decoration:none; color:inherit; display:block;
      box-shadow:var(--glass-highlight), 0 4px 12px rgba(0,0,0,0.3);
      position:relative; transform:translateZ(0); will-change:transform;
    }
    .card:hover {
      transform:translateY(-6px) scale(1.02) translateZ(0);
      border-color:var(--glass-border-bright);
      box-shadow:0 20px 40px rgba(0,0,0,0.6), 0 0 30px rgba(100,210,255,0.2);
    }
    .poster-wrap {
      position:relative; width:100%; aspect-ratio:2/3;
      overflow:hidden; background:linear-gradient(135deg, #1a1a1c, #2a2a2e);
    }
    .poster {
      width:100%; height:100%; object-fit:cover; display:block;
      transition:transform 0.5s ease, opacity 0.3s ease;
      opacity:0; position:relative; z-index:1;
    }
    .poster.loaded { opacity:1; }
    .card:hover .poster { transform:scale(1.08); }
    .poster-skeleton {
      position:absolute; inset:0;
      background:linear-gradient(90deg, #1a1a1c 25%, #2a2a2e 50%, #1a1a1c 75%);
      background-size:200% 100%;
      animation:shimmer 1.5s infinite; z-index:0;
    }
    @keyframes shimmer {
      0% { background-position:200% 0; }
      100% { background-position:-200% 0; }
    }
    /* BADGES */
    .card-hd {
      position:absolute; top:8px; right:8px; z-index:2;
      padding:3px 7px; background:rgba(0,0,0,0.75);
      border:1px solid rgba(255,255,255,0.2); border-radius:5px;
      font-size:9px; font-weight:800; color:var(--cyan);
      backdrop-filter:blur(10px);
    }
    .rank-badge {
      position:absolute; top:8px; left:8px; z-index:3;
      width:34px; height:34px; border-radius:50%;
      background:linear-gradient(135deg, var(--gold), #ff9500);
      color:var(--black); font-weight:900; font-size:15px;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 12px rgba(255,214,10,0.5);
      border:2px solid rgba(255,255,255,0.3);
    }
    /* FAVORI BTN */
    .fav-card-btn {
      position:absolute; top:8px; right:8px; z-index:3;
      width:32px; height:32px; border-radius:50%;
      background:rgba(0,0,0,0.75); backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.2);
      color:rgba(255,255,255,0.7); font-size:13px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:all var(--spring);
    }
    .fav-card-btn:hover { background:rgba(255,55,95,0.25); border-color:var(--pink); color:var(--pink); transform:scale(1.1); }
    .fav-card-btn.active {
      background:linear-gradient(135deg, var(--pink), var(--purple));
      border-color:var(--pink); color:#fff;
      box-shadow:0 4px 12px rgba(255,55,95,0.5);
    }
    .fav-card-btn.active i { animation:heartBeat 0.6s ease; }
    @keyframes heartBeat {
      0%, 100% { transform:scale(1); }
      25% { transform:scale(1.4); }
      50% { transform:scale(1.1); }
      75% { transform:scale(1.3); }
    }
    /* EPISODES BADGE (pou seri) */
    .card-episodes {
      display:inline-flex; align-items:center; gap:4px;
      font-size:9px; color:var(--cyan); font-weight:700;
      background:rgba(100,210,255,0.15);
      padding:2px 6px; border-radius:4px; margin-top:4px;
    }
    .card-episodes i { font-size:8px; }
    /* CARD INFO */
    .card-info { padding:9px 11px; }
    .card-title {
      font-size:12px; font-weight:700;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      margin-bottom:3px;
    }
    .card-meta { display:flex; gap:6px; font-size:10px; color:var(--text-dim); align-items:center; flex-wrap:wrap; }
    .card-meta .rating { color:var(--gold); font-weight:700; display:inline-flex; align-items:center; gap:2px; }
    .card-meta .rating i { font-size:8px; }
    /* FOOTER */
    .footer {
      position:fixed; bottom:0; left:0; right:0; z-index:90;
      padding:12px 20px; background:rgba(10,10,12,0.9);
      backdrop-filter:var(--blur-glass);
      border-top:1px solid var(--glass-border);
      display:flex; align-items:center; justify-content:space-around;
      padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    }
    .footer-btn {
      display:flex; flex-direction:column; align-items:center; gap:4px;
      color:var(--text-dim); text-decoration:none;
      font-size:10px; font-weight:600;
      padding:8px 16px; border-radius:14px;
      transition:all var(--spring);
    }
    .footer-btn i { font-size:20px; }
    .footer-btn.active { color:var(--cyan); }
    .footer-btn:hover { color:var(--cyan); }
    /* SEARCH */
    .search-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.7);
      backdrop-filter:blur(40px);
      z-index:200; display:none;
      align-items:flex-start; justify-content:center; padding:100px 20px 20px;
    }
    .search-overlay.active { display:flex; }
    .search-box {
      width:100%; max-width:560px; padding:12px 12px 12px 20px;
      border-radius:50px; display:flex; align-items:center; gap:12px;
      background:var(--glass-2); backdrop-filter:blur(60px);
      border:1px solid var(--glass-border-bright);
    }
    .search-box i { color:var(--text-dim); font-size:18px; }
    .search-box input {
      flex:1; background:transparent; border:none; outline:none;
      color:var(--text); font-size:16px; font-family:inherit;
    }
    .search-close {
      width:38px; height:38px; border-radius:50%;
      background:var(--glass-2); border:1px solid var(--glass-border);
      color:var(--text); display:flex; align-items:center; justify-content:center;
      cursor:pointer;
    }
    .empty-state { text-align:center; padding:60px 20px; color:var(--text-dim); }
    .empty-state i { font-size:48px; opacity:0.4; margin-bottom:16px; display:block; }
    @media (max-width: 1024px) {
      .grid { grid-template-columns:repeat(4, 1fr); }
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns:repeat(3, 1fr); gap:8px; }
      .content { padding:0 14px; }
      .hero { height:460px; }
      .carousel-wrap { margin:0 -14px; padding:0 14px; }
      .carousel .card { flex:0 0 140px; }
      .card-title { font-size:11px; }
      .card-info { padding:8px 9px; }
      .categories { padding:0 14px 24px; }
    }
    @media (max-width: 380px) {
      .grid { grid-template-columns:repeat(2, 1fr); }
    }
  </style>
</head>

<div class="bg-neo"></div>

<header class="header">

const STATE = {
  heroMovies: [MOVIES[0], MOVIES[5], MOVIES[10], MOVIES[20], MOVIES[30]],
  heroIndex: 0,
  heroTimer: null,
  currentFilter: 'all',
  searchQuery: '',
  searchTimer: null,
  imageObserver: null,
  imageCache: new Set()
};

// ============================================================
// ✅ INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  setupSearch();
  setupCategories();
  updateHero();
  startHeroRotation();
  renderAllSections();
});

// ============================================================
// ✅ HERO ROTATION
// ============================================================
function updateHero() {
  const m = STATE.heroMovies[STATE.heroIndex];
  const heroBg = document.getElementById('heroBg');
  heroBg.style.backgroundImage = `url(${m.poster})`;
  document.getElementById('heroTitle').textContent = m.title;
  document.getElementById('heroMeta').innerHTML = `
    <span><i class="fas fa-calendar"></i> ${m.year}</span>
    <span class="rating"><i class="fas fa-star"></i> ${m.rating}</span>
    <span><i class="fas fa-tag"></i> ${m.genre}</span>
  `;
  const params = new URLSearchParams({ subjectId: m.subjectId, title: m.title, poster: m.poster, year: m.year, rating: m.rating, type: m.type, detailPath: m.detailPath, desc: m.desc });
  const url = `player.html?${params.toString()}`;
  document.getElementById('heroPlay').href = url;
  document.getElementById('heroInfo').href = url;
}

function startHeroRotation() {
  if (STATE.heroTimer) clearInterval(STATE.heroTimer);
  STATE.heroTimer = setInterval(() => {
    STATE.heroIndex = (STATE.heroIndex + 1) % STATE.heroMovies.length;
    updateHero();
  }, 5500);
}

// ============================================================
// ✅ CATEGORIES
// ============================================================
function setupCategories() {
  const container = document.getElementById('categoryTabs');
  const categories = ['all', 'Action', 'Drama', 'Comedy', 'Crime', 'Sci-Fi', 'Animation', 'Series'];
  const labels = { 'all':'Tous', 'Action':'Action', 'Drama':'Drama', 'Comedy':'Comédie', 'Crime':'Crime', 'Sci-Fi':'Sci-Fi', 'Animation':'Animation', 'Series':'Séries' };
  container.innerHTML = categories.map(cat => `<button class="cat ${cat==='all'?'active':''}" data-cat="${cat}">${labels[cat]}</button>`).join('');
  container.querySelectorAll('.cat').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.cat').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      STATE.currentFilter = btn.dataset.cat;
      renderAllSections();
    });
  });
}

// ============================================================
// ✅ RENDER ALL SECTIONS
// ============================================================
function renderAllSections() {
  const main = document.getElementById('mainContent');
  
  let filtered = MOVIES;
  if (STATE.currentFilter === 'Series') filtered = MOVIES.filter(m => m.type === 'series');
  else if (STATE.currentFilter !== 'all') filtered = MOVIES.filter(m => m.genre.includes(STATE.currentFilter));
  
  if (STATE.searchQuery) {
    const q = STATE.searchQuery;
    filtered = filtered.filter(m => m.title.toLowerCase().includes(q) || m.genre.toLowerCase().includes(q));
  }
  
  let html = '';
  
  // ===== TOP 5 SERIES =====
  const topSeries = MOVIES.filter(m => m.title === "Breaking Bad" || m.title === "Game of Thrones" || m.title === "Prison Break" || m.title === "Stranger Things" || m.title === "Money Heist");
  
  if (topSeries.length > 0 && STATE.currentFilter === 'all' && !STATE.searchQuery) {
    html += `
      <div class="section">
        <div class="section-head">
          <h2 class="section-title"><i class="fas fa-crown" style="color:var(--gold);"></i> Top 5 Séries <span class="top-badge">TOP</span></h2>
        </div>
        <div class="carousel-wrap">
          <div class="carousel">
            ${topSeries.map((m, i) => createCarouselCard(m, i + 1)).join('')}
          </div>
        </div>
      </div>`;
  }
  
  // ===== TOP 5 FILMS =====
  const topFilms = MOVIES.filter(m => m.title === "Sinners" || m.title === "One Battle After Another" || m.title === "Mission: Impossible - The Final Reckoning" || m.title === "Ballerina" || m.title === "The Accountant 2");
  
  if (topFilms.length > 0 && STATE.currentFilter === 'all' && !STATE.searchQuery) {
    html += `
      <div class="section">
        <div class="section-head">
          <h2 class="section-title"><i class="fas fa-fire"></i> Top 5 Films <span class="top-badge">TOP</span></h2>
          <a href="movies.html" class="see-all">Voir tout <i class="fas fa-chevron-right"></i></a>
        </div>
        <div class="carousel-wrap">
          <div class="carousel">
            ${topFilms.map((m, i) => createCarouselCard(m, i + 1)).join('')}
          </div>
        </div>
      </div>`;
  }
  
  // ===== TOP 6 ANIMATION =====
  const topAnimation = MOVIES.filter(m => m.genre === "Animation").slice(0, 6);
  
  if (topAnimation.length > 0 && STATE.currentFilter === 'all' && !STATE.searchQuery) {
    html += `
      <div class="section">
        <div class="section-head">
          <h2 class="section-title"><i class="fas fa-palette" style="color:var(--pink);"></i> Top 6 Animation Netflix</h2>
          <a href="movies.html?genre=Animation" class="see-all">Voir tout <i class="fas fa-chevron-right"></i></a>
        </div>
        <div class="carousel-wrap">
          <div class="carousel">
            ${topAnimation.map((m, i) => createCarouselCard(m, i + 1)).join('')}
          </div>
        </div>
      </div>`;
  }
  
  // ===== BOUTON "VOIR TOUS" =====
  if (STATE.currentFilter === 'all' && !STATE.searchQuery) {
    html += `
      <div class="section" style="margin-bottom:24px;">
        <a href="movies.html" class="see-all" style="width:100%; justify-content:center; padding:14px;">
          <i class="fas fa-th"></i> Voir tous les films <i class="fas fa-arrow-right"></i>
        </a>
      </div>`;
  }
  
  // ===== KATEGORI (6 fim chak) =====
  const grouped = {};
  filtered.forEach(m => {
    const g = m.genre.split(',')[0].trim();
    if (!grouped[g]) grouped[g] = [];
    grouped[g].push(m);
  });
  
  Object.keys(grouped).forEach(genre => {
    html += `
      <div class="section">
        <div class="section-head">
          <h2 class="section-title"><i class="fas fa-film"></i> ${genre}</h2>
          <a href="movies.html?genre=${encodeURIComponent(genre)}" class="see-all">Voir tout <i class="fas fa-chevron-right"></i></a>
        </div>
        <div class="grid">${grouped[genre].slice(0, 6).map(m => createCard(m)).join('')}</div>
      </div>`;
  });
  
  if (filtered.length === 0) {
    main.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><h3>Aucun film trouvé</h3></div>`;
    return;
  }
  
  main.innerHTML = html;
  setupLazyLoading();
}

// ============================================================
// ✅ CAROUSEL CARD (ak rank number)
// ============================================================
function createCarouselCard(m, rank) {
  const params = new URLSearchParams({ subjectId: m.subjectId, title: m.title, poster: m.poster, year: m.year, rating: m.rating, type: m.type, detailPath: m.detailPath, desc: m.desc, episodes: m.episodes || '', seasons: m.seasons || '' });
  const isFav = checkFavorite(m.subjectId);
  return `
    <a href="player.html?${params.toString()}" class="card">
      <div class="poster-wrap">
        <div class="rank-badge">${rank}</div>
        <button class="fav-card-btn ${isFav ? 'active' : ''}" onclick="event.preventDefault(); event.stopPropagation(); toggleFavoriteCard('${m.subjectId}', this);">
          <i class="fas fa-heart"></i>
        </button>
        <div class="poster-skeleton"></div>
        <img class="poster" data-src="${m.poster}" alt="${m.title}" loading="lazy" decoding="async"
             onerror="this.style.display='none';">
        <div class="card-hd">HD</div>
      </div>
      <div class="card-info">
        <div class="card-title">${m.title}</div>
        <div class="card-meta">
          <span>${m.year}</span>
          <span class="rating"><i class="fas fa-star"></i>${m.rating}</span>
        </div>
        ${m.type === 'series' && m.episodes ? `<div class="card-episodes"><i class="fas fa-tv"></i> S${m.seasons} • ${m.episodes} ép.</div>` : ''}
      </div>
    </a>`;
}

// ============================================================
// ✅ NORMAL CARD
// ============================================================
function createCard(m) {
  const params = new URLSearchParams({ subjectId: m.subjectId, title: m.title, poster: m.poster, year: m.year, rating: m.rating, type: m.type, detailPath: m.detailPath, desc: m.desc, episodes: m.episodes || '', seasons: m.seasons || '' });
  const isFav = checkFavorite(m.subjectId);
  return `
    <a href="player.html?${params.toString()}" class="card">
      <div class="poster-wrap">
        <button class="fav-card-btn ${isFav ? 'active' : ''}" onclick="event.preventDefault(); event.stopPropagation(); toggleFavoriteCard('${m.subjectId}', this);">
          <i class="fas fa-heart"></i>
        </button>
        <div class="poster-skeleton"></div>
        <img class="poster" data-src="${m.poster}" alt="${m.title}" loading="lazy" decoding="async"
             onerror="this.style.display='none';">
        <div class="card-hd">HD</div>
      </div>
      <div class="card-info">
        <div class="card-title">${m.title}</div>
        <div class="card-meta">
          <span>${m.year}</span>
          <span class="rating"><i class="fas fa-star"></i>${m.rating}</span>
        </div>
        ${m.type === 'series' && m.episodes ? `<div class="card-episodes"><i class="fas fa-tv"></i> S${m.seasons} • ${m.episodes} ép.</div>` : ''}
      </div>
    </a>`;
}

// ============================================================
// ✅ FAVORIS
// ============================================================
function checkFavorite(subjectId) {
  try {
    const favs = JSON.parse(localStorage.getItem('blastflix_favorites') || '[]');
    return favs.some(f => f.subjectId === subjectId);
  } catch { return false; }
}

function toggleFavoriteCard(subjectId, btn) {
  let favs = [];
  try { favs = JSON.parse(localStorage.getItem('blastflix_favorites') || '[]'); } catch {}
  
  const exists = favs.some(f => f.subjectId === subjectId);
  const movie = MOVIES.find(m => m.subjectId === subjectId);
  
  if (exists) {
    favs = favs.filter(f => f.subjectId !== subjectId);
    btn.classList.remove('active');
  } else if (movie) {
    favs.unshift({
      subjectId: movie.subjectId, title: movie.title, poster: movie.poster,
      year: movie.year, rating: movie.rating, type: movie.type,
      detailPath: movie.detailPath, desc: movie.desc,
      addedAt: Date.now()
    });
    btn.classList.add('active');
  }
  
  localStorage.setItem('blastflix_favorites', JSON.stringify(favs));
}

// ============================================================
// ✅ LAZY LOADING
// ============================================================
function setupLazyLoading() {
  if (STATE.imageObserver) STATE.imageObserver.disconnect();
  
  if ('IntersectionObserver' in window) {
    STATE.imageObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          const src = img.dataset.src;
          if (src) {
            img.src = src;
            img.onload = () => {
              img.classList.add('loaded');
              STATE.imageCache.add(src);
              const skel = img.parentElement.querySelector('.poster-skeleton');
              if (skel) skel.style.display = 'none';
            };
            img.removeAttribute('data-src');
          }
          obs.unobserve(img);
        }
      });
    }, { rootMargin: '300px', threshold: 0.01 });
    
    document.querySelectorAll('.poster[data-src]').forEach(img => STATE.imageObserver.observe(img));
  } else {
    document.querySelectorAll('.poster[data-src]').forEach(img => {
      img.src = img.dataset.src;
      img.onload = () => {
        img.classList.add('loaded');
        const skel = img.parentElement.querySelector('.poster-skeleton');
        if (skel) skel.style.display = 'none';
      };
    });
  }
}

// ============================================================
// ✅ RANDOM FILM
// ============================================================
document.getElementById('randomBtn').addEventListener('click', () => {
  const random = MOVIES[Math.floor(Math.random() * MOVIES.length)];
  const params = new URLSearchParams({ subjectId: random.subjectId, title: random.title, poster: random.poster, year: random.year, rating: random.rating, type: random.type, detailPath: random.detailPath, desc: random.desc });
  window.location.href = `player.html?${params.toString()}`;
});

// ============================================================
// ✅ SEARCH
// ============================================================
function setupSearch() {
  const searchBtn = document.getElementById('searchBtn');
  const searchOverlay = document.getElementById('searchOverlay');
  const closeSearch = document.getElementById('closeSearch');
  const searchInput = document.getElementById('searchInput');
  
  searchBtn.addEventListener('click', () => {
    searchOverlay.classList.add('active');
    setTimeout(() => searchInput.focus(), 100);
  });
  
  const close = () => {
    searchOverlay.classList.remove('active');
    searchInput.value = '';
    STATE.searchQuery = '';
    renderAllSections();
  };
  
  closeSearch.addEventListener('click', close);
  searchOverlay.addEventListener('click', (e) => { if (e.target === searchOverlay) close(); });
  
  searchInput.addEventListener('input', (e) => {
    clearTimeout(STATE.searchTimer);
    STATE.searchTimer = setTimeout(() => {
      STATE.searchQuery = e.target.value.trim().toLowerCase();
      renderAllSections();
    }, 200);
  });
}
