<!-- index.html - Login Page avec Redirection vers dashboard.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLAST PROXY - Activation</title>
    <style>
        :root {
            /* Palette graphite / noir / argent — plus froide, plus "metal" */
            --bg-primary: #07070a;
            --bg-secondary: #101014;
            --bg-floor: #0c0c10;
            --text: #eef0f4;
            --text-secondary: #9aa1ae;
            --text-muted: #565b68;
            --accent: #8b93a6;
            --accent-2: #d7dce4;
            --accent-glow: #b7bfcf;
            --glass: rgba(255, 255, 255, 0.035);
            --glass-border: rgba(255, 255, 255, 0.14);
            --glass-border-strong: rgba(215, 220, 228, 0.35);
            --success: #6bcf9a;
            --error: #ff8078;
            --grid-line: rgba(180, 190, 205, 0.07);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            perspective: 1400px;
        }

        /* ---------- Fond 3D : sol en grille + brume + orbes metalliques ---------- */
        .liquid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background:
                radial-gradient(ellipse 90% 60% at 50% 0%, rgba(140, 150, 170, 0.10), transparent 60%),
                linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-floor) 100%);
        }

        .grid-floor {
            position: absolute;
            left: -50%;
            right: -50%;
            bottom: -10%;
            height: 70%;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: rotateX(78deg);
            transform-origin: bottom;
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent 85%);
            mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent 85%);
            animation: floorDrift 10s linear infinite;
            opacity: 0.8;
        }

        @keyframes floorDrift {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 0 60px, 0 0; }
        }

        .liquid-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            animation: floatOrb 18s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        .liquid-orb:nth-child(2) {
            width: 460px;
            height: 460px;
            background: radial-gradient(circle, #4b5262, transparent 70%);
            top: -120px;
            left: -100px;
        }

        .liquid-orb:nth-child(3) {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, #6e7688, transparent 70%);
            bottom: -80px;
            right: -60px;
            animation-delay: -6s;
        }

        .liquid-orb:nth-child(4) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #9aa3b5, transparent 70%);
            top: 45%;
            left: 55%;
            animation-delay: -12s;
            opacity: 0.18;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            25% { transform: translate3d(120px, -90px, 60px) scale(1.15); }
            50% { transform: translate3d(-90px, 110px, -40px) scale(0.85); }
            75% { transform: translate3d(90px, 70px, 30px) scale(1.05); }
        }

        /* Particules flottantes fines, pour la profondeur */
        .spark {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--accent-2);
            opacity: 0;
            animation: sparkRise linear infinite;
        }

        @keyframes sparkRise {
            0%   { transform: translateY(0) translateX(0); opacity: 0; }
            10%  { opacity: 0.5; }
            90%  { opacity: 0.15; }
            100% { transform: translateY(-620px) translateX(20px); opacity: 0; }
        }

        /* ---------- Carte glass, avec tilt 3D au mouvement de souris ---------- */
        .tilt-wrap {
            position: relative;
            z-index: 10;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
        }

        .login-container {
            position: relative;
            background: linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
            backdrop-filter: blur(28px) saturate(120%);
            -webkit-backdrop-filter: blur(28px) saturate(120%);
            border: 1px solid var(--glass-border);
            border-radius: 26px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow:
                0 40px 90px rgba(0, 0, 0, 0.55),
                0 1px 0 rgba(255, 255, 255, 0.06) inset,
                0 0 0 1px rgba(0,0,0,0.4);
            animation: containerAppear 0.8s cubic-bezier(.2,.8,.2,1);
            transform-style: preserve-3d;
        }

        /* Trait de lumiere en haut de la carte, façon reflet metal */
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 8%;
            right: 8%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-border-strong), transparent);
        }

        /* Grain subtil pour casser l'effet "plastique" du glass */
        .login-container::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 26px;
            pointer-events: none;
            background-image: radial-gradient(rgba(255,255,255,0.5) 0.6px, transparent 0.6px);
            background-size: 3px 3px;
            opacity: 0.03;
            mix-blend-mode: overlay;
        }

        @keyframes containerAppear {
            from { transform: translateY(50px) rotateX(8deg) scale(0.92); opacity: 0; }
            to   { transform: translateY(0) rotateX(0deg) scale(1); opacity: 1; }
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
            transform: translateZ(40px);
        }

        .logo-icon {
            width: 74px;
            height: 74px;
            background: linear-gradient(150deg, #3a3f4a, #12141a 65%);
            border: 1px solid var(--glass-border-strong);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: floatIcon 4s ease-in-out infinite;
            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.18),
                inset 0 -8px 16px rgba(0,0,0,0.4);
        }

        .logo-icon svg {
            width: 30px;
            height: 30px;
            filter: drop-shadow(0 0 6px rgba(215, 220, 228, 0.5));
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotateZ(0deg); }
            50% { transform: translateY(-10px) rotateZ(4deg); }
        }

        .logo h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff, var(--accent) 60%, #6a7180);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            color: var(--text-muted);
            margin-top: 6px;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .input-group {
            position: relative;
            margin: 30px 0;
            transform: translateZ(25px);
        }

        .input-group input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(155, 163, 178, 0.25);
            border-radius: 14px;
            color: var(--text);
            font-size: 16px;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-2);
            box-shadow: 0 0 0 4px rgba(180, 188, 202, 0.12), 0 0 24px rgba(180, 188, 202, 0.15);
            background: rgba(255, 255, 255, 0.06);
        }

        .input-group input::placeholder {
            color: var(--text-muted);
        }

        .input-group label {
            position: absolute;
            left: 15px;
            top: -12px;
            background: #101014;
            padding: 0 10px;
            color: var(--accent-2);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            border-radius: 6px;
        }

        .btn-activate {
            width: 100%;
            padding: 18px;
            background: linear-gradient(150deg, #3d4250, #1a1c22 70%);
            color: var(--accent-2);
            border: 1px solid var(--glass-border-strong);
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            transform: translateZ(30px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12);
        }

        .btn-activate::before {
            content: '';
            position: absolute;
            top: 0;
            left: -60%;
            width: 40%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-20deg);
            transition: left 0.6s ease;
        }

        .btn-activate:hover {
            transform: translateZ(30px) translateY(-3px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.18);
            border-color: var(--accent-2);
        }

        .btn-activate:hover::before {
            left: 130%;
        }

        .btn-activate:active {
            transform: translateZ(30px) translateY(0);
        }

        .btn-activate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            display: none;
            font-size: 14px;
            transform: translateZ(20px);
        }

        .status-message.success {
            display: block;
            background: rgba(107, 207, 154, 0.08);
            color: var(--success);
            border: 1px solid rgba(107, 207, 154, 0.4);
        }

        .status-message.error {
            display: block;
            background: rgba(255, 128, 120, 0.08);
            color: var(--error);
            border: 1px solid rgba(255, 128, 120, 0.4);
        }

        .status-message.loading {
            display: block;
            background: rgba(180, 188, 202, 0.06);
            color: var(--accent-2);
            border: 1px solid rgba(180, 188, 202, 0.3);
        }

        .powered-by {
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 11px;
            letter-spacing: 1px;
            transform: translateZ(15px);
        }

        .powered-by strong {
            color: var(--accent-2);
        }

        @media (prefers-reduced-motion: reduce) {
            .liquid-orb, .grid-floor, .spark, .logo-icon, .login-container {
                animation: none !important;
            }
            .tilt-wrap {
                transition: none !important;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 35px 25px;
                margin: 20px;
                border-radius: 22px;
            }

            .logo h1 {
                font-size: 21px;
            }
        }
    </style>
</head>
<body>
    <div class="liquid-bg">
        <div class="grid-floor"></div>
        <div class="liquid-orb"></div>
        <div class="liquid-orb"></div>
        <div class="liquid-orb"></div>
        <div id="sparks"></div>
    </div>

    <div class="tilt-wrap" id="tiltWrap">
        <div class="login-container">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                </div>
                <h1>BLAST PROXY</h1>
                <p>Système d'Activation Premium</p>
            </div>

            <div class="input-group">
                <label>CLÉ DE LICENCE</label>
                <input type="text" id="licenseInput" placeholder="Entrez votre clé de licence..." maxlength="50" autocomplete="off">
            </div>

            <button class="btn-activate" id="activateBtn" onclick="activateLicense()">
                Activer
            </button>

            <div class="status-message" id="statusMessage"></div>

            <div class="powered-by">
                Powered by <strong>BLAST PROXY SAFE</strong>
            </div>
        </div>
    </div>

    <script>
        // 50 Clés valides (cachées - admin only)
        const VALID_LICENSES = [
            // 20 Clés de 1 Jour
            { key: 'BLAST-1D-AAAA1-BBBB1-CCCC1', duration: 1 },
            { key: 'BLAST-1D-AAAA2-BBBB2-CCCC2', duration: 1 },
            { key: 'BLAST-1D-AAAA3-BBBB3-CCCC3', duration: 1 },
            { key: 'BLAST-1D-AAAA4-BBBB4-CCCC4', duration: 1 },
            { key: 'BLAST-1D-AAAA5-BBBB5-CCCC5', duration: 1 },
            { key: 'BLAST-1D-AAAA6-BBBB6-CCCC6', duration: 1 },
            { key: 'BLAST-1D-AAAA7-BBBB7-CCCC7', duration: 1 },
            { key: 'BLAST-1D-AAAA8-BBBB8-CCCC8', duration: 1 },
            { key: 'BLAST-1D-AAAA9-BBBB9-CCCC9', duration: 1 },
            { key: 'BLAST-1D-AAAA0-BBBB0-CCCC0', duration: 1 },
            { key: 'BLAST-1D-DDDD1-EEEE1-FFFF1', duration: 1 },
            { key: 'BLAST-1D-DDDD2-EEEE2-FFFF2', duration: 1 },
            { key: 'BLAST-1D-DDDD3-EEEE3-FFFF3', duration: 1 },
            { key: 'BLAST-1D-DDDD4-EEEE4-FFFF4', duration: 1 },
            { key: 'BLAST-1D-DDDD5-EEEE5-FFFF5', duration: 1 },
            { key: 'BLAST-1D-DDDD6-EEEE6-FFFF6', duration: 1 },
            { key: 'BLAST-1D-DDDD7-EEEE7-FFFF7', duration: 1 },
            { key: 'BLAST-1D-DDDD8-EEEE8-FFFF8', duration: 1 },
            { key: 'BLAST-1D-DDDD9-EEEE9-FFFF9', duration: 1 },
            { key: 'BLAST-1D-DDDD0-EEEE0-FFFF0', duration: 1 },

            // 20 Clés de 7 Jours
            { key: 'BLAST-7D-GGGG1-HHHH1-IIII1', duration: 7 },
            { key: 'BLAST-7D-GGGG2-HHHH2-IIII2', duration: 7 },
            { key: 'BLAST-7D-GGGG3-HHHH3-IIII3', duration: 7 },
            { key: 'BLAST-7D-GGGG4-HHHH4-IIII4', duration: 7 },
            { key: 'BLAST-7D-GGGG5-HHHH5-IIII5', duration: 7 },
            { key: 'BLAST-7D-GGGG6-HHHH6-IIII6', duration: 7 },
            { key: 'BLAST-7D-GGGG7-HHHH7-IIII7', duration: 7 },
            { key: 'BLAST-7D-GGGG8-HHHH8-IIII8', duration: 7 },
            { key: 'BLAST-7D-GGGG9-HHHH9-IIII9', duration: 7 },
            { key: 'BLAST-7D-GGGG0-HHHH0-IIII0', duration: 7 },
            { key: 'BLAST-7D-JJJJ1-KKKK1-LLLL1', duration: 7 },
            { key: 'BLAST-7D-JJJJ2-KKKK2-LLLL2', duration: 7 },
            { key: 'BLAST-7D-JJJJ3-KKKK3-LLLL3', duration: 7 },
            { key: 'BLAST-7D-JJJJ4-KKKK4-LLLL4', duration: 7 },
            { key: 'BLAST-7D-JJJJ5-KKKK5-LLLL5', duration: 7 },
            { key: 'BLAST-7D-JJJJ6-KKKK6-LLLL6', duration: 7 },
            { key: 'BLAST-7D-JJJJ7-KKKK7-LLLL7', duration: 7 },
            { key: 'BLAST-7D-JJJJ8-KKKK8-LLLL8', duration: 7 },
            { key: 'BLAST-7D-JJJJ9-KKKK9-LLLL9', duration: 7 },
            { key: 'BLAST-7D-JJJJ0-KKKK0-LLLL0', duration: 7 },

            // 10 Clés de 30 Jours
            { key: 'BLAST-30D-MMMM1-NNNN1-OOOO1', duration: 30 },
            { key: 'BLAST-30D-MMMM2-NNNN2-OOOO2', duration: 30 },
            { key: 'BLAST-30D-MMMM3-NNNN3-OOOO3', duration: 30 },
            { key: 'BLAST-30D-MMMM4-NNNN4-OOOO4', duration: 30 },
            { key: 'BLAST-30D-MMMM5-NNNN5-OOOO5', duration: 30 },
            { key: 'BLAST-30D-PPPP1-QQQQ1-RRRR1', duration: 30 },
            { key: 'BLAST-30D-PPPP2-QQQQ2-RRRR2', duration: 30 },
            { key: 'BLAST-30D-PPPP3-QQQQ3-RRRR3', duration: 30 },
            { key: 'BLAST-30D-PPPP4-QQQQ4-RRRR4', duration: 30 },
            { key: 'BLAST-30D-PPPP5-QQQQ5-RRRR5', duration: 30 }
        ];

        // Clés déjà utilisées avec IP
        let usedLicenses = JSON.parse(localStorage.getItem('blast_used_licenses') || '{}');

        // Détecter l'IP automatiquement
        async function detectUserIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return 'Unknown';
            }
        }

        // Activer la licence
        async function activateLicense() {
            const licenseKey = document.getElementById('licenseInput').value.trim();
            const statusMessage = document.getElementById('statusMessage');
            const activateBtn = document.getElementById('activateBtn');

            if (!licenseKey) {
                showStatus('Veuillez entrer votre clé de licence', 'error');
                return;
            }

            // Détecter IP
            const userIP = await detectUserIP();

            // Vérifier la clé
            const license = VALID_LICENSES.find(l => l.key === licenseKey);

            if (!license) {
                showStatus('Clé invalide', 'error');
                return;
            }

            // Vérifier si déjà utilisée
            if (usedLicenses[licenseKey]) {
                const used = usedLicenses[licenseKey];

                if (used.ip !== userIP) {
                    showStatus('Cette clé est liée à une autre IP', 'error');
                    return;
                }

                if (used.expiresAt > Date.now()) {
                    showStatus('Licence active! Redirection...', 'success');

                    localStorage.setItem('blast_license', JSON.stringify({
                        key: licenseKey,
                        userIP: userIP,
                        duration: used.duration,
                        activatedAt: used.activatedAt,
                        expiresAt: used.expiresAt,
                        sessionId: 'SESSION-' + Math.random().toString(36).substr(2, 9).toUpperCase()
                    }));

                    // REDIRECTION VERS DASHBOARD.HTML
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                    return;
                } else {
                    showStatus('Cette clé a expiré', 'error');
                    return;
                }
            }

            // Validation en cours
            showStatus('Validation en cours...', 'loading');
            activateBtn.disabled = true;

            await new Promise(resolve => setTimeout(resolve, 1500));

            const expiresAt = Date.now() + license.duration * 24 * 60 * 60 * 1000;

            // Enregistrer
            usedLicenses[licenseKey] = {
                ip: userIP,
                duration: license.duration,
                activatedAt: Date.now(),
                expiresAt: expiresAt
            };

            localStorage.setItem('blast_used_licenses', JSON.stringify(usedLicenses));

            showStatus('Licence valide! Redirection...', 'success');

            localStorage.setItem('blast_license', JSON.stringify({
                key: licenseKey,
                userIP: userIP,
                duration: license.duration,
                activatedAt: Date.now(),
                expiresAt: expiresAt,
                sessionId: 'SESSION-' + Math.random().toString(36).substr(2, 9).toUpperCase()
            }));

            // REDIRECTION VERS DASHBOARD.HTML
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);
        }

        function showStatus(message, type) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.textContent = message;
            statusMessage.className = 'status-message ' + type;
        }

        // Vérifier licence existante
        window.onload = function() {
            const savedLicense = localStorage.getItem('blast_license');
            if (savedLicense) {
                const license = JSON.parse(savedLicense);
                if (license.expiresAt > Date.now()) {
                    // REDIRECTION DIRECTE VERS DASHBOARD
                    window.location.href = 'dashboard.html';
                }
            }

            // Génère quelques particules flottantes pour la profondeur du décor
            const sparkContainer = document.getElementById('sparks');
            for (let i = 0; i < 25; i++) {
                const s = document.createElement('div');
                s.className = 'spark';
                s.style.left = Math.random() * 100 + 'vw';
                s.style.bottom = (Math.random() * 20) + 'vh';
                s.style.animationDuration = (6 + Math.random() * 8) + 's';
                s.style.animationDelay = (Math.random() * 8) + 's';
                sparkContainer.appendChild(s);
            }
        };

        // Touche Entrée
        document.getElementById('licenseInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                activateLicense();
            }
        });

        // Tilt 3D léger de la carte selon la position de la souris (effet "glass" flottant)
        const tiltWrap = document.getElementById('tiltWrap');
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches === false) {
            document.addEventListener('mousemove', function(e) {
                const x = (e.clientX / window.innerWidth - 0.5) * 2;
                const y = (e.clientY / window.innerHeight - 0.5) * 2;
                tiltWrap.style.transform = `rotateY(${x * 6}deg) rotateX(${-y * 6}deg)`;
            });
            document.addEventListener('mouseleave', function() {
                tiltWrap.style.transform = 'rotateY(0deg) rotateX(0deg)';
            });
        }
    </script>
</body>
</html>
