<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>BLAST FLIX - Films</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root {
      --black:#000; --charcoal:#121214; --slate:#1c1c1f;
      --cyan:#64d2ff; --blue:#0a84ff; --purple:#bf5af2;
      --glass-1:rgba(255,255,255,0.035); --glass-border:rgba(255,255,255,0.09);
      --glass-border-bright:rgba(255,255,255,0.22);
      --text:#f5f5f7; --text-dim:rgba(245,245,247,0.55);
      --r-lg:20px; --r-md:14px;
      --spring:0.4s cubic-bezier(0.34,1.56,0.64,1);
      --blur-glass:blur(40px) saturate(180%);
    }
    body {
      font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;
      background:var(--black); color:var(--text); min-height:100vh;
      padding-bottom:80px;
    }
    .bg-neo { position:fixed; inset:0; z-index:-3; background:var(--black); }
    .bg-neo::before {
      content:''; position:absolute; inset:0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(100,210,255,0.22), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(10,132,255,0.15), transparent);
      filter:blur(80px);
    }
    .header {
      position:sticky; top:0; z-index:100; padding:16px 20px;
      background:rgba(10,10,12,0.55);
      backdrop-filter:var(--blur-glass);
      border-bottom:1px solid var(--glass-border);
      display:flex; align-items:center; justify-content:space-between;
    }
    .logo { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
    .logo-mark {
      width:36px; height:36px; border-radius:12px;
      background:linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
      display:flex; align-items:center; justify-content:center;
      color:var(--black); font-size:16px;
    }
    .logo-text { font-size:19px; font-weight:800; }
    .search-bar { padding:0 20px 16px; }
    .search-input {
      width:100%; padding:12px 18px;
      background:var(--glass-1); border:1px solid var(--glass-border);
      border-radius:50px; color:var(--text);
      font-size:14px; font-family:inherit; outline:none;
    }
    .search-input:focus { border-color:var(--cyan); }
    .content { max-width:1200px; margin:0 auto; padding:20px; }
    .section-title {
      font-size:21px; font-weight:800; margin-bottom:20px;
      display:flex; align-items:center; gap:10px;
    }
    .section-title i { color:var(--cyan); }
    .grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
      gap:16px;
    }
    .card {
      border-radius:var(--r-lg); overflow:hidden;
      background:var(--glass-1); border:1px solid var(--glass-border);
      cursor:pointer; transition:all 0.45s var(--spring);
      text-decoration:none; color:inherit; display:block;
    }
    .card:hover { transform:translateY(-6px); border-color:var(--glass-border-bright); }
    .poster-wrap { width:100%; aspect-ratio:2/3; overflow:hidden; background:var(--charcoal); }
    .poster { width:100%; height:100%; object-fit:cover; display:block; }
    .info { padding:12px 14px; }
    .title { font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:4px; }
    .meta { font-size:11px; color:var(--text-dim); }
    .footer {
      position:fixed; bottom:0; left:0; right:0; z-index:90;
      padding:12px 20px; background:rgba(10,10,12,0.85);
      backdrop-filter:var(--blur-glass);
      border-top:1px solid var(--glass-border);
      display:flex; align-items:center; justify-content:space-around;
      padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    }
    .footer-btn {
      display:flex; flex-direction:column; align-items:center; gap:4px;
      color:var(--text-dim); text-decoration:none;
      font-size:10px; font-weight:600;
      padding:8px 16px; border-radius:14px;
    }
    .footer-btn i { font-size:20px; }
    .footer-btn.active { color:var(--cyan); }
    .loader {
      position:fixed; inset:0; background:var(--black); z-index:999;
      display:flex; align-items:center; justify-content:center;
    }
    .loader.hidden { display:none; }
    .loader-mark {
      width:80px; height:80px; border-radius:20px;
      background:linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
      display:flex; align-items:center; justify-content:center;
      font-size:36px; color:var(--black);
      animation:markPulse 2s infinite;
    }
    @keyframes markPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
    @media (max-width:768px) {
      .grid { grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:12px; }
      .content { padding:14px; }
    }
  </style>
</head>
<body>

<div class="bg-neo"></div>

<div class="loader" id="loader">
  <div class="loader-mark"><i class="fas fa-play"></i></div>
</div>

<header class="header">
  <a href="index.html" class="logo">
    <div class="logo-mark"><i class="fas fa-play"></i></div>
    <span class="logo-text">BLAST FLIX</span>
  </a>
</header>

<div class="search-bar">
  <input type="text" class="search-input" id="searchInput" placeholder="Rechercher un film...">
</div>

<main class="content">
  <h2 class="section-title"><i class="fas fa-fire"></i> Films <span id="movieCount"></span></h2>
  <div class="grid" id="movieGrid"></div>
</main>

<footer class="footer">
  <a href="index.html" class="footer-btn active">
    <i class="fas fa-home"></i><span>Accueil</span>
  </a>
  <a href="#" class="footer-btn">
    <i class="fas fa-search"></i><span>Recherche</span>
  </a>
  <a href="#" class="footer-btn">
    <i class="fas fa-film"></i><span>Films</span>
  </a>
  <a href="#" class="footer-btn" onclick="alert('Login pa disponib')">
    <i class="fas fa-user"></i><span>Login</span>
  </a>
</footer>

<script>
// ============================================================
// ✅ TOUT FIM OU YO (Mete tout fim ou yo isit la)
// ============================================================
const MOVIES = [
  {

    year: "2025",
    rating: "7.2",
    type: "movie",
    detailPath: "bugonia-WTd7eaSmwY2",
    desc: "Bugonia is a sci-fi thriller about a conspiracy theorist who kidnaps a CEO."
  },
  {
    subjectId: "3854326812578922640",
    title: "After the Hunt",
    poster: "https://pbcdnw.aoneroom.com/image/2025/11/21/40a1b8238733d1169d079a5e7af0fc7f.jpg",
    year: "2025",
    rating: "6.2",
    type: "movie",
    detailPath: "after-the-hunt-G9uUgYaRIA4",
    desc: "A college professor finds herself at a personal and professional crossroads when a star pupil levels an accusation against one of her colleagues."
  },
  {
    subjectId: "8759851328492438440",
    title: "Train Dreams",
    poster: "https://pbcdnw.aoneroom.com/image/2025/11/17/ad421550a04b88b8696a04264ec5a37c.jpg",
    year: "2025",
    rating: "7.7",
    type: "movie",
    detailPath: "train-dreams-OJyRf09d6ra",
    desc: "Based on Denis Johnson's beloved novella, Train Dreams is the moving portrait of Robert Grainier, a logger and railroad worker who leads a life of unexpected depth and beauty."
  },
  {
    subjectId: "407974060606504992",
    title: "The Family Plan 2",
    poster: "https://pbcdnw.aoneroom.com/image/2025/12/02/873fd90dff1123846fe6cc34c1010f10.jpg",
    year: "2025",
    rating: "5.6",
    type: "movie",
    detailPath: "the-family-plan-2-YctPw7Aw8u",
    desc: "Now that Dan's assassin days are behind him, all he wants for Christmas is quality time with his kids."
  },
  {
    subjectId: "1740329846154085032",
    title: "The Family Plan",
    poster: "https://pbcdnw.aoneroom.com/image/2025/11/02/44b4bb2b8981eb13b9ce374e1d0f6df5.jpg",
    year: "2023",
    rating: "6.3",
    type: "movie",
    detailPath: "the-family-plan-4KeFZScJy42",
    desc: "A former top assassin living incognito as a suburban dad must take his unsuspecting family on the run."
  },
  {
    subjectId: "3551015833440864784",
    title: "Resurrection Road",
    poster: "https://pbcdnw.aoneroom.com/image/2025/11/02/4dbb392a0c402c393bd4459395a18150.jpg",
    year: "2025",
    rating: "5.9",
    type: "movie",
    detailPath: "resurrection-road-2DPUL5NGje4",
    desc: "An elite squad of six Black soldiers, led by ex-slave Barabbas, have been sent on a suicide mission."
  },
  {
    subjectId: "8857965935064499248",
    title: "Playdate",
    poster: "https://pbcdnw.aoneroom.com/image/2025/10/28/edc4c3b20c646359da2ce17a49624c51.jpg",
    year: "2025",
    rating: "7.0",
    type: "movie",
    detailPath: "playdate-mr2NLFPzlya",
    desc: "Brian has just been fired from his job. He becomes a stay-at-home dad."
  },
  {
    subjectId: "144265366439707640",
    title: "One Battle After Another",
    poster: "https://pbcdnw.aoneroom.com/image/2025/11/03/19c186991294a590412ee734350cad0c.jpg",
    year: "2025",

    type: "movie",
    detailPath: "one-battle-after-another-AorB0GGJEa",
    desc: "When their evil enemy resurfaces after 16 years, a group of ex-revolutionaries reunite to rescue the daughter of one of their own."
  },
  {
    subjectId: "488603172416769952",
    title: "Roofman",
    poster: "https://pbcdnw.aoneroom.com/image/2025/11/03/e4639ad4c7e759e3385a3afc19157a57.jpg",
    year: "2025",
    rating: "7.2",
    type: "movie",
    detailPath: "roofman-axKcIQ4O5A",
    desc: "A charismatic criminal, while on the run from the police, hides in a hidden space of a toy store."
  }
];

// ============================================================
// ✅ AFICHE FIM YO
// ============================================================
function renderMovies(movies) {
  const grid = document.getElementById("movieGrid");
  
  if (movies.length === 0) {
    grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--text-dim);">Aucun film</div>`;
    return;
  }
  
  grid.innerHTML = movies.map(m => {
    const params = new URLSearchParams({
      subjectId: m.subjectId,
      title: m.title,
      poster: m.poster || '',
      year: m.year || '',
      rating: m.rating || '',
      type: m.type || 'movie',
      detailPath: m.detailPath || '',
      desc: m.desc || ''
    });
    
    return `
      <a href="player.html?${params.toString()}" class="card">
        <div class="poster-wrap">
          <img class="poster" src="${m.poster}" alt="${m.title}" loading="lazy"
               onerror="this.src='https://via.placeholder.com/300x450/1a1a1c/4a4a52?text=No+Image'">
        </div>
        <div class="info">
          <div class="title">${m.title}</div>
          <div class="meta">${m.year} • ${m.type === 'series' ? 'Série' : 'Film'}</div>
        </div>
      </a>
    `;
  }).join('');
}

// ============================================================
// ✅ SEARCH
// ============================================================
document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) {
    renderMovies(MOVIES);
    return;
  }
  const filtered = MOVIES.filter(m => m.title.toLowerCase().includes(q));
  renderMovies(filtered);
});

// ============================================================
// ✅ KÒMANSE
// ============================================================
document.getElementById("loader").classList.add("hidden");
document.getElementById("movieCount").textContent = `(${MOVIES.length})`;
renderMovies(MOVIES);
</script>
</body>
</html>
