<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BLAST PROXY - Activation</title>
    <style>
        :root {
            --bg-primary: #07070a;
            --bg-secondary: #101014;
            --bg-floor: #0c0c10;
            --text: #eef0f4;
            --text-secondary: #9aa1ae;
            --text-muted: #565b68;
            --accent: #8b93a6;
            --accent-2: #d7dce4;
            --glass: rgba(255, 255, 255, 0.035);
            --glass-border: rgba(255, 255, 255, 0.14);
            --glass-border-strong: rgba(215, 220, 228, 0.35);
            --success: #6bcf9a;
            --error: #ff8078;
            --grid-line: rgba(180, 190, 205, 0.07);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            perspective: 1400px;
            -webkit-tap-highlight-color: transparent;
            padding: 24px 16px;
        }

        .liquid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background:
                radial-gradient(ellipse 90% 60% at 50% 0%, rgba(140, 150, 170, 0.10), transparent 60%),
                linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-floor) 100%);
        }

        .grid-floor {
            position: absolute;
            left: -50%;
            right: -50%;
            bottom: -10%;
            height: 70%;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: rotateX(78deg);
            transform-origin: bottom;
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent 85%);
            mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent 85%);
            animation: floorDrift 10s linear infinite;
            opacity: 0.8;
        }

        @keyframes floorDrift {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 0 60px, 0 0; }
        }

        .liquid-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            animation: floatOrb 18s ease-in-out infinite;
        }

        .liquid-orb:nth-child(2) { width: 460px; height: 460px; background: radial-gradient(circle, #4b5262, transparent 70%); top: -120px; left: -100px; }
        .liquid-orb:nth-child(3) { width: 380px; height: 380px; background: radial-gradient(circle, #6e7688, transparent 70%); bottom: -80px; right: -60px; animation-delay: -6s; }
        .liquid-orb:nth-child(4) { width: 300px; height: 300px; background: radial-gradient(circle, #9aa3b5, transparent 70%); top: 45%; left: 55%; animation-delay: -12s; opacity: 0.18; }

        @keyframes floatOrb {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            25% { transform: translate3d(120px, -90px, 60px) scale(1.15); }
            50% { transform: translate3d(-90px, 110px, -40px) scale(0.85); }
            75% { transform: translate3d(90px, 70px, 30px) scale(1.05); }
        }

        .spark {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--accent-2);
            opacity: 0;
            animation: sparkRise linear infinite;
        }

        @keyframes sparkRise {
            0%   { transform: translateY(0) translateX(0); opacity: 0; }
            10%  { opacity: 0.5; }
            90%  { opacity: 0.15; }
            100% { transform: translateY(-620px) translateX(20px); opacity: 0; }
        }

        .tilt-wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
        }

        .login-container {
            position: relative;
            background: linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
            backdrop-filter: blur(28px) saturate(120%);
            -webkit-backdrop-filter: blur(28px) saturate(120%);
            border: 1px solid var(--glass-border);
            border-radius: 26px;
            padding: 50px 40px;
            width: 100%;
            box-shadow:
                0 40px 90px rgba(0, 0, 0, 0.55),
                0 1px 0 rgba(255, 255, 255, 0.06) inset,
                0 0 0 1px rgba(0,0,0,0.4);
            animation: containerAppear 0.8s cubic-bezier(.2,.8,.2,1);
            transform-style: preserve-3d;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 8%;
            right: 8%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-border-strong), transparent);
        }

        @keyframes containerAppear {
            from { transform: translateY(50px) rotateX(8deg) scale(0.92); opacity: 0; }
            to   { transform: translateY(0) rotateX(0deg) scale(1); opacity: 1; }
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
            transform: translateZ(40px);
        }

        .logo-icon {
            width: 74px;
            height: 74px;
            background: linear-gradient(150deg, #3a3f4a, #12141a 65%);
            border: 1px solid var(--glass-border-strong);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: floatIcon 4s ease-in-out infinite;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255,255,255,0.18);
        }

        .logo-icon svg {
            width: 30px;
            height: 30px;
            filter: drop-shadow(0 0 6px rgba(215, 220, 228, 0.5));
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotateZ(0deg); }
            50% { transform: translateY(-10px) rotateZ(4deg); }
        }

        .logo h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff, var(--accent) 60%, #6a7180);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            color: var(--text-muted);
            margin-top: 6px;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .input-group {
            position: relative;
            margin: 30px 0;
            transform: translateZ(25px);
        }

        .input-group input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(155, 163, 178, 0.25);
            border-radius: 14px;
            color: var(--text);
            font-size: 16px;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-2);
            box-shadow: 0 0 0 4px rgba(180, 188, 202, 0.12), 0 0 24px rgba(180, 188, 202, 0.15);
            background: rgba(255, 255, 255, 0.06);
        }

        .input-group label {
            position: absolute;
            left: 15px;
            top: -12px;
            background: #101014;
            padding: 0 10px;
            color: var(--accent-2);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            border-radius: 6px;
        }

        .btn-activate {
            width: 100%;
            padding: 18px;
            background: linear-gradient(150deg, #3d4250, #1a1c22 70%);
            color: var(--accent-2);
            border: 1px solid var(--glass-border-strong);
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            transform: translateZ(30px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12);
        }

        .btn-activate:hover {
            transform: translateZ(30px) translateY(-3px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.18);
        }

        .btn-activate:active {
            transform: translateZ(30px) translateY(0);
        }

        .btn-activate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            display: none;
            font-size: 14px;
        }

        .status-message.success { display: block; background: rgba(107, 207, 154, 0.08); color: var(--success); border: 1px solid rgba(107, 207, 154, 0.4); }
        .status-message.error { display: block; background: rgba(255, 128, 120, 0.08); color: var(--error); border: 1px solid rgba(255, 128, 120, 0.4); }
        .status-message.loading { display: block; background: rgba(180, 188, 202, 0.06); color: var(--accent-2); border: 1px solid rgba(180, 188, 202, 0.3); }

        .powered-by {
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 11px;
            letter-spacing: 1px;
        }

        .powered-by strong { color: var(--accent-2); }

        @media (max-width: 480px) {
            .login-container { padding: 34px 22px; border-radius: 22px; }
            .logo h1 { font-size: 21px; }
            .logo-icon { width: 62px; height: 62px; }
        }
    </style>
</head>
<body>
    <div class="liquid-bg">
        <div class="grid-floor"></div>
        <div class="liquid-orb"></div>
        <div class="liquid-orb"></div>
        <div class="liquid-orb"></div>
        <div id="sparks"></div>
    </div>

    <div class="tilt-wrap" id="tiltWrap">
        <div class="login-container">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                </div>
                <h1>BLAST PROXY</h1>
                <p>Système d'Activation Premium</p>
            </div>

            <div class="input-group">
                <label>CLÉ DE LICENCE</label>
                <input type="text" id="licenseInput" placeholder="Entrez votre clé de licence..." maxlength="50" autocomplete="off">
            </div>

            <button class="btn-activate" id="activateBtn" onclick="activateLicense()">Activer</button>

            <div class="status-message" id="statusMessage"></div>

            <div class="powered-by">Powered by <strong>BLAST PROXY SAFE</strong></div>
        </div>
    </div>

    <script>
        // 400 clés générées par défaut (200 × 1 jour, 150 × 7 jours, 50 × 30 jours)
        function generateDefaultKeys() {
            if (localStorage.getItem('blast_keys_db')) return;
            const keys = [];
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            function randSegment(len) { let s=''; for(let i=0;i<len;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; }
            for(let i=1; i<=200; i++) {
                keys.push({ key: `BLAST-1D-${String(i).padStart(4,'0')}-${randSegment(4)}`, duration: 1, status: 'active', ip: null, activatedAt: null, expiresAt: null });
            }
            for(let i=1; i<=150; i++) {
                keys.push({ key: `BLAST-7D-${String(i).padStart(4,'0')}-${randSegment(4)}`, duration: 7, status: 'active', ip: null, activatedAt: null, expiresAt: null });
            }
            for(let i=1; i<=50; i++) {
                keys.push({ key: `BLAST-30D-${String(i).padStart(4,'0')}-${randSegment(4)}`, duration: 30, status: 'active', ip: null, activatedAt: null, expiresAt: null });
            }
            localStorage.setItem('blast_keys_db', JSON.stringify(keys));
        }
        generateDefaultKeys();

        async function detectUserIP() {
            try { const r = await fetch('https://api.ipify.org?format=json'); return (await r.json()).ip; }
            catch(e) { return 'Unknown'; }
        }

        async function activateLicense() {
            const keyInput = document.getElementById('licenseInput').value.trim();
            const status = document.getElementById('statusMessage');
            if (!keyInput) { showStatus('Veuillez entrer votre clé de licence', 'error'); return; }

            const ip = await detectUserIP();
            const db = JSON.parse(localStorage.getItem('blast_keys_db') || '[]');
            const lic = db.find(k => k.key === keyInput);

            if (!lic) { showStatus('Clé invalide', 'error'); return; }
            if (lic.status === 'blocked') { showStatus('Cette clé est bloquée', 'error'); return; }
            if (lic.status === 'expired') { showStatus('Cette clé a expiré', 'error'); return; }
            if (lic.ip && lic.ip !== ip) { showStatus('Cette clé est déjà liée à une autre IP', 'error'); return; }

            if (!lic.ip) {
                lic.ip = ip;
                lic.activatedAt = Date.now();
                lic.expiresAt = Date.now() + lic.duration * 86400000;
            }
            if (lic.expiresAt < Date.now()) {
                lic.status = 'expired';
                localStorage.setItem('blast_keys_db', JSON.stringify(db));
                showStatus('Cette clé a expiré', 'error');
                return;
            }

            localStorage.setItem('blast_license', JSON.stringify({ key: lic.key, ip: lic.ip, duration: lic.duration, activatedAt: lic.activatedAt, expiresAt: lic.expiresAt }));
            showStatus('Licence valide ! Redirection...', 'success');
            setTimeout(() => window.location.href = 'dashboard.html', 1200);
        }

        function showStatus(msg, type) {
            const s = document.getElementById('statusMessage');
            s.textContent = msg;
            s.className = 'status-message ' + type;
        }

        (function() {
            const saved = JSON.parse(localStorage.getItem('blast_license') || 'null');
            if (saved && saved.expiresAt > Date.now()) window.location.href = 'dashboard.html';
        })();

        document.getElementById('licenseInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') activateLicense();
        });

        // Tilt 3D léger (seulement sur desktop)
        const tiltWrap = document.getElementById('tiltWrap');
        const supportsHoverMouse = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (supportsHoverMouse && !reducedMotion) {
            document.addEventListener('mousemove', function(e) {
                const x = (e.clientX / window.innerWidth - 0.5) * 2;
                const y = (e.clientY / window.innerHeight - 0.5) * 2;
                tiltWrap.style.transform = `rotateY(${x * 6}deg) rotateX(${-y * 6}deg)`;
            });
            document.addEventListener('mouseleave', function() {
                tiltWrap.style.transform = 'rotateY(0deg) rotateX(0deg)';
            });
        }

        // Particules
        const sparkContainer = document.getElementById('sparks');
        const sparkCount = window.innerWidth < 480 ? 12 : 25;
        for (let i = 0; i < sparkCount; i++) {
            const s = document.createElement('div');
            s.className = 'spark';
            s.style.left = Math.random() * 100 + 'vw';
            s.style.bottom = (Math.random() * 20) + 'vh';
            s.style.animationDuration = (6 + Math.random() * 8) + 's';
            s.style.animationDelay = (Math.random() * 8) + 's';
            sparkContainer.appendChild(s);
        }
    </script>
</body>
</html>
