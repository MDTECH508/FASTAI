<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>BLAST FLIX - Films</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
    html { scroll-behavior: smooth; }
    :root {
      --black: #000; --charcoal: #121214; --slate: #1c1c1f;
      --cyan: #64d2ff; --blue: #0a84ff; --purple: #bf5af2;
      --glass-1: rgba(255,255,255,0.035); --glass-2: rgba(255,255,255,0.07);
      --glass-border: rgba(255,255,255,0.09); --glass-border-bright: rgba(255,255,255,0.22);
      --glass-highlight: inset 0 1px 0 rgba(255,255,255,0.2);
      --text: #f5f5f7; --text-dim: rgba(245,245,247,0.55);
      --r-sm: 12px; --r-md: 18px; --r-lg: 24px; --r-xl: 34px;
      --shadow-2: 0 8px 24px rgba(0,0,0,0.5); --shadow-3: 0 20px 60px rgba(0,0,0,0.7);
      --spring: 0.4s cubic-bezier(0.34,1.56,0.64,1);
      --blur-glass: blur(40px) saturate(180%);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      background: var(--black); color: var(--text); min-height: 100vh; overflow-x: hidden;
      letter-spacing: -0.01em;
    }
    .bg-neo { position: fixed; inset: 0; z-index: -3; background: var(--black); overflow: hidden; }
    .bg-neo::before {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(100,210,255,0.18), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(10,132,255,0.12), transparent);
      filter: blur(80px);
    }
    .header {
      position: sticky; top: 0; z-index: 100; padding: 16px 20px;
      background: rgba(10,10,12,0.55);
      backdrop-filter: var(--blur-glass); -webkit-backdrop-filter: var(--blur-glass);
      border-bottom: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: space-between;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      box-shadow: var(--glass-highlight);
    }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .logo-mark {
      width: 36px; height: 36px; border-radius: 12px;
      background: linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
      display: flex; align-items: center; justify-content: center;
      color: var(--black); font-size: 16px;
    }
    .logo-text { font-size: 19px; font-weight: 800; }
    
    .content { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .section-title { font-size: 21px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .section-title i { color: var(--cyan); }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 16px; }
    .card {
      border-radius: var(--r-lg); overflow: hidden;
      background: var(--glass-1); border: 1px solid var(--glass-border);
      cursor: pointer; transition: all 0.45s var(--spring);
      position: relative; display: block; text-decoration: none; color: inherit;
      box-shadow: var(--glass-highlight), var(--shadow-2);
    }
    .card:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: var(--glass-border-bright);
      box-shadow: var(--glass-highlight), 0 20px 50px rgba(0,0,0,0.7);
    }
    .poster-wrap { position: relative; width: 100%; aspect-ratio: 2/3; overflow: hidden; }
    .poster { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.6s; }
    .card:hover .poster { transform: scale(1.1); }
    .rating {
      position: absolute; top: 12px; right: 12px; padding: 6px 11px;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
      border-radius: 10px; font-size: 12px; font-weight: 800;
      display: flex; align-items: center; gap: 4px; border: 1px solid rgba(255,255,255,0.15);
    }
    .rating i { color: var(--cyan); font-size: 10px; }
    .info { padding: 12px 14px; }
    .title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .meta { font-size: 11px; color: var(--text-dim); }
    
    .loader {
      position: fixed; inset: 0; background: var(--black); z-index: 999;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 20px;
    }
    .loader.hidden { display: none; }
    .loader-mark {
      width: 80px; height: 80px; border-radius: 20px;
      background: linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
      display: flex; align-items: center; justify-content: center; font-size: 36px; color: var(--black);
      animation: markPulse 2s infinite;
    }
    @keyframes markPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(20,20,22,0.95); border: 1px solid var(--glass-border-bright);
      color: var(--text); padding: 10px 20px; border-radius: 50px; font-size: 12px; font-weight: 600;
      z-index: 10000; opacity: 0; transition: all 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 768px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap: 12px; }
      .content { padding: 14px; }
    }
  </style>
</head>
<body>

<div class="bg-neo"></div>

<div class="loader" id="loader">
  <div class="loader-mark"><i class="fas fa-play"></i></div>
</div>

<header class="header">
  <a href="index.html" class="logo">
    <div class="logo-mark"><i class="fas fa-play"></i></div>
    <span class="logo-text">BLAST FLIX</span>
  </a>
</header>

<main class="content">
  <h2 class="section-title"><i class="fas fa-fire"></i> Chargement...</h2>
  <div class="grid" id="movieGrid"></div>
</main>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// ⚠️ TOUT KLE SEKRÈ OU YO (PA ITILIZE NAN SIT PIBLIK)
// ============================================================
const SECRET_KEY_DEFAULT_B64 = "NzZpUmwwN3MweFNOOWpxbUVXQXQ3OUVCSlp1bElRSXNWNjRGWnIyTw==";
const SECRET_KEY_ALT_B64 = "WHFuMm5uTzQxL0w5Mm8xaXVYaFNMSFRiWHZZNFo1Wlo2Mm04bVNMQQ==";
const MODERN_USER_AGENT = "com.community.mbox.in/50020130 (Linux; U; Android 14; en_IN; Pixel 8; Build/UD1A.230803.041; Cronet/145.0.7582.0)";
const WEB_USER_AGENT = "Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Mobile Safari/537.36";

const API_BASE = "https://h5-api.aoneroom.com/wefeed-h5api-bff";
const NATIVE_API_BASE = "https://api3.aoneroom.com";
const BOOTSTRAP_HOST = "https://apig.inmoviebox.com";
const BOOTSTRAP_URL = `${BOOTSTRAP_HOST}/wefeed-mobile-bff/tab/ranking-list?tabId=0&categoryType=4516404531735022304&page=1&perPage=1`;

const WEB_DOMAINS = [
  "https://123moviesfree.club",
  "https://movie-box.co",
  "https://movieboxonline.net",
  "https://sflix.film",
  "https://h5-api.aoneroom.com",
  "https://netnaija.film",
  "https://movieboxhd.net"
];

// ============================================================
// ✅ TMDB (POU AFICHE PLIS FIM)
// ============================================================
const TMDB_API_KEY = '0d52884a56cdb80bb562ba562d96642b';
const TMDB_BASE = 'https://api.themoviedb.org/3';
const TMDB_IMG = 'https://image.tmdb.org/t/p/w500';

async function fetchTMDB() {
  try {
    const pages = await Promise.all([
      fetch(`${TMDB_BASE}/movie/popular?api_key=${TMDB_API_KEY}&language=en-US&page=1`),
      fetch(`${TMDB_BASE}/movie/popular?api_key=${TMDB_API_KEY}&language=en-US&page=2`),
      fetch(`${TMDB_BASE}/movie/popular?api_key=${TMDB_API_KEY}&language=en-US&page=3`)
    ]);
    
    let allMovies = [];
    for (const p of pages) {
      const d = await p.json();
      allMovies.push(...(d.results || []));
    }
    
    return allMovies.map(m => ({
      subjectId: String(m.id), 
      title: m.title,
      poster: m.poster_path ? TMDB_IMG + m.poster_path : '',
      year: (m.release_date || '').slice(0, 4),
      rating: m.vote_average ? m.vote_average.toFixed(1) : 'N/A',
      type: 'movie'
    }));
  } catch (e) {
    console.warn('TMDB pa mache:', e.message);
    return [];
  }
}

// ============================================================
// ✅ FONKSYON POU JWENN FIM (6 API YO)
// ============================================================
async function fetchFromAPIs() {
  for (const domain of WEB_DOMAINS) {
    try {
      console.log(`🔍 Eseye ${domain}`);
      const res = await fetch(`${domain}/wefeed-h5api-bff/subject/filter`, {
        method: 'POST',
        headers: {
          'User-Agent': WEB_USER_AGENT,
          'Referer': `${domain}/`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ tabId: 2, page: 1, perPage: 30 })
      });
      
      if (res.ok) {
        const json = await res.json();
        const items = json.data?.items || [];
        if (items.length > 0) {
          console.log(`✅ ${items.length} fim nan ${domain}`);
          return items.map(m => ({
            subjectId: String(m.subjectId || m.subject_id),
            title: m.title,
            poster: m.cover?.url || '',
            year: (m.releaseDate || '').slice(0, 4),
            rating: m.imdbRatingValue || 'N/A',
            type: m.subjectType === 2 ? 'series' : 'movie'
          }));
        }
      }
    } catch (e) {
      console.warn(`${domain} pa mache:`, e.message);
    }
  }
  return [];
}

// ============================================================
// ✅ CHAJE FIM YO
// ============================================================
async function loadMovies() {
  const grid = document.getElementById("movieGrid");
  const title = document.querySelector('.section-title');
  
  // 1. Eseye TMDB
  console.log('🔍 Chèche nan TMDB...');
  let allMovies = await fetchTMDB();
  
  // 2. Si TMDB pa mache, eseye API yo
  if (allMovies.length === 0) {
    console.log('🔍 Chèche nan API yo...');
    allMovies = await fetchFromAPIs();
  }
  
  // 3. Fallback
  if (allMovies.length === 0) {
    console.log('⚠️ Itilize fallback');
    allMovies = [
      { subjectId:"8759851328492438440", title:"Train Dreams", poster:"https://pbcdnw.aoneroom.com/image/2025/11/17/ad421550a04b88b8696a04264ec5a37c.jpg", year:"2025", rating:7.7, type:"movie" },
      { subjectId:"4956801153355891744", title:"Stranger Things", poster:"https://pbcdnw.aoneroom.com/image/2025/12/01/56d9b04173d90d3f74bb5a7e1112ed7e.jpg", year:"2016", rating:8.6, type:"series" },
      { subjectId:"144265366439707640", title:"One Battle After Another", poster:"https://pbcdnw.aoneroom.com/image/2025/11/03/19c186991294a590412ee734350cad0c.jpg", year:"2025", rating:8.2, type:"movie" },
      { subjectId:"488603172416769952", title:"Roofman", poster:"https://pbcdnw.aoneroom.com/image/2025/11/03/e4639ad4c7e759e3385a3afc19157a57.jpg", year:"2025", rating:7.2, type:"movie" }
    ];
  }
  
  // Afiche fim yo
  document.getElementById("loader").classList.add("hidden");
  title.innerHTML = `<i class="fas fa-fire"></i> Films (${allMovies.length})`;
  
  grid.innerHTML = allMovies.map(m => {
    const params = new URLSearchParams({
      subjectId: m.subjectId,
      title: m.title,
      poster: m.poster || '',
      year: m.year || '',
      rating: m.rating || '',
      type: m.type || 'movie'
    });
    
    return `
      <a href="player.html?${params.toString()}" class="card">
        <div class="poster-wrap">
          <img class="poster" src="${m.poster}" alt="${m.title}" loading="lazy"
               onerror="this.src='https://via.placeholder.com/300x450/1a1a1c/4a4a52?text=No+Image'">
          ${m.rating && m.rating !== 'N/A' ? `<div class="rating"><i class="fas fa-star"></i>${m.rating}</div>` : ''}
        </div>
        <div class="info">
          <div class="title">${m.title}</div>
          <div class="meta">${m.year || ''} • ${m.type === 'series' ? 'Série' : 'Film'}</div>
        </div>
      </a>
    `;
  }).join('');
}

// ============================================================
// ✅ KÒMANSE
// ============================================================
loadMovies();
</script>
</body>
</html>
