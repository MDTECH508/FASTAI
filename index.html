<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0c" />
  <title>BLAST FLIX - Accueil</title>
  <link rel="preconnect" href="https://pbcdnw.aoneroom.com" crossorigin>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased; }
    :root {
      --black:#0a0a0c; --charcoal:#121214; --slate:#1c1c1f;
      --cyan:#64d2ff; --blue:#0a84ff; --purple:#bf5af2; --pink:#ff375f; --gold:#ffd60a; --green:#30d158;
      --glass-1:rgba(255,255,255,0.035); --glass-2:rgba(255,255,255,0.07);
      --glass-border:rgba(255,255,255,0.09); --glass-border-bright:rgba(255,255,255,0.22);
      --text:#f5f5f7; --text-dim:rgba(245,245,247,0.55);
      --spring:0.3s cubic-bezier(0.4,0,0.2,1);
    }
    html { scroll-behavior:smooth; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;
      background:var(--black); color:var(--text); min-height:100vh;
      padding-bottom:80px; overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
    }
    /* BACKGROUND SENP */
    .bg {
      position:fixed; inset:0; z-index:-2;
      background:radial-gradient(ellipse at 50% 0%, rgba(100,210,255,0.08), transparent 60%),
                 radial-gradient(ellipse at 100% 100%, rgba(10,132,255,0.06), transparent 50%),
                 var(--black);
    }
    /* SVG ICON */
    .svg {
      width:20px; height:20px;
      fill:none; stroke:currentColor; stroke-width:2;
      stroke-linecap:round; stroke-linejoin:round;
      display:inline-block; flex-shrink:0;
    }
    /* HEADER */
    .header {
      position:sticky; top:0; z-index:100;
      padding:12px 16px;
      background:rgba(10,10,12,0.85);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border-bottom:1px solid var(--glass-border);
      display:flex; align-items:center; justify-content:space-between;
      padding-top:calc(12px + env(safe-area-inset-top,0px));
    }
    .logo { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
    .logo-mark {
      width:34px; height:34px; border-radius:11px;
      background:linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
      display:flex; align-items:center; justify-content:center;
      color:var(--black);
      box-shadow:0 4px 16px rgba(100,210,255,0.5);
    }
    .logo-mark .svg { width:16px; height:16px; fill:currentColor; }
    .logo-text {
      font-size:18px; font-weight:900;
      background:linear-gradient(135deg, var(--cyan), var(--purple));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .header-btns { display:flex; gap:8px; }
    .icon-btn {
      width:38px; height:38px; border-radius:50%;
      background:var(--glass-2); border:1px solid var(--glass-border);
      color:var(--text); display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:all var(--spring);
    }
    .icon-btn:hover { border-color:var(--cyan); background:rgba(100,210,255,0.15); color:var(--cyan); }
    .icon-btn:hover .svg { filter:drop-shadow(0 0 6px rgba(100,210,255,0.8)); }
    /* HERO */
    .hero {
      position:relative; height:440px; overflow:hidden;
      margin-bottom:20px;
    }
    .hero-bg {
      position:absolute; inset:0;
      background-size:cover; background-position:center;
      transition:opacity 0.5s;
    }
    .hero-bg::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(to top, var(--black) 0%, rgba(10,10,12,0.7) 40%, transparent 80%);
    }
    .hero-content {
      position:absolute; bottom:0; left:0; right:0;
      padding:24px 20px; z-index:2; max-width:1200px; margin:0 auto;
    }
    .hero-badge {
      display:inline-flex; align-items:center; gap:6px;
      padding:5px 12px;
      background:rgba(100,210,255,0.15);
      border:1px solid rgba(100,210,255,0.4);
      border-radius:50px;
      font-size:10px; font-weight:800; color:var(--cyan);
      margin-bottom:12px;
    }
    .hero-badge .svg { width:12px; height:12px; filter:drop-shadow(0 0 4px rgba(100,210,255,0.8)); }
    .hero-title {
      font-size:clamp(26px, 6vw, 40px); font-weight:900; line-height:1.1;
      margin-bottom:10px;
      text-shadow:0 2px 20px rgba(0,0,0,0.9);
    }
    .hero-meta {
      display:flex; gap:12px; flex-wrap:wrap;
      font-size:13px; color:var(--text-dim); margin-bottom:16px; font-weight:600;
    }
    .hero-meta span { display:inline-flex; align-items:center; gap:4px; }
    .hero-meta .svg { width:12px; height:12px; color:var(--cyan); }
    .hero-meta .rating .svg { color:var(--gold); filter:drop-shadow(0 0 4px rgba(255,214,10,0.8)); }
    .hero-btns { display:flex; gap:10px; }
    .btn {
      padding:11px 22px; border-radius:50px;
      font-size:13px; font-weight:800;
      display:inline-flex; align-items:center; gap:8px;
      text-decoration:none; border:none;
      cursor:pointer; font-family:inherit;
      transition:all var(--spring);
    }
    .btn .svg { width:14px; height:14px; }
    .btn-primary {
      background:#fff; color:var(--black);
      box-shadow:0 6px 20px rgba(255,255,255,0.2);
    }
    .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(255,255,255,0.3); }
    .btn-secondary {
      background:rgba(255,255,255,0.1); color:#fff;
      border:1px solid rgba(255,255,255,0.2);
      backdrop-filter:blur(10px);
    }
    .btn-secondary:hover { background:rgba(255,255,255,0.15); }
    /* CATEGORIES */
    .cats {
      display:flex; gap:8px; padding:0 20px 20px;
      overflow-x:auto; scrollbar-width:none;
      max-width:1200px; margin:0 auto;
    }
    .cats::-webkit-scrollbar { display:none; }
    .cat {
      padding:8px 16px;
      background:var(--glass-1); border:1px solid var(--glass-border);
      border-radius:50px;
      color:var(--text-dim); font-size:12px; font-weight:700;
      white-space:nowrap; cursor:pointer; font-family:inherit;
      transition:all var(--spring);
    }
    .cat.active {
      background:linear-gradient(135deg, rgba(100,210,255,0.2), rgba(191,90,242,0.15));
      border-color:var(--cyan); color:var(--cyan);
      box-shadow:0 2px 12px rgba(100,210,255,0.3);
    }
    .cat:hover:not(.active) { border-color:var(--glass-border-bright); color:var(--text); }
    /* CONTENT */
    .content { max-width:1200px; margin:0 auto; padding:0 20px; }
    .section { margin-bottom:28px; }
    .sec-head {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:14px;
    }
    .sec-title {
      font-size:17px; font-weight:800;
      display:flex; align-items:center; gap:8px;
    }
    .sec-title .svg { width:16px; height:16px; color:var(--cyan); filter:drop-shadow(0 0 6px rgba(100,210,255,0.7)); }
    .sec-title .top-badge {
      background:linear-gradient(135deg, var(--gold), #ff9500);
      color:var(--black); font-size:9px; font-weight:900;
      padding:3px 8px; border-radius:50px;
      box-shadow:0 2px 8px rgba(255,214,10,0.4);
    }
    .see-all {
      display:inline-flex; align-items:center; gap:5px;
      padding:6px 12px; border-radius:50px;
      background:var(--glass-2); border:1px solid var(--glass-border);
      color:var(--cyan); font-size:11px; font-weight:700;
      text-decoration:none; transition:all var(--spring);
    }
    .see-all:hover { background:rgba(100,210,255,0.15); border-color:var(--cyan); }
    .see-all .svg { width:10px; height:10px; }
    /* CAROUSEL */
    .carousel-wrap { margin:0 -20px; padding:0 20px; }
    .carousel {
      display:flex; gap:12px;
      overflow-x:auto; scrollbar-width:none;
      padding-bottom:8px;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
    }
    .carousel::-webkit-scrollbar { display:none; }
    .carousel .card { flex:0 0 175px; scroll-snap-align:start; }
    /* GRID */
    .grid { display:grid; grid-template-columns:repeat(6, 1fr); gap:10px; }
    /* CARD */
    .card {
      border-radius:16px; overflow:hidden;
      background:var(--glass-1); border:1px solid var(--glass-border);
      cursor:pointer; text-decoration:none; color:inherit;
      display:block; position:relative;
      transition:transform 0.3s, border-color 0.3s, box-shadow 0.3s;
      transform:translateZ(0);
    }
    .card:hover {
      transform:translateY(-4px) scale(1.02);
      border-color:var(--glass-border-bright);
      box-shadow:0 12px 30px rgba(0,0,0,0.5);
    }
    .poster-wrap {
      position:relative; width:100%; aspect-ratio:2/3;
      overflow:hidden; background:var(--charcoal);
    }
    .poster {
      width:100%; height:100%; object-fit:cover; display:block;
      transition:transform 0.4s, opacity 0.3s;
      opacity:0;
    }
    .poster.loaded { opacity:1; }
    .card:hover .poster { transform:scale(1.08); }
    .poster-skel {
      position:absolute; inset:0;
      background:linear-gradient(90deg, #161618 0%, #222225 50%, #161618 100%);
      background-size:200% 100%;
      animation:shimmer 1.2s linear infinite;
    }
    @keyframes shimmer {
      0% { background-position:200% 0; }
      100% { background-position:-200% 0; }
    }
    /* BADGES */
    .badge-hd {
      position:absolute; top:6px; right:6px; z-index:2;
      padding:2px 6px;
      background:rgba(0,0,0,0.75);
      border:1px solid rgba(100,210,255,0.4);
      border-radius:4px;
      font-size:8px; font-weight:900; color:var(--cyan);
    }
    .badge-rank {
      position:absolute; top:6px; left:6px; z-index:3;
      width:30px; height:30px; border-radius:50%;
      background:linear-gradient(135deg, var(--gold), #ff9500);
      color:var(--black); font-weight:900; font-size:13px;
      display:flex; align-items:center; justify-content:center;
      border:2px solid rgba(255,255,255,0.3);
      box-shadow:0 3px 10px rgba(255,214,10,0.5);
    }
    /* FAVORI */
    .fav-btn {
      position:absolute; top:6px; right:6px; z-index:3;
      width:28px; height:28px; border-radius:50%;
      background:rgba(0,0,0,0.7);
      border:1px solid rgba(255,255,255,0.2);
      color:rgba(255,255,255,0.6);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:all var(--spring);
      padding:0;
    }
    .fav-btn .svg { width:13px; height:13px; }
    .fav-btn:hover { background:rgba(255,55,95,0.2); border-color:var(--pink); color:var(--pink); }
    .fav-btn.active {
      background:linear-gradient(135deg, var(--pink), var(--purple));
      border-color:var(--pink); color:#fff;
      box-shadow:0 3px 10px rgba(255,55,95,0.5);
    }
    .fav-btn.active .svg {
      fill:currentColor;
      filter:drop-shadow(0 0 4px rgba(255,55,95,0.8));
    }
    /* CARD INFO */
    .card-info { padding:8px 10px; }
    .card-title {
      font-size:11px; font-weight:700;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      margin-bottom:3px;
    }
    .card-meta {
      display:flex; gap:6px; font-size:9px; color:var(--text-dim);
      align-items:center; flex-wrap:wrap;
    }
    .card-meta .rating {
      color:var(--gold); font-weight:800;
      display:inline-flex; align-items:center; gap:2px;
    }
    .card-meta .rating .svg { width:8px; height:8px; fill:currentColor; stroke:none; }
    .card-ep {
      display:inline-flex; align-items:center; gap:3px;
      font-size:8px; color:var(--cyan); font-weight:700;
      background:rgba(100,210,255,0.12);
      padding:1px 5px; border-radius:3px; margin-top:3px;
    }
    /* FOOTER */
    .footer {
      position:fixed; bottom:0; left:0; right:0; z-index:90;
      padding:10px 16px;
      background:rgba(10,10,12,0.9);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border-top:1px solid var(--glass-border);
      display:flex; align-items:center; justify-content:space-around;
      padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));
    }
    .footer-btn {
      display:flex; flex-direction:column; align-items:center; gap:3px;
      color:var(--text-dim); text-decoration:none;
      font-size:9px; font-weight:700;
      padding:6px 14px; border-radius:12px;
      transition:color 0.3s;
    }
    .footer-btn .svg { width:20px; height:20px; }
    .footer-btn.active { color:var(--cyan); }
    .footer-btn.active .svg { filter:drop-shadow(0 0 6px rgba(100,210,255,0.8)); }
    /* SEARCH */
    .search-overlay {
      position:fixed; inset:0;
      background:rgba(0,0,0,0.85);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      z-index:200; display:none;
      align-items:flex-start; justify-content:center;
      padding:80px 20px 20px;
    }
    .search-overlay.active { display:flex; }
    .search-box {
      width:100%; max-width:560px;
      padding:12px 12px 12px 18px;
      border-radius:50px;
      display:flex; align-items:center; gap:12px;
      background:var(--glass-2);
      border:1px solid var(--glass-border-bright);
    }
    .search-box .svg { width:16px; height:16px; color:var(--text-dim); }
    .search-box input {
      flex:1; background:transparent; border:none; outline:none;
      color:var(--text); font-size:15px; font-family:inherit;
    }
    .search-close {
      width:34px; height:34px; border-radius:50%;
      background:var(--glass-2); border:1px solid var(--glass-border);
      color:var(--text);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
    }
    .search-close .svg { width:14px; height:14px; }
    /* EMPTY */
    .empty {
      text-align:center; padding:60px 20px; color:var(--text-dim);
      grid-column:1/-1;
    }
    .empty .svg { width:40px; height:40px; opacity:0.4; margin-bottom:12px; }
    .empty h3 { font-size:16px; color:var(--text); }
    /* MOBILE */
    @media (max-width:1024px) { .grid { grid-template-columns:repeat(4, 1fr); } }
    @media (max-width:768px) {
      .grid { grid-template-columns:repeat(3, 1fr); gap:8px; }
      .content { padding:0 14px; }
      .hero { height:400px; }
      .carousel-wrap { margin:0 -14px; padding:0 14px; }
      .carousel .card { flex:0 0 130px; }
      .cats { padding:0 14px 20px; }
      .card-title { font-size:10px; }
    }
    @media (max-width:380px) { .grid { grid-template-columns:repeat(2, 1fr); } }
    /* REDUCE MOTION */
    @media (prefers-reduced-motion: reduce) {
      * { animation:none !important; transition:none !important; }
    }
  </style>
</head>

// ============================================================
// ✅ HERO
// ============================================================
function updateHero() {
  const m = STATE.heroMovies[STATE.heroIndex];
  const heroBg = document.getElementById('heroBg');
  heroBg.style.backgroundImage = `url(${m.poster})`;
  document.getElementById('heroTitle').textContent = m.title;
  document.getElementById('heroMeta').innerHTML = `
    <span>${SVG.calendar} ${m.year}</span>
    <span class="rating">${SVG.star} ${m.rating}</span>
    <span>${SVG.film} ${m.genre}</span>
  `;
  const p = new URLSearchParams({ subjectId: m.subjectId, title: m.title, poster: m.poster, year: m.year, rating: m.rating, type: m.type, detailPath: m.detailPath, desc: m.desc, episodes: m.episodes || '', seasons: m.seasons || '' });
  const url = `player.html?${p.toString()}`;
  document.getElementById('heroPlay').href = url;
  document.getElementById('heroInfo').href = url;
}

function startHeroRotation() {
  if (STATE.heroTimer) clearInterval(STATE.heroTimer);
  STATE.heroTimer = setInterval(() => {
    STATE.heroIndex = (STATE.heroIndex + 1) % STATE.heroMovies.length;
    updateHero();
  }, 6000);
}

// ============================================================
// ✅ CATEGORIES
// ============================================================
function setupCategories() {
  const container = document.getElementById('categoryTabs');
  const cats = ['all','Action','Drama','Comedy','Crime','Sci-Fi','Animation','Series'];
  const labels = { 'all':'Tous','Action':'Action','Drama':'Drama','Comedy':'Comédie','Crime':'Crime','Sci-Fi':'Sci-Fi','Animation':'Animation','Series':'Séries' };
  container.innerHTML = cats.map(c => `<button class="cat ${c==='all'?'active':''}" data-cat="${c}">${labels[c]}</button>`).join('');
  container.querySelectorAll('.cat').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.cat').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      STATE.currentFilter = btn.dataset.cat;
      renderAllSections();
    });
  });
}

// ✅ RENDER
// ============================================================
function renderAllSections() {
  const main = document.getElementById('mainContent');
  
  let filtered = MOVIES;
  if (STATE.currentFilter === 'Series') filtered = MOVIES.filter(m => m.type === 'series');
  else if (STATE.currentFilter !== 'all') filtered = MOVIES.filter(m => m.genre.includes(STATE.currentFilter));
  
  if (STATE.searchQuery) {
    const q = STATE.searchQuery;
    filtered = filtered.filter(m => m.title.toLowerCase().includes(q) || m.genre.toLowerCase().includes(q));
  }
  
  let html = '';
  
  if (STATE.currentFilter === 'all' && !STATE.searchQuery) {
    // TOP 5 SERIES
    const topSeries = MOVIES.filter(m => m.title === "Breaking Bad" || m.title === "Game of Thrones" || m.title === "Prison Break" || m.title === "Stranger Things" || m.title === "Money Heist");
    html += `
      <div class="section">
        <div class="sec-head">
          <h2 class="sec-title">${SVG.crown} Top 5 Séries <span class="top-badge">TOP</span></h2>
        </div>
        <div class="carousel-wrap">
          <div class="carousel">${topSeries.map((m,i) => createCarousel(m, i+1)).join('')}</div>
        </div>
      </div>`;
    
    // TOP 5 FILMS
    const topFilms = MOVIES.filter(m => m.title === "Sinners" || m.title === "One Battle After Another" || m.title === "Mission: Impossible - The Final Reckoning" || m.title === "Ballerina" || m.title === "The Accountant 2");
    html += `
      <div class="section">
        <div class="sec-head">
          <h2 class="sec-title">${SVG.fire} Top 5 Films <span class="top-badge">TOP</span></h2>
          <a href="movies.html" class="see-all">Voir tout ${SVG.chevRight}</a>
        </div>
        <div class="carousel-wrap">
          <div class="carousel">${topFilms.map((m,i) => createCarousel(m, i+1)).join('')}</div>
        </div>
      </div>`;
    
    // TOP 6 ANIMATION
    const topAnim = MOVIES.filter(m => m.genre === 'Animation').slice(0,6);
    html += `
      <div class="section">
        <div class="sec-head">
          <h2 class="sec-title">${SVG.palette} Top 6 Animation</h2>
          <a href="movies.html?genre=Animation" class="see-all">Voir tout ${SVG.chevRight}</a>
        </div>
        <div class="carousel-wrap">
          <div class="carousel">${topAnim.map((m,i) => createCarousel(m, i+1)).join('')}</div>
        </div>
      </div>`;
    
    // VOIR TOUT
    html += `
      <div class="section" style="margin-bottom:20px;">
        <a href="movies.html" class="see-all" style="width:100%; justify-content:center; padding:12px;">${SVG.film} Voir tous les films ${SVG.chevRight}</a>
      </div>`;
  }
  
  // KATEGORI
  const grouped = {};
  filtered.forEach(m => {
    const g = m.genre.split(',')[0].trim();
    if (!grouped[g]) grouped[g] = [];
    grouped[g].push(m);
  });
  
  Object.keys(grouped).forEach(genre => {
    html += `
      <div class="section">
        <div class="sec-head">
          <h2 class="sec-title">${SVG.film} ${genre}</h2>
          <a href="movies.html?genre=${encodeURIComponent(genre)}" class="see-all">Voir tout ${SVG.chevRight}</a>
        </div>
        <div class="grid">${grouped[genre].slice(0,6).map(m => createCard(m)).join('')}</div>
      </div>`;
  });
  
  if (filtered.length === 0) {
    main.innerHTML = `<div class="empty">${SVG.search}<h3>Aucun film trouvé</h3></div>`;
    return;
  }
  
  main.innerHTML = html;
  setupLazyLoading();
}

// ============================================================
// ✅ CREATE CARD
// ============================================================
function createCard(m) {
  const p = new URLSearchParams({ subjectId: m.subjectId, title: m.title, poster: m.poster, year: m.year, rating: m.rating, type: m.type, detailPath: m.detailPath, desc: m.desc, episodes: m.episodes || '', seasons: m.seasons || '' });
  const isFav = checkFav(m.subjectId);
  return `
    <a href="player.html?${p.toString()}" class="card">
      <div class="poster-wrap">
        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="event.preventDefault(); event.stopPropagation(); toggleFav('${m.subjectId}', this);">${SVG.heart}</button>
        <div class="poster-skel"></div>
        <img class="poster" data-src="${m.poster}" alt="${m.title}" loading="lazy" decoding="async" onerror="this.style.display='none';">
        <div class="badge-hd">HD</div>
      </div>
      <div class="card-info">
        <div class="card-title">${m.title}</div>
        <div class="card-meta">
          <span>${m.year}</span>
          <span class="rating">${SVG.star}${m.rating}</span>
        </div>
        ${m.type === 'series' && m.episodes ? `<div class="card-ep">${SVG.tv} S${m.seasons} • ${m.episodes} ép.</div>` : ''}
      </div>
    </a>`;
}

function createCarousel(m, rank) {
  const p = new URLSearchParams({ subjectId: m.subjectId, title: m.title, poster: m.poster, year: m.year, rating: m.rating, type: m.type, detailPath: m.detailPath, desc: m.desc, episodes: m.episodes || '', seasons: m.seasons || '' });
  const isFav = checkFav(m.subjectId);
  return `
    <a href="player.html?${p.toString()}" class="card">
      <div class="poster-wrap">
        <div class="badge-rank">${rank}</div>
        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="event.preventDefault(); event.stopPropagation(); toggleFav('${m.subjectId}', this);" style="right:6px;top:6px;">${SVG.heart}</button>
        <div class="poster-skel"></div>
        <img class="poster" data-src="${m.poster}" alt="${m.title}" loading="lazy" decoding="async" onerror="this.style.display='none';">
      </div>
      <div class="card-info">
        <div class="card-title">${m.title}</div>
        <div class="card-meta">
          <span>${m.year}</span>
          <span class="rating">${SVG.star}${m.rating}</span>
        </div>
      </div>
    </a>`;
}

// ============================================================
// ✅ FAVORIS
// ============================================================
function checkFav(id) {
  try {
    const favs = JSON.parse(localStorage.getItem('blastflix_favorites') || '[]');
    return favs.some(f => f.subjectId === id);
  } catch { return false; }
}

function toggleFav(id, btn) {
  let favs = [];
  try { favs = JSON.parse(localStorage.getItem('blastflix_favorites') || '[]'); } catch {}
  const exists = favs.some(f => f.subjectId === id);
  const movie = MOVIES.find(m => m.subjectId === id);
  
  if (exists) {
    favs = favs.filter(f => f.subjectId !== id);
    btn.classList.remove('active');
  } else if (movie) {
    favs.unshift({
      subjectId: movie.subjectId, title: movie.title, poster: movie.poster,
      year: movie.year, rating: movie.rating, type: movie.type,
      detailPath: movie.detailPath, desc: movie.desc,
      addedAt: Date.now()
    });
    btn.classList.add('active');
  }
  localStorage.setItem('blastflix_favorites', JSON.stringify(favs));
}

// ============================================================
// ✅ LAZY LOADING
// ============================================================
function setupLazyLoading() {
  if (STATE.imageObserver) STATE.imageObserver.disconnect();
  
  if ('IntersectionObserver' in window) {
    STATE.imageObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          const src = img.dataset.src;
          if (src) {
            img.src = src;
            img.onload = () => {
              img.classList.add('loaded');
              const skel = img.parentElement.querySelector('.poster-skel');
              if (skel) skel.style.display = 'none';
            };
            img.removeAttribute('data-src');
          }
          obs.unobserve(img);
        }
      });
    }, { rootMargin: '200px' });
    
    document.querySelectorAll('.poster[data-src]').forEach(img => STATE.imageObserver.observe(img));
  }
}

// ============================================================
// ✅ RANDOM
// ============================================================
function goRandom() {
  const m = MOVIES[Math.floor(Math.random() * MOVIES.length)];
  const p = new URLSearchParams({ subjectId: m.subjectId, title: m.title, poster: m.poster, year: m.year, rating: m.rating, type: m.type, detailPath: m.detailPath, desc: m.desc, episodes: m.episodes || '', seasons: m.seasons || '' });
  window.location.href = `player.html?${p.toString()}`;
}

// ============================================================
// ✅ SEARCH
// ============================================================
function setupSearch() {
  const btn = document.getElementById('searchBtn');
  const overlay = document.getElementById('searchOverlay');
  const closeBtn = document.getElementById('closeSearch');
  const input = document.getElementById('searchInput');
  
  btn.addEventListener('click', () => {
    overlay.classList.add('active');
    setTimeout(() => input.focus(), 100);
  });
  
  const close = () => {
    overlay.classList.remove('active');
    input.value = '';
    STATE.searchQuery = '';
    renderAllSections();
  };
  
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  
  input.addEventListener('input', (e) => {
    clearTimeout(STATE.searchTimer);
    STATE.searchTimer = setTimeout(() => {
      STATE.searchQuery = e.target.value.trim().toLowerCase();
      renderAllSections();
    }, 200);
  });
}
</script>
